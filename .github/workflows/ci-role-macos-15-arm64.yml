name: managed role macos-15-arm64
on:
  workflow_call:
    inputs:
      tested_source_sha: {required: true, type: string}
      expected_identity_base64: {required: true, type: string}
      expected_identity_sha256: {required: true, type: string}
      expected_artifact_id: {required: true, type: string}
      expected_artifact_digest: {required: true, type: string}
      run_identity: {required: true, type: string}
      artifact_nonce: {required: true, type: string}
      base_sha: {required: true, type: string}
      stage-artifact-name: {required: false, type: string, default: ''}
      stage-artifact-id: {required: false, type: string, default: ''}
      stage-upload-action-digest: {required: false, type: string, default: ''}
      stage-rest-digest: {required: false, type: string, default: ''}
      stage-created-at: {required: false, type: string, default: ''}
      stage-expires-at: {required: false, type: string, default: ''}
      stage-manifest-sha256: {required: false, type: string, default: ''}
      stage-attestation-subject-digest: {required: false, type: string, default: ''}
      stage-attestation-bundle-sha256: {required: false, type: string, default: ''}
      producer-workflow-signer-sha: {required: false, type: string, default: ''}
      workflow-run-id: {required: false, type: string, default: ''}
      run-attempt: {required: false, type: string, default: ''}
      producer-sealing-check-run-id: {required: false, type: string, default: ''}
      producer-sealing-receipt-artifact-id: {required: false, type: string, default: ''}
      producer-sealing-receipt-upload-action-digest: {required: false, type: string, default: ''}
      producer-sealing-receipt-rest-digest: {required: false, type: string, default: ''}
      producer-sealing-receipt-created-at: {required: false, type: string, default: ''}
      producer-sealing-receipt-expires-at: {required: false, type: string, default: ''}
      producer-lineage-artifact-id: {required: false, type: string, default: ''}
      producer-lineage-upload-action-digest: {required: false, type: string, default: ''}
      producer-lineage-rest-digest: {required: false, type: string, default: ''}
      producer-lineage-sha256: {required: false, type: string, default: ''}
      producer-lineage-attestation-subject-digest: {required: false, type: string, default: ''}
      producer-lineage-attestation-bundle-sha256: {required: false, type: string, default: ''}
      producer-role: {required: false, type: string, default: ''}
      consumer-role: {required: false, type: string, default: ''}
    outputs:
      sealing-receipt-artifact-id:
        value: ${{ jobs.seal.outputs.receipt_id }}
      sealing-receipt-upload-action-digest:
        value: ${{ jobs.seal.outputs.receipt_digest }}
jobs:
  candidate:
    runs-on: macos-15
    timeout-minutes: 120
    permissions: {contents: read}
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      check_run_id: ${{ steps.candidate_locator.outputs.check_run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {persist-credentials: false}
      - name: Reject preinstalled Nix
        shell: bash
        run: |
          if command -v nix >/dev/null 2>&1; then
            echo 'Nix must not be present before installation' >&2
            exit 1
          fi
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with: {enable_kvm: false}
      - name: Verify action-installed Nix interface
        shell: bash
        run: |
          nix_profile=/nix/var/nix/profiles/default
          nix_path=$(command -v nix)
          nix_store_path=$(command -v nix-store)
          [[ $nix_path == "$nix_profile/bin/nix" ]] || { echo 'nix must resolve through the action-installed Nix profile' >&2; exit 1; }
          [[ $nix_store_path == "$nix_profile/bin/nix-store" ]] || { echo 'nix-store must resolve through the action-installed Nix profile' >&2; exit 1; }
          nix_version=$(nix --version 2>&1)
          nix_store_version=$(nix-store --version 2>&1)
          [[ $nix_version == 'nix (Nix) 2.35.2' ]] || { echo 'nix version must equal 2.35.2' >&2; exit 1; }
          [[ $nix_store_version == 'nix-store (Nix) 2.35.2' ]] || { echo 'nix-store version must equal 2.35.2' >&2; exit 1; }
          nix_real_path=$(python3 -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' "$nix_path")
          nix_store_real_path=$(python3 -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' "$nix_store_path")
          [[ ${nix_real_path%/*} == "${nix_store_real_path%/*}" ]] || { echo 'nix and nix-store must resolve through one installed Nix profile' >&2; exit 1; }
      - id: validated
        env:
          EXPECTED_IDENTITY_BASE64: ${{ inputs.expected_identity_base64 }}
          EXPECTED_IDENTITY_SHA256: ${{ inputs.expected_identity_sha256 }}
          TESTED_SOURCE_SHA: ${{ inputs.tested_source_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          RUN_IDENTITY: ${{ inputs.run_identity }}
          ARTIFACT_NONCE: ${{ inputs.artifact_nonce }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_ARTIFACT_ID: ${{ inputs.expected_artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ inputs.expected_artifact_digest }}
        run: ./scripts/ci-devenv.sh ./scripts/validate-managed-workflow-inputs.sh --role macos-15-arm64 --output "$RUNNER_TEMP/expected-identity.json" >> "$GITHUB_OUTPUT"
      - name: Require the complete producer seal interface only for BURL-O001
        env:
          TICKET: ${{ steps.validated.outputs.ticket_identity }}
          STAGE_ARTIFACT_NAME: ${{ inputs.stage-artifact-name }}
          STAGE_ARTIFACT_ID: ${{ inputs.stage-artifact-id }}
          STAGE_UPLOAD_ACTION_DIGEST: ${{ inputs.stage-upload-action-digest }}
          STAGE_REST_DIGEST: ${{ inputs.stage-rest-digest }}
          STAGE_CREATED_AT: ${{ inputs.stage-created-at }}
          STAGE_EXPIRES_AT: ${{ inputs.stage-expires-at }}
          STAGE_MANIFEST_SHA256: ${{ inputs.stage-manifest-sha256 }}
          STAGE_ATTESTATION_SUBJECT_DIGEST: ${{ inputs.stage-attestation-subject-digest }}
          STAGE_ATTESTATION_BUNDLE_SHA256: ${{ inputs.stage-attestation-bundle-sha256 }}
          PRODUCER_WORKFLOW_SIGNER_SHA: ${{ inputs.producer-workflow-signer-sha }}
          PRODUCER_WORKFLOW_RUN_ID: ${{ inputs.workflow-run-id }}
          PRODUCER_RUN_ATTEMPT: ${{ inputs.run-attempt }}
          PRODUCER_SEALING_CHECK_RUN_ID: ${{ inputs.producer-sealing-check-run-id }}
          PRODUCER_SEALING_RECEIPT_ARTIFACT_ID: ${{ inputs.producer-sealing-receipt-artifact-id }}
          PRODUCER_SEALING_RECEIPT_UPLOAD_ACTION_DIGEST: ${{ inputs.producer-sealing-receipt-upload-action-digest }}
          PRODUCER_SEALING_RECEIPT_REST_DIGEST: ${{ inputs.producer-sealing-receipt-rest-digest }}
          PRODUCER_SEALING_RECEIPT_CREATED_AT: ${{ inputs.producer-sealing-receipt-created-at }}
          PRODUCER_SEALING_RECEIPT_EXPIRES_AT: ${{ inputs.producer-sealing-receipt-expires-at }}
          PRODUCER_LINEAGE_ARTIFACT_ID: ${{ inputs.producer-lineage-artifact-id }}
          PRODUCER_LINEAGE_UPLOAD_ACTION_DIGEST: ${{ inputs.producer-lineage-upload-action-digest }}
          PRODUCER_LINEAGE_REST_DIGEST: ${{ inputs.producer-lineage-rest-digest }}
          PRODUCER_LINEAGE_SHA256: ${{ inputs.producer-lineage-sha256 }}
          PRODUCER_LINEAGE_ATTESTATION_SUBJECT_DIGEST: ${{ inputs.producer-lineage-attestation-subject-digest }}
          PRODUCER_LINEAGE_ATTESTATION_BUNDLE_SHA256: ${{ inputs.producer-lineage-attestation-bundle-sha256 }}
          PRODUCER_ROLE: ${{ inputs.producer-role }}
          CONSUMER_ROLE: ${{ inputs.consumer-role }}
        run: ./scripts/ci-devenv.sh ./scripts/validate-compatibility-stage-interface.sh "$TICKET"
      - if: ${{ inputs.stage-artifact-id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {artifact-ids: "${{ inputs.stage-artifact-id }}", path: "${{ runner.temp }}/compatibility-acquisition/stage", digest-mismatch: error}
      - if: ${{ inputs.producer-sealing-receipt-artifact-id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {artifact-ids: "${{ inputs.producer-sealing-receipt-artifact-id }}", path: "${{ runner.temp }}/compatibility-acquisition/receipt", digest-mismatch: error}
      - if: ${{ inputs.producer-lineage-artifact-id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {artifact-ids: "${{ inputs.producer-lineage-artifact-id }}", path: "${{ runner.temp }}/compatibility-acquisition/lineage", digest-mismatch: error}
      - name: Verify producer stage, receipt, and lineage offline before teardown
        if: ${{ inputs.stage-artifact-id != '' }}
        env:
          SIGNER_SHA: ${{ inputs.producer-workflow-signer-sha }}
        run: |
          acquisition="$RUNNER_TEMP/compatibility-acquisition"
          ./scripts/ci-devenv.sh gh attestation trusted-root > "$acquisition/trusted_root.jsonl"
          ./scripts/ci-devenv.sh gh attestation verify "$acquisition/stage/compatibility-stage-manifest.json" --bundle "$acquisition/stage/compatibility-stage-attestation.sigstore.json" --custom-trusted-root "$acquisition/trusted_root.jsonl" -R SkrOYC/burlmd --signer-workflow SkrOYC/burlmd/.github/workflows/ci-role-macos-26-arm64.yml --signer-digest "$SIGNER_SHA" --source-digest "$SIGNER_SHA" --source-ref refs/heads/master --deny-self-hosted-runners --format json > "$acquisition/stage-verification.json"
          ./scripts/ci-devenv.sh gh attestation verify "$acquisition/receipt/ci-seal-receipt.json" --bundle "$acquisition/receipt/ci-seal-receipt-attestation.sigstore.json" --custom-trusted-root "$acquisition/trusted_root.jsonl" -R SkrOYC/burlmd --signer-workflow SkrOYC/burlmd/.github/workflows/ci-role-macos-26-arm64.yml --signer-digest "$SIGNER_SHA" --source-digest "$SIGNER_SHA" --source-ref refs/heads/master --deny-self-hosted-runners --format json > "$acquisition/receipt-verification.json"
          ./scripts/ci-devenv.sh gh attestation verify "$acquisition/lineage/compatibility-stage-producer-lineage.json" --bundle "$acquisition/lineage/compatibility-stage-producer-lineage-attestation.sigstore.json" --custom-trusted-root "$acquisition/trusted_root.jsonl" -R SkrOYC/burlmd --signer-workflow SkrOYC/burlmd/.github/workflows/ci-role-macos-26-arm64.yml --signer-digest "$SIGNER_SHA" --source-digest "$SIGNER_SHA" --source-ref refs/heads/master --deny-self-hosted-runners --format json > "$acquisition/lineage-verification.json"
      - name: Remove acquisition credentials and expose only verified producer members
        if: ${{ inputs.stage-artifact-id != '' }}
        env:
          STAGE_ROOT: ${{ runner.temp }}/compatibility-acquisition
          MEMBER_ROOT: ${{ runner.temp }}/authenticated-stage-members
          BINDING_OUTPUT: ${{ runner.temp }}/wrapper-handoff/compatibility-stage-consumption.json
          EXPECTED_IDENTITY: ${{ steps.validated.outputs.expected_identity_file }}
          STAGE_ARTIFACT_NAME: ${{ inputs.stage-artifact-name }}
          STAGE_ARTIFACT_ID: ${{ inputs.stage-artifact-id }}
          STAGE_UPLOAD_ACTION_DIGEST: ${{ inputs.stage-upload-action-digest }}
          STAGE_REST_DIGEST: ${{ inputs.stage-rest-digest }}
          STAGE_CREATED_AT: ${{ inputs.stage-created-at }}
          STAGE_EXPIRES_AT: ${{ inputs.stage-expires-at }}
          STAGE_MANIFEST_SHA256: ${{ inputs.stage-manifest-sha256 }}
          STAGE_ATTESTATION_SUBJECT_DIGEST: ${{ inputs.stage-attestation-subject-digest }}
          STAGE_ATTESTATION_BUNDLE_SHA256: ${{ inputs.stage-attestation-bundle-sha256 }}
          PRODUCER_WORKFLOW_SIGNER_SHA: ${{ inputs.producer-workflow-signer-sha }}
          PRODUCER_WORKFLOW_RUN_ID: ${{ inputs.workflow-run-id }}
          PRODUCER_RUN_ATTEMPT: ${{ inputs.run-attempt }}
          PRODUCER_SEALING_CHECK_RUN_ID: ${{ inputs.producer-sealing-check-run-id }}
          PRODUCER_SEALING_RECEIPT_ARTIFACT_ID: ${{ inputs.producer-sealing-receipt-artifact-id }}
          PRODUCER_SEALING_RECEIPT_UPLOAD_ACTION_DIGEST: ${{ inputs.producer-sealing-receipt-upload-action-digest }}
          PRODUCER_SEALING_RECEIPT_REST_DIGEST: ${{ inputs.producer-sealing-receipt-rest-digest }}
          PRODUCER_SEALING_RECEIPT_CREATED_AT: ${{ inputs.producer-sealing-receipt-created-at }}
          PRODUCER_SEALING_RECEIPT_EXPIRES_AT: ${{ inputs.producer-sealing-receipt-expires-at }}
          PRODUCER_LINEAGE_ARTIFACT_ID: ${{ inputs.producer-lineage-artifact-id }}
          PRODUCER_LINEAGE_UPLOAD_ACTION_DIGEST: ${{ inputs.producer-lineage-upload-action-digest }}
          PRODUCER_LINEAGE_REST_DIGEST: ${{ inputs.producer-lineage-rest-digest }}
          PRODUCER_LINEAGE_SHA256: ${{ inputs.producer-lineage-sha256 }}
          PRODUCER_LINEAGE_ATTESTATION_SUBJECT_DIGEST: ${{ inputs.producer-lineage-attestation-subject-digest }}
          PRODUCER_LINEAGE_ATTESTATION_BUNDLE_SHA256: ${{ inputs.producer-lineage-attestation-bundle-sha256 }}
          PRODUCER_ROLE: ${{ inputs.producer-role }}
          CONSUMER_ROLE: ${{ inputs.consumer-role }}
          CONSUMER_CANDIDATE_CHECK_RUN_ID: ${{ job.check_run_id }}
        run: |
          ./scripts/ci-devenv.sh ./scripts/prepare-compatibility-stage-consumer.sh --expected "$EXPECTED_IDENTITY" --input "$STAGE_ROOT" --output "$MEMBER_ROOT" --binding-output "$BINDING_OUTPUT"
          [[ ! -e $STAGE_ROOT ]]
          [[ -f "$MEMBER_ROOT/roles/macos-26-arm64/handoff/outbox/macos-current-construction.tar.zst" && -f "$MEMBER_ROOT/roles/macos-26-arm64/handoff/outbox/macos-current-construction.sha256" && ! -e "$MEMBER_ROOT/stage-verification.json" ]]
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {ref: "${{ steps.validated.outputs.tested_source_sha }}", path: tested-source, persist-credentials: false}
      - name: Remove persisted Nix credentials before candidate execution
        run: |
          # The pinned installer falls back to github.token when its optional
          # input is empty. Remove its world-readable Nix access token and
          # restart the daemon so candidate code cannot inherit cached config.
          sudo /usr/bin/sed -i '' -E '/^[[:space:]]*access-tokens[[:space:]]*=/d' /etc/nix/nix.conf
          sudo /bin/launchctl kickstart -k system/org.nixos.nix-daemon
          if sudo /usr/bin/grep -Eq '^[[:space:]]*access-tokens[[:space:]]*=' /etc/nix/nix.conf; then
            echo 'Nix access-token configuration remains after scrub' >&2
            exit 1
          fi
          effective_nix_config=$(nix show-config)
          if /usr/bin/grep -Eq '^[[:space:]]*access-tokens[[:space:]]*=[[:space:]]*[^[:space:]]' <<<"$effective_nix_config"; then
            echo 'Nix daemon retains an access token after scrub' >&2
            exit 1
          fi
      - name: Run candidate as credential-free data
        env:
          EXPECTED_IDENTITY: ${{ steps.validated.outputs.expected_identity_file }}
          BURLMD_AUTHENTICATED_STAGE_ROOT: ${{ steps.validated.outputs.requires_macos_15_stage == 'true' && inputs.stage-artifact-id != '' && format('{0}/authenticated-stage-members', runner.temp) || '' }}
          BURLMD_COMPATIBILITY_STAGE_CONSUMPTION: ${{ steps.validated.outputs.requires_macos_15_stage == 'true' && inputs.stage-artifact-id != '' && format('{0}/wrapper-handoff/compatibility-stage-consumption.json', runner.temp) || '' }}
          BURLMD_ROLE_RUNTIME_ROOT: ${{ runner.temp }}/role-runtime
        run: |
          # The runner exposes artifact-runtime authority to this step. Clear
          # it in this shell before the long-lived candidate can inspect its
          # parent environment on the shared macOS host.
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_RUNTIME_URL ACTIONS_RESULTS_URL
          env -u GH_TOKEN -u GITHUB_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_RUNTIME_URL -u ACTIONS_RESULTS_URL -u SSH_AUTH_SOCK -u GIT_ASKPASS -u NIX_CONFIG -u NIX_CONF_DIR -u NIX_USER_CONF_FILES \
            ./scripts/ci-devenv.sh ./scripts/run-managed-role.sh macos-15-arm64 "$GITHUB_WORKSPACE/tested-source" "$RUNNER_TEMP/candidate-output"
          [[ ! -e "$RUNNER_TEMP/wrapper-handoff/compatibility-stage-consumption.json" ]]
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: "managed-evidence-candidate-macos-15-arm64-${{ steps.validated.outputs.nonce }}", path: "${{ runner.temp }}/candidate-output/ci-role-evidence.tar.zst", overwrite: false, if-no-files-found: error}
      - id: candidate_locator
        env: {CHECK_RUN_ID: "${{ job.check_run_id }}"}
        run: printf 'check_run_id=%s\n' "$CHECK_RUN_ID" >> "$GITHUB_OUTPUT"
  seal:
    needs: candidate
    runs-on: macos-15
    permissions: {actions: read, contents: read, id-token: write, attestations: write}
    outputs:
      artifact_id: ${{ steps.upload_sealed.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload_sealed.outputs.artifact-digest }}
      receipt_id: ${{ steps.upload_receipt.outputs.artifact-id }}
      receipt_digest: ${{ steps.upload_receipt.outputs.artifact-digest }}
      check_run_id: ${{ steps.seal_locator.outputs.check_run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {persist-credentials: false}
      - name: Reject preinstalled Nix
        shell: bash
        run: |
          if command -v nix >/dev/null 2>&1; then
            echo 'Nix must not be present before installation' >&2
            exit 1
          fi
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with: {enable_kvm: false}
      - name: Verify action-installed Nix interface
        shell: bash
        run: |
          nix_profile=/nix/var/nix/profiles/default
          nix_path=$(command -v nix)
          nix_store_path=$(command -v nix-store)
          [[ $nix_path == "$nix_profile/bin/nix" ]] || { echo 'nix must resolve through the action-installed Nix profile' >&2; exit 1; }
          [[ $nix_store_path == "$nix_profile/bin/nix-store" ]] || { echo 'nix-store must resolve through the action-installed Nix profile' >&2; exit 1; }
          nix_version=$(nix --version 2>&1)
          nix_store_version=$(nix-store --version 2>&1)
          [[ $nix_version == 'nix (Nix) 2.35.2' ]] || { echo 'nix version must equal 2.35.2' >&2; exit 1; }
          [[ $nix_store_version == 'nix-store (Nix) 2.35.2' ]] || { echo 'nix-store version must equal 2.35.2' >&2; exit 1; }
          nix_real_path=$(python3 -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' "$nix_path")
          nix_store_real_path=$(python3 -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' "$nix_store_path")
          [[ ${nix_real_path%/*} == "${nix_store_real_path%/*}" ]] || { echo 'nix and nix-store must resolve through one installed Nix profile' >&2; exit 1; }
      - id: seal_locator
        env: {CHECK_RUN_ID: "${{ job.check_run_id }}"}
        run: printf 'check_run_id=%s\n' "$CHECK_RUN_ID" >> "$GITHUB_OUTPUT"
      - id: validated
        env:
          EXPECTED_IDENTITY_BASE64: ${{ inputs.expected_identity_base64 }}
          EXPECTED_IDENTITY_SHA256: ${{ inputs.expected_identity_sha256 }}
          TESTED_SOURCE_SHA: ${{ inputs.tested_source_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          RUN_IDENTITY: ${{ inputs.run_identity }}
          ARTIFACT_NONCE: ${{ inputs.artifact_nonce }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_ARTIFACT_ID: ${{ inputs.expected_artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ inputs.expected_artifact_digest }}
        run: ./scripts/ci-devenv.sh ./scripts/validate-managed-workflow-inputs.sh --role macos-15-arm64 --output "$RUNNER_TEMP/expected-input.json" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {name: "managed-evidence-expected-${{ steps.validated.outputs.nonce }}", path: expected}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {name: "managed-evidence-candidate-macos-15-arm64-${{ steps.validated.outputs.nonce }}", path: candidate}
      - if: ${{ steps.validated.outputs.ticket_identity == 'BURL-O001' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {artifact-ids: "${{ inputs.stage-artifact-id }}", path: "${{ runner.temp }}/fresh-seal-acquisition/stage", digest-mismatch: error}
      - if: ${{ steps.validated.outputs.ticket_identity == 'BURL-O001' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {artifact-ids: "${{ inputs.producer-sealing-receipt-artifact-id }}", path: "${{ runner.temp }}/fresh-seal-acquisition/receipt", digest-mismatch: error}
      - if: ${{ steps.validated.outputs.ticket_identity == 'BURL-O001' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {artifact-ids: "${{ inputs.producer-lineage-artifact-id }}", path: "${{ runner.temp }}/fresh-seal-acquisition/lineage", digest-mismatch: error}
      - name: Reacquire and authenticate complete producer compatibility evidence in fresh seal
        if: ${{ steps.validated.outputs.ticket_identity == 'BURL-O001' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNER_SHA: ${{ inputs.producer-workflow-signer-sha }}
        run: |
          acquisition="$RUNNER_TEMP/fresh-seal-acquisition"
          ./scripts/ci-devenv.sh gh attestation trusted-root > "$acquisition/trusted_root.jsonl"
          ./scripts/ci-devenv.sh gh attestation verify "$acquisition/stage/compatibility-stage-manifest.json" --bundle "$acquisition/stage/compatibility-stage-attestation.sigstore.json" --custom-trusted-root "$acquisition/trusted_root.jsonl" -R SkrOYC/burlmd --signer-workflow SkrOYC/burlmd/.github/workflows/ci-role-macos-26-arm64.yml --signer-digest "$SIGNER_SHA" --source-digest "$SIGNER_SHA" --source-ref refs/heads/master --deny-self-hosted-runners --format json > "$acquisition/stage-verification.json"
          ./scripts/ci-devenv.sh gh attestation verify "$acquisition/receipt/ci-seal-receipt.json" --bundle "$acquisition/receipt/ci-seal-receipt-attestation.sigstore.json" --custom-trusted-root "$acquisition/trusted_root.jsonl" -R SkrOYC/burlmd --signer-workflow SkrOYC/burlmd/.github/workflows/ci-role-macos-26-arm64.yml --signer-digest "$SIGNER_SHA" --source-digest "$SIGNER_SHA" --source-ref refs/heads/master --deny-self-hosted-runners --format json > "$acquisition/receipt-verification.json"
          ./scripts/ci-devenv.sh gh attestation verify "$acquisition/lineage/compatibility-stage-producer-lineage.json" --bundle "$acquisition/lineage/compatibility-stage-producer-lineage-attestation.sigstore.json" --custom-trusted-root "$acquisition/trusted_root.jsonl" -R SkrOYC/burlmd --signer-workflow SkrOYC/burlmd/.github/workflows/ci-role-macos-26-arm64.yml --signer-digest "$SIGNER_SHA" --source-digest "$SIGNER_SHA" --source-ref refs/heads/master --deny-self-hosted-runners --format json > "$acquisition/lineage-verification.json"
      - name: Authenticate candidate job and artifact before authority
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_IDENTITY_FILE: ${{ steps.validated.outputs.expected_identity_file }}
          EXPECTED_ID: ${{ inputs.expected_artifact_id }}
          EXPECTED_DIGEST: ${{ inputs.expected_artifact_digest }}
          ARTIFACT_NONCE: ${{ steps.validated.outputs.nonce }}
          CANDIDATE_CHECK_RUN_ID: ${{ needs.candidate.outputs.check_run_id }}
          CANDIDATE_ID: ${{ needs.candidate.outputs.artifact_id }}
          CANDIDATE_DIGEST: ${{ needs.candidate.outputs.artifact_digest }}
        run: ./scripts/ci-devenv.sh ./scripts/validate-seal-rest.sh --phase candidate --role macos-15-arm64 --nonce "$ARTIFACT_NONCE" --expected "$EXPECTED_IDENTITY_FILE" --expected-id "$EXPECTED_ID" --expected-digest "$EXPECTED_DIGEST" --candidate-check-run-id "$CANDIDATE_CHECK_RUN_ID" --candidate-id "$CANDIDATE_ID" --candidate-digest "$CANDIDATE_DIGEST"
      - name: Validate immutable candidate then seal
        env: {EXPECTED_INPUT: "${{ steps.validated.outputs.expected_identity_file }}", ARTIFACT_NONCE: "${{ steps.validated.outputs.nonce }}"}
        run: |
          ./scripts/ci-devenv.sh cmp -- "$EXPECTED_INPUT" expected/expected-identity.json
          ./scripts/ci-devenv.sh ./scripts/validate-managed-role-bundle.sh --expected expected/expected-identity.json --role macos-15-arm64 --nonce "$ARTIFACT_NONCE" --bundle candidate/ci-role-evidence.tar.zst
          ./scripts/ci-devenv.sh mkdir sealed
          ./scripts/ci-devenv.sh cp candidate/ci-role-evidence.tar.zst sealed/
          ./scripts/ci-devenv.sh tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -I 'zstd -19 --no-progress' -cf sealed/ci-sealed-role-evidence.tar.zst -C sealed ci-role-evidence.tar.zst
      - name: Compare candidate compatibility manifest to fresh seal reconstruction
        if: ${{ steps.validated.outputs.ticket_identity == 'BURL-O001' }}
        env:
          EXPECTED_IDENTITY: ${{ steps.validated.outputs.expected_identity_file }}
          STAGE_ARTIFACT_NAME: ${{ inputs.stage-artifact-name }}
          STAGE_ARTIFACT_ID: ${{ inputs.stage-artifact-id }}
          STAGE_UPLOAD_ACTION_DIGEST: ${{ inputs.stage-upload-action-digest }}
          STAGE_REST_DIGEST: ${{ inputs.stage-rest-digest }}
          STAGE_CREATED_AT: ${{ inputs.stage-created-at }}
          STAGE_EXPIRES_AT: ${{ inputs.stage-expires-at }}
          STAGE_MANIFEST_SHA256: ${{ inputs.stage-manifest-sha256 }}
          STAGE_ATTESTATION_SUBJECT_DIGEST: ${{ inputs.stage-attestation-subject-digest }}
          STAGE_ATTESTATION_BUNDLE_SHA256: ${{ inputs.stage-attestation-bundle-sha256 }}
          PRODUCER_WORKFLOW_SIGNER_SHA: ${{ inputs.producer-workflow-signer-sha }}
          PRODUCER_WORKFLOW_RUN_ID: ${{ inputs.workflow-run-id }}
          PRODUCER_RUN_ATTEMPT: ${{ inputs.run-attempt }}
          PRODUCER_SEALING_CHECK_RUN_ID: ${{ inputs.producer-sealing-check-run-id }}
          PRODUCER_SEALING_RECEIPT_ARTIFACT_ID: ${{ inputs.producer-sealing-receipt-artifact-id }}
          PRODUCER_SEALING_RECEIPT_UPLOAD_ACTION_DIGEST: ${{ inputs.producer-sealing-receipt-upload-action-digest }}
          PRODUCER_SEALING_RECEIPT_REST_DIGEST: ${{ inputs.producer-sealing-receipt-rest-digest }}
          PRODUCER_SEALING_RECEIPT_CREATED_AT: ${{ inputs.producer-sealing-receipt-created-at }}
          PRODUCER_SEALING_RECEIPT_EXPIRES_AT: ${{ inputs.producer-sealing-receipt-expires-at }}
          PRODUCER_LINEAGE_ARTIFACT_ID: ${{ inputs.producer-lineage-artifact-id }}
          PRODUCER_LINEAGE_UPLOAD_ACTION_DIGEST: ${{ inputs.producer-lineage-upload-action-digest }}
          PRODUCER_LINEAGE_REST_DIGEST: ${{ inputs.producer-lineage-rest-digest }}
          PRODUCER_LINEAGE_SHA256: ${{ inputs.producer-lineage-sha256 }}
          PRODUCER_LINEAGE_ATTESTATION_SUBJECT_DIGEST: ${{ inputs.producer-lineage-attestation-subject-digest }}
          PRODUCER_LINEAGE_ATTESTATION_BUNDLE_SHA256: ${{ inputs.producer-lineage-attestation-bundle-sha256 }}
          PRODUCER_ROLE: ${{ inputs.producer-role }}
          CONSUMER_ROLE: ${{ inputs.consumer-role }}
          CONSUMER_CANDIDATE_CHECK_RUN_ID: ${{ needs.candidate.outputs.check_run_id }}
        run: |
          ./scripts/ci-devenv.sh ./scripts/prepare-compatibility-stage-consumer.sh --expected "$EXPECTED_IDENTITY" --input "$RUNNER_TEMP/fresh-seal-acquisition" --output "$RUNNER_TEMP/fresh-seal-members" --binding-output "$RUNNER_TEMP/fresh-seal-handoff.json"
          [[ ! -e "$RUNNER_TEMP/fresh-seal-acquisition" ]]
          ./scripts/ci-devenv.sh tar -I zstd -xOf candidate/ci-role-evidence.tar.zst ci-role-evidence.json > candidate-role-evidence.json
          # shellcheck disable=SC2016
          ./scripts/ci-devenv.sh jq -e --slurpfile candidate candidate-role-evidence.json --slurpfile fresh "$RUNNER_TEMP/fresh-seal-handoff.json" '
            def normalized: del(.consumerBinding.stageAttestationVerificationResultSha256, .consumerBinding.producerReceiptAttestationVerificationResultSha256, .consumerBinding.producerLineageAttestationVerificationResultSha256, .consumerBinding.trustedRootSha256, .consumerBinding.verifiedAt);
            $candidate[0].roleEvidence.compatibilityStage | normalized == ($fresh[0] | normalized)
          ' >/dev/null
          # Fresh evidence authorizes the invariant compatibility facts only.
          # Keep the exact candidate binding after that comparison: it retains
          # the candidate invocation's verification-result, trusted-root, and
          # verifiedAt facts for receipt v2 and later aggregation.
          ./scripts/ci-devenv.sh jq -ce '.roleEvidence.compatibilityStage' candidate-role-evidence.json > "$RUNNER_TEMP/candidate-compatibility-stage.json"
          rm -rf -- "$RUNNER_TEMP/fresh-seal-members"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with: {subject-path: sealed/ci-sealed-role-evidence.tar.zst, push-to-registry: false, create-storage-record: false}
      - id: upload_sealed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: "managed-evidence-sealed-macos-15-arm64-${{ steps.validated.outputs.nonce }}", path: sealed/ci-sealed-role-evidence.tar.zst, overwrite: false, if-no-files-found: error}
      - name: Write pre-completion receipt
        env:
          ROLE: macos-15-arm64
          WORKFLOW_PATH: .github/workflows/ci-role-macos-15-arm64.yml
          ARTIFACT_NONCE: ${{ steps.validated.outputs.nonce }}
          EXPECTED_IDENTITY_SHA256: ${{ steps.validated.outputs.expected_identity_sha256 }}
          EXPECTED_ID: ${{ steps.validated.outputs.expected_artifact_id }}
          EXPECTED_DIGEST: ${{ steps.validated.outputs.expected_artifact_digest }}
          CANDIDATE_ID: ${{ needs.candidate.outputs.artifact_id }}
          CANDIDATE_DIGEST: ${{ needs.candidate.outputs.artifact_digest }}
          SEALED_ID: ${{ steps.upload_sealed.outputs.artifact-id }}
          SEALED_DIGEST: ${{ steps.upload_sealed.outputs.artifact-digest }}
          TESTED_SOURCE_SHA: ${{ steps.validated.outputs.tested_source_sha }}
          BASE_SHA: ${{ steps.validated.outputs.base_sha }}
          CHECK_RUN_ID: ${{ job.check_run_id }}
          EXPECTED_IDENTITY_FILE: ${{ steps.validated.outputs.expected_identity_file }}
          COMPATIBILITY_STAGE_FILE: ${{ steps.validated.outputs.ticket_identity == 'BURL-O001' && format('{0}/candidate-compatibility-stage.json', runner.temp) || '' }}
        run: ./scripts/ci-devenv.sh ./scripts/write-sealing-receipt.sh candidate/ci-role-evidence.tar.zst sealed/ci-sealed-role-evidence.tar.zst ci-seal-receipt.json
      - run: ./scripts/ci-devenv.sh ./scripts/validate-sealing-receipt.sh ci-seal-receipt.json
      - id: attest_receipt
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with: {subject-path: ci-seal-receipt.json, push-to-registry: false, create-storage-record: false}
      - name: Preserve receipt attestation bundle
        run: ./scripts/ci-devenv.sh cp -- "${{ steps.attest_receipt.outputs.bundle-path }}" ci-seal-receipt-attestation.sigstore.json
      - id: upload_receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "managed-evidence-seal-receipt-macos-15-arm64-${{ steps.validated.outputs.nonce }}"
          path: |
            ci-seal-receipt.json
            ci-seal-receipt-attestation.sigstore.json
          overwrite: false
          if-no-files-found: error
      - name: Re-authenticate sealed artifacts and receipt after upload
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_IDENTITY_FILE: expected/expected-identity.json
          EXPECTED_ID: ${{ inputs.expected_artifact_id }}
          EXPECTED_DIGEST: ${{ inputs.expected_artifact_digest }}
          ARTIFACT_NONCE: ${{ steps.validated.outputs.nonce }}
          CANDIDATE_CHECK_RUN_ID: ${{ needs.candidate.outputs.check_run_id }}
          CANDIDATE_ID: ${{ needs.candidate.outputs.artifact_id }}
          CANDIDATE_DIGEST: ${{ needs.candidate.outputs.artifact_digest }}
          SEALED_ID: ${{ steps.upload_sealed.outputs.artifact-id }}
          SEALED_DIGEST: ${{ steps.upload_sealed.outputs.artifact-digest }}
          RECEIPT_ID: ${{ steps.upload_receipt.outputs.artifact-id }}
          RECEIPT_DIGEST: ${{ steps.upload_receipt.outputs.artifact-digest }}
        run: ./scripts/ci-devenv.sh ./scripts/validate-seal-rest.sh --phase sealed --role macos-15-arm64 --nonce "$ARTIFACT_NONCE" --expected "$EXPECTED_IDENTITY_FILE" --expected-id "$EXPECTED_ID" --expected-digest "$EXPECTED_DIGEST" --candidate-check-run-id "$CANDIDATE_CHECK_RUN_ID" --candidate-id "$CANDIDATE_ID" --candidate-digest "$CANDIDATE_DIGEST" --sealed-id "$SEALED_ID" --sealed-digest "$SEALED_DIGEST" --receipt-id "$RECEIPT_ID" --receipt-digest "$RECEIPT_DIGEST"
