boundaries:
  - id: BND-01
    legacy_id: Presentation and Interaction
    name: Presentation and Interaction
    kind: module
    type: Desktop interaction surface
    responsibility: "Captures Writer intent and renders authoritative state, warnings, Decisions, Suggestions, diagnostics, and release information"
    inputs: ["Receives Note, Workspace, session, synchronization, and recovery state."]
    outputs: [Sends interaction commands.]
    depends_on: [BND-02]
    certainty: assumed
    assumption: "Migrated from containers.md; not yet mapped to a code path."
  - id: BND-02
    legacy_id: Core Coordination
    name: Core Coordination
    kind: module
    type: Application coordinator and authority boundary
    responsibility: "Serializes commands against authoritative model state, enforces authority and conformance, and coordinates local and external state machines"
    inputs: ["Receives Writer actions, guest-change proposals, synchronization results, and Object results."]
    outputs: [Emits authoritative state and durable obligations.]
    depends_on: [BND-03, BND-04, BND-05, BND-07, BND-08, BND-09, BND-10, BND-11, BND-12, BND-18]
    certainty: assumed
    assumption: "Migrated from containers.md; not yet mapped to a code path."
  - id: BND-03
    legacy_id: Canonical Note Model
    name: Canonical Note Model
    kind: module
    type: Source-backed semantic model
    responsibility: "Defines Note-local values and operations for parsing, rendering, source-preserving edits, undo, find and replace, Links, Assets, Suggestion representation, and conformance"
    inputs: [Accepts Note source and semantic operations.]
    outputs: ["Returns structured Note state, source ranges, and source-preserving results."]
    depends_on: []
    certainty: assumed
    assumption: "Migrated from containers.md; not yet mapped to a code path."
  - id: BND-04
    legacy_id: Workspace Model
    name: Workspace Model
    kind: module
    type: Workspace authority model
    responsibility: "Solely owns authoritative Workspace and session state: the Directory tree, canonical paths, Note identity, open-session registry, Protected State, lifecycle provenance, and the lifecycle of Suggestions, Lifecycle Decisions, Asset Decisions, and reconciliation records"
    inputs: [Accepts Workspace operations and candidate external states.]
    outputs: ["Returns authoritative tree state, Decisions, and retention roots."]
    depends_on: [BND-03]
    certainty: assumed
    assumption: "Migrated from containers.md; not yet mapped to a code path."
  - id: BND-05
    legacy_id: Workspace Persistence
    name: Workspace Persistence
    kind: other
    type: Local authoritative storage
    responsibility: "Persists Note source, Directories, recoverable local history, and atomic lifecycle outcomes inside the Workspace boundary"
    inputs: [Stores and retrieves authoritative Workspace bytes and Versions.]
    outputs: [Stores and retrieves authoritative Workspace bytes and Versions.]
    depends_on: [BND-13]
    certainty: assumed
    assumption: "Migrated from containers.md; not yet mapped to a code path."
  - id: BND-06
    legacy_id: Local Asset Store
    name: Local Asset Store
    kind: other
    type: Local authoritative Object storage
    responsibility: "Owns verified local Object bytes, active offline availability, hydration handoff, cache eviction, and retention of bytes reachable from Protected State"
    inputs: [Accepts verified Object writes and retention roots.]
    outputs: ["Returns verified bytes, availability, and eviction outcomes."]
    depends_on: [BND-04, BND-05, BND-13]
    certainty: assumed
    assumption: "Migrated from containers.md; not yet mapped to a code path."
  - id: BND-07
    legacy_id: Derived Index
    name: Derived Index
    kind: other
    type: Rebuildable local projection
    responsibility: "Supports search, title lookup, backlinks, conformance inventory, and incremental Workspace views without becoming authoritative"
    inputs: [Accepts validated Workspace changes.]
    outputs: [Returns queries and rebuild progress.]
    depends_on: [BND-05, BND-12]
    certainty: assumed
    assumption: "Migrated from containers.md; not yet mapped to a code path."
  - id: BND-08
    legacy_id: Application State
    name: Application State
    kind: other
    type: Non-Workspace durable state
    responsibility: "Persists and restores snapshots of device preferences, per-Workspace session state, drafts, operation intents, reconciliation records, synchronization presentation, and migration metadata. It doesn't own authoritative session state"
    inputs: [Persists and restores device or Workspace-scoped application state.]
    outputs: [Persists and restores device or Workspace-scoped application state.]
    depends_on: [BND-12]
    certainty: assumed
    assumption: "Migrated from containers.md; not yet mapped to a code path."
  - id: BND-09
    legacy_id: Workspace Observer
    name: Workspace Observer
    kind: module
    type: Platform event adapter
    responsibility: Converts filesystem event bursts into debounced change proposals without deciding authority or conformance
    inputs: ["Receives Platform events and emits candidate creates, edits, moves, renames, and deletes."]
    outputs: ["Receives Platform events and emits candidate creates, edits, moves, renames, and deletes."]
    depends_on: [BND-13]
    certainty: assumed
    assumption: "Migrated from containers.md; not yet mapped to a code path."
  - id: BND-10
    legacy_id: Remote Sync Coordinator
    name: Remote Sync Coordinator
    kind: module
    type: Optional asynchronous coordinator
    responsibility: "Connects a Workspace to a private Remote, detects local and incoming history, coordinates reconciliation, and reports distinct synchronization states"
    inputs: [Accepts durable synchronization intents.]
    outputs: ["Returns authentication, privacy, transfer, divergence, and completion outcomes."]
    depends_on: [BND-02, BND-05, BND-08, BND-12, BND-14]
    certainty: assumed
    assumption: "Migrated from containers.md; not yet mapped to a code path."
  - id: BND-11
    legacy_id: Object Transfer Coordinator
    name: Object Transfer Coordinator
    kind: module
    type: Optional asynchronous Object coordinator
    responsibility: "Validates at connection, periodically, and before publication that anonymous callers can't list, read, write, or delete in the Object Store prefix; uploads and verifies required Objects before history publication; hydrates Objects; and coordinates migration, repair, rotation, and cleanup"
    inputs: [Accepts Object obligations and retention roots.]
    outputs: ["Returns verification, hydration, migration, and recovery outcomes."]
    depends_on: [BND-02, BND-06, BND-08, BND-12, BND-14]
    certainty: assumed
    assumption: "Migrated from containers.md; not yet mapped to a code path."
  - id: BND-12
    legacy_id: Secure Storage
    name: Secure Storage
    kind: other
    type: Credential and key persistence
    responsibility: "Persists index keys, Provider credentials, and Object Store credentials outside Workspace content and diagnostics"
    inputs: ["Stores, reads, rotates, and removes secret material for authorized callers."]
    outputs: ["Stores, reads, rotates, and removes secret material for authorized callers."]
    depends_on: [BND-13]
    certainty: assumed
    assumption: "Migrated from containers.md; not yet mapped to a code path."
  - id: BND-13
    legacy_id: Host Platform
    name: Host Platform
    kind: other
    type: Operating system and filesystem authority
    responsibility: "Owns window chrome, process lifecycle, filesystem events, secure storage, file selection, installation, and package-manager behavior"
    inputs: [Provides Platform services and lifecycle signals.]
    outputs: [Provides Platform services and lifecycle signals.]
    depends_on: []
    certainty: assumed
    assumption: "Migrated from containers.md; not yet mapped to a code path."
  - id: BND-14
    legacy_id: "Provider, Remote, and Object Store"
    name: "Provider, Remote, and Object Store"
    kind: other
    type: Optional user-controlled synchronization services
    responsibility: "The Provider authorizes and locates a private Remote. The Remote stores Workspace history. The Object Store stores immutable Object bytes under the Writer's control"
    inputs: ["Accept authenticated repository or Object operations and return explicit authorization, privacy, integrity, and availability outcomes."]
    outputs: ["Accept authenticated repository or Object operations and return explicit authorization, privacy, integrity, and availability outcomes."]
    depends_on: [External network availability, "User-controlled Provider, Remote, and Object Store accounts"]
    certainty: assumed
    assumption: "Migrated from containers.md; not yet mapped to a code path."
  - id: BND-15
    legacy_id: Release Pipeline
    name: Release Pipeline
    kind: pipeline-stage
    type: "Build, verification, and publication boundary"
    responsibility: "Produces each supported artifact, assigns validation roles, establishes authoritative expected identity, requires complete accepted evidence, and publishes artifact integrity with authenticated build provenance"
    inputs: [Accepts a release identity and Platform matrix.]
    outputs: ["Emits verified artifacts, evidence, and metadata to Release Distribution."]
    depends_on: [BND-16, BND-17, BND-19, Supported Platform build environments]
    certainty: assumed
    assumption: "Migrated from containers.md; not yet mapped to a code path."
  - id: BND-16
    legacy_id: Isolated validation environment
    name: Isolated validation environment
    kind: other
    type: Pipeline-owned System/Native validation environment
    responsibility: "Runs one assigned validation role while owning its display, compositor, input, and process state independently of the Writer's active desktop. Candidate execution and evidence sealing use separate fresh pipeline-owned environments"
    inputs: ["Candidate execution accepts an artifact, run identity, required role, and authoritative expected source, execution, base, release, build, and corpus identities without origin-signing authority."]
    outputs: [It emits one complete untrusted bundle containing the role manifest and every named evidence file., A fresh sealing environment validates that bundle and the candidate environment identity before it authenticates an immutable sealed handoff.]
    depends_on: [BND-15, BND-17]
    certainty: assumed
    assumption: "Migrated from containers.md; not yet mapped to a code path."
  - id: BND-17
    legacy_id: Evidence aggregation
    name: Evidence aggregation
    kind: pipeline-stage
    type: Evidence integrity and acceptance boundary
    responsibility: "Authenticates the fresh sealing environment as managed origin, independently observes its final state after completion, verifies the trust-anchor relationship and ticket write boundary, verifies candidate and sealed handoff identities and complete bundle integrity, and compares captured identity with authoritative expected identity before isolated aggregation"
    inputs: ["Accepts expected trust-anchor, workflow-signer, tested-source, base, release, build, corpus, run, and required-role identities from Release Pipeline.", Accepts one authenticated sealed bundle per role and the pipeline-owned candidate and sealing environment records., Credentialed acquisition produces verified read-only inputs.]
    outputs: [Credentialed acquisition produces verified read-only inputs., "Returns an accepted complete set or explicit unmanaged, candidate-controlled, out-of-boundary, untrusted, missing, duplicated, mismatched, stale, corrupt, unsealed, credential-exposed, or isolation-failed outcomes."]
    depends_on: [BND-16, BND-15]
    certainty: assumed
    assumption: "Migrated from containers.md; not yet mapped to a code path."
  - id: BND-18
    legacy_id: Release Update Coordinator
    name: Release Update Coordinator
    kind: module
    type: Optional asynchronous metadata coordinator
    responsibility: "Checks compatible release metadata, reports a higher 0.x release, and hands installation authority to the Host Platform or package manager"
    inputs: [Receives update-check intent and returns compatible release information.]
    outputs: [Receives update-check intent and returns compatible release information. It never replaces installed binaries.]
    depends_on: [BND-19]
    certainty: assumed
    assumption: "Migrated from containers.md; not yet mapped to a code path."
  - id: BND-19
    legacy_id: Release Distribution
    name: Release Distribution
    kind: other
    type: Artifact and release-metadata distribution
    responsibility: "Publishes supported artifacts, integrity data, authenticated provenance, compatibility metadata, and release information without installing binaries"
    inputs: [Accepts verified release outputs and serves immutable artifacts and compatible release metadata.]
    outputs: [Accepts verified release outputs and serves immutable artifacts and compatible release metadata.]
    depends_on: [BND-15, External network availability]
    certainty: assumed
    assumption: "Migrated from containers.md; not yet mapped to a code path."
