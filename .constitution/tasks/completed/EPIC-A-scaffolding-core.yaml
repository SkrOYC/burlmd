id: A
name: scaffolding core
kind: tooling
capabilities: []
depends_on: []
scope:
  paths: [pubspec.yaml, rust/Cargo.toml, flutter_rust_bridge.yaml, rust/src/markdown/parser.rs, rust/src/api/ffi_api.rs]
  tech_spec_patchable: []
estimated_diff_lines: 1500
tickets:
  - id: BURL-A001
    title: Initialize FRB Monorepo
    type: Chore
    effort: 3
    depends_on: []
    category: DX
    scope:
      in: [pubspec.yaml, rust/Cargo.toml, flutter_rust_bridge.yaml]
    verification:
      command: cargo test --manifest-path rust/Cargo.toml && flutter test && dart
        analyze && git diff --check
      expected: Rust and Flutter tests pass, Dart analysis passes, and the working
        tree has no whitespace errors.
    stop_conditions: [STOP if FFI generation fails due to missing system dependencies.]
    description: "Set up the standard flutter_rust_bridge monorepo. Clear out the default counter code and establish the rust/src/api directory structure. FRB scaffolds rust_builder/cargokit/ containing vendored third-party Dart that upstream says to ignore; add analyzer.exclude for it in analysis_options.yaml, or the dart analyze pre-commit hook will gate on code this project does not own. The dart format hook is already scoped to lib/ and test/ for the same reason"
    acceptance:
      mode: gherkin
      evidence: |
        Given a fresh clone of the repository
        When I run `flutter_rust_bridge_codegen generate`
        Then the Dart bindings are successfully generated without errors
        And `cargo build` succeeds
    flows: []
    certainty: assumed
    status: done
    deviations:
      - files: [analysis_options.yaml, devenv.nix, lib/, linux/, macos/, rust/src/api/simple.rs, rust_builder/, test/, ".metadata", pubspec.lock]
        justification: "Standard Flutter project initialization (flutter create) and flutter_rust_bridge monorepo integration (flutter_rust_bridge_codegen integrate) scaffolded platform build trees, cargokit wrapper package, default main entrypoint, and analysis exclusions required for Dart and Rust build support. rust/src/api/simple.rs carries the FRB #[frb(init)] lifecycle hook (init_app) generated by the same scaffolding. devenv.nix's dart format loop and stray-.dart guard defensively include integration_test//test_driver/ (each existence-checked before use) even though neither directory exists in this tree yet, so that scope doesn't silently narrow if Flutter/FRB tooling creates them later"
  - id: BURL-A002
    title: Implement Markdown Parsing Logic
    type: Feature
    effort: 5
    depends_on: [BURL-A001]
    category: Correctness
    scope:
      in: [rust/src/markdown/parser.rs]
    verification:
      command: "cargo test --color=always --package rust --lib"
      expected: All unit tests pass.
    stop_conditions: ["STOP if `pulldown-cmark` fails to parse nested blocks correctly."]
    description: Build the Rust module that uses pulldown-cmark to parse raw Markdown text into the custom AST AstNode structures defined in the TechSpec
    acceptance:
      mode: gherkin
      evidence: |
        Given a raw markdown string with headings and bold text
        When the parsing function is called
        Then it returns an AstNode tree containing the correct TextRuns
    flows: []
    certainty: assumed
    status: done
    deviations:
      - files: [rust/src/markdown/mod.rs, rust/src/lib.rs, rust/Cargo.toml]
        justification: "Created rust/src/markdown/mod.rs to expose parser, declared pub mod markdown; in rust/src/lib.rs, and added pulldown-cmark dependency to rust/Cargo.toml to support Markdown AST parsing"
  - id: BURL-A003
    title: Expose AST over FFI
    type: Feature
    effort: 2
    depends_on: [BURL-A002]
    category: Correctness
    scope:
      in: [rust/src/api/ffi_api.rs]
    verification:
      command: "flutter_rust_bridge_codegen generate && cargo build"
      expected: Code generation and compilation succeed.
    description: Expose the AST data structures and the open_note synchronous parsing function across the flutter_rust_bridge boundary
    acceptance:
      mode: gherkin
      evidence: |
        Given the parsed AST structures
        When I run FRB codegen
        Then the corresponding Dart classes (AstNode, TextRun) are available in `lib/src/rust/`
    flows: []
    certainty: assumed
    status: done
    deviations:
      - files: [pubspec.yaml, pubspec.lock, lib/src/rust/api/ffi_api.dart, lib/src/rust/api/ffi_api.freezed.dart, lib/src/rust/frb_generated.dart, lib/src/rust/frb_generated.io.dart, lib/src/rust/frb_generated.web.dart, lib/src/rust/markdown/ast.dart, lib/src/rust/markdown/ast.freezed.dart, rust/src/api/mod.rs, rust/src/frb_generated.rs, rust/src/markdown/ast.rs, rust/src/markdown/mod.rs, rust/src/markdown/parser.rs]
        justification: "Added freezed and build_runner dependencies to pubspec.yaml required by flutter_rust_bridge_codegen for enum AST serialization across FFI, exported ffi_api in rust/src/api/mod.rs, and generated Dart FFI binding files under lib/src/rust/. The AstNode/InlineElement/TextRun definitions were moved into rust/src/markdown/ast.rs (a domain-owned module, since parsing is what produces and shapes them) and re-exported through ffi_api.rs so FRB's rust_input: crate::api scan still surfaces them; this resolved a circular dependency where markdown::parser had imported these same types back from api::ffi_api, which itself calls into markdown::parse_markdown. FRB codegen mirrors the new Rust module layout into Dart, so the generated AST classes now live under lib/src/rust/markdown/ instead of lib/src/rust/api/"
closeout:
