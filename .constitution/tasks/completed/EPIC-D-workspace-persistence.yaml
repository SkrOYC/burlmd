          dart-analyze hook bypassed for the four expected errors in the
          untouched test/components/editor_test.dart (the NoteState/NoteMetadata
          reshape debt this epic's sequencing deliberately assigns to
          BURL-D009); all other hooks passed and lib/ analyzes clean
  - id: BURL-D008
    title: Editing FFI Surface
    type: Feature
    effort: 5
    depends_on:
      - BURL-D003
      - BURL-D007
    category: Correctness
    scope:
      in:
        - rust/src/api/ffi_api.rs
        - rust/src/draft.rs
        - rust/src/frb_generated.rs
        - lib/src/rust/**
        - lib/src/providers/note_providers.dart
        - lib/src/providers/rust_api_provider.dart
      out:
        - lib/src/components/**
        - lib/src/screens/**
    verification:
      command: "cargo test --manifest-path rust/Cargo.toml api::ffi_api -- --list |
        grep -q ': test' && cargo test --manifest-path rust/Cargo.toml
        api::ffi_api && cargo clippy --manifest-path rust/Cargo.toml
        --all-targets -- -D warnings && dart analyze"
      expected: exit 0
    stop_conditions:
      - STOP if `update_block` retains its AST-based signature; ADR-007 decision
        4 replaces it with source text, and leaving both is a divergence the UI
        will pick the wrong one from.
      - STOP if `update_block` parses, splices, or returns a `NoteState`. It is
        the per-keystroke call and must stay cheap; the reparse belongs in
        `commit_block`. Putting it back on the typing path contradicts ADR-007,
        ADR-008 and `architecture/risks.md` risk 7 simultaneously.
      - STOP if generated bindings are hand-edited rather than regenerated and
        committed.
    description: "Expose the editing operations across the FFI boundary exactly as
      contracts/ffi_api.rs declares them: fetching a Block's raw source, the
      per-keystroke update_block that buffers text and writes the draft row
      without parsing, the commit_block that splices and reparses on blur, block
      insert, delete, split and merge, and the three range operations over a
      multi-Block selection. Leave exactly one entry point for opening a Note,
      open_note, taking a concept id. (The pre-v1.1.0 contract also listed
      open_note_by_id; it was never implemented, so there is no function to
      delete — the pair existed only because identity was ambiguous, and under
      ADR-004 it is not.) Delete save_note, which does exist in api/ffi_api.rs,
      in favour of flush_note, which now takes a concept id. Regenerate and
      commit the bindings. Note that a splice can change a Block's node shape,
      so the returned state is authoritative and callers must not retain a block
      path across a reparsing call"
    acceptance:
      mode: gherkin
      evidence: >
        Given an open Note

        When a Block's source is requested

        Then the raw Markdown for that Block is returned, including its
        delimiters


        Given an open Note

        When a Block is updated with new source text

        Then a draft row is written, no parse occurs, and no AST is returned


        Given a Block whose buffered source differs from the file

        When the Block is committed

        Then the Note's working source is reparsed and the span map rebuilt,
        with no second substitution — `update_block` already performed it, and
        the new state is returned


        Given a Block and a character offset

        When the Block is split at that offset

        Then the returned state contains two Blocks whose combined source equals
        the original


        Given the first Block of a Note

        When a merge with the previous Block is requested

        Then the operation is a no-op and returns the unchanged state


        Given a selection spanning three Blocks

        When it is copied as Markdown

        Then the returned text reproduces the selected content across all three


        Given the exposed surface

        When it is compared against contracts/ffi_api.rs

        Then open_note accepts a concept id and there is exactly one open-a-Note
        entry point

        And no exposed function takes a workspace_id parameter
    flows: []
    certainty: assumed
    status: done
