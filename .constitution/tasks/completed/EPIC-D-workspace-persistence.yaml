  follow_ups:
    - "**An undeclared dependency edge, `BURL-D007` → `BURL-D006`, surfaced
      during planning.** `D006`'s acceptance criteria need `D007`'s
      pathspec-scoped commit and its write tiers — a lifecycle operation has to
      commit exactly the paths it touched, and it has to carry every affected
      Note's buffer and draft row forward. The published DAG had them
      independent. Corrected in the critical path at v1.5.0 and recorded there
      so future DAGs model it rather than rediscovering it mid-execution."
    - "**A rare flake, since root-caused and fixed — and the record of it here
      was wrong twice over.**
      `git::operations::tests::path_in_head_distinguishes_a_new_note_from_one_a\
      lready_in_history` failed roughly 1 run in 15 early in this branch. This
      note originally called it \"pre-existing — it predates this epic and was
      not introduced by it\", and that was false: `path_in_head` and its test
      are *added* by this epic, and `master` carries neither, so nothing about
      it predates anything. It was then not reproducible in 40+ subsequent runs
      and was provisionally recorded as environmental (parallel tempdir `git
      init`), which was also wrong. PR #7 review round 13 reproduced it and
      found the cause, which is neither the test nor the Create-vs-Update
      decision path it exercises: the two `apply_credentials` tests in the same
      module built their fixture by `std::env::set_var`ing
      `GIT_CONFIG_COUNT`/`GIT_CONFIG_KEY_0`/`GIT_CONFIG_VALUE_0` into the
      **process** environment. `git` reads that sequence out of the environment
      it inherits at `fork`/`exec`, three `set_var` calls are not one atomic
      step, and `ENV_LOCK` deliberately does not cover the many tests here that
      spawn a real `git` child — so any `git init` landing after
      `GIT_CONFIG_COUNT=1` and before `GIT_CONFIG_VALUE_0` exists died with
      `error: missing config value for GIT_CONFIG_VALUE_0`, failing whichever
      unrelated test happened to be running. `path_in_head`'s test was simply
      one of a dozen candidates, which is why it looked intermittent and
      unattributable. Fixed by passing the inherited entry count into
      `apply_credentials_after` instead of mutating process state, so those two
      tests touch nothing outside their own `Command`; the module's tests now
      pass repeatedly under the ordinary parallel runner."
    - "**Foreign-bundle relative links inside a moved Note are not
      re-resolved.** When a Note containing relative links authored by an
      external tool is moved, its *inbound* links are rewritten correctly, but
      relative links pointing *out* of it are left as written and may now
      resolve differently. No ticket's criteria required otherwise, and the
      behaviour is defensible under CAP-PORT-03's tolerance of
      externally-authored files — but it is a real gap, and the natural home for
      it is an expansion of CAP-PORT-03 rather than a bug fix."
    - "**`find_notes_by_title`'s per-keystroke cost is unmeasured.**
      `schema.sql` declares no index on `notes(title)`, so the shipped query
      scans the active Workspace's rows. That is sound at current Note counts
      and was never on a keystroke path in this epic, since nothing calls it.
      Epic E's command-palette ticket puts it on one, and should measure it
      there before shipping — and add the index if the measurement calls for
      it."
    - "**No Dart-side wrapper tests exist.** The guard against mis-wiring a
      regenerated binding lives entirely in the Rust wrapper-layer tests added
      by `BURL-D008`'s fix round. A Dart-side test that a provider calls the FFI
      function it claims to would catch a class of error the Rust side
      structurally cannot see. Deferred to Epic E, which is where those wrappers
      first acquire a UI caller."
  settled: []
