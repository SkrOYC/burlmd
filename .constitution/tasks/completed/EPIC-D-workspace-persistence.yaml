tickets:
  - id: BURL-D001
    title: "Spike: Span Invalidation Under Source Splicing"
    type: Spike
    effort: 3
    depends_on: []
    category: Correctness
    scope:
      in:
        - .constitution/spikes/SPK-BURL-D001.md
      out:
        - rust/src/**
    verification:
      command: "test -s .constitution/spikes/SPK-BURL-D001.md && ! grep -q 'Status:
        placeholder' .constitution/spikes/SPK-BURL-D001.md && ! grep -q 'To be
        filled' .constitution/spikes/SPK-BURL-D001.md && git diff --quiet HEAD~1
        HEAD -- rust/src"
      expected: exit 0
    stop_conditions:
      - "STOP if this Spike is landed across more than one commit. Its gate
        asserts that the Spike's own commit touched no production code (`git
        diff --quiet HEAD~1 HEAD -- rust/src`), which is the only form that is
        neither trivially true — as `git diff --quiet HEAD` was — nor
        order-dependent, as comparing against the branch base is: `BURL-D001`
        and `BURL-D002` both have no dependencies, and `critical-path.md`
        numbers D002 first, so a branch-base comparison would already be dirty
        when this Spike arrives."
      - STOP if the tier 2 timer's synchronization with the synchronous FFI
        calls it races is left undecided. The timer is Core-owned and fires on
        its own thread while `update_block`/`commit_block` run on the Dart
        caller's; both touch the working source and span map, and the timer side
        does an encrypted database write and a file write. Reusing
        `db::connection`'s process-wide mutex naively lets a keystroke block on
        a lock held across a disk write, inside the 16ms budget. Record the
        shape and the measured contention — see ADR-008's consequences.
      - STOP if the investigation concludes that whole-file reparse cannot meet
        the 16ms budget in `prd/constraints.yaml` at realistic Note sizes; that
        invalidates ADR-007's mitigation and requires a Stage 3 pass, not an
        improvised offset-arithmetic implementation.
      - STOP if no production code change is required by the findings; a Spike
        that recommends implementation changes must name the ticket, not perform
        them.
    description: Establish empirically how the Core Engine should maintain source
      spans across a splice, and at what Note size the chosen approach stops
      being viable. architecture/risks.md risk 7 names whole-file reparse as the
      mitigation because it makes an incorrect span map unrepresentable, but the
      cost has never been measured. Determine the reparse cost curve against
      Note size using the pinned parser, identify the size at which it
      approaches the frame budget, and confirm whether reparse-after-commit
      keeps that cost off the per-keystroke path given the tiering in ADR-008.
      Record whether offset arithmetic is ever warranted, and if so under
      exactly what conditions
    acceptance:
      mode: gherkin
      evidence: >
        Given the spike report at .constitution/spikes/SPK-BURL-D001.md

        When it is reviewed

        Then it records measured reparse timings across at least three Note
        sizes spanning small, typical and pathological

        And it states the Note size at which reparse approaches the 16ms frame
        budget

        And it names the chosen span-maintenance strategy and the tickets it
        unlocks

        And no file under rust/src is modified by the Spike's own commit —
        throwaway prototyping is expected, since the timings and contention
        numbers this Spike must report cannot be obtained otherwise, and must
        live outside the crate entirely — a scratch checkout or a throwaway
        binary — not in rust/examples/. That location was named in an earlier
        revision on the grounds that the default target does not build it, which
        is true of cargo build and false of cargo clippy --all-targets, the tail
        of every Epic D gate: --all-targets expands to include --examples, so
        committed prototype code becomes a deny-warnings gate on BURL-D003, the
        very ticket this Spike unblocks. What must not happen is production code
        arriving under cover of a Spike
    flows: []
    certainty: assumed
    status: done
    spike: SPK-BURL-D001
  - id: BURL-D002
    title: OKF Bundle Domain Module
    type: Feature
    effort: 5
    depends_on: []
    category: Correctness
    scope:
      in:
        - rust/src/okf/mod.rs
        - rust/src/okf/frontmatter.rs
        - rust/src/okf/concept_id.rs
        - rust/src/okf/links.rs
        - rust/src/frb_generated.rs
        - rust/src/error.rs
        - rust/Cargo.toml
        - rust/src/lib.rs
      out:
        - rust/src/api/**
        - rust/src/db/**
    verification:
      command: "cargo test --manifest-path rust/Cargo.toml okf:: -- --list | grep -q
        ': test' && cargo test --manifest-path rust/Cargo.toml okf:: && cargo
        test --manifest-path rust/Cargo.toml -- --skip keyring && cargo clippy
        --manifest-path rust/Cargo.toml --all-targets -- -D warnings"
      expected: exit 0
    stop_conditions:
      - STOP if the YAML reader dependency named in `tech-spec/stack.yaml`
        cannot parse a fixture block; do not hand-roll a YAML parser, and do not
        substitute a different crate without a Stage 3 pass.
      - STOP if any code path in this module writes or re-serializes a
        frontmatter block; ADR-007 makes the block a read-only span.
    description: Implement the on-disk format domain specified in
      tech-spec/data-models/okf-bundle.md. Covers reading and validating a
      frontmatter block against okf-frontmatter.schema.json's
      required/recommended split, converting between a bundle-relative path and
      an OKF concept id in both directions, classifying a Markdown link target
      as an internal Link or an external link, deriving a Link's target concept
      id, and enforcing the reserved-filename rule. A file must be reported as
      non-conformant — rather than rejected — when its frontmatter is absent,
      unparseable, or parses without a non-empty type. All three, because OKF
      section 11 states three conformance conditions and the second is the type
      field; okf-frontmatter.schema.json already treats it as the sole
      conformance-bearing property
    acceptance:
      mode: gherkin
      evidence: >
        Given a Note file containing a frontmatter block with type and title

        When the frontmatter is read

        Then type and title are returned and the file is reported conformant


        Given a Note file whose frontmatter contains keys the application does
        not manage

        When the frontmatter is read

        Then those keys are reported present and their original bytes are left
        untouched


        Given a Note file with no frontmatter block at all

        When the frontmatter is read

        Then the file is reported non-conformant and is not rejected


        Given a Note file whose frontmatter block parses cleanly but carries no
        `type`

        When the frontmatter is read

        Then the file is reported non-conformant and is not rejected — OKF
        section 11's second condition is a non-empty `type`, so this is the only
        case where the check is more than a parse attempt, and it is the case a
        naive implementation gets wrong


        Given the bundle-relative path "projects/burlmd.md"

        When the concept id is derived

        Then it equals "projects/burlmd"


        Given a link target "/projects/architecture.md"

        When the link is classified

        Then it is an internal Link with target concept id
        "projects/architecture"


        Given a link target "https://example.com/page"

        When the link is classified

        Then it is an external link


        Given a concept id "projects/Meeting Notes"

        When a link to it is serialized

        Then the destination is angle-bracket wrapped —
        `[text](</projects/Meeting Notes.md>)` — because CommonMark forbids a
        space in a bare destination and the unwrapped form parses as paragraph
        text rather than as a link, producing no edge to index and nothing for a
        rename to rewrite


        Given a concept id containing a literal `<`, `>`, `&` or backslash

        When a link to it is serialized

        Then each is backslash-escaped inside the brackets, and parsing the
        result yields the original concept id unchanged — `&` included, because
        CommonMark decodes entity references inside a destination and
        `</Caf&eacute;.md>` parses back as `/Café.md`


        Given any Note title the derivation accepts

        When a link to that Note is serialized and the result is parsed back

        Then the recovered concept id equals the original — the round trip is a
        property test over titles including spaces, parentheses, `#`, `%`, a
        bare `&`, a named entity (`&amp;`, `&eacute;`), a numeric reference
        (`&#65;`) and the escaped characters above, not a fixture of single-word
        names


        Given a proposed Note filename of "index" or "log"

        When the name is validated

        Then it is rejected as reserved
    flows: []
    certainty: assumed
    status: done
    deviations:
      - files:
          - rust/Cargo.lock
          - .constitution/tech-spec/stack.yaml
        justification: "Cargo.lock changed as the direct side effect of adding saphyr,
          saphyr-parser and the proptest dev-dependency via cargo add, per
          project tooling policy (CLAUDE.md: \"You MUST use CLIs instead of
          manual edits when declaring packages\"); it is not itself named in the
          ticket's Scope but always moves with Cargo.toml. proptest was added as
          a dev-dependency because the ticket's own Gherkin requires \"a
          property test over a generator/corpus, not single-word fixtures\" for
          the link-serialization round trip
          (okf::links::tests::link_round_trips_through_serialize_and_a_real_par\
          se) — rust-core-logic's testing guidance names proptest/quickcheck as
          the tool for exactly this shape of invariant, and nothing already in
          the crate's dependency graph provided it. saphyr-parser was added as a
          direct dependency during this ticket's post-merge review round, to fix
          a P1/P2 finding: okf::frontmatter::read_frontmatter handed untrusted
          YAML straight to saphyr::Yaml::load_from_str, whose loader clones an
          aliased subtree on every reference, so a small (\"billion
          laughs\"-shaped) block of nested anchors aborts the process via an
          uncatchable allocation failure rather than returning non-conformant.
          saphyr-parser is not a new external dependency in substance — it is
          the crate saphyr itself is built on and already resolves transitively
          — added directly only so okf::frontmatter::contains_alias_reference
          can pre-scan the raw token stream for an Alias event and reject the
          block before saphyr's loader ever materializes anything, the same
          \"add a direct dependency for a transitively-resolved crate's specific
          API\" pattern stack.yaml already documents for reqwest. stack.yaml's
          YAML Reader entry is updated to record both additions and the
          dev-dependency, alongside the existing saphyr pin, so the BOM stays
          the single source of truth for what the crate actually depends on and
          why"
  - id: BURL-D003
    title: Span-Preserving Parse and Splice Engine
    type: Feature
    effort: 8
    depends_on:
      - BURL-D001
      - BURL-D002
    category: Correctness
    scope:
      in:
        - rust/src/markdown/parser.rs
        - rust/src/markdown/spans.rs
        - rust/src/markdown/splice.rs
        - rust/src/markdown/ast.rs
        - rust/src/markdown/mod.rs
        - rust/Cargo.toml
        - rust/src/frb_generated.rs
      out:
        - rust/src/api/**
        - rust/src/workspace/**
    verification:
      command: "cargo test --manifest-path rust/Cargo.toml markdown:: -- --list | grep
        -q ': test' && cargo test --manifest-path rust/Cargo.toml markdown:: &&
        cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D
        warnings"
      expected: exit 0
    stop_conditions:
      - STOP if satisfying Edit Fidelity appears to require adding a byte range
        to any `AstNode` variant; `tech-spec/guidelines.md` forbids spans
        crossing the FFI boundary and ADR-007 decision 3 states why.
      - STOP if any splice path needs to reconstruct Markdown from an AST; no
        serializer exists on the save path by design.
    description: "The heart of ADR-007. Parse a Note into an AST while building a
      Core-side span map keyed by block_path and, within each Block, by inline
      run (ADR-007 decision 8), then replace the bytes of one Block's span with
      new source text and reparse. The inline granularity is what lets a
      BlockRange — whose offsets are into *rendered* text, because it spans
      unfocused Blocks — resolve to the source offsets a splice needs. It costs
      no extra pass: Parser::into_offset_iter() already yields a range for every
      event, inline included. Frontmatter is located as a span like any other
      Block and is never re-serialized. Adopt the span-maintenance strategy
      chosen by BURL-D001. The round-trip property required by
      tech-spec/guidelines.md is the primary gate: splicing a Block's own
      unmodified source back over its span must reproduce the file
      byte-for-byte, including whitespace, delimiter style, and unmanaged
      frontmatter keys"
    acceptance:
      mode: gherkin
      evidence: >
        Given any Note in the fixture corpus and any Block within it

        When that Block's own unmodified source is spliced back over its span

        Then the resulting file is byte-identical to the original


        Given a Note whose paragraphs use underscore emphasis and asterisk
        bullets

        When a different Block is edited and the Note is written

        Then the untouched paragraphs retain underscore emphasis and asterisk
        bullets exactly


        Given a Note with frontmatter keys the application does not manage

        When any Block is edited and the Note is written

        Then the frontmatter block is byte-identical to the original


        Given a paragraph Block whose new source begins with a list marker

        When the splice is committed and the file reparsed

        Then the resulting node at that position is a list rather than a
        paragraph


        Given a paragraph whose source is `hello **bold** world`

        When rendered offset 6 is resolved against the span map

        Then it yields source offset 8, which is where `bold` begins


        Given a selection expressed as rendered offsets across two Blocks

        When it is resolved and the selected source extracted

        Then the extracted text is exactly the source spanned by the selection,
        delimiters included
    flows: []
    certainty: assumed
    status: done
    deviations:
      - files:
          - rust/proptest-regressions/markdown/splice.txt
        justification: Harness-generated artifact of the in-scope round-trip proptest,
          created during this ticket's review round. It holds the shrunk minimal
          reproducers of the two review findings (the fabricated 0..0 span for
          zero-render list items, and the overlapping span left by image
          hoisting), and proptest re-runs checked-in regressions ahead of novel
          cases — committing it is the tool's own recommendation and is the
          standing guard against regressions of exactly this class
  - id: BURL-D004
    title: Local Workspace Bootstrap
    type: Feature
    effort: 5
    depends_on:
      - BURL-D002
    category: Correctness
    scope:
      in:
        - rust/src/git/operations.rs
        - rust/src/lib.rs
        - rust/src/workspace/mod.rs
        - rust/src/workspace/bootstrap.rs
        - rust/src/api/ffi_api.rs
        - rust/src/db/connection.rs
        - rust/src/db/schema.sql
      out:
        - rust/src/api/auth.rs
        - lib/main.dart
    verification:
      command: "cargo test --manifest-path rust/Cargo.toml workspace::bootstrap --
        --list | grep -q ': test' && cargo test --manifest-path rust/Cargo.toml
        workspace::bootstrap && cargo test --manifest-path rust/Cargo.toml --
        --skip keyring && cargo clippy --manifest-path rust/Cargo.toml
        --all-targets -- -D warnings"
      expected: exit 0
    stop_conditions:
      - STOP if bootstrap requires reading a credential, contacting a network
        host, or consulting authentication state; `flow-workspace-bootstrap.md`
        contains no such step and CAP-WS-01 forbids one.
      - STOP if the encrypted index is placed inside the bundle directory;
        `tech-spec/guidelines.md` requires it live alongside, not within, and
        names the exact path.
      - STOP if an index file found at the old `$HOME/.burlmd/index.sqlite3`
        path is opened, migrated, or copied. It is stale derived state under a
        path the specification no longer names; the new path starts empty and
        `BURL-D005` rebuilds it from the bundle.
    description: "Implement open_or_create_local_workspace and open_workspace per
      flow-workspace-bootstrap.md. The second takes a caller-supplied directory
      and is what CAP-WS-05 and ADR-005 decision 7 both already assume exists.
      It converges on every post-condition of the first — index initialized,
      root key present, workspaces row written, bundle indexed, and a repository
      present — differing only in that it does not create the directory, and
      adopts existing history rather than replacing it. In particular it does
      initialize a repository when the directory has none (ADR-005 decision 8):
      tier 3 commits on every Note close, so a Workspace adopted without one
      leaves CAP-WS-02 unsatisfiable and close_note failing on the routine path.
      Resolves the default Workspace location and the index location specified
      in guidelines.md — the latter replacing the $HOME/.burlmd/index.sqlite3
      placeholder connection.rs carries from Epic B — creates the directory when
      absent, initializes a version-controlled repository in place, generates
      and stores the root encryption key on first boot, opens the encrypted
      index, and writes a Workspace row with a local provider and no remote. The
      root key path moves here from the authentication flow, where it never
      belonged. Both this path and a future clone path must converge on
      identical post-conditions"
    acceptance:
      mode: gherkin
      evidence: >
        Given no Workspace directory exists and no network is reachable

        When the local Workspace is opened

        Then the directory is created, a repository is initialized in it, and a
        Workspace row is written with a local provider and no remote URL


        Given no root encryption key exists in secure storage

        When the local Workspace is opened

        Then a key is generated, stored, and used to open the encrypted index
        (`CAP-WS-04` — the key generation moves here from the authentication
        flow, where it never belonged)


        Given a Workspace that already exists

        When the local Workspace is opened again

        Then the existing repository and Workspace row are reused and no second
        key is generated


        Given a Workspace has been opened

        When the index file location is inspected

        Then it is outside the bundle directory, at the path `guidelines.md`
        names, and not at `$HOME/.burlmd/index.sqlite3`


        Given an index file exists at the old `$HOME/.burlmd/index.sqlite3` path

        When the local Workspace is opened

        Then that file is neither opened nor migrated, and the Workspace opens
        against an index at the new path


        Given an existing directory of Markdown files that this application did
        not create

        When it is opened as a Workspace

        Then it becomes the active Workspace, a Workspace row is written for it,
        and no Note in it is modified


        Given that directory contains no version history

        When it is opened as a Workspace

        Then a repository is initialized in it — otherwise the close tier has
        nothing to commit into and CAP-WS-02 is unsatisfiable for every session
        in that Workspace (ADR-005 decision 8)


        Given that directory already contains version history

        When it is opened as a Workspace

        Then the existing history is adopted unchanged


        Given any connection opened against the encrypted index

        When `PRAGMA foreign_keys` is queried on it

        Then it reports enabled — the setting is per-connection and not stored
        in the file, and every cascade in the schema is inert without it


        Given an index file whose `user_version` reads something other than 0

        When the schema batch is re-applied on open

        Then `user_version` is left as it was rather than reset to the baseline
    flows: []
    certainty: assumed
    status: done
  - id: BURL-D005
    title: Bundle Indexer
    type: Feature
    effort: 8
    depends_on:
      - BURL-D003
      - BURL-D004
    category: Correctness
    scope:
      in:
        - rust/src/lib.rs
        - rust/src/index/mod.rs
        - rust/src/index/scan.rs
        - rust/src/index/incremental.rs
        - rust/src/api/ffi_api.rs
        - rust/src/frb_generated.rs
      out:
        - rust/src/sync/scheduler.rs
    verification:
      command: "cargo test --manifest-path rust/Cargo.toml index:: -- --list | grep -q
        ': test' && cargo test --manifest-path rust/Cargo.toml index:: && cargo
        clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings"
      expected: exit 0
    stop_conditions:
      - STOP if a full rescan is required to keep the index current during
        ordinary editing; `architecture/risks.md` risk 3 requires incremental
        updates as the routine path.
      - STOP if a file with unparseable frontmatter causes indexing to fail
        rather than being recorded as non-conformant; CAP-WS-05 and CAP-PORT-03
        both depend on tolerating it.
      - STOP if any path here clears `notes` before clearing `notes_fts` through
        `fts_mapping`. Deleting a `notes` row cascades the mapping away, and the
        mapping is the only pointer to the FTS row — see
        `data-models/schema.sql`. This applies to the full rebuild and to the
        incremental rewrite of a single Note, and it matters more here than on
        the delete path because reindex runs on first open, after a merge, and
        on recovery, orphaning the whole Workspace's text each time.
    description: Populate and maintain every index table from the bundle on disk —
      the work no production code has ever done. Covers a full scan producing
      Note rows with content hashes and conformance flags, full-text rows with
      their mapping rows, Link edges with derived target ids including ghost
      Links, and Directory rows including empty ones. Also provides the
      incremental path used on every write, and reindex_workspace, which closes
      Epic C's deferred item 3 where the sync scheduler's re-index hook
      currently calls a documented no-op. Every path that removes an existing
      row — the full rebuild, and the incremental rewrite of one Note — must
      clear notes_fts through fts_mapping *before* clearing notes, for the
      reason schema.sql gives at the mapping table. Full-text search must
      satisfy the sub-100ms constraint at a realistic corpus size
    acceptance:
      mode: gherkin
      evidence: >
        Given a bundle containing Notes in nested Directories

        When the Workspace is indexed

        Then every Note has a row keyed by its concept id, with a content hash
        and a conformance flag


        Given a Note containing a link to another Note that exists

        When the Workspace is indexed

        Then a Link edge is recorded with the target's concept id and it
        resolves


        Given a Note containing a link to a Note that does not exist

        When the Workspace is indexed

        Then a Link edge is still recorded and is reported as unresolved rather
        than dropped


        Given any Note whose AST is requested

        When its inline Links are examined

        Then `InlineElement::Link.exists` reflects whether the target concept id
        matches an indexed Note — `BURL-D003` declares the field but sits
        upstream of the index and has nothing to resolve it against, so
        populating it is this ticket's obligation


        Given an empty Directory in the bundle

        When the Workspace is indexed

        Then a Directory row exists for it


        Given a single Note has changed on disk

        When the incremental index path runs

        Then only that Note's rows are rewritten and no full rescan occurs


        Given an indexed Workspace whose Notes contain distinctive text

        When the Workspace is fully reindexed

        Then a search for text belonging to no current Note matches nothing — a
        rebuild that clears `notes` first strands every FTS row beyond reach,
        and reindex runs often enough that the leak is unbounded


        Given an indexed Workspace of at least one thousand Notes

        When a full-text query is executed

        Then results return in under 100 milliseconds


        Given any path that rebuilds or incrementally updates the index has just
        finished

        When the search query's plan is examined

        Then it drives from `notes_fts` and reaches `fts_mapping` through
        `idx_fts_mapping_rowid`, with no AUTOMATIC COVERING INDEX step —
        asserted on the plan rather than on a timing, because at a thousand
        Notes the wrong plan is still comfortably inside the 100ms budget and
        the criterion above passes with the defect in place


        Given a full or incremental reindex has completed

        When the index's table statistics are inspected

        Then `ANALYZE` has been run — without it the planner reaches `notes` by
        building a second automatic index per query, which the index alone does
        not fix
    flows: []
    certainty: assumed
    status: done
  - id: BURL-D006
    title: Note and Directory Lifecycle
    type: Feature
    effort: 8
    depends_on:
      - BURL-D005
    category: Correctness
    scope:
      in:
        - rust/src/workspace/mod.rs
        - rust/src/workspace/lifecycle.rs
        - rust/src/workspace/links_rewrite.rs
        - rust/src/api/ffi_api.rs
        - rust/src/frb_generated.rs
        - lib/src/providers/rust_api_provider.dart
      out:
        - rust/src/markdown/**
        - lib/**
    verification:
      command: "cargo test --manifest-path rust/Cargo.toml workspace::lifecycle --
        --list | grep -q ': test' && cargo test --manifest-path rust/Cargo.toml
        workspace::lifecycle && cargo clippy --manifest-path rust/Cargo.toml
        --all-targets -- -D warnings && dart analyze"
      expected: exit 0
    stop_conditions:
      - STOP if a rename or move can complete having rewritten only some inbound
        Links; `architecture/risks.md` risk 8 identifies partial rewriting as a
        silent graph-corruption mode, so the operation must be atomic or must
        fail.
      - STOP if a title collision is resolved by silently disambiguating the
        filename; the contract specifies an error.
      - STOP if a rename is refused because rewriting inbound Links violated the
        `links` primary key. That is a collision to merge, not a conflict to
        report — see the note on the key in `data-models/schema.sql`. The STOP
        above requires the operation be atomic or fail; it does not make this a
        legitimate failure.
    description: Implement creation, deletion, rename and move for Notes, and
      creation, rename and deletion for Directories, per contracts/ffi_api.rs.
      Because OKF identity is positional, rename and move change a Note's
      concept id, so each must rewrite the file, its index rows, and every
      inbound Link in one atomic operation committed together. Creation writes a
      conformant frontmatter block. Deletion is committed so it stays
      recoverable
    acceptance:
      mode: gherkin
      evidence: >
        Given a Workspace with a Directory

        When a Note is created in it with a title

        Then a file exists with a frontmatter block containing a non-empty type
        and that title, and it is indexed


        Given three Notes link to a fourth whose title contains a space

        When the fourth Note is renamed

        Then all three links resolve to the new concept id and no link is left
        pointing at the old one — the title is specified to contain a space
        because a fixture of single-word titles passes this criterion vacuously
        if links are serialized without angle brackets: there is no edge to
        rewrite and none left pointing anywhere


        Given a Note is moved to a different Directory

        When the move completes

        Then its concept id reflects the new path and every inbound link
        resolves


        Given a rename fails partway through rewriting inbound links

        When the operation returns

        Then no file, index row, or link has been changed


        Given a Note already exists with a name derived from a requested title

        When a second Note is created with that title

        Then the operation reports the path as unavailable and creates nothing


        Given a Note is renamed to a title deriving to an existing filename, or
        to a reserved one

        When the rename is attempted

        Then it reports the path as unavailable and changes nothing — renaming
        is checked on the same terms as creating


        Given a Note is renamed

        When the search index is queried by its new title

        Then it is found, and its old title no longer matches — `notes_fts`
        indexes the title, so a rename that updates only `notes` leaves search
        answering with the previous one


        Given a Note is deleted

        When local version history is inspected

        Then the deletion is committed and the prior content is recoverable


        Given a Note carrying an unflushed draft row is deleted

        When the draft table is inspected

        Then no row remains for it — the table has no foreign key, so nothing
        cascades and the deletion must clear it explicitly


        Given a Note whose content is indexed for full-text search is deleted

        When the search index is queried for text unique to it

        Then nothing matches — the `notes` cascade removes `fts_mapping`, which
        is the only pointer to the FTS row, so the FTS row must be deleted first
        or it becomes permanently unreachable and undeletable


        Given a Note carrying an unflushed draft row is renamed

        When the draft table is inspected

        Then the row is re-keyed to the new concept id and the drafted body is
        intact, with its frontmatter `title` carrying the new value — this is
        the one case the missing foreign key exists to permit, so it is the one
        case that must be tested, and preserving the draft byte-for-byte would
        make the next write revert the rename


        Given a Note is open with buffered edits when it is renamed

        When the idle write tier next fires

        Then it writes the new title and is not refused with a revision mismatch
        — its working source, span map and recorded revision all move with the
        rename


        Given Note B is open with buffered edits and contains a Link to Note A

        When A is renamed

        Then B's next idle write succeeds without a revision mismatch, and B's
        Link resolves to A's new concept id — a rename rewrites B's bytes too,
        so B's buffer, spans and revision must move with it or the verbatim
        write reverts the rewrite


        Given Note B carries an unflushed draft row and contains a Link to Note
        A

        When A is renamed and B is later opened

        Then B's restored draft contains the rewritten Link, not the old one —
        the draft is parsed in preference to disk, so a draft left unrewritten
        reverts the rename one session later


        Given three Notes link to a fourth

        When the fourth Note is renamed

        Then the returned `LifecycleEffects.rewritten` names all three — their
        own ids did not change, so the shell has no other way to learn their
        bytes moved, and `BURL-E005` depends on this list to reload them


        Given a Note contains a Link to itself

        When it is renamed

        Then both its frontmatter title and its self-Link are rewritten


        Given a Note links to both `Old` and a not-yet-created `New`

        When `Old` is renamed to `New`

        Then the rename succeeds and the two inbound edges collapse to one,
        rather than failing on the `links` primary key
    flows: []
    certainty: assumed
    status: done
    deviations:
      - files:
          - rust/src/workspace/persist.rs (additive only)
        justification: "contracts/ffi_api.rs states three obligations on rename_note —
          the working source, the span map and the recorded revision of *every
          affected Note* must be carried forward — and all three are discharged
          against state that workspace::persist keeps private. SessionState's
          fields live behind a private Mutex, and a SessionInner's identity (its
          concept id and the two paths derived from it) is immutable by
          construction precisely because every reader of it reads without a
          lock: the idle timer, tier 2's OCC sequence and tier 3's pathspec
          commit. There is therefore no way to express a session re-key from
          workspace/lifecycle.rs, and refusing to rename an open Note — the
          alternative the contract itself names — is explicitly not the answer
          taken, because BURL-E005 makes renaming an open Note a
          criterion-backed workflow and the set of affected *source* Notes is
          not something the user can see in order to close them first. The
          change is additive: two new pub(super) functions
          (carry_session_forward, discard_session) and one private method
          (NoteSession::install_rewrite), plus three visibility widenings from
          private to pub(super) (Workspace::with_db, Workspace::note_path,
          atomic_write). No existing signature, body or behavior changed, and
          pub(super) keeps all of it private to the workspace module.
          Re-implementing atomic_write inside lifecycle.rs was the way to touch
          nothing, and was rejected because architecture/resilience.md's
          survive-an-abrupt-termination guarantee would then have two
          implementations free to drift"
  - id: BURL-D007
    title: Persistence Tiers
    type: Feature
    effort: 5
    depends_on:
      - BURL-D003
      - BURL-D005
    category: Correctness
    scope:
      in:
        - rust/src/git/operations.rs
        - rust/src/workspace/mod.rs
        - rust/src/workspace/persist.rs
        - rust/src/draft.rs
        - rust/src/api/ffi_api.rs
        - rust/src/frb_generated.rs
      out:
        - rust/src/sync/scheduler.rs
    verification:
      command: "cargo test --manifest-path rust/Cargo.toml workspace::persist --
        --list | grep -q ': test' && cargo test --manifest-path rust/Cargo.toml
        workspace::persist && cargo clippy --manifest-path rust/Cargo.toml
        --all-targets -- -D warnings"
      expected: exit 0
    stop_conditions:
      - STOP if a commit is triggered on a timer rather than on Note close;
        ADR-008 rejected timer-based commits explicitly.
      - STOP if a file write is not atomic; `architecture/resilience.md`
        guarantees the previous state survives an abrupt termination mid-write.
    description: "Implement the four tiers of ADR-008. Every Block edit writes a
      draft row; roughly a second of inactivity splices and writes the file
      atomically; closing a Note or quitting flushes any pending write, makes
      one commit for the session, clears the draft row, and notifies the sync
      scheduler — giving notify_activity() its first caller since Epic C. The
      write tier compares the file on disk against the Core's current revision
      for that Note — initialised to the on-disk hash at open and re-recorded
      after every successful write — immediately before writing, and refuses the
      write on mismatch. The re-recording is the load-bearing half: the timer
      fires repeatedly in one session, so a baseline pinned to open time would
      make the second write fail against the first — the Optimistic Concurrency
      Control in architecture/risks.md risk 6, now guarding file content rather
      than a database column. That comparison belongs entirely to the Core:
      flush_note takes no revision token, because the UI never learns when the
      idle tier fires and any token it held would be stale by construction.
      Switching away from a Note counts as closing it"
    acceptance:
      mode: gherkin
      evidence: >
        Given a Note is being edited

        When a Block edit is committed

        Then a draft row exists for that Note and the file on disk is unchanged


        Given a Note with no pending edits

        When a Block is split, merged, inserted, deleted, or a multi-Block range
        is replaced

        Then a draft row exists for that Note immediately, before the write tier
        fires — each of these is a discrete user action with no preceding
        keystroke call, so scoping tier 1 to `update_block` would leave the edit
        only in memory until the timer


        Given a structural edit has been made and the process is killed before
        the write tier fires

        When the Note is next opened

        Then that edit is present


        Given a draft row exists and the process is terminated without cleanup

        When the Note is next opened

        Then the in-progress content is restored and the state reports it came
        from a draft


        Given a Note with pending edits

        When the idle write tier fires

        Then the file is written atomically and a new content hash is returned


        Given a Note has been written but not closed

        When local version history is inspected

        Then no commit exists for this session yet


        Given a Block is still focused and the idle interval elapses

        When the write tier fires

        Then the Note's working source is written verbatim and atomically, and
        no splice and no reparse occur in this tier


        Given a Block whose source grows by two bytes

        When the edit is buffered

        Then that Block's own span end moves by two as well as every later span
        shifting by two — resizing the edited span, not only shifting the ones
        after it


        Given a Block edited, written mid-focus by the idle tier, and then
        blurred

        When the file is inspected

        Then it contains the typed text exactly once — the case where a second
        writer re-splices over an unresized span duplicates it


        Given a Note with edits from this session

        When the Note is closed

        Then exactly one commit is made, the draft row is cleared, and the sync
        scheduler is notified


        Given a Note is opened and closed with no edits

        When local version history is inspected

        Then no commit was made — reading a Note is the most common path through
        this tier, and an empty commit per Note visited would destroy the
        readable history this design exists to produce


        Given two Notes have unwritten changes on disk

        When one of them is closed

        Then the commit contains that Note only — a whole-worktree commit would
        sweep both and break the one-commit-per-Note-per-session guarantee


        Given any commit this tier makes

        When its author is inspected

        Then it is the fixed application identity from ADR-008, not a value read
        from the user or from global Git configuration — this commit is the
        whole of `CAP-WS-02`, the durability guarantee that makes a local-only
        Workspace trustworthy before any Remote exists


        Given a Note with edits and no external modification

        When the idle write tier fires twice in one session

        Then both writes succeed and neither is refused — the baseline advances
        with each write, so the second is not compared against the state the
        first replaced


        Given the on-disk file was changed by something other than this
        application

        When the idle write tier fires

        Then the write is refused with a revision mismatch carrying the current
        revision, and the file on disk is left untouched


        Given a Note whose write tier has just refused a write with a revision
        mismatch

        When the Note is reloaded

        Then the draft row is deleted, the file's current bytes are reparsed,
        the working source, span map and revision baseline are all rebuilt from
        them, and the returned state reports it was not restored from a draft


        Given a Note has been reloaded

        When the idle write tier next fires

        Then it succeeds — the baseline now matches disk, so the mismatch does
        not repeat; without a reload the same comparison fails on every tick
        indefinitely, because `open_note` parses the surviving draft in
        preference to disk and would hand back the buffer that just lost


        Given the reloaded file contains Git conflict markers written by the
        sync path

        When the reloaded state is examined

        Then they appear as Suggestion nodes rather than as literal text — this
        is the only call that reads externally-written bytes into an
        already-open Note, so it is where risk 6's residual path terminates


        Given a Note whose source is 100 kilobytes

        When a single Block edit is committed to the draft tier

        Then the measured write completes within the frame budget, and the
        measurement is recorded in the test rather than asserted by inspection
    flows: []
    certainty: assumed
    status: done
    deviations:
      - files:
          - rust/src/markdown/spans.rs
          - rust/src/db/schema.sql
          - and a behavioral (not signature) change to open_note in
            rust/src/api/ffi_api.rs
        justification: spans.rs gained SpanMap::apply_buffered_edit because the map's
          fields are private and its builder is pub(super), so ADR-008 decision
          2's buffered-edit span arithmetic (resize the edited span, shift later
          ones, resize ancestor containers) was inexpressible from
          workspace/persist.rs without it; the method lives with the invariants
          it must preserve. schema.sql gained drafts.edit_seq INTEGER NOT NULL
          DEFAULT 0 because SPK-BURL-D001 §6.2.6's settled draft-clear compares
          a sequence persisted in the row (DELETE … AND edit_seq <= ?), and the
          column did not exist; this is a baseline DDL edit (nothing deployed,
          user_version unchanged) and is mirrored into
          .constitution/tech-spec/data-models/schema.sql at reconciliation.
          open_note now delegates to a persist::NoteSession when the path
          resolves inside the active Workspace (falling back to the direct read
