tickets:
  - id: BURL-E001
    title: Manual-QA Smoke Harness
    type: Chore
    effort: 2
    depends_on: []
    category: DX
    scope:
      in: [scripts/smoke-shot.sh, devenv.nix, ".gitignore"]
      out: ["lib/**", "rust/src/**"]
    verification:
      command: "./scripts/smoke-shot.sh harness-selftest && test -s .qa/harness-selftest.png"
      expected: exit 0
    stop_conditions: ["STOP if the harness cannot capture a screenshot in this environment; report the limitation rather than substituting a widget-test assertion, because substituting one recreates exactly the blind spot this ticket exists to close."]
    description: "Provide the repeatable command every subsequent UI ticket uses as its gate. It builds the native library in release mode (required because the generated loader resolves it from a path the debug bundle does not populate), builds and launches the desktop application, waits for it to render, captures a screenshot to a known location, and terminates cleanly with a non-zero exit if the application failed to start. The screenshot tooling is already provisioned in the developer environment for this purpose; this ticket turns an ad-hoc procedure documented in tech-spec/guidelines.md into a command"
    acceptance:
      mode: gherkin
      evidence: |
        ```gherkin
        Given a clean checkout in the developer environment
        When the smoke harness is run with a name
        Then the application builds, launches, is screenshotted to a file under that name, and the process exits zero
        
        Given the application fails to launch
        When the smoke harness is run
        Then it exits non-zero and no screenshot is written
        ```
    flows: []
    certainty: assumed
    status: done
  - id: BURL-E002
    title: Open Directly Into the Workspace
    type: Feature
    effort: 3
    depends_on: [BURL-E001]
    category: Correctness
    scope:
      in: [lib/main.dart, lib/src/screens/workspace.dart, lib/src/providers/workspace_provider.dart, lib/src/providers/rust_api_provider.dart, test/widget_test.dart]
      out: [lib/src/screens/login.dart, lib/src/providers/auth_provider.dart]
    verification:
      command: "flutter test && ./scripts/smoke-shot.sh e002-workspace-opens"
      expected: exit 0
    stop_conditions: ["STOP if removing the gate requires deleting the login screen or the auth provider; both remain for the deferred connect flow and only stop being a startup gate.", "STOP if any editing, navigation or search surface remains reachable only when authenticated; CAP-WS-01 requires none of them be."]
    description: "Remove the authentication gate from application startup. The application opens the local Workspace on launch and presents it directly. Authentication state governs synchronization only, and no editing capability depends on it. This is the change that makes the application usable at all — it is currently unusable end to end, for a reason that is a specification defect rather than a bug"
    acceptance:
      mode: gherkin
      evidence: |
        ```gherkin
        Given no credentials exist in secure storage and no network is reachable
        When the application is launched
        Then the Workspace is presented and no login screen appears
        
        Given the application has been launched with no credentials
        When a screenshot is captured
        Then it shows the Workspace shell rather than a login prompt
        
        Given the application is restarted
        When it opens
        Then the same local Workspace is reused rather than recreated
        ```
    flows: []
    certainty: assumed
    status: done
  - id: BURL-E003
    title: Directory Tree Sidebar
    type: Feature
    effort: 5
    depends_on: [BURL-E002]
    category: Correctness
    scope:
      in: [lib/src/components/workspace_tree.dart, lib/src/providers/workspace_provider.dart, lib/src/screens/workspace.dart, test/components/workspace_tree_test.dart]
      out: [lib/src/components/editor.dart]
    verification:
      command: "flutter test test/components/workspace_tree_test.dart && ./scripts/smoke-shot.sh e003-tree"
      expected: exit 0
    stop_conditions: ["STOP if the tree holds Note content in widget state; `tech-spec/guidelines.md` permits only ephemeral UI state such as which nodes are expanded.", "STOP if rendering the tree requires one call per Directory level; the contract returns the tree in a single call."]
    description: "Render the Workspace as a nested, expandable Directory tree and open a Note when one is selected. This is the primary navigation surface — without it no Note is reachable after being written. Directories sort before Notes at each level. Empty Directories appear, which is why they are indexed at all"
    acceptance:
      mode: gherkin
      evidence: |
        ```gherkin
        Given a Workspace with nested Directories and Notes
        When the tree is rendered
        Then each level lists Directories before Notes, sorted by name
        
        Given a Directory containing no Notes
        When the tree is rendered
        Then that Directory still appears
        
        Given a collapsed Directory
        When it is expanded
        Then its children appear without a further Workspace-wide reload
        
        Given a Note in the tree
        When it is selected
        Then that Note opens
        ```
    flows: []
    certainty: assumed
    status: done
  - id: BURL-E004
    title: Mount the Editor and Navigate
    type: Feature
    effort: 5
    depends_on: [BURL-E003]
    category: Correctness
    scope:
      in: [lib/src/screens/workspace.dart, lib/src/components/editor.dart, lib/src/providers/note_providers.dart, test/components/editor_test.dart]
      out: [lib/src/components/workspace_tree.dart]
    verification:
      command: "flutter test test/components/editor_test.dart && ./scripts/smoke-shot.sh e004-editor-mounted"
      expected: exit 0
    stop_conditions: ["STOP if switching Notes does not close the outgoing Note through the Core; leaving it unclosed skips the commit tier and loses the session from version history.", "STOP if an error returned across the boundary is swallowed rather than surfaced; the editor currently has no error surface at all."]
    description: "Mount the editor for the first time. Selecting a Note in the tree opens it and renders its Blocks; switching to another Note closes the outgoing one through the Core so its session is written and committed. Failures crossing the boundary are surfaced rather than discarded — a gap the review of Epic B recorded but left unreachable because the editor was never mounted"
    acceptance:
      mode: gherkin
      evidence: |
        ```gherkin
        Given a Note is selected in the tree
        When it opens
        Then its Blocks render as formatted output
        
        Given a Note with unsaved edits is open
        When a different Note is selected
        Then the outgoing Note is closed through the Core before the new one opens
        
        Given the Core returns an error when opening a Note
        When the editor handles it
        Then the failure is shown to the user rather than silently ignored
        
        Given a Note has been opened in the running application
        When a screenshot is captured
        Then its rendered content is visible
        ```
    flows: []
    certainty: assumed
    status: done
    deviations:
      - files: ["test/components/workspace_tree_test.dart (not in this ticket's declared scope)"]
        justification: "The milestone review of BURL-E003 raised a P2 — the tree's selection highlight read selectedNoteIdProvider without watching, leaving stale highlight after the first tap. Fixing it was mandated during BURL-E004 because the editor consumes the same selection seam; the fix landed in workspace_tree.dart (adjacent-scope) and this regression test locks the behavior"
  - id: BURL-E005
    title: Note and Directory Lifecycle Actions
    type: Feature
    effort: 5
    depends_on: [BURL-E004]
    category: Correctness
    scope:
      in: [lib/src/components/workspace_tree.dart, lib/src/components/lifecycle_actions.dart, lib/src/providers/workspace_provider.dart, test/components/lifecycle_actions_test.dart]
      out: ["rust/src/**"]
    verification:
      command: "flutter test test/components/lifecycle_actions_test.dart && ./scripts/smoke-shot.sh e005-lifecycle"
      expected: exit 0
    stop_conditions: [STOP if deletion is offered without confirmation., "STOP if a rejected name collision is worked around client-side by altering the name; the Core reports the path unavailable and the user must be told.", "STOP if `LifecycleEffects.rewritten` is ignored. Those Notes' ids did not change and nothing about them looks stale, which is exactly why the Core returns the list — an open one holds a Link to an id that no longer exists, and following it recreates the concept the rename removed."]
    description: "Surface creation, rename, move and deletion for Notes, and creation, rename and deletion for Directories. Because a rename or move changes a Note's identity, the open Note must re-anchor to the returned state rather than retaining its previous identifier. Moving is available at least through an explicit action; drag-and-drop is not required"
    acceptance:
      mode: gherkin
      evidence: |
        ```gherkin
        Given a Directory is selected
        When a new Note is created in it with a title
        Then it appears in the tree and opens for editing
        
        Given a Note is open and is renamed
        When the rename completes
        Then the tree shows the new title and the open editor remains anchored to the same Note
        
        Given a title collides with an existing Note
        When creation is attempted
        Then the conflict is reported to the user and no Note is created
        
        Given a Note is selected for deletion
        When deletion is confirmed
        Then it disappears from the tree and the editor closes it
        
        Given a Note is moved to another Directory
        When the move completes
        Then it appears under the new Directory in the tree
        
        Given a Note from inside a Directory is open
        When that Directory is renamed
        Then the open Note re-anchors using the id remapping the Core returns, rather than holding a dead identifier
        
        Given Note B is open and contains a Link to Note A
        When A is renamed
        Then B reloads, because `LifecycleEffects.rewritten` names it — B's own id did not change, so nothing looks wrong, but its in-memory AST still carries A's old `target_id`
        
        Given B was not reloaded after such a rename
        When its stale Link is followed
        Then the failure this criterion exists to prevent is visible: the create-on-follow path recreates the concept the rename removed
        
        Given the Block containing that Link is the focused one in B
        When A is renamed
        Then B's editable field is refreshed from the returned state before the next keystroke — otherwise `update_block` substitutes the pre-rewrite source back and reverts the rename
        
        Given a Note is open
        When its containing Directory is deleted
        Then the editor closes that Note rather than leaving it open against a removed file
        ```
    flows: []
    certainty: assumed
    status: done
    deviations:
      - files: [lib/src/providers/note_providers.dart (two additive methods), lib/src/providers/workspace_provider.dart (one additive method)]
        justification: "Re-anchoring an identity-changed open Note needs to replace [activeNoteProvider]'s state from outside the notifier, but Riverpod marks external .state assignment protected/visible_for_testing, so production code cannot do it without lint violations. Three minimal additions instead: NoteController.adopt(NoteState) (re-anchor path — adopt the Core's returned post-operation state whose session was carried forward under the new id), NoteController.clear() (close-in-editor path after deletion, where sending close_note would raise NotFound because the Core already discarded the session), and SelectedNoteId.clear() (unselect on delete). No existing method or behavior changed"
  - id: BURL-E006
    title: Search Surface
    type: Feature
    effort: 3
    depends_on: [BURL-E004]
    category: Correctness
    scope:
      in: [lib/src/components/search_panel.dart, lib/src/providers/search_provider.dart, test/components/search_panel_test.dart]
      out: [lib/src/components/workspace_tree.dart]
    verification:
      command: "flutter test test/components/search_panel_test.dart && ./scripts/smoke-shot.sh e006-search"
      expected: exit 0
    stop_conditions: ["STOP if the result limit is hardcoded in the UI; the Core takes it as a parameter precisely so the surface controls it."]
    description: "Give full-text search a surface for the first time. Search is scoped to the current Workspace, returns ranked results with snippets, and opens a Note when a result is selected. Results must remain responsive within the sub-100ms constraint, so queries are issued against the index rather than filtered client-side"
    acceptance:
      mode: gherkin
      evidence: |
        ```gherkin
        Given a Workspace containing Notes with distinct content
        When a query matching one of them is entered
        Then that Note appears in the results with a snippet
        
        Given a search result is shown
        When it is selected
        Then the corresponding Note opens
        
        Given a query matching no Note
        When it is entered
        Then an empty state is shown rather than an error
        
        Given a query containing punctuation such as hyphens and parentheses
        When it is entered
        Then results or an empty state are shown and no error surfaces
        ```
    flows: []
    certainty: assumed
    status: done
  - id: BURL-E007
    title: Recovered Draft Surface
    type: Feature
    effort: 2
    depends_on: [BURL-E004]
    category: Correctness
    scope:
      in: [lib/src/components/draft_recovery.dart, lib/src/providers/workspace_provider.dart, test/components/draft_recovery_test.dart]
      out: ["rust/src/**"]
    verification:
      command: "flutter test test/components/draft_recovery_test.dart && ./scripts/smoke-shot.sh e007-draft-recovery"
      expected: exit 0
    stop_conditions: ["STOP if recovered content is discarded when the user dismisses the notice; dismissal hides the notice, it does not delete work.", "STOP if a write-tier failure is left unsurfaced. `note_write_status` exists because the write tier's trigger is a Core-owned timer with no caller to return an error to; if nothing polls it, `RevisionMismatch`, `DiskFull` and `IoError` are raised into nothing while the user keeps typing into a buffer nothing can persist."]
    description: "Make crash recovery visible, and write failure visible with it — the two share a surface because both are the application telling the user something about durability that it cannot say through the editor itself. On startup, Notes carrying an unflushed draft from a previous session are surfaced so the user knows work was recovered rather than silently finding a Note in an unexpected state. Opening such a Note shows the recovered content, and the state carries the fact that it came from a draft"
    acceptance:
      mode: gherkin
      evidence: |
        ```gherkin
        Given a draft exists from a session that ended without flushing
        When the application starts
        Then the affected Note is surfaced as having recovered work
        
        Given a recovered Note is opened
        When it renders
        Then it shows the drafted content rather than the last content written to disk
        
        Given the recovery notice is dismissed
        When the Note is opened afterwards
        Then the recovered content is still present
        
        Given the write tier fails with a revision mismatch on an open Note
        When the UI next polls its write status
        Then the failure is shown, and the user is offered a reload rather than a retry — the file changed underneath the draft, so retrying would overwrite it
        
        Given that reload is accepted
        When it completes
        Then the Note re-renders from disk and the write status clears — the offer calls `reload_note`, not `open_note`, which would restore the surviving draft and reproduce the mismatch on the next tick
        
        Given that reload is offered
        When the user has not yet chosen
        Then their buffered text is still reachable, and the confirmation says plainly that reloading discards it — `reload_note` destroys unwritten work by design, and this is the only prompt in the application that does
        
        Given the write tier fails because the disk is full
        When the UI next polls
        Then the failure is shown persistently rather than once, since every subsequent write fails the same way until it is resolved
        ```
    flows: []
    certainty: assumed
    status: done
    deviations:
      - files: [lib/src/providers/note_providers.dart (+26 lines)]
        justification: "Added NoteController.reloadFromDisk() wrapping reload_note. Assigning a reloaded NoteState into activeNoteProvider requires the notifier itself (state setter is @protected); duplicating controller logic outside it was the worse alternative"
  - id: BURL-E008
    title: Rescan Workspace
    type: Feature
    effort: 2
    depends_on: [BURL-E002, BURL-E003]
    category: Correctness
    scope:
      in: [lib/src/screens/workspace.dart, lib/src/providers/workspace_provider.dart]
      out: ["rust/src/**", "lib/src/components/**"]
    verification:
      command: "flutter test && ./scripts/smoke-shot.sh shel-e008"
      expected: "exit 0, screenshot showing the tree reflecting an externally added Note without an application restart"
    stop_conditions: ["STOP if the rescan path is reachable while a Note is open with unflushed edits; the recorded transient-drop window means rescanning under open sessions can silently discard freshly-written index rows. The affordance refreshes the shell's view of the Workspace; it does not run mid-session underneath open Notes."]
    description: "Implement CAP-WS-06. A user-invokable action re-derives the shell's view of the Workspace from disk by driving the existing full-reindex call and refreshing the tree, so external writes made while the application runs become visible without restarting. Stale-until-refresh is the documented behavior: no file watching this wave. The affordance lives where navigation lives (the tree surface), states plainly what it does, and disables while any Note is open with unwritten edits per the STOP"
    acceptance:
      mode: gherkin
      evidence: |
        ```gherkin
        Given an external tool adds a Note to the Workspace directory while the application runs
        When the user invokes the rescan action with no Note holding unwritten edits
        Then the tree shows the new Note without an application restart
        
        Given a Note is open with buffered edits not yet written
        When the user invokes the rescan action
        Then the action is unavailable or refused, and no index rows are discarded
        
        Given the full reindex fails (unreadable file)
        When the rescan attempt completes
        Then the failure surfaces as a message naming the failure, and the tree keeps its previous view rather than showing a partial one
        ```
        
        ## Completion Notes & Deferred Follow-Ups
        
        All eight tickets (`BURL-E001` … `BURL-E008`, 27 story points) are implemented, independently reviewed and merged across 15 commits (`713de70` … `b3cd66f`): nine feature commits, one review-fix commit, one harness hardening, three docs commits recording deviations, and the integration milestone that mounted the remaining surfaces. The convention followed throughout was a single-pass full review per milestone with every P0 and P1 fixed before the next ticket began; P2/P3 findings were either fixed in round or recorded below.
        
        **Validation.** Every ticket launched the real application as part of its gate — thirteen smoke screenshots via `scripts/smoke-shot.sh` (the harness built first for exactly this reason), each alongside its targeted `flutter test` runs. The epic-level carry-forward recorded during execution — that no ticket mounted `SearchPanel`, `RecoveredDraftsPanel` or `WriteTierNotice` into the shell — was discharged at reconciliation rather than archived open: commit `b3cd66f` mounts all three into `workspace.dart` (search toggled from the sidebar, drafts panel above the tree, write-tier notice above the editor), with write-tier polling arming when a Note is open.
        
        **Deviations shipped under record:** `BURL-E004` touched `test/components/workspace_tree_test.dart` outside its declared scope (P2 selection-highlight fix mandated by review); `BURL-E005` added three minimal provider methods (`NoteController.adopt`/`.clear()`, `SelectedNoteId.clear()`) to re-anchor an identity-changed open Note without violating Riverpod's protected state setter; `BURL-E007` added `NoteController.reloadFromDisk()` for the same reason; and the integration milestone that mounted the remaining surfaces also introduced `test/screens/workspace_mounting_test.dart` and extended `test/screens/workspace_rescan_test.dart` — both are justified reconciliation artifacts, since no single ticket's scope owned the shell-level mounting they cover.
        
        The following were identified during implementation or reconciliation and are explicitly out of this epic's scope. They are recorded here rather than silently dropped:
        
        1. **`lib/src/components/status_message.dart`** is a new shared SnackBar seam introduced by the PR review-fix commits (one `showStatusMessage(BuildContext, String)` helper so lifecycle-outcome and rescan reporting hide-then-show through a single path). It is a justified reconciliation artifact consumed by the `BURL-E005` and `BURL-E008` surfaces, neither of whose declared scopes owned a shared reporting seam.
        
        2. **A Zero-Directory Workspace has no entry point for creating a root-level Directory.** Row menus only exist on existing tree rows (also recorded as `BURL-E005`'s known limitation). Until surfaced otherwise, first content must arrive through a path that already has a Directory.
        3. **`RecoveredDraftsPanel` can overflow vertically** with very many recovered drafts (P3): it has no scroll container.
        4. **The tree-row overflow "move" picker silently no-ops while the tree snapshot is loading** (P3).
        5. **Open question from the `BURL-E008` review:** whether Core-side `reindex_workspace` transactionality covers typing into a previously-clean Note while a rescan is in flight. Worth settling before any future ticket widens the rescan path.
        6. **No test coverage of the periodic-timer arm path** (write-tier polling) — a deliberate fake-clock tradeoff, recorded so its absence reads as a decision rather than an oversight.
        7. **Two standing standards adopted before this epic painted widgets were not met by its own widgets:** zero `Semantics` wrappers ship, user-facing strings are hardcoded literals across the new components, and no `gen-l10n` scaffolding exists. Recorded in `tech-spec/changelog.md` v1.4.0 as well; owed before the Wave 3 design epic builds final UI.
    flows: []
    certainty: assumed
    status: done
