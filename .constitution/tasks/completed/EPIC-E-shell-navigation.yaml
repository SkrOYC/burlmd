  paths: [scripts/smoke-shot.sh, devenv.nix, ".gitignore", lib/main.dart, lib/src/screens/workspace.dart, lib/src/providers/workspace_provider.dart, lib/src/providers/rust_api_provider.dart, test/widget_test.dart, lib/src/components/workspace_tree.dart, test/components/workspace_tree_test.dart, lib/src/components/editor.dart, lib/src/providers/note_providers.dart, test/components/editor_test.dart, lib/src/components/lifecycle_actions.dart, test/components/lifecycle_actions_test.dart, lib/src/components/search_panel.dart, lib/src/providers/search_provider.dart, test/components/search_panel_test.dart, lib/src/components/draft_recovery.dart, test/components/draft_recovery_test.dart]
  tech_spec_patchable: []
