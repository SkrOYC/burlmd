  - id: BURL-B004
    title: Expose SQLite Queries to FFI
    type: Feature
    effort: 2
    depends_on: [BURL-B003]
    category: Correctness
    scope:
      in: [rust/src/api/ffi_api.rs]
    verification:
      command: cargo build
      expected: exit 0
    description: "Expose search_notes and save_note functions across the FRB boundary, wiring them to the rusqlite database operations"
    acceptance:
      mode: gherkin
      evidence: |
        Given the FFI bridge
        When Dart calls `search_notes`
        Then the Rust core executes an FTS5 query and returns `NoteMetadata`
    flows: []
    certainty: assumed
    status: done
    deviations:
      - files: [rust/src/db/connection.rs, rust/src/frb_generated.rs, lib/src/rust/api/ffi_api.dart, lib/src/rust/frb_generated.dart, lib/src/rust/frb_generated.io.dart, lib/src/rust/frb_generated.web.dart]
        justification: "search_notes/save_note need a process-wide DB connection to operate on, so the OnceLock<Mutex<Connection>> singleton and its connection() accessor were added to db/connection.rs (already-owned by BURL-B002/B003) rather than duplicated inside ffi_api.rs. rust/src/frb_generated.rs and the lib/src/rust/ files are all flutter_rust_bridge_codegen generate output (Rust-side dispatch glue and Dart-side bindings respectively), required whenever ffi_api.rs's public FFI surface changes (same pattern recorded for BURL-A003, whose own Verification Command was flutter_rust_bridge_codegen generate && cargo build); regenerated automatically, not hand-edited"
