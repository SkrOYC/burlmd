tickets:
  - id: BURL-B001
    title: Integrate Keychain Root Key
    type: Security
    effort: 3
    depends_on: []
    category: Security
    scope:
      in: [rust/src/security/keyring.rs]
    verification:
      command: "cargo test security::"
      expected: exit 0
    description: Implement Rust keyring integration to generate and securely store a 256-bit root AES key in the host OS secure enclave
    acceptance:
      mode: gherkin
      evidence: |
        Given a fresh installation
        When the app boots
        Then a new 256-bit key is generated and stored in the OS Keychain
    flows: []
    certainty: assumed
    status: done
    deviations:
      - files: [rust/src/security/mod.rs (new), rust/src/lib.rs, rust/Cargo.toml, rust/Cargo.lock]
        justification: "Introducing the security module requires a mod.rs to declare its child (keyring) and a pub mod security; wire-in at the crate root (lib.rs), the same shape as BURL-A001's recorded deviations for rust/src/api. Cargo.toml/Cargo.lock changed because the keyring, getrandom, and zeroize crates were added via cargo add per project tooling policy — zeroize wraps the generated root key (and, from BURL-B002 onward, its hex encoding and the assembled PRAGMA string) so key material is wiped from memory on drop rather than lingering in a dropped-but-unzeroed allocation. (This crate was missed from this justification when first added and only recorded here during PR #4's round-3 review.)"
  - id: BURL-B002
    title: Encrypt SQLite with SQLCipher
    type: Security
    effort: 5
    depends_on: [BURL-B001]
    category: Security
    scope:
      in: [rust/src/db/connection.rs]
    verification:
      command: "cargo test db::"
      expected: exit 0
    description: Configure the rusqlite initialization to issue PRAGMA key using the root key from BURL-B001
    acceptance:
      mode: gherkin
      evidence: |
        Given the SQLite initialization
        When the database file is written to disk
        Then the file is AES-256-CBC encrypted with HMAC-SHA512 page authentication and cannot be opened by standard sqlite3 CLI
    flows: []
    certainty: assumed
    status: done
    deviations:
      - files: [rust/src/db/mod.rs (new), rust/src/lib.rs, rust/Cargo.toml, rust/Cargo.lock, ".constitution/tech-spec/stack.md", ".constitution/tech-spec/changelog.md"]
        justification: "db/mod.rs and the lib.rs wire-in are the same unavoidable module-introduction pattern as BURL-B001. Cargo.toml/Cargo.lock changed via cargo add rusqlite --features bundled-sqlcipher and cargo add tempfile --dev. stack.md/changelog.md were corrected because the shipped implementation applies the root key via SQLCipher's raw-key PRAGMA form (PRAGMA key = \"x'<hex>'\", no KDF) rather than the passphrase/PBKDF2 mechanism the spec previously described — leaving the spec factually wrong about the actual security mechanism was judged worse than this one-bullet out-of-scope correction; confirmed with the user before implementation as the correct approach given the root key is already full-entropy CSPRNG output"
