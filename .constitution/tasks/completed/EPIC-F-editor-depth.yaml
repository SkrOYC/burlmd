  - id: BURL-F002
    title: Live Preview Block Promotion
    type: Feature
    effort: 8
    depends_on: [BURL-F001]
    category: Correctness
    scope:
      in: [lib/src/components/editor.dart, lib/src/components/block_view.dart, lib/src/components/block_editor.dart, lib/src/providers/rust_api_provider.dart, "lib/src/rust/**", rust/src/api/ffi_api.rs, rust/src/markdown/spans.rs, rust/src/workspace/persist.rs, rust/src/frb_generated.rs, test/components/editor_test.dart]
