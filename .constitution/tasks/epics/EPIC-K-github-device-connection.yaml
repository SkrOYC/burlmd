    - rust/src/provider/github_device_flow.rs
    - "rust/src/security/**"
    - rust/src/api/auth.rs
    - rust/src/api/ffi_api.rs
    - rust/src/api/mod.rs
    - rust/src/frb_generated.rs
    - rust/Cargo.toml
    - rust/Cargo.lock
