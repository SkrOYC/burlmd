    certainty: assumed
    status: planned
  - id: BURL-G010
    title: Surface and restore local Note history
    type: Feature
    effort: 5
    depends_on:
      - BURL-G004
    category: Feature-Evolution
    scope:
      in:
        - rust/src/git/operations.rs
        - rust/src/api/ffi_api.rs
        - lib/src/components/**
        - lib/src/providers/note_providers.dart
        - test/**
    verification:
      command: cargo test --manifest-path rust/Cargo.toml &&
        ./scripts/check-generated-bindings.sh && flutter test && dart analyze &&
        ./scripts/smoke-shot.sh hist-g010 && git diff --check
      expected: exit 0 with list, confirm, restore, and asset-rehydration handoff
        tests passing
    stop_conditions:
      - STOP if restore silently discards an unwritten draft or depends on a
        full diff viewer.
    description: List session-granularity Note versions, show timestamps/messages,
      confirm destructive restore, create a new current history state, and
      request referenced Object hydration without rewriting earlier history
    acceptance:
      mode: gherkin
      evidence: >
        ```gherkin

        Given a Note has local session versions and an unwritten draft

        When the Writer selects an earlier version

        Then burlmd requires confirmation

        And after confirmation restores it as the current source with
        recoverable history

        And requests any referenced Object that is not locally hydrated

        ```
    flows:
      - flow-history-diagnostics
    certainty: assumed
    status: planned
  - id: BURL-G011
    title: Integrate and harden the feature-complete local shell
    type: Feature
    effort: 8
    depends_on:
      - BURL-G001
      - BURL-G002
      - BURL-G006
      - BURL-G007
      - BURL-G009
      - BURL-G010
    category: Correctness
    scope:
      in:
        - lib/src/design/**
        - lib/src/screens/workspace.dart
        - lib/src/components/**
        - lib/l10n/**
        - test/goldens/**
        - test/**
        - integration_test/**
        - scripts/visual-regression.sh
    verification:
      command: TRUST_ANCHOR_WORKTREE/scripts/managed-evidence.sh run --ticket
        BURL-G011 --trust-anchor-sha TRUST_ANCHOR_SHA --source-ref SOURCE_REF
        --tested-source-sha TESTED_SOURCE_SHA --base-sha BASE_SHA --output
        EVIDENCE_WORKTREE/.constitution/evidence/BURL-G011/managed-evidence.json
        && git -C EVIDENCE_WORKTREE diff --check
      expected: "exit 0 with the local feature matrix and reviewed visual evidence
        passing Original verification detail: `ubuntu-24.04`: `cargo test
        --manifest-path rust/Cargo.toml && flutter test && dart analyze &&
        ./scripts/visual-regression.sh shell-g011 --baseline
        test/goldens/shell-g011-linux.png --max-different-pixels 0 && git diff
        --check && ! rg -n '\\[DEBUG-' lib rust test scripts`; Apple Silicon
        `macos-26`: `cargo test --manifest-path rust/Cargo.toml && flutter test
        && dart analyze && ./scripts/visual-regression.sh shell-g011 --baseline
        test/goldens/shell-g011-macos.png --max-different-pixels 0 && git diff
        --check && ! rg -n '\\[DEBUG-' lib rust test scripts`; Apple Silicon
        `macos-15`: `cargo test --manifest-path rust/Cargo.toml && flutter test
        && dart analyze && git diff --check`. Validate all results through the
        authenticated `BURL-M003` role and aggregate schemas."
    stop_conditions:
      - STOP if any pointer action lacks keyboard reachability, Writer-facing
        string bypasses localization, or state shown by the shell isn't
        authoritative.
      - STOP if the final aggregate is rejected, Linux capture can observe the
        Writer's desktop, macOS 26 geometry isn't verified, or macOS 15 creates
        or updates a visual baseline.
    description: Integrate the completed local workflows into the delivered design
      system, finish keyboard/focus/Semantics/localization coverage, and rebuild
      visual evidence after Platform-chrome removal
    acceptance:
      mode: visual_regression
      evidence: "The pipeline-owned Linux environment compares its exact capture with
        the named Linux baseline at a zero-different-pixel threshold without
        reading the Writer's desktop. This required platform-regression gate
        isn't authoritative product visual evidence. The actual hosted macOS 26
        GUI verifies its logical viewport and compares with the sole
        authoritative product visual baseline. macOS 15 runs the same functional
        matrix without performance or visual evidence. Authenticated role
        bundles and the accepted aggregate bind every result to the trust
        anchor, workflow signer, separate tested source, ticket base, build,
        corpus, run, image, and artifact identity. Together with integration
        logs, the gates cover preferences, restored tabs, every close path,
        Workspace switch, title jump, backlinks, undo/redo, find/replace, and
        history restore. The shell preserves PR #11 design parity without fake
        Platform chrome, unreachable actions, hardcoded Writer-facing copy, or
        nonauthoritative placeholder state."
    flows:
      - flow-desktop-session
      - flow-workspace-navigation
    certainty: assumed
    status: planned
