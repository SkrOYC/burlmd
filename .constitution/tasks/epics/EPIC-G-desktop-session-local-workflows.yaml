  - id: BURL-G008
    title: Implement Core-owned undo and redo
    type: Feature
    effort: 8
    depends_on:
      - BURL-G004
    category: Correctness
    scope:
      in:
        - rust/src/draft.rs
        - rust/src/markdown/**
        - rust/src/api/ffi_api.rs
        - lib/src/providers/note_providers.dart
        - lib/src/components/editor.dart
        - test/components/**
    verification:
      command: cargo test --manifest-path rust/Cargo.toml &&
        ./scripts/check-generated-bindings.sh && flutter test && dart analyze &&
        ./scripts/smoke-shot.sh edit-g008 && git diff --check
      expected: exit 0 with operation-stack and keyboard tests passing
    stop_conditions:
      - STOP if the final AST contract after BURL-H001 changes operation
        identity or inverse requirements; reconcile this ticket before
        implementation.
    description: Implement the bounded Core command stack across splice, structural,
      range, and replace-all edits, with redo invalidation, tier-1 durability,
      and platform keyboard actions
    acceptance:
      mode: invariant
      evidence: For every covered content operation, applying undo restores
        byte-identical prior source and authoritative caret/tree state; redo
        restores the forward state; a divergent edit clears redo; close/reload
        clears the stack; lifecycle and sync changes never enter it.
    flows:
      - flow-edit-note
    certainty: assumed
    status: planned
  - id: BURL-G009
    title: Implement in-Note find and atomic replace
    type: Feature
    effort: 8
    depends_on:
      - BURL-G008
    category: Feature-Evolution
    scope:
      in:
        - rust/src/markdown/**
        - rust/src/api/ffi_api.rs
        - lib/src/components/editor.dart
        - lib/src/providers/note_providers.dart
        - test/components/**
    verification:
      command: cargo test --manifest-path rust/Cargo.toml &&
        ./scripts/check-generated-bindings.sh && flutter test && dart analyze &&
        ./scripts/smoke-shot.sh find-g009 && git diff --check
      expected: exit 0 with match navigation and one-operation replace-all tests passing
    stop_conditions:
      - STOP if Flutter computes source ranges or replace-all dispatches a
        sequence of independently visible mutations.
    description: Find matches through the canonical Note model, navigate them in the
      editor, replace one, and replace all as one durable undoable operation
    acceptance:
      mode: contract_test
      evidence: Fixtures cover inline syntax, nested Blocks, Unicode, empty/no-match
        cases, single replacement, and replace-all. Core returns every range and
        one authoritative post-replace state; replace-all creates exactly one
        undo entry and no intermediate render state.
    flows:
