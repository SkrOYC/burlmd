    title: Implement the Local Asset Store and immutable manifest
    type: Feature
    effort: 8
    depends_on: []
    category: Correctness
    scope:
      in: ["rust/src/assets/**", "rust/src/workspace/**", rust/src/git/operations.rs, rust/src/api/ffi_api.rs, rust/Cargo.toml, rust/Cargo.lock, "test/**"]
