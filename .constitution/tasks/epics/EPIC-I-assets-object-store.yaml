      expected: "exit 0 with identity, dedupe, manifest, atomic-copy, containment, and Git-payload-exclusion tests passing"
    stop_conditions: ["STOP if final TechSpec hasn't accepted BURL-I001 or mutable device state enters the Git manifest.", "STOP if commit safety depends on a writable, readable, present, or trustworthy `.gitignore` file."]
    description: "Add the accepted content identity, canonical assets/objects/ payload path, immutable textual manifest, atomic imported-byte adoption, deduplication, and local verification state. Enforce a Core commit-path exclusion for assets/objects/ before staging, independent of ignore files and ambient Git configuration. Stage only authoritative Note and textual-manifest paths selected by the operation"
    acceptance:
      mode: invariant
      evidence: "Byte-identical imports share one Object; distinct bytes never collide; active bytes are copied inside the contained Workspace before reference; the manifest contains only accepted immutable facts; and device-local hydration/verification state never enters Git. Missing, modified, unreadable, or symlinked `.gitignore` fixtures can't place payload bytes in the index or a commit. Existing tracked payload paths, broad commit requests, and adversarial path aliases fail closed before staging, while the textual manifest remains committable."
    flows: [flow-assets]
    certainty: assumed
    status: planned
