tickets:
  - id: BURL-O001
    title: Prove prerelease packaging feasibility and Linux baseline
    type: Spike
    effort: 8
    depends_on: []
    category: DX
    scope:
      in:
        - .constitution/prototypes/packaging/**
        - .constitution/spikes/SPK-BURL-O001.md
    verification:
      command: TRUST_ANCHOR_WORKTREE/scripts/managed-evidence.sh run --ticket
        BURL-O001 --trust-anchor-sha TRUST_ANCHOR_SHA --source-ref SOURCE_REF
        --tested-source-sha TESTED_SOURCE_SHA --base-sha BASE_SHA --output
        EVIDENCE_WORKTREE/.constitution/prototypes/packaging/managed-evidence.json
        && git -C EVIDENCE_WORKTREE diff --check
      expected: exit 0 with .constitution/prototypes/packaging/results.json, accepted
        .constitution/prototypes/packaging/managed-evidence.json,
        executor-authored .constitution/spikes/SPK-BURL-O001.md, and an OD-08
        recommendation
    stop_conditions:
      - STOP if the harness uses ambient Git, omits installed-runtime probes, or
        infers one Platform result from another.
      - STOP if the `BURL-M003` evidence pull request isn't merged or any
        required role bundle is missing, incomplete, stale, mismatched, corrupt,
        self-hosted, unauthenticated, or rejected.
      - STOP if post-completion API observation doesn't resolve the receipt
        locator to one completed successful sealing job on the fixed hosted
        label, or if an expected, candidate, or sealed artifact name or
        normalized digest is invalid, missing, duplicate, extra, or inconsistent
        with the run nonce.
      - STOP if the launcher isn't the clean trust-anchor copy, a trusted
        control file differs at the signer SHA, or the base-to-source diff
        leaves the packaging write allowlist.
      - STOP if any cross-role archive comes from a manual or
        environment-selected source, the machine result is missing or invalid,
        or the evidence commit omits the machine result, accepted managed
        report, or executor-authored Spike report.
      - STOP if a candidate command can observe a credential canary or OIDC or
        attestation capability; if the trusted upload wrapper lacks its
        job-scoped artifact runtime authority; if valid immutable untrusted
        candidate output doesn't cross into fresh seal; if that output is
        treated as trusted before seal; if candidate execution or processes gain
        seal OIDC or attestation authority or cross the fresh environment
        boundary; or if the coordinator can observe an authentication or
        credential canary, its identity changes after preparation, isolation or
        its network denial fails, an input is writable, or a path other than its
        output is writable.
      - STOP and reconcile the contract if Apple's published stable-version list
        no longer identifies macOS 26 and macOS 15 as the two most recent stable
        major versions.
      - STOP when the 8-point Spike budget is exhausted and leave unsupported
        hosts outside the recommendation.
    description: Build and install the representative harness as AppImage, tagged
      Nix Flake package, and unsigned Apple Silicon archive across the required
      Linux and macOS matrix. Authenticate managed role evidence through
      BURL-M003. Prove the checksum and provenance-metadata layout inside the
      prototype; release-candidate attestations remain production workflow work
      owned by BURL-O009 and BURL-O014
    acceptance:
      mode: hitl_sil
      evidence: "Unique hashed and logged runs verify installed Git and runtime,
        secure storage, file selection, native loading, secret injection, update
        selection, host chrome, repeatability, and every named Linux candidate.
        The Linux role provides `packaging-runtime`; macOS 26 provides
        `packaging-runtime` and `repeatable-construction`; macOS 15 provides
        `packaging-runtime-compatibility`. This Spike doesn't claim performance,
        Linux platform-regression, or authoritative macOS visual evidence.
        Candidate commands produce an untrusted bundle containing the manifest
        plus every named result, log, raw measurement, and handoff without
        token, artifact-runtime, OIDC, or attestation access. After candidate
        commands finish, the trusted workflow wrapper uses job-scoped artifact
        runtime authority to upload that untrusted bundle. A fresh dependent
        sealing job validates the immutable bundle and alone authenticates the
        sealed artifact. Aggregation verifies the exact packaging evidence
        profile, trust anchor, workflow signer, separate tested source, ticket
        base, packaging allowlist, sealing provenance, bundle integrity, and
        internal artifact hashes. Each named runtime check obtains guest
        operating system, distribution, version, and architecture from inside
        the installed probe environment; aggregation requires exact Ubuntu
        22.04, 24.04, and 26.04 plus Debian 12 and 13 x86-64 evidence rather
        than trusting run IDs or the outer Nix host. The versioned build script
        runs `flutter clean`, enforces the committed dependency lock, normalizes
        archive metadata from the source revision's epoch, and emits the actual
        deterministic `.tar.gz` release artifact for each construction. macOS 26
        constructs that archive twice from identical inputs; aggregation
        requires byte-identical archive hashes. Extraction rejects path escape
        and proves the archive preserves required modes, symlink targets,
        extended attributes, and one application bundle. The first archive
        travels in the authenticated macOS 26 sealed bundle. Only after
        verifying and staging that bundle does the macOS 15 role extract and
        probe the same bytes. Final aggregation stages all three sealed role
        bundles under fixed role directories and requires both macOS probes to
        name the same archive SHA-256. Nix out-links are only build sources: the
        result tool copies their resolved bytes or closures into `artifacts/`
        inside the Spike allowlist before size and SHA-256 recording. The
        aggregate records the prebuilt result-tool identity and proves no
        network, credential, writable input, or host user state entered
        coordinator execution. The CLI produces authoritative schema-valid
        `results.json`; the executor authors its human interpretation and
        commits both with the accepted managed report."
    flows:
      - flow-release
    certainty: assumed
    status: planned
    spike: SPK-BURL-O001
  - id: BURL-O002
    title: Add content-excluding structured diagnostics
    type: Feature
    effort: 8
    depends_on: []
    category: Security
    scope:
      in:
        - rust/src/diagnostics/**
        - rust/src/api/ffi_api.rs
        - rust/Cargo.toml
        - rust/Cargo.lock
        - lib/src/components/**
        - test/**
    verification:
      command: cargo test --manifest-path rust/Cargo.toml &&
        ./scripts/check-generated-bindings.sh && flutter test && dart analyze &&
        ./scripts/smoke-shot.sh log-m002 && git diff --check && ! rg -n
        '\[DEBUG-' lib rust test scripts
      expected: exit 0 with rotation, failure isolation, redaction, export, and
        no-network tests passing
    stop_conditions:
      - STOP if Note/Asset content, credentials, tokens, signed locations,
        content-derived telemetry, or secret-bearing debug values can enter logs
        or Diagnostics Export.
    description: Add a rotating best-effort local structured log for
      failures/retries/state decisions and a Writer-created Diagnostics Export
      containing app/schema versions without content, signed locations,
      content-derived telemetry, or automatic transmission
    acceptance:
      mode: invariant
      evidence: Generated content, credential, signed-location, and content-derived
        canaries never appear in files or export; required failures and state
        transitions do; rotation caps storage; logging failure never becomes a
        product failure; export performs no network request.
    flows:
      - flow-history-diagnostics
    certainty: assumed
    status: planned
  - id: BURL-O004
    title: Implement deterministic nightly PRD meters
    type: Chore
    effort: 8
    depends_on:
      - BURL-O016
    category: Perf
    scope:
      in:
        - rust/benches/**
        - integration_test/**
        - scripts/**
        - .github/workflows/**
        - .constitution/evidence/BURL-O004/**
    verification:
      command: TRUST_ANCHOR_WORKTREE/scripts/managed-evidence.sh run --ticket
        BURL-O004 --trust-anchor-sha TRUST_ANCHOR_SHA --source-ref SOURCE_REF
        --tested-source-sha TESTED_SOURCE_SHA --base-sha BASE_SHA --output
        EVIDENCE_WORKTREE/.constitution/evidence/BURL-O004/managed-evidence.json
        && TRUST_ANCHOR_WORKTREE/scripts/aggregate-prd-meters.sh --require-run
        linux-reference=EVIDENCE_WORKTREE/.constitution/evidence/BURL-O004/managed-evidence-coordinator/roles/linux-x86_64/nightly-prd-meters-linux.json
        --require-run
        macos-reference=EVIDENCE_WORKTREE/.constitution/evidence/BURL-O004/managed-evidence-coordinator/roles/macos-26-arm64/nightly-prd-meters-macos.json
        --require-same-corpus-hash --require-same-meter-definition-version
        --output
        EVIDENCE_WORKTREE/.constitution/evidence/BURL-O004/nightly-prd-meters.json
        && git -C EVIDENCE_WORKTREE diff --check
      expected: "deterministic corpus generation succeeds on both managed performance
        roles, macOS 15 functional compatibility passes, and aggregation emits
        one authenticated machine-readable nonblocking result for every meter.
        A later evidence-only pull request contains managed-evidence.json,
        nightly-prd-meters.json, and manifest.yaml with the byte count and
        SHA-256 digest for each artifact.
        Original verification detail: `ubuntu-24.04`: `cargo test
        --manifest-path rust/Cargo.toml && flutter test && dart analyze &&
        ./scripts/bench-prd-meters.sh --all --run-id linux-reference
        --expected-host-profile github-ubuntu-24_04-x86_64 --corpus-size 10000
        --output .constitution/reports/nightly-prd-meters-linux.json && git diff
        --check`; Apple Silicon `macos-26`: `cargo test --manifest-path
        rust/Cargo.toml && flutter test && dart analyze &&
        ./scripts/bench-prd-meters.sh --all --run-id macos-reference
        --expected-host-profile github-macos-26-arm64 --corpus-size 10000
        --output .constitution/reports/nightly-prd-meters-macos.json && git diff
        --check`; Apple Silicon `macos-15` functional compatibility: `cargo test
        --manifest-path rust/Cargo.toml && flutter test && dart analyze && git
        diff --check`; coordinator: `./scripts/aggregate-prd-meters.sh
        --require-run
        linux-reference=.constitution/reports/nightly-prd-meters-linux.json
        --require-run
        macos-reference=.constitution/reports/nightly-prd-meters-macos.json
        --require-same-corpus-hash --require-same-meter-definition-version
        --output .constitution/reports/nightly-prd-meters.json && git diff
        --check`. Validate all role and aggregate evidence through `BURL-M003`."
    stop_conditions:
      - STOP if a meter uses a different corpus/profile/definition than PRD
        constraints or changes a threshold outside Product Requirements
        Evolution.
      - STOP if macOS 15 contributes a performance meter or managed evidence
        lacks authenticated expected-identity and artifact verification.
      - STOP if the evidence-only pull request changes a path outside
        .constitution/evidence/BURL-O004/, omits managed-evidence.json,
        nightly-prd-meters.json, or manifest.yaml with their byte counts and
        SHA-256 digests, or lacks independent review and merge.
    description: Generate the 10,000-Note and editing corpora and measure search,
      UI, open, cold start, idle memory, external changes, capacity, image,
      history health, and synchronization freshness on named profiles
    acceptance:
      mode: benchmark
      constraints:
        - NFC-01
        - NFC-02
        - NFC-03
        - NFC-04
        - NFC-05
        - NFC-06
        - NFC-07
        - NFC-10
        - NFC-11
      evidence: Linux x86-64 and macOS 26 performance bundles record the managed image
        and environment identity, run, profile, corpus hash, meter-definition
        version, samples, percentile or threshold, exact command, and Goal or
        Fail disposition for every scalar PRD meter. macOS 15 records common
        functional compatibility only. Aggregation verifies expected identity,
        GitHub-hosted role signer, bundle integrity, exact evidence classes,
        corpus, and meter definitions. The nightly job is nonblocking during
        `0.x` but produces a durable regression report; release gates consume
        the same definitions. A later evidence-only pull request changes only
        `.constitution/evidence/BURL-O004/` and contains managed-evidence.json,
        nightly-prd-meters.json, and manifest.yaml with the byte count and
        SHA-256 digest for each artifact. Independent review and merge of that
        manifest-backed pull request are required before acceptance.
    flows:
      - flow-release
    certainty: assumed
    status: planned
  - id: BURL-O016
    title: Warn before local history storage becomes unhealthy
    type: Feature
    effort: 5
    depends_on: []
    category: Correctness
