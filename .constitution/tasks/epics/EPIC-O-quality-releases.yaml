    description: "Build immutable candidate AppImage and Apple Silicon archives plus
      the release-tagged Flake input and source archive from one revision.
      Generate checksums, licenses, disclosures, and keyless GitHub Actions
      artifact attestations using
      actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 with id-token:
      write, contents: read, and attestations: write; retain the candidates
      unpublished for installed verification. The accepted contract binds the
      GitHub/Sigstore trust root, SkrOYC/burlmd, the release workflow identity,
      release ref, source revision, and every artifact subject. Developer ID
      signing and notarization remain deferred"
    acceptance:
      mode: runbook_probe
      evidence: Independent verification reproduces every SHA-256 from immutable
        candidate bytes and runs `gh attestation verify` against the expected
        `SkrOYC/burlmd` repository plus the accepted release-workflow and
