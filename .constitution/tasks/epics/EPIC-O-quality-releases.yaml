    verification:
      command: cargo test --manifest-path rust/Cargo.toml &&
        ./scripts/check-generated-bindings.sh && flutter test && dart analyze &&
        ./scripts/smoke-shot.sh health-m004 && git diff --check
      expected: exit 0 with accepted-threshold, deduplication, recovery-action, and
        boundary tests passing
    stop_conditions:
      - STOP if final Stage 3 hasn't accepted the history-health meter and
        threshold after BURL-I001, or if the warning performs destructive
        maintenance automatically.
    description: Measure stored textual and manifest history against the accepted
      health threshold, warn the Writer before the threshold, explain the local
      consequences, and expose only non-destructive inspection and recovery
      actions
    acceptance:
      mode: gherkin
      evidence: >
        ```gherkin

        Given local textual and manifest history approaches the accepted health
        threshold

        When the pre-warning boundary is crossed

        Then burlmd presents one actionable Writer-facing warning before the
        threshold

        And repeated measurements don't create warning spam

        And no history or Object is deleted automatically

        And returning below the reset boundary permits a later warning

        ```
    flows:
      - flow-history-diagnostics
    certainty: assumed
    status: planned
  - id: BURL-O005
    title: Back up and atomically migrate application state
    type: Feature
    effort: 8
    depends_on: []
    category: Correctness
    scope:
      in:
        - rust/src/db/**
        - rust/src/workspace/**
        - lib/src/providers/**
        - test/**
    verification:
      command: cargo test --manifest-path rust/Cargo.toml && flutter test && dart
        analyze && ./scripts/smoke-shot.sh migrate-m005 && git diff --check
      expected: exit 0 with backup, forward migration, rebuild, fault injection,
        rollback, and later-version refusal tests passing
    stop_conditions:
      - STOP if migration can partially publish, changes Markdown unnecessarily,
        or destroys the only usable prior state before success.
      - STOP if unsupported later-version preference or Workspace-snapshot bytes
        are migrated, overwritten, normalized, or discarded.
    description: Version application state, back up affected supported data, migrate
      forward atomically, rebuild derived index state when safer, restore backup
      on failure, and refuse unsupported later versions. Quarantine and preserve
      unsupported later-version bytes exactly; runtime may use in-memory
      defaults, and it may write a separate supported current file only through
      an explicitly safe path isolated from the preserved bytes
    acceptance:
      mode: invariant
      evidence: Fault injection at every migration step leaves either the complete
        prior state or complete new state; backup remains recoverable until
        validation; Workspace Markdown stays unchanged unless the accepted path
        migration explicitly requires it. Unsupported later-version device
        preferences and Workspace snapshots are refused, quarantined, and
        preserved byte-for-byte. Runtime defaults remain in memory, and any
        later supported current-format write uses a separate explicitly safe
        isolation path without modifying the preserved bytes.
    flows:
      - flow-desktop-session
    certainty: assumed
    status: planned
