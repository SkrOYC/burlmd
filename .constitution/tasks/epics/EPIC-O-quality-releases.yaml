        workflow identity, an unexpected ref/revision, an untrusted issuer, or a
        wrong subject fails closed. Compatibility labels match intended systems;
        unsigned macOS warnings are explicit; candidates remain unpublished and
        install without source builds. This authenticated build provenance
        doesn't claim Developer ID signing or notarization.
