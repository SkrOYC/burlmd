id: P
name: workspace repair and live observation
kind: product
capabilities:
  - CAP-036
  - CAP-037
  - CAP-038
  - CAP-039
  - CAP-040
  - CAP-041
  - CAP-042
  - CAP-050
depends_on:
  - H
  - I
  - M
scope:
  paths:
    - rust/src/okf/**
    - rust/src/workspace/**
    - rust/src/api/ffi_api.rs
    - lib/src/components/**
    - test/**
    - rust/src/api/**
    - rust/Cargo.toml
    - rust/Cargo.lock
    - .constitution/evidence/BURL-P002/**
    - rust/src/index/**
    - rust/src/git/operations.rs
    - lib/src/providers/workspace_provider.dart
    - lib/src/providers/note_providers.dart
    - rust/src/index/scan.rs
    - lib/src/screens/workspace.dart
    - test/screens/workspace_rescan_test.dart
  tech_spec_patchable: []
estimated_diff_lines: 5550
tickets:
  - id: BURL-P001
    title: Preview and apply conformance/path repairs
    type: Feature
    effort: 8
    depends_on: []
    category: Correctness
    scope:
      in:
        - rust/src/okf/**
        - rust/src/workspace/**
        - rust/src/api/ffi_api.rs
        - lib/src/components/**
        - test/**
    verification:
      command: cargo test --manifest-path rust/Cargo.toml &&
        ./scripts/check-generated-bindings.sh && flutter test && dart analyze &&
        ./scripts/smoke-shot.sh repair-h008 && git diff --check
      expected: exit 0 with preview fidelity, confirm, rollback, and exclude tests
        passing
    stop_conditions:
      - STOP if the Writer can't inspect original and proposed bytes or if
        repair changes unrelated content.
      - STOP if work would include automatic or silent repair; don't expand this
        ticket.
    description: Produce previewed conformance/path repairs, preserve original
      bytes, apply only confirmed changes as one recoverable lifecycle outcome,
      and retain Exclude as a non-mutating choice
    acceptance:
      mode: invariant
      evidence: Every repair preview identifies exact byte/path changes; confirmation
        applies only those changes atomically and records recovery history;
        rejection/exclusion preserves original bytes; failure restores the prior
        authoritative Workspace.
    flows:
      - flow-workspace-monitoring
      - flow-workspace-bootstrap
    certainty: assumed
    status: planned
  - id: BURL-P002
    title: Add debounced live Workspace observation
    type: Feature
    effort: 8
    depends_on: []
    category: Feature-Evolution
    scope:
      in:
        - rust/src/workspace/**
        - rust/src/api/**
        - rust/Cargo.toml
        - rust/Cargo.lock
        - test/**
        - .constitution/evidence/BURL-P002/**
    verification:
      command: TRUST_ANCHOR_WORKTREE/scripts/managed-evidence.sh run --ticket
        BURL-P002 --trust-anchor-sha TRUST_ANCHOR_SHA --source-ref SOURCE_REF
        --tested-source-sha TESTED_SOURCE_SHA --base-sha BASE_SHA --output
        EVIDENCE_WORKTREE/.constitution/evidence/BURL-P002/managed-evidence.json
        && git -C EVIDENCE_WORKTREE diff --check
      expected: "exit 0 with burst/debounce/fallback and missed-event recovery tests
        passing, plus a managed report. A later evidence-only pull request
        contains managed-evidence.json and manifest.yaml with its byte count and
        SHA-256 digest. Original verification detail: `ubuntu-24.04`: `cargo test
        --manifest-path rust/Cargo.toml && cargo clippy --workspace
        --all-targets --manifest-path rust/Cargo.toml -- -D warnings &&
        ./scripts/check-generated-bindings.sh && cargo run --release
        --manifest-path rust/Cargo.toml --bin workspace-observer-meter --
        --run-id linux-reference --profile github-ubuntu-24_04-x86_64
        --operations 100 --output target/observer-meters/linux-reference.json &&
        git diff --check`; Apple Silicon `macos-26`: `cargo test --manifest-path
        rust/Cargo.toml && cargo clippy --workspace --all-targets
        --manifest-path rust/Cargo.toml -- -D warnings &&
        ./scripts/check-generated-bindings.sh && cargo run --release
        --manifest-path rust/Cargo.toml --bin workspace-observer-meter --
        --run-id macos-reference --profile github-macos-26-arm64 --operations
        100 --output target/observer-meters/macos-reference.json && git diff
        --check`; Apple Silicon `macos-15` functional compatibility: `cargo test
        --manifest-path rust/Cargo.toml && ./scripts/check-generated-bindings.sh
        && git diff --check`. Validate complete role bundles and the accepted
        aggregate through the `BURL-M003` two-phase protocol."
    stop_conditions:
      - STOP if the final TechSpec hasn't pinned the observer adapter and
        polling fallback.
      - STOP if managed evidence is rejected or if macOS 15 contributes
        performance evidence.
      - STOP if an event directly mutates authority without Core validation.
      - STOP if the evidence-only pull request changes a path outside
        .constitution/evidence/BURL-P002/, omits managed-evidence.json or
        manifest.yaml with its byte count and SHA-256 digest, or lacks
        independent review and merge.
      - STOP if work would include authority decisions owned by BURL-P003 or
        BURL-P004; don't expand this ticket.
    description: Convert Platform filesystem events into debounced candidate
      create/edit/rename/move/delete proposals with fallback polling and
      explicit Rescan recovery
    acceptance:
      mode: benchmark
      constraints:
        - NFC-06
      evidence: The Linux x86-64 and macOS 26 managed roles record 100 deterministic
        single and burst operations apiece with captured image and environment
        identity. Each performance run produces one candidate set within the
        2-second Goal, with no missed or duplicate history outcome and no direct
        authoritative mutation. macOS 15 proves functional compatibility only.
        Aggregation rejects identity, signer, artifact, image-version, corpus,
        or role mismatches. A later evidence-only pull request changes only
        `.constitution/evidence/BURL-P002/` and contains managed-evidence.json
        plus manifest.yaml with its byte count and SHA-256 digest. Independent
        review and merge of that manifest-backed pull request are required
        before acceptance.
    flows:
      - flow-workspace-monitoring
    certainty: assumed
    status: planned
  - id: BURL-P003
    title: Reconcile valid external Note and lifecycle changes
    type: Feature
    effort: 8
    depends_on:
      - BURL-P002
    category: Correctness
    scope:
      in:
        - rust/src/workspace/**
        - rust/src/index/**
        - rust/src/git/operations.rs
        - rust/src/api/ffi_api.rs
        - lib/src/providers/workspace_provider.dart
        - test/**
    verification:
      command: cargo test --manifest-path rust/Cargo.toml &&
        ./scripts/check-generated-bindings.sh && flutter test && dart analyze &&
        ./scripts/smoke-shot.sh ext-h010 && git diff --check
      expected: exit 0 with valid edit/create/rename/move/delete history and reload
        tests passing
    stop_conditions:
      - STOP if rename provenance is uncertain; route it to a decision rather
        than guessing.
      - STOP if work would include dirty or invalid decisions owned by
        BURL-P004; don't expand this ticket.
    description: Validate clean external changes, update the authoritative tree and
      index, record local history, reload clean open Notes, and apply the same
      lifecycle/Link rules as Writer actions
    acceptance:
      mode: gherkin
      evidence: >
        ```gherkin

        Given a clean open Workspace

        When a guest performs a conforming create, edit, move, rename, or delete

        Then burlmd validates it, records one local history outcome, updates
        authoritative state and the index, and reloads affected clean sessions

        ```
    flows:
      - flow-workspace-monitoring
    certainty: assumed
    status: planned
  - id: BURL-P004
    title: Resolve dirty, stale, and invalid external changes
    type: Feature
    effort: 8
    depends_on:
      - BURL-P003
      - BURL-P001
    category: Correctness
    scope:
      in:
        - rust/src/workspace/**
        - rust/src/api/ffi_api.rs
        - lib/src/components/**
        - lib/src/providers/note_providers.dart
        - test/**
    verification:
      command: cargo test --manifest-path rust/Cargo.toml &&
        ./scripts/check-generated-bindings.sh && flutter test && dart analyze &&
        ./scripts/smoke-shot.sh decide-h011 && git diff --check
      expected: exit 0 with Compare/Keep/Load/Repair/Exclude and stale-revision tests
        passing
    stop_conditions:
      - STOP if same-device changes become Suggestion nodes or either version is
        discarded before resolution.
      - STOP if work would include Git Suggestions or Remote reconciliation
        owned by Epic L; don't expand this ticket.
    description: Pause writes for dirty or invalid external changes, preserve
      last-known-good and guest bytes, offer the valid decisions, compare exact
      revisions, and require renewed input after a guest revision advances
    acceptance:
      mode: invariant
      evidence: Both versions remain recoverable through every decision; the reviewed
        guest revision is compared again before application; stale input never
        applies; invalid input never replaces authoritative state; and no path
        produces a Git Suggestion.
    flows:
      - flow-workspace-monitoring
    certainty: assumed
    status: planned
  - id: BURL-P005
    title: Retain Rescan as observation recovery
    type: Feature
    effort: 5
    depends_on:
      - BURL-P002
      - BURL-P004
    category: Correctness
    scope:
      in:
        - rust/src/index/scan.rs
        - rust/src/workspace/**
        - lib/src/screens/workspace.dart
        - test/screens/workspace_rescan_test.dart
    verification:
      command: cargo test --manifest-path rust/Cargo.toml && flutter test && dart
        analyze && ./scripts/smoke-shot.sh rescan-h012 && git diff --check
      expected: exit 0 with observer-recovery and decision-preservation tests passing
    stop_conditions:
      - STOP if Rescan bypasses live-monitor validation/decision rules or
        discards pending decisions.
      - STOP if work would include a second authority or alternate conformance
        path; don't expand this ticket.
    description: Reconcile the delivered Rescan affordance with live observation as
      an explicit recovery path using the same candidate, validation, authority,
      and decision pipeline
    acceptance:
      mode: contract_test
      evidence: After injected missed/coalesced events, Rescan converges the index and
        authoritative tree through the same validation rules, preserves drafts
        and pending decisions, and creates no duplicate history.
    flows:
      - flow-workspace-bootstrap
    certainty: assumed
    status: planned
