    title: Resolve delete-versus-edit without content loss
    type: Feature
    effort: 5
    depends_on: []
    category: Correctness
    scope:
      in: ["rust/src/sync/**", "rust/src/markdown/**", "rust/src/workspace/**", rust/src/api/ffi_api.rs, "lib/src/components/**", "test/**"]
