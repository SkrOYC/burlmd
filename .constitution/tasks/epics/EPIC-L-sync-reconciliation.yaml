      command: "cargo test --manifest-path rust/Cargo.toml && ./scripts/check-generated-bindings.sh && flutter test && dart analyze && ./scripts/smoke-shot.sh delete-l011 && git diff --check && ! rg -n '\\[DEBUG-' lib rust test scripts"
      expected: "exit 0 with both direction orders, restore-plus-Suggestion, confirmation, and history tests passing"
    stop_conditions: [STOP if edited content becomes only a structural decision or deletion wins without explicit confirmation.]
    description: "Restore the edited Note, represent the content difference as a Suggestion, preserve both outcomes, and require explicit confirmation before deletion wins"
    acceptance:
      mode: gherkin
      evidence: |
        ```gherkin
        Given one side deleted a Note and the other edited it
        When reconciliation materializes
        Then the edited Note is restored with a Suggestion and recoverable history
        And deletion occurs only after the Writer explicitly confirms that outcome
        ```
    flows: [flow-conflict-resolution]
    certainty: assumed
    status: planned
