  - id: BURL-L010
    title: Integrate complete Remote refs with Protected Object retention
    type: Feature
    effort: 8
    depends_on: []
    category: Correctness
    scope:
      in: ["rust/src/git/**", "rust/src/sync/**", "rust/src/assets/**", "rust/src/object_store/**", "test/**"]
    verification:
      command: "cargo test --manifest-path rust/Cargo.toml && cargo clippy --workspace --all-targets --manifest-path rust/Cargo.toml -- -D warnings && git diff --check"
      expected: "exit 0 with unfiltered advertised-ref enumeration, quarantined no-prune fetch, incomplete stop, and deletion integration tests passing"
    stop_conditions: ["STOP if an advertised ref is excluded or can't be fetched into quarantine without an accepted upstream classification that proves it isn't published history.", "STOP and mark Remote authority incomplete if advertisement or quarantine work exceeds 100,000 refs, 16 MiB of advertised-ref bytes, 2 GiB of cumulative fetched data, or 30 minutes of wall-clock time."]
    description: "Run unfiltered git ls-remote --refs against the attached Remote and stream-parse every advertised refs/* entry under explicit count and byte limits. Fetch each Object ID into an isolated, bounded, no-prune temporary quarantine namespace without mutating Workspace refs. Enforce 100,000 refs, 16 MiB of advertisement data, 2 GiB of cumulative fetched data, and a 30-minute wall-clock deadline, with cancellation and cleanup on success, failure, cancellation, and restart. Extend Protected State roots with every fetched history for recovery, migration, detach, cache-retention, and reconciliation decisions. Fail closed when enumeration, classification, fetch completeness, or resource bounds are unproven while preserving local use"
    acceptance:
      mode: invariant
      evidence: "Generated Remote namespaces include branches, annotated and lightweight tags, pull-request refs, and arbitrary advertised ref hierarchies. Every fetchable advertised Object ID expands Protected State. Reflog-only and non-advertised Provider-internal refs don't expand authority. Boundary tests cover every limit, streaming behavior, cancellation, crash recovery, path confinement, and unconditional quarantine cleanup. An unclassified or unfetchable advertised ref, authorization failure, enumeration failure, fetch failure, or exceeded limit marks Remote authority incomplete and stops migration, detach, retention, or reconciliation decisions that require complete published history without blocking local editing. Independent verified local cache eviction remains possible; authoritative remote deletion doesn't exist during `0.x`."
    flows: [flow-sync-push, flow-object-store-lifecycle]
    certainty: assumed
    status: planned
