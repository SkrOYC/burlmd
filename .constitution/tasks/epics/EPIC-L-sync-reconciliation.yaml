      command: "cargo test --manifest-path rust/Cargo.toml && ./scripts/check-generated-bindings.sh && dart analyze && git diff --check"
      expected: "exit 0 with fault injection at every state transition, restart, stale branch, revalidation, and CAS tests passing"
    stop_conditions: [STOP if a decision can apply to different commit/tree identities than the Writer reviewed.]
    description: "Persist base/local/incoming/tentative identities and decisions before input, recover them after crash, CAS the branch from recorded local, recompute after advancement, and require renewed input for changed outcomes"
    acceptance:
