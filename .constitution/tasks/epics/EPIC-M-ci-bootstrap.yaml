        Behavioral fixtures protect and invoke
        `scripts/validate-compatibility-stage-interface.sh` before acquisition,
        offline verification, or consumer processing. They accept exactly 26
        nonempty BURL-O001 values and prove the wrapper performs all three
        immutable-ID downloads. After download, three offline attestation
        verifications verify the stage before consumer processing and
        credential-free candidate execution. They accept exactly 26 empty
        values for every non-O001 ticket, skip only those compatibility steps,
        and prove the ordinary candidate path continues. Runtime fixtures don't
        claim to
        detect YAML declaration shape or arbitrary value
        provenance; downstream identity, attestation, digest, lineage, and
        freshness validation retains that responsibility.


        Fixtures require three distinct offline attestation verifications. The
        stage-manifest verification is pinned to the stage manifest and stage
        bundle and writes `stage-verification.json`. The producer-receipt
        verification is pinned to the producer sealing receipt and receipt
        bundle and writes `receipt-verification.json`. The producer-lineage
        verification is pinned to the producer-lineage artifact and lineage
        bundle and writes `lineage-verification.json`. Fixtures accept
        `consumerBinding.downloadedStageArtifactId` only when it equals
        `producerLineage.stageArtifact.artifactId` in the macOS 15 manifest,
        its sealing receipt, and the final aggregate. At each surface, fixtures
        reject a mismatch.

        After the three distinct offline attestation commands write
        `stage-verification.json`, `receipt-verification.json`, and
        `lineage-verification.json`, the trusted
        `scripts/prepare-compatibility-stage-consumer.sh` helper must consume
        and validate all three result files together with all 26 runtime values
        before it removes credentials or exposes only the two verified producer
        members read-only. Fixtures must fail if the helper ignores, swaps, or
        does not validate any result file or runtime value.


        Linux static and integration fixtures prove `env -i` Bubblewrap `0.11.2`
        PID containment by rejecting a surviving double-fork probe before
        upload. Hosted-macOS fixtures distinguish candidate-command no-privilege
        execution from the trusted wrapper's later artifact runtime authority.
        They prove fresh-job separation, sole seal OIDC and attestation
        authority, safe validation, and no candidate-byte execution in seal. A
        surviving candidate process can corrupt untrusted output or cause a
        fail-closed upload denial. It can't gain seal authority or enter the
        fresh seal environment. Fixtures reject any universal macOS containment
        or zero-survivor claim. Accepted evidence authenticates reviewed
        workflow execution and sealed provenance. It does not prove that
        arbitrary malicious macOS candidate code is contained or that its
        untrusted output is truthful. Reviewed source and test contracts remain
        required.


        Before the ordered gate invokes it, `BURL-M003` creates the missing
        generated-binding checker. Checker fixtures prove that it snapshots a
        path-sorted SHA-256 manifest and byte backup for
        `rust/src/frb_generated.rs` and `lib/src/rust/**`, runs the provisional
        `2.12.0` generator, and detects every added, removed, or changed
        generated byte. Clean, stale, generator-failure, premodified-file, and
        interruption cases restore and verify the exact precheck state before
        exit. Contract fixtures prove that `collect` and `run` reject extra or
        missing flags, replace outputs atomically, emit the specified JSON
        summary, and use exit statuses `0`, `1`, and `2` exactly as Stage 3
        defines. Dispatch fixtures require `master`, the exact returned run ID,
        canonical expected-identity bytes, and separate signer and tested-source
        SHAs. Managed-Spike fixtures prove that verified manifest members stage
        only under fixed role directories, coordinator steps use no manual
        source, and acceptance requires a schema-valid `results.json`. They
        execute the collector-reconciliation fixture and reject a runner-label
        mismatch before comparing ordered evidence classes. A non-`CLOEXEC`
        descriptor canary proves that the trusted launcher closes descriptors
        before Bubblewrap; namespace and network fixtures remain separate.
        For BURL-O001, the macOS 26 seal validates the two declared producer
        members. It then creates, attests, uploads, and REST-validates the exact
        compatibility stage before writing its receipt. The receipt binds the
        stage name, service artifact ID, both digest forms, lifetime, manifest,
        attestation facts, producing seal locator, signer, source, run, attempt,
        and roles. A separate staging job is forbidden. The macOS 15 trusted
        wrapper downloads the exact stage, producer receipt, and canonical
        `compatibility-stage-producer-lineage.json` artifact by immutable ID.
        It runs three offline attestation verifications with a fresh trusted
        root. It then removes credentials and exposes only the
        two verified producer members read-only. The macOS 15 manifest and seal
        preserve the parsed `producerLineage`, the exact SHA-256 of the
        immutable RFC 8785 `compatibility-stage-producer-lineage.json` bytes,
        its transport identity and attestation, and `consumerBinding`. The
        macOS 15 seal independently reconstructs those trusted facts. Final
        aggregation requires those values to agree with the signed lineage
        artifact, both receipts, and both seal origins.


        The workflow never pushes repository content, publishes a release, or
        receives live product credentials. The implementation review and merge
        establish the anchor.
        The dedicated evidence pull request then commits only
        `.constitution/evidence/BURL-M003/managed-evidence.json`,
