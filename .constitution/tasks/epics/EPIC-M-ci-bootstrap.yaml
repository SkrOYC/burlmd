id: M
name: CI bootstrap
kind: tooling
capabilities:
  - CAP-076
depends_on: []
scope:
  paths:
    - rust/src/workspace/persist.rs
    - scripts/repeat-test.sh
    - .github/workflows/ci.yml
    - .github/workflows/ci-role-linux-x86-64.yml
    - .github/workflows/ci-role-macos-26-arm64.yml
    - .github/workflows/ci-role-macos-15-arm64.yml
    - devenv.nix
    - devenv.lock
    - scripts/**
    - lib/visual_capture_main.dart
    - test_driver/visual_capture_driver.dart
    - test/visual_capture_driver_protocol_test.dart
    - test/goldens/**
    - integration_test/**
    - .constitution/evidence/BURL-M003/**
  tech_spec_patchable: []
estimated_diff_lines: 1650
tickets:
  - id: BURL-M015
    title: Stabilize the authoritative-success timestamp regression test
    type: Chore
    effort: 3
    depends_on: []
    category: Tech-Debt
    scope:
      in:
        - rust/src/workspace/persist.rs
        - scripts/repeat-test.sh
    verification:
      command: cargo test --manifest-path rust/Cargo.toml
        a_structural_draft_failure_after_tier_two_publication_returns_authoritative_success
        && ./scripts/repeat-test.sh --count 100 -- cargo test --manifest-path
        rust/Cargo.toml
        a_structural_draft_failure_after_tier_two_publication_returns_authoritative_success
        && git diff --check
      expected: the targeted regression passes once normally and 100 consecutive
        isolated repetitions with deterministic timestamp evidence
    stop_conditions:
      - STOP if this ticket isn't running as the first reviewed milestone on
        `chore/epic-m-ci-foundation` from merged `master`.
      - STOP if the fix can hide a real ordering failure, rely on wall-clock
        coincidence, or weaken the authoritative-success state comparison.
      - STOP if work would weaken authoritative-success semantics or remove
        timestamp assertions without a deterministic replacement; don't expand
        this ticket.
    description: Replace the one-second last_modified race in the existing
      structural-draft authoritative-success regression with deterministic
      clock/state evidence while preserving the production invariant and exact
      state comparison
    acceptance:
      mode: stat_threshold
      constraints:
        - NFC-14
      evidence: "Metric: targeted-test failures. Dataset: 100 consecutive isolated
        repetitions after one ordinary run. Threshold: 0 failures and no skipped
        assertion. Command: the exact verification command above. The assertion
        still distinguishes authoritative success from rollback/failure without
        depending on wall-clock second boundaries. The milestone receives one
        full review before `BURL-M003` begins."
    flows:
      - flow-edit-note
    certainty: assumed
    status: planned
  - id: BURL-M003
    title: Establish the Linux and Apple Silicon macOS managed validation matrix
    type: Chore
    effort: 8
    depends_on:
      - BURL-M015
    category: DX
    scope:
      in:
        - .github/workflows/ci.yml
        - .github/workflows/ci-role-linux-x86-64.yml
        - .github/workflows/ci-role-macos-26-arm64.yml
        - .github/workflows/ci-role-macos-15-arm64.yml
        - devenv.nix
        - devenv.lock
        - scripts/**
        - lib/visual_capture_main.dart
        - test_driver/visual_capture_driver.dart
        - test/visual_capture_driver_protocol_test.dart
        - test/goldens/**
        - integration_test/**
        - .constitution/evidence/BURL-M003/**
      out:
        - .constitution/tech-spec/**
    verification:
      command: cargo fmt --manifest-path rust/Cargo.toml -- --check && cargo clippy
        --workspace --all-targets --all-features --manifest-path rust/Cargo.toml
        -- -D warnings && cargo test --manifest-path rust/Cargo.toml && dart
        format --output=none --set-exit-if-changed lib test test_driver
        integration_test && ./scripts/check-generated-bindings.sh && flutter
        test && dart analyze && ! rg -n '\[DEBUG-' lib rust test scripts &&
        actionlint && ./scripts/assert-ci-matrix.sh --workflow
        .github/workflows/ci.yml --require-runner ubuntu-24.04 --require-runner
        macos-26 --require-runner macos-15 --require-role-schema
        .constitution/tech-spec/contracts/ci-role-evidence.schema.json
        --require-aggregate-schema
        .constitution/tech-spec/contracts/ci-evidence.schema.json &&
        ./scripts/assert-managed-evidence-isolation.sh --contract
        .constitution/tech-spec/contracts/provisional-spikes.toml --sandbox
        bubblewrap --expected-version 0.11.2 &&
        ./scripts/test-managed-role-production-contract.sh &&
        ./scripts/test-managed-evidence-reconciliation.sh &&
        ./scripts/test-seal-validators.sh && git diff --check
      expected: local validation exits 0; the reviewed implementation merge
        establishes TRUST_ANCHOR_SHA; all three roles finish their assigned
        common-functional, analysis, integration, protocol, and security classes
        without credential access; all candidate placement, topology, label,
        and completion guards pass without claiming authenticated candidate
        hosted origin; each fresh seal origin is authenticated by verified
        provenance; the exact `receipt_digests` job contract, semantic
        receipt-digest transport validation, and every typed negative fixture
        pass; the seal-owned BURL-O001 stage chain passes; Linux also finishes
        generated-binding and managed-isolation classes, including raw contract
        version `38` closure-view checks across all seven ordered sessions; no
        role claims
        performance or visual evidence;
        the dedicated evidence pull request contains only
        .constitution/evidence/BURL-M003/managed-evidence.json, completion.md,
        and manifest.yaml and merges after independent review
    stop_conditions:
      - STOP if `BURL-M015` isn't committed, validated, and independently
        reviewed in `chore/epic-m-ci-foundation` or the branch wasn't created
        from merged `master`.
      - >
        STOP before BURL-M003 implementation until this Tasks patch merges and
        a later Stage 3 patch changes
        `ci_bootstrap.stage4_tasks_adaptation.status` from `required` to
        `satisfied`. The Stage 3 acknowledgement must merge before
        implementation begins.
      - STOP if implementation imports or cherry-picks from the unmerged Epic G
        branch. Implement the accepted CI and headless contracts from merged
        `master`; later surgical replay must preserve this merged foundation.
      - STOP if any gate invokes `scripts/check-generated-bindings.sh` before
        this ticket implements it or if the checker changes either generated
        surface from its precheck state on any exit path.
      - STOP if any third-party action isn't pinned to the full Stage 3 commit
        SHA or a role uses ambient repository toolchains instead of repository
        locks.
      - >
        STOP if any trusted `cachix/install-nix-action` call site omits the
        literal `enable_kvm: false`, derives the value, supplies an
        `install_url`, accepts preinstalled Nix, or fails the exact Nix `2.35.2`
        checks in `ci_bootstrap.actions.install_nix_interface`.
      - STOP if private/internal attestation isn't available; emit
        `attestation-unavailable` and reject the aggregate without a hash-only
        fallback.
      - STOP if candidate code defines expected identity, the managed-evidence
        launcher, or a signer workflow; if validation uses a pull-request merge
        revision, a dynamic local-workflow `uses` expression, or a self-hosted
        runner; or if identity doesn't separate trust anchor, workflow signer,
        tested source, base, and later evidence state.
      - STOP if the implementation hasn't completed local, milestone, and
        pull-request review before its rebase merge; the launcher isn't running
        from the clean merged anchor; or `master` differs on any trusted control
        path.
      - STOP if `scripts/validate-compatibility-stage-interface.sh` is not a
        protected trusted control whose bytes and mode equal the trust anchor
        before dispatch and during collection, or if its change bypasses the
        reviewed trust-anchor rotation and evidence-only completion sequence.
      - STOP if recovery reuses a workflow run, uses a GitHub UI or API rerun,
        or reuses its nonce. Every failed, cancelled, timed-out, or rejected
        collection requires a new `workflow_dispatch` run, a different workflow
        run ID, and a new 128-bit nonce from pinned coreutils
        `od -An -N16 -tx1 /dev/urandom | tr -d ' \n'`. Fail closed unless that
        command produces exactly 32 lowercase hexadecimal characters.
      - STOP if the trusted caller or any reusable role workflow does not invoke
        `scripts/validate-managed-workflow-inputs.sh` or require the literal
        environment value `GITHUB_RUN_ATTEMPT=1` before candidate execution,
        acquisition, upload, sealing, or attestation work. STOP if local
        `collect` reads or depends on ambient `GITHUB_RUN_ATTEMPT`, accepts
        anything other than literal `--attempt 1`, does not require REST
        `run_attempt == 1` before acquisition and immediately before accepted
        publication, or publishes after observed attempt drift.
      - STOP if the evidence pull request changes anything except
        `.constitution/evidence/BURL-M003/managed-evidence.json`,
        `.constitution/evidence/BURL-M003/completion.md`, and
        `.constitution/evidence/BURL-M003/manifest.yaml`, lacks independent
        review, or hasn't merged. `BURL-M003` remains incomplete until that
        merge.
      - STOP if a role bundle omits any manifest-named result, log, raw
        measurement, or handoff, or if any bundled byte fails its size or
        SHA-256 check.
      - STOP if a role isn't exactly a successful `candidate` job followed by a
        fresh `seal` job, candidate has OIDC, attestation, or Actions
        permission, seal doesn't exclusively own signing authority, or candidate
        bytes execute in the sealing environment.
      - STOP if candidate placement, topology, labels, or completion are treated
        as cryptographic hosted-origin proof; if candidate evidence contains
        `runnerEnvironment`; or if `hostedOriginVerified` depends on candidate
        REST data. These observations are noncryptographic runtime guards only.
      - STOP if a fresh seal's hosted origin isn't authenticated by attestation
        provenance bound to the exact signer, source, run, attempt, check-run
        ID, and `runner_environment=github-hosted` claim.
      - STOP if Linux copies a private Nix store, exposes a broad host root or
        Nix state, or deviates from the two read-only views, seven ordered
        `sessions`, and complete vectors in
        `ci_bootstrap.linux_candidate_closure_view`. STOP if Bubblewrap is not
        the sole candidate namespace and session-payload launch, or if the
        trusted parent gains an undeclared general process allowlist.
      - STOP if the Linux launcher doesn't retain the original teardown-lock
        descriptor, reopens the candidate-controlled pathname as proof, or
        accepts before the outer process ends and
        `teardown_lock_verifier_argv` acquires the required
        open-file-description lock after namespace PID 1 releases it and before
        cleanup.
      - STOP if a sealing receipt claims final job state, lacks
        `job.check_run_id`, or is stored inside the sealed bundle that it
        hashes. Only the post-completion coordinator may construct
        `origin.sealingJob` after the job API reports one matching completed
        successful job.
      - STOP if a pinned upload action digest isn't bare lowercase 64-hex or if
        a REST or aggregate digest isn't exactly `sha256:` plus that action
        output.
      - >
        STOP if any reusable role workflow doesn't expose exactly
        `sealing-receipt-artifact-id` and
        `sealing-receipt-upload-action-digest`; or if the caller's fresh
        `receipt_digests` job doesn't need exactly `expected`, `linux`,
        `macos_26`, and `macos_15`. STOP if that job doesn't run on
        `ubuntu-24.04` with only the `contents` permission set to `read`;
        doesn't map all six values
        directly through `needs` into the version-1 transport written by
        `scripts/write-receipt-digest-observation.sh`; or doesn't upload the
        exact `managed-evidence-receipt-digests-{artifact_nonce}` artifact
        containing only `receipt-upload-digests.json`. The upload must set
        `overwrite: false` and `if-no-files-found: error`.
      - STOP if collection doesn't resolve the transport's immutable ID from
        the exact run inventory, download the raw archive by ID, or compare its
        SHA-256 with the canonical REST digest before extraction or JSON
        parsing. Corrupt or substituted bytes must produce `artifact-corrupt`.
        A REST ID, run, repository, name, or expiration-state mismatch must
        produce `artifact-api-mismatch`. STOP if the collector doesn't
        semantically validate the extracted transport or doesn't match every
        transported receipt artifact ID and name to one unique REST artifact
        object. Fixtures must reject missing, extra, duplicate, malformed,
        reordered, wrong-role, wrong-run, wrong-attempt, wrong-signer,
        wrong-nonce, wrong-name, wrong-ID, and wrong-digest transport data.
      - STOP if `artifactNonce` isn't the exact lowercase 32-hex suffix of
        `runIdentity`; an artifact name contains a forbidden character; or an
        expected, candidate, sealed, or receipt artifact is missing, duplicate,
        extra, pre-uploaded, substituted, or digest-mismatched. Those artifact
        digest failures must use `artifact-digest-mismatch`. A compatibility
        stage or lineage transport artifact digest failure must use
        `compatibility-stage-digest-mismatch`. Also STOP if any ticket other
        than BURL-O001 carries a compatibility stage.
      - STOP if BURL-O001 uses a separate staging job; if the macOS 26 `seal`
        job doesn't create, attest, upload, and REST-validate the exact stage;
        if it doesn't create and attest the immutable RFC 8785
        `compatibility-stage-producer-lineage.json` artifact after the signed
        producer receipt has `createdAt` and `expiresAt`; if the macOS 15
        wrapper doesn't verify the exact stage, producer receipt, and lineage
        artifact offline before credential removal and read-only exposure; or if
        its manifest, receipt, seal, and final aggregate don't agree on the
        parsed lineage, exact lineage-artifact SHA-256, lineage transport
        identity and attestation, and trusted `consumerBinding`.
      - STOP if either the macOS 26 `seal` job output boundary or the macOS 26
        reusable-workflow output boundary fails to ticket-gate and normalize
        `producer-sealing-check-run-id`,
        `producer-sealing-receipt-artifact-id`, and
        `producer-sealing-receipt-upload-action-digest` to empty strings for
        every non-O001 ticket before caller mapping. STOP if the macOS 15
        trusted wrapper invokes acquisition, offline verification, or consumer
        processing before it validates the ordered 26-field interface; if
        BURL-O001 accepts an empty field; or if any other ticket accepts a
        nonempty field or skips the ordinary candidate path after skipping
        compatibility-only work.
      - STOP if `run` accepts a managed Spike without staging verified role
        contents, running its declared coordinator steps, and publishing a valid
        authoritative machine result.
      - STOP if a candidate command receives `GH_TOKEN`, `GITHUB_TOKEN`, OIDC
        request capability, an ambient credential or configuration path, or an
        inherited credential descriptor.
      - STOP if coordinator preparation begins after authentication, uses an
        unlocked input, or doesn't record and revalidate the executable and
        closure identity.
      - STOP if Bubblewrap `0.11.2` isn't provided by the locked Linux
        environment or the exact pinned Bubblewrap and loopback prerequisite
        fails. The role must stop before candidate dependency execution, bundle
        creation, or upload. The native-isolation prerequisite and candidate
        path must not invoke `sudo`, write a sysctl, install or replace an
        AppArmor profile, mutate another host policy, add a second probe or
        restoration path, or use a privileged fallback. STOP if the
        coordinator sees any credential canary or forbidden client, an input is
        writable, or anything except its output is writable. There is no
        credential-clearing-only fallback.
      - STOP if the bootstrap profile claims performance, Linux
        platform-regression, or authoritative macOS visual evidence. Those
        obligations belong to later benchmark, shell, and release gates.
      - STOP if the Flutter Rust Bridge generator, Rust crate, or Dart package
        differs from the provisionally authorized `2.12.0` triple. Use that
        triple only for bootstrap and require revalidation after final Stage 3.
      - STOP if work would include live product or canary credentials,
        repository-content pushes, release publication, or Writer desktop
        state; don't expand this ticket.
    description: >
      Add one trusted workflow_dispatch caller and three distinct two-job
      reusable role workflows referenced through static local paths. Each role's
      candidate job has only contents read permission, checks out the separate
      tested SHA as data, and runs candidate commands without artifact or
      signing credentials. Linux runs the raw-contract-version-38 seven-session
      plan through two exact read-only Bubblewrap views. Hosted macOS performs
      bounded cleanup only. Every candidate
      bundle is untrusted. After candidate commands finish, the trusted workflow
      wrapper uses only its job-scoped artifact runtime authority to upload the
      handoff. Its dependent seal job starts on a fresh environment, never
      executes candidate bytes, validates identity, noncryptographic candidate
      guards, artifact IDs and REST digests, safe archive structure, schemas,
      and member hashes, and alone receives OIDC and attestation authority. It
      uploads the sealed bundle before it writes a separate attested receipt.
      The receipt records job.check_run_id, immutable identities, and normalized
      expected, candidate, and sealed digest pairs, but no final job result.
      Each reusable role workflow exposes exactly the receipt artifact ID and
      bare upload digest. The caller's fresh `receipt_digests` job needs exactly
      `expected`, `linux`, `macos_26`, and `macos_15`, runs on
      `ubuntu-24.04`, and has only `contents: read`. It maps all six values into
      the identity-bound version-1 transport through
      `scripts/write-receipt-digest-observation.sh`. It uploads exactly
      `managed-evidence-receipt-digests-{artifact_nonce}`, containing only
      `receipt-upload-digests.json`, with `overwrite: false` and
      `if-no-files-found: error`. The collector semantically validates the
      extracted transport and matches every transported receipt artifact ID and
      name to one unique REST artifact object.
      Verified seal provenance alone authenticates hosted origin. After the
      attempt completes, managed-evidence.sh resolves that locator through the
      job API and constructs aggregate origin.sealingJob only for a completed
      successful provenance-bound match. For BURL-O001, the macOS 26 seal owns
      the authenticated compatibility stage. Before acquisition, offline
      verification, or consumer processing, the protected macOS 15 wrapper
      validates the exact ordered 26-field interface. It accepts only
      all-nonempty BURL-O001 values and only all-empty values for every other
      ticket. Both the macOS 26 `seal` job output boundary and the macOS 26
      reusable-workflow output boundary ticket-gate and normalize the three
      producer-sealing aliases to empty strings for every other ticket before
      caller mapping. After BURL-O001 validation succeeds, the macOS 15 wrapper
      downloads the exact stage, producer receipt, and canonical producer-lineage
      artifact by immutable ID. It verifies the stage through three offline
      attestation verifications after download and before credential-free
      candidate execution. The macOS 15 seal and final aggregate preserve the
      complete lineage. Implement the collect and
      run forms, the non-mutating
      generated-binding checker, the managed-evidence isolation fixture,
      `scripts/supervise-linux-session.sh`, and the mode-0644
      `scripts/managed-sway.conf` file. Add the exact Linux tools declared by the
      42-record bill of materials, including Bubblewrap `0.11.2`, GitHub CLI
      `2.96.0`, Diffutils `3.12`, Procps `4.0.6`, iproute2 `7.0.0`, Bash `5.3p9`,
      Coreutils `9.11`, and util-linux `2.42`, through the locked Nix
      environment. Reproduce the specified behavior without importing the Epic
      G branch. Pin
      actions/checkout to fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09,
      cachix/install-nix-action to 13d8dd58da0234aa297dedd986986ccb8e7f3e24,
      actions/upload-artifact to 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a,
      actions/download-artifact to 3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c, and
      actions/attest to 1e69f48acb82d1966a394da916b4c1698aa569d6. Generate
      authoritative trust-anchor, workflow-signer, tested-source, base, release,
      build, corpus, run, artifact-nonce, required-role, and signer identity
      before fan-out. The coordinator verifies the post-completion jobs, unique
      artifacts, receipt and sealed-bundle attestations, canonical digest
      conversion, provenance, and bundled files before writing an accepted or
      rejected aggregate


      Complete these steps in order:
        1. Implement `scripts/check-generated-bindings.sh` from the exact Stage 3 checker contract. Test clean, stale, generator-failure, added-file, removed-file, premodified-file, and interruption cases. Every case must leave `rust/src/frb_generated.rs` and `lib/src/rust/**` byte-identical to their precheck state.
        2. Implement `scripts/assert-managed-evidence-isolation.sh`,
           `scripts/supervise-linux-session.sh`, `scripts/managed-sway.conf`,
           the managed-role launcher, and the fresh-seal parser against
           `ci_bootstrap.linux_trusted_parent_bubblewrap`,
           `ci_bootstrap.linux_integration_session_compositor`, and
           `ci_bootstrap.linux_candidate_closure_view`. Pin the declared
           Diffutils, Procps, iproute2, Bash, Coreutils, util-linux,
           Bubblewrap, and GitHub CLI records through `devenv.nix` and
           `devenv.lock`. Every trusted Nix installer call must satisfy
           `ci_bootstrap.actions.install_nix_interface`, including literal
           `enable_kvm: false`.
        3. Make positive Linux fixtures reproduce `session_ids`, `sessions`,
           `closure_root_policy`, `session_contract_mount_policy`,
           `complete_argv_policy`, `full_vector_fixture_records`,
           `trusted_host_root_policy`, `capacity_root_policy`,
           `candidate_environment_policy`, `supervisor_script_policy`,
           `descriptor_policy`, `supervisor_cleanup_policy`,
           `teardown_lock_policy`, `loopback_policy`, `apparmor_probe_policy`,
           `source_log_policy`, and `closure_view_log_policy`. The fixtures
           must cover five base sessions and two integration sessions, the
           complete 488-member or 547-member read-only view, all runtime
           argv bytes, canonical checkout and host roots, the read-only
           `/contract` leaf, the direct Coreutils `env -i` boundary, the
           explicit Bash descriptor-255 close, phase-specific descriptor
           inventories, in-namespace headless Sway, distinct runtime leaves,
           integration candidate and Sway direct-child waits, namespace-PID-1
           adopted-descendant reaping, retained-inode OFD lock acquisition,
           cleanup, and fresh-seal reconstruction.
        4. Make negative Linux fixtures apply `complete_argv_fixture_policy`,
           `candidate_environment_fixture_policy`,
           `supervisor_script_fixture_policy`, `descriptor_fixture_policy`,
           `teardown_lock_fixture_policy`, `apparmor_fixture_policy`, and the
           mount, source, authority, runtime-leaf, preflight, log, and cleanup
           rejection policies. Reject a private-store copy; a broad, missing,
           writable, extra, or substituted bind; unresolved authority; a
           base-session compositor surface; inherited environment or
           descriptor state; swapped logs; early teardown proof; pathname
           substitution; incomplete namespace-PID-1 reaping; integration cleanup before
           both candidate and Sway direct-child waits; a native-isolation
           prerequisite or candidate-path host-policy mutation or fallback; and
           any bundle creation or upload after a prerequisite or cleanup failure.
        5. Retain the role-execution fixture policies
           `ci_bootstrap.role_execution.fixture_policy`,
           `ci_bootstrap.role_execution.candidate_guard_fixture_policy`,
           `ci_bootstrap.role_execution.compatibility_stage_fixture_policy`, and
           `ci_bootstrap.role_execution.compatibility_stage_consumer_binding_fixture_policy`
           for the receipt, compatibility, evidence-profile, and typed rejection
           behavior already accepted. Validate role schema version `15`,
           aggregate schema version `19`, sealing receipt version `2`, and
           receipt transport version `1`. Protect the exact 35-path
           `trusted_control_paths` inventory. Require the exact 11-artifact
           ordinary inventory and 13-artifact BURL-O001 inventory.
        6. Require every reusable role workflow to expose exactly `sealing-receipt-artifact-id` and `sealing-receipt-upload-action-digest` from its receipt upload. Pin `receipt_digests` to exactly `needs: [expected, linux, macos_26, macos_15]`, `runs-on: ubuntu-24.04`, and `permissions: contents: read`. Pass all six outputs directly through `needs` to `scripts/write-receipt-digest-observation.sh`. Upload only its schema-valid version-1 `receipt-upload-digests.json` as `managed-evidence-receipt-digests-{artifact_nonce}`, with `overwrite: false` and `if-no-files-found: error`. Require the exact 11-artifact ordinary inventory and 13-artifact BURL-O001 inventory. Make the collector resolve the transport's immutable ID from the exact run inventory, fetch that ID's REST object, and download the raw archive through the ID-addressed endpoint. Before extraction or JSON parsing, require the raw archive SHA-256 to equal the canonical REST digest. Corruption or substitution must produce `artifact-corrupt`; a REST ID, run, repository, name, or expiration-state mismatch must produce `artifact-api-mismatch`. Retain the immutable ID, exact name, REST digest, and computed raw-download hash in `receiptDigestTransportArtifact`. Semantically validate the extracted transport and match every transported receipt artifact ID and name to one unique REST artifact object. For each receipt, require the REST digest to equal `sha256:` plus the transported bare action digest, retain both in `origin.sealingReceiptArtifact`, and produce `artifact-digest-mismatch` on mismatch. Add fixtures that reject missing, extra, duplicate, malformed, reordered, wrong-role, wrong-run, wrong-attempt, wrong-signer, wrong-nonce, wrong-name, wrong-ID, and wrong-digest transport data.
        7. Commit and independently review the `BURL-M003` milestone on `chore/epic-m-ci-foundation`. Open a ready implementation pull request, obtain independent pull-request review, and rebase-merge it into `master`. Record the resulting full `master` tip as `TRUST_ANCHOR_SHA`; don't treat the ticket as complete.
        8. Create a clean detached `TRUST_ANCHOR_WORKTREE` at `TRUST_ANCHOR_SHA` and create `EVIDENCE_WORKTREE` on `docs/epic-m-ci-evidence` from that merged `master`. Set `BASE_SHA` to the rebased, reviewed `BURL-M015` milestone at the trust anchor's first parent. Run `TRUST_ANCHOR_WORKTREE/scripts/managed-evidence.sh run --ticket BURL-M003 --trust-anchor-sha TRUST_ANCHOR_SHA --source-ref refs/heads/master --tested-source-sha TRUST_ANCHOR_SHA --base-sha BASE_SHA --output EVIDENCE_WORKTREE/.constitution/evidence/BURL-M003/managed-evidence.json && git -C EVIDENCE_WORKTREE diff --check`.
        9. In the minimally privileged Linux `candidate` job, run the exact
           seven `ci_bootstrap.linux_candidate_closure_view.sessions` in
           order. Each session uses one Bubblewrap invocation and the exact
           base or integration view, command, environment, descriptor
           branch, loopback setup, and cleanup protocol. On both Apple
           Silicon macOS roles, a cold checkout runs `flutter test && dart
           analyze && flutter test integration_test -d macos -r github`,
           then performs bounded cleanup of known test processes without
           claiming universal containment. Each dependent `seal` job
           validates and authenticates the untrusted bundle in a fresh
           environment and never executes candidate bytes.
        10. In `EVIDENCE_WORKTREE`, add `.constitution/evidence/BURL-M003/completion.md` with the anchor SHA, workflow signer SHA, tested-source SHA, run identity, accepted report digest, implementation pull request, and review evidence. Add `.constitution/evidence/BURL-M003/manifest.yaml` with the exact byte counts and SHA-256 digests of `managed-evidence.json` and `completion.md`. Commit exactly those three evidence files. Open, independently review, and merge the ready evidence pull request. Only this merge completes `BURL-M003`.
    acceptance:
      mode: contract_test
      evidence: >
        The `ubuntu-24.04` role provides `common-functional`,
        `managed-evidence-protocol`, `managed-evidence-security`,
        `managed-evidence-isolation`, `generated-binding-check`,
        `static-analysis`, and `desktop-integration`. The Apple Silicon
        `macos-26` and `macos-15` roles provide `common-functional`,
        `managed-evidence-protocol`, `managed-evidence-security`,
        `static-analysis`, and `desktop-integration`. Each role runs the
        complete Flutter unit suite, analyzer, and desktop integration gate.
        Linux runs the exact five base and two integration sessions from
        `ci_bootstrap.linux_candidate_closure_view.sessions`. Only the two
        integration sessions start headless Sway inside their Bubblewrap
        namespace. Both macOS roles run the exact cold-checkout integration
        sequence from the ordered implementation steps. The evidence records every
        integration-test file and result and rejects an empty, skipped, or
        partially discovered suite. The bootstrap profile doesn't include
        `performance`, `linux-platform-regression`, or
        `macos-authoritative-visual`. Each integration session owns its distinct
        runtime leaf, display, compositor, process group, and application PID
        without reading the Writer's desktop. Base sessions have no compositor
        process, runtime leaf, socket, or Wayland environment. Later
        benchmark, shell, and release tickets own the performance and visual gates.


        The trusted `master` caller invokes
        `.github/workflows/ci-role-linux-x86-64.yml`,
        `.github/workflows/ci-role-macos-26-arm64.yml`, and
        `.github/workflows/ci-role-macos-15-arm64.yml` through static local
        paths. Each role workflow resolves from `WORKFLOW_SIGNER_SHA` and
        contains exactly `candidate` and `seal` jobs on separate fresh
        environments. The clean trust-anchor launcher creates expected identity
        and verifies that the signer retains every trusted control byte.
        Identity keeps the trust anchor, signer, tested source, base,
        `managed:<32hex>` run identity, and its exact 32-hex artifact nonce
        distinct. Expected, candidate, sealed, and sealing-receipt artifact
        names use fixed safe templates. The local dispatch token has Actions
        write permission. Candidate narrows its job permissions to contents
        read; the fresh non-executing seal alone retains Actions read, contents
        read, OIDC, and attestations write. Candidate commands can't inherit
        artifact runtime or signing capabilities. After they finish, the trusted
        workflow wrapper receives job-scoped artifact runtime authority to
        upload the untrusted candidate bundle.


        Expected identity supplies `requiredRoleGuards` for every role. The
        collector records static placement, the candidate-to-seal topology,
        observed labels, and completed success in `candidatePlacement`. The
        aggregate exposes them as four separate checks. These checks are
        noncryptographic runtime guards. They never create candidate
        `runnerEnvironment` or contribute to `hostedOriginVerified`.


        Role documents validate against schema version `15`, and the aggregate
        validates against schema version `19`. The raw managed-evidence
        contract is version `38`. The sealing receipt validates against version
        `2`, and the receipt transport validates against version `1`. The exact
        service inventory remains 11 ordinary artifacts or 13 BURL-O001
        artifacts. The 42-record bill of materials and exact 35-path
        `ci_bootstrap.trust_anchor.trusted_control_paths` inventory are binding.
        The sealing receipt contains
        `job.check_run_id` but no status, conclusion, completion timestamp, or
        observation of its own uploaded artifact.
        After the attempt completes, collection resolves
        exactly one seal job through that locator. It requires completed success
        and provenance bound to the signer, source, run, attempt, check-run ID,
        and `runner_environment=github-hosted`. Only this attestation-backed seal
        origin can set `hostedOriginVerified`. For every expected, candidate,
        sealed, and receipt artifact, fixtures require the REST `sha256:<hex>`
        digest to equal `sha256:` plus the pinned action's bare lowercase
        64-hex output. Prefix, case, and byte mismatches produce
        `artifact-digest-mismatch`. A stage or lineage transport artifact
        digest failure produces `compatibility-stage-digest-mismatch`.
        The receipt-digest transport uses immutable-ID REST lookup and an
        ID-addressed raw download. Before extraction or JSON parsing, the
        collector requires the raw archive SHA-256 to equal the canonical REST
        digest. The aggregate retains `receiptDigestTransportArtifact` with the
        immutable ID, exact name, REST digest, and computed raw-download hash.
        Each `origin.sealingReceiptArtifact` retains the transported bare action
        digest and the matching canonical REST digest.


        Candidate-guard fixtures cover all four typed mismatch outcomes.
        Seal-origin fixtures cover in-progress, failed, missing, duplicate,
        wrong-job, wrong-label, self-hosted, wrong-signer, wrong-source,
        wrong-run, wrong-attempt, and wrong-locator outcomes. BURL-O001 fixtures
        cover raw contract version `38`'s complete compatibility-stage rejection
        inventory: missing, duplicate, substituted, expired, digest mismatch,
        unattested, wrong signer, wrong run, wrong role, wrong seal, stale
        producer receipt, noncanonical lineage, lineage SHA mismatch,
        consumer unbound, and unexpected. The complete role-execution fixture
        inventory in `ci_bootstrap.role_execution.fixture_policy` remains
        required, including token,
        configuration, artifact-runtime, receipt, evidence-profile, viewport,
        nonce, artifact, bundle, trust-anchor, source-allowlist, filesystem,
        coordinator, and aggregation coverage. Raw contract version `38` adds
        its exact closure, environment, descriptor, teardown, host-prerequisite,
        compositor, authority, log, and cleanup fixtures to that inventory.
        Aggregate `accepted` requires all three successful candidate guard sets,
        all three attestation-backed seal origins, every applicable stage check,
        a verified receipt-digest transport, and no rejection reason.


        Static receipt-output fixtures require every reusable role workflow to
        expose exactly `sealing-receipt-artifact-id` and
        `sealing-receipt-upload-action-digest` from its receipt upload step.
        They require the caller's fresh `receipt_digests` job to need exactly
        `expected`, `linux`, `macos_26`, and `macos_15`, run on
        `ubuntu-24.04`, and have only `contents: read`. The job maps all six
        values through `needs` into one schema-valid version-1 transport. It
        invokes `scripts/write-receipt-digest-observation.sh`, downloads no
        candidate bytes, and uploads the exact
        `managed-evidence-receipt-digests-{artifact_nonce}` artifact. That
        artifact contains only `receipt-upload-digests.json`, and the upload
        sets `overwrite: false` and `if-no-files-found: error`. Collector
        fixtures resolve its immutable ID from the exact run inventory, fetch
        that ID's canonical REST object, and download the raw archive through
        the ID-addressed endpoint. They verify the raw archive SHA-256 before
        extraction or JSON parsing. After extraction, they require semantic
        validation and match every transported receipt artifact ID and name to
        one unique REST artifact object. They reject missing, extra, duplicate,
        malformed, reordered, wrong-role, wrong-run, wrong-attempt,
        wrong-signer, wrong-nonce, wrong-name, wrong-ID, and wrong-digest
        transport data. Corruption and substitution fixtures reject with
        `artifact-corrupt`. REST identity or state mismatches reject with
        `artifact-api-mismatch`. Accepted fixtures retain
        `receiptDigestTransportArtifact` and every
        `origin.sealingReceiptArtifact` digest pair.


        Static workflow-shape fixtures use duplicate-aware source inspection to
        pin the ordered 26 producer outputs, 26 macOS 15 string inputs, and each
        observable caller mapping. They also pin this ordered canonical-input,
        uppercase-environment, validator-inventory mapping: `stage-artifact-name`
        to `STAGE_ARTIFACT_NAME` to `stage-artifact-name`;
        `stage-artifact-id` to `STAGE_ARTIFACT_ID` to `stage-artifact-id`;
        `stage-upload-action-digest` to `STAGE_UPLOAD_ACTION_DIGEST` to
        `stage-upload-action-digest`; `stage-rest-digest` to
        `STAGE_REST_DIGEST` to `stage-rest-digest`; `stage-created-at` to
        `STAGE_CREATED_AT` to `stage-created-at`; `stage-expires-at` to
        `STAGE_EXPIRES_AT` to `stage-expires-at`; `stage-manifest-sha256` to
        `STAGE_MANIFEST_SHA256` to `stage-manifest-sha256`;
        `stage-attestation-subject-digest` to
        `STAGE_ATTESTATION_SUBJECT_DIGEST` to
        `stage-attestation-subject-digest`; `stage-attestation-bundle-sha256`
        to `STAGE_ATTESTATION_BUNDLE_SHA256` to
        `stage-attestation-bundle-sha256`; `producer-workflow-signer-sha` to
        `PRODUCER_WORKFLOW_SIGNER_SHA` to `producer-workflow-signer-sha`;
        `workflow-run-id` to `WORKFLOW_RUN_ID` to `workflow-run-id`;
        `run-attempt` to `RUN_ATTEMPT` to `run-attempt`;
        `producer-sealing-check-run-id` to `PRODUCER_SEALING_CHECK_RUN_ID` to
        `producer-sealing-check-run-id`; `producer-sealing-receipt-artifact-id`
        to `PRODUCER_SEALING_RECEIPT_ARTIFACT_ID` to
        `producer-sealing-receipt-artifact-id`;
        `producer-sealing-receipt-upload-action-digest` to
        `PRODUCER_SEALING_RECEIPT_UPLOAD_ACTION_DIGEST` to
        `producer-sealing-receipt-upload-action-digest`;
        `producer-sealing-receipt-rest-digest` to
        `PRODUCER_SEALING_RECEIPT_REST_DIGEST` to
        `producer-sealing-receipt-rest-digest`;
        `producer-sealing-receipt-created-at` to
        `PRODUCER_SEALING_RECEIPT_CREATED_AT` to
        `producer-sealing-receipt-created-at`;
        `producer-sealing-receipt-expires-at` to
        `PRODUCER_SEALING_RECEIPT_EXPIRES_AT` to
        `producer-sealing-receipt-expires-at`; `producer-lineage-artifact-id`
        to `PRODUCER_LINEAGE_ARTIFACT_ID` to `producer-lineage-artifact-id`;
        `producer-lineage-upload-action-digest` to
        `PRODUCER_LINEAGE_UPLOAD_ACTION_DIGEST` to
        `producer-lineage-upload-action-digest`; `producer-lineage-rest-digest`
        to `PRODUCER_LINEAGE_REST_DIGEST` to `producer-lineage-rest-digest`;
        `producer-lineage-sha256` to `PRODUCER_LINEAGE_SHA256` to
        `producer-lineage-sha256`; `producer-lineage-attestation-subject-digest`
        to `PRODUCER_LINEAGE_ATTESTATION_SUBJECT_DIGEST` to
        `producer-lineage-attestation-subject-digest`;
        `producer-lineage-attestation-bundle-sha256` to
        `PRODUCER_LINEAGE_ATTESTATION_BUNDLE_SHA256` to
        `producer-lineage-attestation-bundle-sha256`; `producer-role` to
        `PRODUCER_ROLE` to `producer-role`; and `consumer-role` to
        `CONSUMER_ROLE` to `consumer-role`. These fixtures reject swapped,
        missing, extra, duplicated, and reordered declarations, mappings, and
        inventory fields where source structure is observable. They also prove
        that both the macOS 26 `seal` job output boundary and the macOS 26
        reusable-workflow output boundary ticket-gate and normalize
        `producer-sealing-check-run-id`,
        `producer-sealing-receipt-artifact-id`, and
        `producer-sealing-receipt-upload-action-digest` to empty strings for
        every non-O001 ticket before caller mapping.


        Behavioral fixtures protect and invoke
        `scripts/validate-compatibility-stage-interface.sh` before acquisition,
        offline verification, or consumer processing. They accept exactly 26
        nonempty BURL-O001 values and prove the wrapper performs all three
        immutable-ID downloads. After download, three offline attestation
        verifications verify the stage before consumer processing and
        credential-free candidate execution. They accept exactly 26 empty
        values for every non-O001 ticket, skip only those compatibility steps,
        and prove the ordinary candidate path continues. Runtime fixtures don't
        claim to
        detect YAML declaration shape or arbitrary value
        provenance; downstream identity, attestation, digest, lineage, and
        freshness validation retains that responsibility.


        Fixtures require three distinct offline attestation verifications. The
        stage-manifest verification is pinned to the stage manifest and stage
        bundle and writes `stage-verification.json`. The producer-receipt
        verification is pinned to the producer sealing receipt and receipt
        bundle and writes `receipt-verification.json`. The producer-lineage
        verification is pinned to the producer-lineage artifact and lineage
        bundle and writes `lineage-verification.json`. Fixtures accept
        `consumerBinding.downloadedStageArtifactId` only when it equals
        `producerLineage.stageArtifact.artifactId` in the macOS 15 manifest,
        its sealing receipt, and the final aggregate. At each surface, fixtures
        reject a mismatch.

        After the three distinct offline attestation commands write
        `stage-verification.json`, `receipt-verification.json`, and
        `lineage-verification.json`, the trusted
        `scripts/prepare-compatibility-stage-consumer.sh` helper must consume
        and validate all three result files together with all 26 runtime values
        before it removes credentials or exposes only the two verified producer
        members read-only. Fixtures must fail if the helper ignores, swaps, or
        does not validate any result file or runtime value.


        Positive Linux fixtures reproduce the exact values and policies in
        `ci_bootstrap.linux_trusted_parent_bubblewrap`,
        `ci_bootstrap.linux_integration_session_compositor`, and
        `ci_bootstrap.linux_candidate_closure_view`. They require five
        488-member base views and two 547-member integration views, with no
        copied private store. They reconstruct every `complete_argv_policy`
        vector from the retained authority and current-path rows with no
        unresolved source. They verify the exact read-only `/contract` leaf,
        manifest and source identity, hidden Nix state, and argument budget.


        `trusted_host_root_policy` derives the trusted-control root from the
        immutable launcher path and the tested-source root from the explicit
        credential-free checkout argument. It validates both commits locally.
        It canonicalizes `RUNNER_TEMP` and the role-output argument as separate
        authorities. Parent manifests resolve only below the declared
        `RUNNER_TEMP` root, while logs and role artifacts resolve below the
        role-output root. Their paths must equal
        `tool_closure_manifest_host_relative_path`,
        `closure_manifest_host_relative_path`,
        `base_manifest_host_relative_path`, and
        `integration_manifest_host_relative_path`. Fresh sealing validates the
        retained path structure and consistency without claiming independent
        authentication of departed host paths. Fixtures reject a production
        `/work` alias, an unresolved
        value, a linked or escaping path, a wrong root, or a parent manifest
        sourced through `/contract`.


        The final direct candidate boundary satisfies
        `candidate_environment_policy`: base sessions receive 33 ordered
        assignments, and integration sessions receive 37. The Bash supervisor
        satisfies `supervisor_script_policy` by closing descriptor 255 before
        preflight. The base, integration-supervisor, candidate, and cleanup
        phases satisfy `descriptor_policy`, `descriptor_fixture_policy`, and
        `supervisor_cleanup_policy`. The two integration sessions alone receive
        distinct mode-0700 runtime leaves and in-namespace Sway. The
        configuration prevents `swaybg`, disables Xwayland, and retains exact
        `wayland-1` behavior.


        `loopback_policy` raises and verifies `lo` inside the outer network
        namespace after the descriptor handshake and before candidate, Sway, or
        `swaymsg` startup. The outer namespace exposes no host interface, route,
        external network, or host-network descriptor. Untrusted code may alter
        only its private network configuration.


        Teardown fixtures satisfy `teardown_lock_policy` and
        `teardown_lock_fixture_policy`. The trusted parent retains the original
        descriptor and proves stable device and inode identity. The pinned
        `teardown_lock_verifier_argv` must conflict while the namespace reaper
        lives. After the outer process ends, it must acquire only after genuine
        reaper release and before cleanup. Cleanup follows the integration
        candidate and Sway direct-child waits and uses the verified temporary
        descriptor 3. The parent accepts and records the session only after
        cleanup, then permits upload.
        Fresh sealing validates the complete version 2 closure log and golden,
        including every authority, source, argv, environment, descriptor,
        runtime, cleanup, and retained-lock field. It requires the four source
        identity header fields, the literal canonical staging-leaf path plus
        one LF for `staging-root-sha256`, every 25-field session row, and one
        host-policy row after all seven sessions. Both retained manifest
        payloads must follow in the declared order.


        Negative fixtures reject every mutation required by
        `complete_argv_fixture_policy`, `candidate_environment_fixture_policy`,
        `supervisor_script_fixture_policy`, `descriptor_fixture_policy`,
        `teardown_lock_fixture_policy`, and `apparmor_fixture_policy`. They also
        reject private-store content, broad or writable mounts, a changed
        source identity, a missing or writable `/contract`, a base compositor
        surface, an inherited variable or descriptor, swapped logs, early lock
        acquisition, a replaced-path proof, incomplete reaping or cleanup, and
        a mismatched closure log or golden. The exact pinned prerequisite must
        succeed before dependencies or candidate code run. Every failure blocks
        candidate execution, bundle creation, and upload. The native-isolation
        prerequisite and candidate path must not use `sudo`, mutate AppArmor,
        sysctl, or another host policy, add a second probe or restoration path,
        or use a privileged fallback. A local probe validates mechanics only.
        Accepted hosted BURL-M003 evidence must prove hosted availability for
        that run.


        Static workflow fixtures require literal `enable_kvm: false` at every
        trusted `cachix/install-nix-action` call site. They reject an omitted,
        true, expression-derived, environment-derived, wrapper-derived, or
        nonliteral value. They also retain the `install_url`, preinstalled Nix,
        and exact Nix `2.35.2` checks from
        `ci_bootstrap.actions.install_nix_interface`.


        Hosted-macOS fixtures distinguish candidate-command no-privilege
        execution from the trusted wrapper's later artifact runtime authority.
        They prove fresh-job separation, sole seal OIDC and attestation
        authority, safe validation, and no candidate-byte execution in seal. A
        surviving candidate process can corrupt untrusted output or cause a
        fail-closed upload denial. It can't gain seal authority or enter the
        fresh seal environment. Fixtures reject any universal macOS containment
        or zero-survivor claim. Accepted evidence authenticates reviewed
        workflow execution and sealed provenance. It does not prove that
        arbitrary malicious macOS candidate code is contained or that its
        untrusted output is truthful. Reviewed source and test contracts remain
        required.


        Before the ordered gate invokes it, `BURL-M003` creates the missing
        generated-binding checker. Checker fixtures prove that it snapshots a
        path-sorted SHA-256 manifest and byte backup for
        `rust/src/frb_generated.rs` and `lib/src/rust/**`, runs the provisional
        `2.12.0` generator, and detects every added, removed, or changed
        generated byte. Clean, stale, generator-failure, premodified-file, and
        interruption cases restore and verify the exact precheck state before
        exit. Contract fixtures prove that `collect` and `run` reject extra or
        missing flags, replace outputs atomically, emit the specified JSON
        summary, and use exit statuses `0`, `1`, and `2` exactly as Stage 3
        defines. Dispatch fixtures require `master`, the exact returned run ID,
        canonical expected-identity bytes, and separate signer and tested-source
        SHAs. Managed-Spike fixtures prove that verified manifest members stage
        only under fixed role directories, coordinator steps use no manual
        source, and acceptance requires a schema-valid `results.json`. They
        execute the collector-reconciliation fixture and reject a runner-label
        mismatch before comparing ordered evidence classes. A non-`CLOEXEC`
        descriptor canary proves that the trusted launcher closes descriptors
        before Bubblewrap; namespace and network fixtures remain separate.
        For BURL-O001, the macOS 26 seal validates the two declared producer
        members. It then creates, attests, uploads, and REST-validates the exact
        compatibility stage before writing its receipt. The receipt binds the
        stage name, service artifact ID, both digest forms, lifetime, manifest,
        attestation facts, producing seal locator, signer, source, run, attempt,
        and roles. A separate staging job is forbidden. The macOS 15 trusted
        wrapper downloads the exact stage, producer receipt, and canonical
        `compatibility-stage-producer-lineage.json` artifact by immutable ID.
        It runs three offline attestation verifications with a fresh trusted
        root. It then removes credentials and exposes only the
        two verified producer members read-only. The macOS 15 manifest and seal
        preserve the parsed `producerLineage`, the exact SHA-256 of the
        immutable RFC 8785 `compatibility-stage-producer-lineage.json` bytes,
        its transport identity and attestation, and `consumerBinding`. The
        macOS 15 seal independently reconstructs those trusted facts. Final
        aggregation requires those values to agree with the signed lineage
        artifact, both receipts, and both seal origins.


        Every collection is one fresh `workflow_dispatch` run. The launcher
        creates its 128-bit nonce only through pinned coreutils
        `od -An -N16 -tx1 /dev/urandom | tr -d ' \n'`, accepts exactly 32
        lowercase hexadecimal characters, and fails closed without a fallback.
        A failed, cancelled, timed-out, or
        rejected collection starts another `run` command with a new nonce and
        workflow run ID; GitHub UI and API reruns, including job reruns, are
        prohibited. Before candidate execution, acquisition, upload, sealing, or
        attestation work, the trusted caller and every reusable role workflow
        invoke `scripts/validate-managed-workflow-inputs.sh` and require the
        literal environment value `GITHUB_RUN_ATTEMPT=1`. Local `collect` ignores
        ambient `GITHUB_RUN_ATTEMPT`. It accepts only literal `--attempt 1`,
        requires the exact workflow-run REST object's numeric `run_attempt == 1`
        before acquisition, and re-fetches that object immediately before
        atomically publishing an accepted report. An observed rerun or attempt
        drift before publication rejects without an accepted report.


        In-workflow environment fixtures prove that the trusted caller and every
        reusable role workflow invoke
        `scripts/validate-managed-workflow-inputs.sh` before relevant work. They
        reject missing, malformed, zero, negative, `01`, `+1`, and
        greater-than-one `GITHUB_RUN_ATTEMPT` values. Local CLI fixtures prove
        that `collect` ignores ambient `GITHUB_RUN_ATTEMPT` and rejects every
        spelling except literal `--attempt 1` before acquisition. REST and
        attempt-drift fixtures reject a missing, malformed, nonnumeric, or
        non-1 REST `run_attempt` before acquisition, then inject attempt drift
        before publication and reject publication of an accepted report.
        Lifecycle fixtures cover recovery from failed, cancelled, timed-out, and
        rejected reports.
        They require the exact 11-artifact ordinary inventory and the exact
        13-artifact BURL-O001 inventory, with `overwrite: false` on every
        upload. Each fixed artifact-name template has no variable component
        other than its 32-hex nonce; role names are literals in their declared
        templates. Static fixtures scan every member of the complete
        `trusted_control_paths` inventory for artifact-deletion endpoints. A
        recording fake API intercepts every executable API call site and proves
        that none makes an artifact-deletion request.


        The workflow never pushes repository content, publishes a release, or
        receives live product credentials. The implementation review and merge
        establish the anchor.
        The dedicated evidence pull request then commits only
        `.constitution/evidence/BURL-M003/managed-evidence.json`,
        `.constitution/evidence/BURL-M003/completion.md`, and their
        digest-bearing `.constitution/evidence/BURL-M003/manifest.yaml`.
        `BURL-M003` satisfies dependencies only after that reviewed pull request
        merges. Any trusted-control change repeats the sequence. Final Stage 3
        must revalidate the generator triple and generated output before
        downstream production tickets run.
