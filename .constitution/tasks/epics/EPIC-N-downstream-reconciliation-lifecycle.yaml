        progressive hydration probes passing
    stop_conditions:
      - STOP if destination isn't empty/absent, Remote isn't private/accessible,
        asset-bearing history lacks a verified Object Store configuration, or a
        retained migration fallback can't be credentialed or serviced by an
        already credentialed peer.
    description: Authorize, select an accessible private Remote, clone into a safe
      destination, run canonical preflight/bootstrap, configure authoritative
      replacement Object access, and detect any retained old-store fallback
      descriptor. Store supplied fallback credentials only in secure storage;
      otherwise allow a connected credentialed peer to service verified
      on-demand backfill. Open text promptly and hydrate active Assets
      progressively from the replacement, invoking the BURL-N002 fallback path
      on a verified replacement miss
    acceptance:
      mode: runbook_probe
      evidence: The exact runbook command starts from a clean second-device state,
        joins the isolated private Remote, and reaches an authoritative local
        Workspace with full history and index, immediate Note editing, and
        progressive verified Asset hydration. A migration fixture proves a
        replacement miss invokes the retained old-store fallback through
        securely supplied credentials or a credentialed peer, verifies the
        fetched content hash, backfills and verifies the replacement, and
        hydrates only from that replacement. Its machine-readable log proves no
        source archive mutation, no credential persisted in the clone, and
        bounded cleanup of test state.
    flows:
      - flow-auth-handshake
    certainty: assumed
    status: planned
  - id: BURL-N007
    title: Separate sign-out, detach, reconnect, and full-local transition
    type: Feature
    effort: 8
    depends_on:
      - BURL-N003
    category: Correctness
    scope:
      in:
        - rust/src/sync/**
        - rust/src/git/operations.rs
        - rust/src/object_store/**
        - rust/src/api/ffi_api.rs
        - test/**
    verification:
      command: cargo test --manifest-path rust/Cargo.toml &&
        ./scripts/check-generated-bindings.sh && dart analyze && git diff
        --check
      expected: exit 0 with offline transition to local-with-store, required reconnect
        before retained-store removal, online full-local transition, hydration
        refusal, and exact-history preservation tests passing
    stop_conditions:
      - STOP if detach deletes history or Objects, or can leave an asset-bearing
        Workspace inconsistently attached.
      - STOP if a full-local transition relies on cached Remote refs, stale
        readiness, or no authenticated online Remote revalidation.
      - STOP if removing the Object Store from `LocalWithObjectStore` can
        proceed without reconnecting the exact prior Remote and obtaining fresh
        authenticated ref/revision-bound readiness from BURL-N003.
    description: Keep sign-out credential-only. Offline Remote detachment moves to
      LocalWithObjectStore and retains Object Store configuration. From that
      state, reconnect the exact prior Remote before either resuming publication
      or returning fully local. For a full-local transition, authenticate
      online, enumerate all published refs again, hydrate and verify the
      resulting Protected Object closure, and consume the ref/revision-bound
      readiness atomically before detaching both external stores. Never delete
      remote Object bytes or rewrite history
    acceptance:
      mode: invariant
      evidence: Sign-out preserves attachment. Offline detachment removes only local
        Remote bookkeeping, enters `LocalWithObjectStore`, retains the Object
        Store, and preserves local commits. That state can't remove the retained
        store directly. Reconnecting the exact prior Remote restores publication
        without history rewrite or allows a full-local transition through
        authenticated online Remote-ref revalidation immediately before
        hydration readiness and compare-and-swap detach. The transition refuses
        offline, stale, incomplete, or advanced ref evidence. Success retains
        all protected bytes and deletes no authoritative remote Object.
    flows:
      - flow-auth-handshake
      - flow-object-store-lifecycle
    certainty: assumed
    status: planned
  - id: BURL-N008
    title: Integrate Remote settings, privacy, and authorization states
    type: Feature
    effort: 8
    depends_on:
