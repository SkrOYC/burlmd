  - id: BURL-N001
    title: Resolve Suggestions independently in the editor
    type: Feature
    effort: 8
    depends_on: []
    category: Feature-Evolution
    scope:
      in:
        - lib/src/components/editor.dart
        - lib/src/components/block_view.dart
        - lib/src/providers/note_providers.dart
        - rust/src/api/ffi_api.rs
        - test/**
    verification:
      command: cargo test --manifest-path rust/Cargo.toml &&
        ./scripts/check-generated-bindings.sh && flutter test && dart analyze &&
        ./scripts/smoke-shot.sh sug-l005 && git diff --check
      expected: exit 0 with local/incoming/both/custom, partial unresolved, keyboard,
        Semantics, and persistence tests passing
    stop_conditions:
      - STOP if resolving one Suggestion implicitly resolves another or if UI
        owns conflict source.
    description: Render canonical Suggestions inline and support independent
      accept-local, accept-incoming, accept-both, and custom source replacement
      while retaining unresolved siblings through history and sync
    acceptance:
      mode: gherkin
      evidence: |
        ```gherkin
        Given a Note contains several unresolved Suggestions
        When the Writer resolves one using any supported choice
        Then only that Suggestion changes
        And the Note remains valid and durable
        And unresolved siblings remain visible and synchronizable
        ```
    flows:
      - flow-conflict-resolution
    certainty: assumed
    status: planned
  - id: BURL-N002
    title: Migrate protected Objects to a replacement store
    type: Feature
    effort: 8
    depends_on: []
    category: Correctness
    scope:
      in:
        - rust/src/object_store/**
        - rust/src/sync/**
        - rust/src/workspace/**
        - rust/src/api/ffi_api.rs
        - lib/src/components/**
        - test/**
    verification:
      command: cargo test --manifest-path rust/Cargo.toml &&
        ./scripts/check-generated-bindings.sh && flutter test && dart analyze &&
        ./scripts/smoke-shot.sh migrate-i011 && git diff --check
      expected: exit 0 with durable intent, dual-write, baseline/delta copy,
        revision-bound cutover, resume, stale-publisher, and fresh-device
        fallback tests passing
    stop_conditions:
      - STOP if the old store can retire before every Protected Object is
        verified in the replacement.
      - STOP if any device can publish during migration without first verifying
        each new Object in both stores, or if a device without replacement
        credentials can publish after cutover.
      - STOP if cutover discards the non-secret old-store fallback descriptor or
        a replacement-store miss can strand a protected Object that remains
        verifiable in the retained old store.
      - STOP before migration intent, copy, or dual-write if the replacement
        hasn't passed the complete BURL-I004 private-store validation; pause
        migration and publication if that privacy evidence fails or becomes
        older than 15 minutes.
      - STOP if a Remote-detached Workspace with prior published history
        attempts replacement migration; reconnect the exact prior Remote for
        coordinated migration or remain in `LocalWithObjectStore`.
    description: Route the replacement through the complete BURL-I004 private-store
      validation before publishing migration intent or copying any Object.
      Publish a durable migration intent with non-secret old/new store
      identities only after that succeeds. Revalidate replacement privacy before
      each publication batch and at least every 15 minutes throughout baseline
      copy, delta reconciliation, and dual-write operation. Privacy failure or
      stale evidence pauses migration and publication, leaves the old store
      authoritative, and keeps local use available. While the intent is active,
      every connected device dual-writes and verifies new Objects before
      publication; devices without replacement credentials pause publication but
      keep local use. Copy and verify the baseline Protected Object closure,
      repeatedly reconcile deltas against complete advertised refs and local
      publication state, then publish a compare-and-swap cutover bound to the
      migration epoch, Workspace revision, and Remote-ref inventory. Keep the
      old store's non-secret fallback descriptor in Workspace authority because
      authoritative deletion is disabled during 0.x. On a replacement miss, use
      securely stored old-store credentials or request them from the Writer;
      alternatively, a connected device that retains those credentials may
      perform the same on-demand backfill. Verify the old bytes by content hash,
      write and verify the replacement, then hydrate from the replacement
    acceptance:
      mode: invariant
      evidence: "Concurrency and interruption tests start publication before, during,
        and after baseline copy. Initial validation rejects a replacement that
        permits any anonymous List, Get, Put, or Delete operation before intent
        or copy. Independent policy-drift fixtures enable each operation during
        baseline and delta work; the next scheduled or prepublication probe
        pauses copying, dual writes, and publication with the old store still
        authoritative. Every publication under the migration intent verifies
        fresh replacement privacy and its Objects in both stores. Delta
        reconciliation reaches the exact bound Workspace and Remote inventories
        before compare-and-swap cutover. A stale epoch, revision, ref inventory,
        privacy result, missing replacement credential, or failed verification
        blocks publication or cutover without changing authority. Restart
        resumes durable progress only after fresh private-store validation;
        successful cutover makes the replacement authoritative and retains the
        old store descriptor as readable fallback without changing Object
        identities. Tests cover a stale publisher after cutover and a
        fresh-device join whose replacement lookup misses: securely supplied
        old-store credentials or a credentialed peer fetch the old object,
        verify its content identity, backfill and verify the replacement, and
        only then hydrate it. No contract claims the fallback can be retired
        during `0.x`."
    flows:
      - flow-object-store-lifecycle
    certainty: assumed
    status: planned
  - id: BURL-N003
    title: Prepare every protected Object for full-local transition
    type: Feature
    effort: 8
    depends_on: []
    category: Correctness
    scope:
      in:
        - rust/src/object_store/**
        - rust/src/api/ffi_api.rs
        - lib/src/components/**
        - test/**
    verification:
      command: cargo test --manifest-path rust/Cargo.toml &&
        ./scripts/check-generated-bindings.sh && flutter test && dart analyze &&
        ./scripts/smoke-shot.sh detach-i012 && git diff --check
      expected: exit 0 with authenticated Remote revalidation, reconnect requirement,
        readiness-token, refusal, and restart tests passing
    stop_conditions:
      - STOP if readiness can be issued while any Protected Object is missing,
        unverified, or based on stale reachability.
      - STOP if preparation can't authenticate online and re-enumerate all
        published Remote refs immediately before closure computation.
      - STOP if `LocalWithObjectStore` can issue readiness before reconnecting
        the exact prior Remote.
    description: Require an attached, authenticated Remote for full-local
      preparation. A Workspace in LocalWithObjectStore first reconnects the
      exact prior Remote. Then re-enumerate every published Remote ref, compute
      the complete Protected Object closure across Remote and local state,
      hydrate and verify every byte, and bind readiness to the ref inventory and
      Workspace revision. Preparation doesn't detach either external connection
    acceptance:
      mode: gherkin
      evidence: >
        ```gherkin

        Given a Workspace has an attached Remote, or has reconnected the exact
        prior Remote after offline detach, and protected Objects may not be
        local

        When burlmd prepares a full-local transition while online and
        authenticated

        Then it freshly enumerates every published Remote ref

        And hydrates and verifies every protected Object reachable from that
        authority

        And returns readiness bound to the Remote-ref inventory and Workspace
        revision

        And leaves both external connections unchanged

        And restart preserves prepared bytes but requires renewed authenticated
        readiness after the ref inventory or Workspace revision advances

        ```
    flows:
      - flow-object-store-lifecycle
    certainty: assumed
    status: planned
  - id: BURL-N004
    title: Detach an unused Object Store without detaching the Remote
    type: Feature
    effort: 5
    depends_on: []
    category: Correctness
    scope:
      in:
        - rust/src/object_store/**
        - rust/src/security/**
        - rust/src/api/ffi_api.rs
        - lib/src/components/**
        - test/**
    verification:
      command: cargo test --manifest-path rust/Cargo.toml &&
        ./scripts/check-generated-bindings.sh && flutter test && dart analyze &&
        ./scripts/smoke-shot.sh unlink-i013 && git diff --check
      expected: exit 0 with empty-protected-set, stale-enumeration refusal, credential
        removal, Remote-preservation, and reconnect tests passing
    stop_conditions:
      - STOP if published history is incomplete, any Protected Object exists,
        the enumerated revision has advanced, or Object Store detach can alter
        Remote attachment/history.
    description: Enumerate every Protected State through the complete published-ref
      inventory, prove the protected Object set is empty at compare-and-swap
      time, remove only the Object Store configuration and local credential,
      keep the private GitHub Remote attached, and permit later Object Store
      reconnection
    acceptance:
      mode: invariant
      evidence: Property and interruption tests cover current state, retained or
        unpublished local history, every fetchable ref from unfiltered Remote
        advertisement, pending reconciliation, and Consolidation. Detach
        succeeds only for a revision-bound empty protected set; it removes the
        local Object Store credential and configuration, preserves the exact
        Remote and Git history, and refuses stale, incomplete, unclassified,
        unfetchable, or nonempty enumeration without changing either connection.
    flows:
      - flow-object-store-lifecycle
    certainty: assumed
    status: planned
