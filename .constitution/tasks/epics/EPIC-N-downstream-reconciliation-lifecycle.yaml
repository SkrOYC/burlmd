    verification:
      command: cargo test --manifest-path rust/Cargo.toml && flutter test && dart
        analyze && ./scripts/smoke-shot.sh remote-k007 && git diff --check
      expected: exit 0 with connect, second-device join, reauthorize,
        public/lost-access pause, sign-out, detach/reconnect, and
        keyboard/Semantics tests passing
    stop_conditions:
      - STOP if authentication gates local writing or UI conflates sign-out with
        detach.
    description: Present device flow, repository selection/provisioning, Object
      prerequisites, optional prepublication Consolidation, initial attachment,
      second-device authorize/select/clone join, reauthorization, privacy
      failure, sign-out, full-local detach, and reconnect through typed
      authoritative states. BURL-N006 and BURL-N007 own the Core behavior; this
      ticket owns their Writer-facing workflows
    acceptance:
      mode: gherkin
      evidence: >
        ```gherkin

        Given a local Workspace in each authorization and attachment state

        When the Writer connects a local Workspace, optionally consolidates
        another local Workspace before publication, joins from a second device,
        signs out, reauthorizes, detaches, reconnects, or restores privacy

        Then local editing remains available

        And the UI shows the exact typed state and valid next actions

        And connection can't publish while Consolidation is active or unresolved

        And public or inaccessible Remote state pauses synchronization

        ```
    flows:
      - flow-auth-handshake
    certainty: assumed
    status: planned
  - id: BURL-N009
    title: Establish layered private GitHub verification
    type: Chore
    effort: 5
    depends_on:
      - BURL-N006
      - BURL-N007
    category: Security
    scope:
      in:
        - .github/workflows/**
        - integration_test/**
        - scripts/**
        - .constitution/reports/**
    verification:
      command: cargo test --manifest-path rust/Cargo.toml && flutter test && dart
        analyze && ./scripts/run-private-github-canary.sh --private-remote
        "$BURLMD_TEST_PRIVATE_REMOTE_URL" --object-endpoint
        "$BURLMD_TEST_S3_ENDPOINT" --cleanup always --output
        .constitution/reports/canary-k008.json &&
        ./scripts/verify-device-authorization-runbook.sh
        --require-human-approval --output
        .constitution/reports/device-auth-k008.json && git diff --check
      expected: hermetic PR tests, scheduled live canary apply/probe/cleanup, and
        manual human-authorized device-flow runbook all pass with isolated
        secret boundaries
    stop_conditions:
      - STOP if canary secrets can reach fork workflows or a browser is
        automated to approve device codes.
    description: Add hermetic protocol tests for every PR, a scheduled live canary
      against dedicated private repositories, and a manual prerelease
      device-authorization runbook with cleanup
    acceptance:
      mode: runbook_probe
      evidence: The exact commands record apply, probe, and cleanup outcomes. PR
        verification runs without live secrets; the scheduled canary creates,
        uses, and cleans dedicated private test state even after injected
        failure; secret contexts exclude forks; and the manual device-flow gate
        records human authorization without browser automation. Each report ends
        in a declared clean state or identifies the bounded residual for manual
        cleanup.
    flows:
      - flow-auth-handshake
    certainty: assumed
    status: planned
