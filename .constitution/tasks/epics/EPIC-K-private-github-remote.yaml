  tech_spec_patchable: []
estimated_diff_lines: 5550
tickets:
  - id: BURL-K009
    title: Register and release-gate the project GitHub App
    type: Security
    effort: 5
    depends_on: []
    category: Security
    scope:
      in:
        - config/github-app.release.toml
        - docs/github-app-installation.md
        - scripts/attest-github-app-token-expiration.sh
        - scripts/verify-github-app-registration.sh
        - .github/workflows/**
        - .constitution/reports/**
    verification:
      command: ./scripts/attest-github-app-token-expiration.sh --client-id
        "$BURLMD_GITHUB_APP_CLIENT_ID" --output
        .constitution/reports/github-app-token-expiration-attestation.json &&
        ./scripts/verify-github-app-registration.sh --manifest
        config/github-app.release.toml --installation-url
        "$BURLMD_GITHUB_APP_INSTALLATION_URL" --expected-client-id
        "$BURLMD_GITHUB_APP_CLIENT_ID" --require-device-flow
        --require-private-repository-permissions --forbid-permission workflows
        --token-expiration-attestation
        .constitution/reports/github-app-token-expiration-attestation.json
        --max-attestation-age-hours 24 --output
        .constitution/reports/github-app-registration.json && git diff --check
      expected: 'exit 0 with a non-placeholder public client ID, reachable
        installation URL, exact versioned Contents/Administration/implicit
        Metadata permissions, no Workflows permission, required versioned REST
        headers, a successful device-code request, a fresh expiring-token
        attestation, and a drift-free release report Original verification
        detail: Run `./scripts/attest-github-app-token-expiration.sh --client-id
        "$BURLMD_GITHUB_APP_CLIENT_ID" --output
        .constitution/reports/github-app-token-expiration-attestation.json`,
        complete the displayed device-flow authorization as the project
        administrator, then run `./scripts/verify-github-app-registration.sh
        --manifest config/github-app.release.toml --installation-url
        "$BURLMD_GITHUB_APP_INSTALLATION_URL" --expected-client-id
        "$BURLMD_GITHUB_APP_CLIENT_ID" --require-device-flow
        --require-private-repository-permissions --forbid-permission workflows
        --token-expiration-attestation
        .constitution/reports/github-app-token-expiration-attestation.json
        --max-attestation-age-hours 24 --output
        .constitution/reports/github-app-registration.json && git diff
        --check`.'
    stop_conditions:
      - STOP if release configuration uses a placeholder client ID, requires a
        client secret/private key in the binary or CI, omits the public
        installation URL, or differs from the versioned permission manifest.
    description: Register the project-owned GitHub App through the administrator
      runbook, publish its installation URL, version its repository and account
      permissions, enable device flow and expiring user tokens, and inject the
      public release client ID. Automate public metadata, installation URL,
      permission, client-ID, and device-code checks. Require a fresh
      administrator-approved device-flow attestation for token expiration before
      release
    acceptance:
      mode: runbook_probe
      evidence: "The administrator runbook records registration and ownership without
        exporting secrets. The automated probe reads public App metadata and
        proves the installation URL, release client ID, exact
        Contents/Administration/implicit Metadata permissions, absence of
        Workflows permission, manifest version, required `Accept` and
        `X-GitHub-Api-Version: 2026-03-10` REST headers, and a successful
        device-code request. A human-approved device flow must issue
        `expires_in`, `refresh_token`, and `refresh_token_expires_in`. The
        attestation records their presence and lifetimes but never their values,
        securely discards the tokens, and expires after the 24-hour freshness
        window. Missing or stale evidence blocks BURL-K001 and release
        verification."
    flows:
      - flow-auth-handshake
    certainty: assumed
    status: planned
  - id: BURL-K001
    title: Replace legacy OAuth with GitHub App device flow
    type: Security
    effort: 8
    depends_on:
      - BURL-K009
    category: Security
    scope:
      in:
        - rust/src/api/auth.rs
        - rust/src/api/ffi_api.rs
        - lib/src/providers/auth_provider.dart
        - lib/src/screens/login.dart
        - test/providers/auth_provider_test.dart
        - test/screens/login_test.dart
    verification:
      command: cargo test --manifest-path rust/Cargo.toml &&
        ./scripts/check-generated-bindings.sh && flutter test && dart analyze &&
        ./scripts/smoke-shot.sh auth-k001 && git diff --check && ! rg -n
        '\[DEBUG-' lib rust test scripts
      expected: exit 0 with device-code, polling, slowdown, denial, cancellation,
        bad-code restart, both documented expiry identifiers, unverified-email
        guidance, and every documented fatal device-flow error contract test
        passing
    stop_conditions:
      - STOP if implementation needs an embedded client secret, App private key,
        callback listener, or automated browser approval.
    description: Implement the accepted GitHub App device-code request and polling
      contract, expose verification URI/code and typed progress, and remove the
      old PKCE redirect/client-secret path. Treat both expired_token and
      GitHub's documented token_expired wording as expiry responses that discard
      the code and restart device authorization
    acceptance:
      mode: contract_test
      evidence: Protocol fixtures verify the pinned GitHub API contract, polling
        interval and `slow_down` handling, terminal denial, cancellation, public
        client ID only, and absence of every superseded redirect/secret path.
        Success requires the complete expiring token pair, both lifetimes, empty
        `scope`, and bearer `token_type` in JSON. `bad_verification_code`,
        `expired_token`, and `token_expired` each discard the unusable code and
        restart device flow with a fresh code. `unverified_user_email` stops
        polling and guides the Writer to verify their primary email before
        restarting. `unsupported_grant_type`, `incorrect_client_credentials`,
        `incorrect_device_code`, and `device_flow_disabled` stop polling
        immediately and surface typed configuration or protocol failures.
    flows:
      - flow-auth-handshake
    certainty: assumed
    status: planned
  - id: BURL-K002
    title: Persist, refresh, and revoke the user token pair safely
    type: Security
    effort: 8
    depends_on:
      - BURL-K001
    category: Security
    scope:
      in:
        - rust/src/api/auth.rs
        - rust/src/security/**
        - rust/src/api/ffi_api.rs
        - lib/src/providers/auth_provider.dart
        - test/**
    verification:
      command: cargo test --manifest-path rust/Cargo.toml &&
        ./scripts/check-generated-bindings.sh && flutter test && dart analyze &&
        ./scripts/smoke-shot.sh token-k002 && git diff --check
      expected: exit 0 with secure-store, pre-expiry refresh, concurrent refresh,
        atomic rotation, one-401 retry, second-401 refusal, transient failure,
        bad-refresh, fatal refresh configuration/protocol, unverified-email, and
        sign-out tests passing
    stop_conditions:
      - STOP if tokens transit persistent Dart state, logs, diagnostics, Git
        config, a remote URL, or Workspace files.
    description: Store expiring access/refresh tokens only in Platform secure
      storage, serialize refresh, atomically rotate the pair before expiry or
      after one authenticated 401, replay the failed operation at most once,
      treat a second 401 as authentication-required, and preserve credentials on
      transient failure. A definitive bad refresh token restarts device flow.
      unsupported_grant_type and incorrect_client_credentials preserve the
      current pair, stop refresh, and surface typed configuration/protocol
      failure without retry. unverified_user_email preserves the pair, prompts
      the Writer to verify the primary email, and then restarts device flow.
      Implement sign-out without detach
    acceptance:
      mode: invariant
      evidence: At most one refresh runs. JSON fixtures require `access_token`,
        `expires_in`, `refresh_token`, `refresh_token_expires_in`, empty
        `scope`, and bearer `token_type` before rotation. Missing, malformed, or
        form-encoded success responses preserve the earlier pair and fail as
        protocol errors. Readers observe either the old valid pair or the new
        complete pair; access-token expiry refreshes proactively; one
        authenticated `401` causes exactly one refresh and one replay; a second
        `401` stops as authentication-required; transient errors retain the pair
        and local operation; a definitively bad refresh returns to
        authorization. `unsupported_grant_type` and
        `incorrect_client_credentials` never retry and expose distinct typed
        configuration/protocol outcomes. `unverified_user_email` exposes Writer
        guidance and restarts only after verification. Sign-out removes
        credentials but preserves Workspace Remote attachment and history.
    flows:
      - flow-auth-handshake
    certainty: assumed
    status: planned
  - id: BURL-K003
    title: Discover installations and select or provision a private repository
    type: Feature
    effort: 8
    depends_on:
      - BURL-K002
    category: Security
    scope:
      in:
        - rust/src/provider/**
        - rust/src/api/ffi_api.rs
        - lib/src/components/**
        - test/**
    verification:
      command: cargo test --manifest-path rust/Cargo.toml &&
        ./scripts/check-generated-bindings.sh && flutter test && dart analyze &&
        ./scripts/smoke-shot.sh repo-k003 && git diff --check && ! rg -n
        '\[DEBUG-' lib rust test scripts
      expected: exit 0 with installation, permission, private/empty selection,
        provisioning, and coverage-recheck tests passing
    stop_conditions:
      - STOP if repository privacy, emptiness, App installation coverage,
        Contents write, or required Administration permission isn't established.
    description: List App installations and accessible repositories, select an
      eligible private empty repository or provision one privately, explain
      Administration write, and pause until the installation covers a new
      repository
    acceptance:
      mode: contract_test
      evidence: "GitHub API fixtures cover user and organization installations,
        insufficient permission, selected-repository coverage, private
        provisioning, public/nonempty refusal, and rate limits. Every REST
        fixture asserts `Accept: application/vnd.github+json` and
        `X-GitHub-Api-Version: 2026-03-10`; OAuth device and token endpoints
        remain outside the REST-header rule."
    flows:
      - flow-auth-handshake
    certainty: assumed
    status: planned
  - id: BURL-K004
    title: Attach and publish an existing local Workspace
    type: Feature
    effort: 8
    depends_on:
      - BURL-K003
    category: Feature-Evolution
    scope:
      in:
        - rust/src/git/operations.rs
        - rust/src/provider/**
        - rust/src/sync/**
        - rust/src/api/ffi_api.rs
        - test/**
        - integration_test/connect_consolidation_flow_test.dart
    verification:
      command: cargo test --manifest-path rust/Cargo.toml &&
        ./scripts/check-generated-bindings.sh && flutter test
        integration_test/connect_consolidation_flow_test.dart -d linux && dart
        analyze && git diff --check
      expected: exit 0 with prerequisite, workflow-history refusal, optional
        prepublication Consolidation, ephemeral credential, publish, rollback,
        and privacy-recheck tests passing
    stop_conditions:
      - STOP if protected Objects aren't verified in the Object Store or Git
        credentials would persist beyond one process invocation.
      - STOP if any commit reachable from a local publication ref contains
        `.github/workflows/**`; keep the Workspace local and offer Consolidation
        into a clean Workspace.
    description: Recheck private/empty eligibility, Object readiness, and the
      complete local publication closure, then enter the connection Preparing
      state. Refuse workflow-bearing history without requesting Workflows
      permission. Before initial publication, let the Writer either continue
      with the active Workspace or complete the typed Consolidation workflow
      from Epic J. Attach the Remote without rehoming local state, publish with
      an ephemeral user token, and persist attachment only after success
    acceptance:
      mode: invariant
      evidence: No Note history publishes before protected Objects verify and the
        Writer completes or declines Consolidation. Generated refs prove that a
        workflow path in current or historical commits refuses publication while
        local use remains available. The connection integration test drives
        `Preparing → Consolidating → Preparing → Connected`, including a
        collision decision, and proves the source stays unchanged. It asserts
        that the second preparation phase rechecks Object/privacy prerequisites
        and that initial publication completes before `Connected`. Git receives
        credentials only through the ephemeral adapter. Failure leaves the local
        Workspace and history intact and unattached; success records the exact
        private Remote without credentials in configuration or URL.
    flows:
      - flow-auth-handshake
      - flow-sync-push
    certainty: assumed
    status: planned
