id: K
name: private github remote
kind: product
capabilities: [CAP-054, CAP-061, CAP-062, CAP-063, CAP-067, CAP-068, CAP-069, CAP-073, CAP-070]
depends_on: [G, H, I, J, M]
scope:
  paths: [config/github-app.release.toml, docs/github-app-installation.md, scripts/attest-github-app-token-expiration.sh, scripts/verify-github-app-registration.sh, ".github/workflows/**", ".constitution/reports/**", rust/src/api/auth.rs, rust/src/api/ffi_api.rs, lib/src/providers/auth_provider.dart, lib/src/screens/login.dart, test/providers/auth_provider_test.dart, test/screens/login_test.dart, "rust/src/security/**", "test/**", "rust/src/provider/**", "lib/src/components/**", rust/src/git/operations.rs, "rust/src/sync/**", integration_test/connect_consolidation_flow_test.dart, rust/src/workspace/bootstrap.rs, "rust/src/object_store/**", scripts/verify-second-device-join.sh, lib/src/providers/workspace_provider.dart, lib/src/screens/workspace.dart, "lib/l10n/**", "integration_test/**", "scripts/**"]
  tech_spec_patchable: []
estimated_diff_lines: 10000
tickets:
  - id: BURL-K009
    title: Register and release-gate the project GitHub App
    type: Security
    effort: 5
    depends_on: []
    category: Security
    scope:
      in: [config/github-app.release.toml, docs/github-app-installation.md, scripts/attest-github-app-token-expiration.sh, scripts/verify-github-app-registration.sh, ".github/workflows/**", ".constitution/reports/**"]
    verification:
      command: "./scripts/attest-github-app-token-expiration.sh --client-id \"$BURLMD_GITHUB_APP_CLIENT_ID\" --output .constitution/reports/github-app-token-expiration-attestation.json"
      expected: "exit 0 with a non-placeholder public client ID, reachable installation URL, exact versioned Contents/Administration/implicit Metadata permissions, no Workflows permission, required versioned REST headers, a successful device-code request, a fresh expiring-token attestation, and a drift-free release report Original verification detail: Run `./scripts/attest-github-app-token-expiration.sh --client-id \"$BURLMD_GITHUB_APP_CLIENT_ID\" --output .constitution/reports/github-app-token-expiration-attestation.json`, complete the displayed device-flow authorization as the project administrator, then run `./scripts/verify-github-app-registration.sh --manifest config/github-app.release.toml --installation-url \"$BURLMD_GITHUB_APP_INSTALLATION_URL\" --expected-client-id \"$BURLMD_GITHUB_APP_CLIENT_ID\" --require-device-flow --require-private-repository-permissions --forbid-permission workflows --token-expiration-attestation .constitution/reports/github-app-token-expiration-attestation.json --max-attestation-age-hours 24 --output .constitution/reports/github-app-registration.json && git diff --check`."
    stop_conditions: ["STOP if release configuration uses a placeholder client ID, requires a client secret/private key in the binary or CI, omits the public installation URL, or differs from the versioned permission manifest."]
    description: "Register the project-owned GitHub App through the administrator runbook, publish its installation URL, version its repository and account permissions, enable device flow and expiring user tokens, and inject the public release client ID. Automate public metadata, installation URL, permission, client-ID, and device-code checks. Require a fresh administrator-approved device-flow attestation for token expiration before release"
    acceptance:
      mode: runbook_probe
      evidence: "The administrator runbook records registration and ownership without exporting secrets. The automated probe reads public App metadata and proves the installation URL, release client ID, exact Contents/Administration/implicit Metadata permissions, absence of Workflows permission, manifest version, required `Accept` and `X-GitHub-Api-Version: 2026-03-10` REST headers, and a successful device-code request. A human-approved device flow must issue `expires_in`, `refresh_token`, and `refresh_token_expires_in`. The attestation records their presence and lifetimes but never their values, securely discards the tokens, and expires after the 24-hour freshness window. Missing or stale evidence blocks BURL-K001 and release verification."
    flows: [flow-auth-handshake]
    certainty: assumed
    status: planned
  - id: BURL-K001
    title: Replace legacy OAuth with GitHub App device flow
    type: Security
    effort: 8
    depends_on: [BURL-K009]
    category: Security
    scope:
      in: [rust/src/api/auth.rs, rust/src/api/ffi_api.rs, lib/src/providers/auth_provider.dart, lib/src/screens/login.dart, test/providers/auth_provider_test.dart, test/screens/login_test.dart]
    verification:
      command: "cargo test --manifest-path rust/Cargo.toml && ./scripts/check-generated-bindings.sh && flutter test && dart analyze && ./scripts/smoke-shot.sh auth-k001 && git diff --check && ! rg -n '\\[DEBUG-' lib rust test scripts"
      expected: "exit 0 with device-code, polling, slowdown, denial, cancellation, bad-code restart, both documented expiry identifiers, unverified-email guidance, and every documented fatal device-flow error contract test passing"
    stop_conditions: ["STOP if implementation needs an embedded client secret, App private key, callback listener, or automated browser approval."]
    description: "Implement the accepted GitHub App device-code request and polling contract, expose verification URI/code and typed progress, and remove the old PKCE redirect/client-secret path. Treat both expired_token and GitHub's documented token_expired wording as expiry responses that discard the code and restart device authorization"
    acceptance:
      mode: contract_test
      evidence: "Protocol fixtures verify the pinned GitHub API contract, polling interval and `slow_down` handling, terminal denial, cancellation, public client ID only, and absence of every superseded redirect/secret path. Success requires the complete expiring token pair, both lifetimes, empty `scope`, and bearer `token_type` in JSON. `bad_verification_code`, `expired_token`, and `token_expired` each discard the unusable code and restart device flow with a fresh code. `unverified_user_email` stops polling and guides the Writer to verify their primary email before restarting. `unsupported_grant_type`, `incorrect_client_credentials`, `incorrect_device_code`, and `device_flow_disabled` stop polling immediately and surface typed configuration or protocol failures."
    flows: [flow-auth-handshake]
    certainty: assumed
    status: planned
  - id: BURL-K002
    title: "Persist, refresh, and revoke the user token pair safely"
    type: Security
    effort: 8
    depends_on: [BURL-K001]
    category: Security
    scope:
      in: [rust/src/api/auth.rs, "rust/src/security/**", rust/src/api/ffi_api.rs, lib/src/providers/auth_provider.dart, "test/**"]
    verification:
      command: "cargo test --manifest-path rust/Cargo.toml && ./scripts/check-generated-bindings.sh && flutter test && dart analyze && ./scripts/smoke-shot.sh token-k002 && git diff --check"
      expected: "exit 0 with secure-store, pre-expiry refresh, concurrent refresh, atomic rotation, one-401 retry, second-401 refusal, transient failure, bad-refresh, fatal refresh configuration/protocol, unverified-email, and sign-out tests passing"
    stop_conditions: ["STOP if tokens transit persistent Dart state, logs, diagnostics, Git config, a remote URL, or Workspace files."]
    description: "Store expiring access/refresh tokens only in Platform secure storage, serialize refresh, atomically rotate the pair before expiry or after one authenticated 401, replay the failed operation at most once, treat a second 401 as authentication-required, and preserve credentials on transient failure. A definitive bad refresh token restarts device flow. unsupported_grant_type and incorrect_client_credentials preserve the current pair, stop refresh, and surface typed configuration/protocol failure without retry. unverified_user_email preserves the pair, prompts the Writer to verify the primary email, and then restarts device flow. Implement sign-out without detach"
    acceptance:
      mode: invariant
      evidence: "At most one refresh runs. JSON fixtures require `access_token`, `expires_in`, `refresh_token`, `refresh_token_expires_in`, empty `scope`, and bearer `token_type` before rotation. Missing, malformed, or form-encoded success responses preserve the earlier pair and fail as protocol errors. Readers observe either the old valid pair or the new complete pair; access-token expiry refreshes proactively; one authenticated `401` causes exactly one refresh and one replay; a second `401` stops as authentication-required; transient errors retain the pair and local operation; a definitively bad refresh returns to authorization. `unsupported_grant_type` and `incorrect_client_credentials` never retry and expose distinct typed configuration/protocol outcomes. `unverified_user_email` exposes Writer guidance and restarts only after verification. Sign-out removes credentials but preserves Workspace Remote attachment and history."
    flows: [flow-auth-handshake]
    certainty: assumed
    status: planned
  - id: BURL-K003
    title: Discover installations and select or provision a private repository
    type: Feature
    effort: 8
    depends_on: [BURL-K002]
    category: Security
    scope:
      in: ["rust/src/provider/**", rust/src/api/ffi_api.rs, "lib/src/components/**", "test/**"]
    verification:
      command: "cargo test --manifest-path rust/Cargo.toml && ./scripts/check-generated-bindings.sh && flutter test && dart analyze && ./scripts/smoke-shot.sh repo-k003 && git diff --check && ! rg -n '\\[DEBUG-' lib rust test scripts"
      expected: "exit 0 with installation, permission, private/empty selection, provisioning, and coverage-recheck tests passing"
    stop_conditions: ["STOP if repository privacy, emptiness, App installation coverage, Contents write, or required Administration permission isn't established."]
    description: "List App installations and accessible repositories, select an eligible private empty repository or provision one privately, explain Administration write, and pause until the installation covers a new repository"
    acceptance:
      mode: contract_test
      evidence: "GitHub API fixtures cover user and organization installations, insufficient permission, selected-repository coverage, private provisioning, public/nonempty refusal, and rate limits. Every REST fixture asserts `Accept: application/vnd.github+json` and `X-GitHub-Api-Version: 2026-03-10`; OAuth device and token endpoints remain outside the REST-header rule."
    flows: [flow-auth-handshake]
    certainty: assumed
    status: planned
  - id: BURL-K004
    title: Attach and publish an existing local Workspace
    type: Feature
    effort: 8
    depends_on: [BURL-K003]
    category: Feature-Evolution
    scope:
      in: [rust/src/git/operations.rs, "rust/src/provider/**", "rust/src/sync/**", rust/src/api/ffi_api.rs, "test/**", integration_test/connect_consolidation_flow_test.dart]
    verification:
      command: "cargo test --manifest-path rust/Cargo.toml && ./scripts/check-generated-bindings.sh && flutter test integration_test/connect_consolidation_flow_test.dart -d linux && dart analyze && git diff --check"
      expected: "exit 0 with prerequisite, workflow-history refusal, optional prepublication Consolidation, ephemeral credential, publish, rollback, and privacy-recheck tests passing"
    stop_conditions: ["STOP if protected Objects aren't verified in the Object Store or Git credentials would persist beyond one process invocation.", "STOP if any commit reachable from a local publication ref contains `.github/workflows/**`; keep the Workspace local and offer Consolidation into a clean Workspace."]
    description: "Recheck private/empty eligibility, Object readiness, and the complete local publication closure, then enter the connection Preparing state. Refuse workflow-bearing history without requesting Workflows permission. Before initial publication, let the Writer either continue with the active Workspace or complete the typed Consolidation workflow from Epic J. Attach the Remote without rehoming local state, publish with an ephemeral user token, and persist attachment only after success"
    acceptance:
      mode: invariant
      evidence: "No Note history publishes before protected Objects verify and the Writer completes or declines Consolidation. Generated refs prove that a workflow path in current or historical commits refuses publication while local use remains available. The connection integration test drives `Preparing → Consolidating → Preparing → Connected`, including a collision decision, and proves the source stays unchanged. It asserts that the second preparation phase rechecks Object/privacy prerequisites and that initial publication completes before `Connected`. Git receives credentials only through the ephemeral adapter. Failure leaves the local Workspace and history intact and unattached; success records the exact private Remote without credentials in configuration or URL."
    flows: [flow-auth-handshake, flow-sync-push]
    certainty: assumed
    status: planned
  - id: BURL-K005
    title: Join a connected Workspace on another device
    type: Feature
    effort: 8
    depends_on: [BURL-K003]
    category: Feature-Evolution
    scope:
      in: [rust/src/workspace/bootstrap.rs, rust/src/git/operations.rs, "rust/src/provider/**", "rust/src/object_store/**", rust/src/api/ffi_api.rs, scripts/verify-second-device-join.sh, "test/**"]
    verification:
      command: "cargo test --manifest-path rust/Cargo.toml && ./scripts/check-generated-bindings.sh && dart analyze && ./scripts/verify-second-device-join.sh --private-remote \"$BURLMD_TEST_PRIVATE_REMOTE_URL\" --object-endpoint \"$BURLMD_TEST_S3_ENDPOINT\" --output target/runbooks/clone-k005.json && git diff --check"
      expected: "exit 0 with empty-destination, live clone, preflight, index, Object configuration, migration fallback onboarding, immediate text access, and progressive hydration probes passing"
    stop_conditions: ["STOP if destination isn't empty/absent, Remote isn't private/accessible, asset-bearing history lacks a verified Object Store configuration, or a retained migration fallback can't be credentialed or serviced by an already credentialed peer."]
    description: "Authorize, select an accessible private Remote, clone into a safe destination, run canonical preflight/bootstrap, configure authoritative replacement Object access, and detect any retained old-store fallback descriptor. Store supplied fallback credentials only in secure storage; otherwise allow a connected credentialed peer to service verified on-demand backfill. Open text promptly and hydrate active Assets progressively from the replacement, invoking the BURL-I011 fallback path on a verified replacement miss"
    acceptance:
      mode: runbook_probe
      evidence: "The exact runbook command starts from a clean second-device state, joins the isolated private Remote, and reaches an authoritative local Workspace with full history and index, immediate Note editing, and progressive verified Asset hydration. A migration fixture proves a replacement miss invokes the retained old-store fallback through securely supplied credentials or a credentialed peer, verifies the fetched content hash, backfills and verifies the replacement, and hydrates only from that replacement. Its machine-readable log proves no source archive mutation, no credential persisted in the clone, and bounded cleanup of test state."
    flows: [flow-auth-handshake]
    certainty: assumed
    status: planned
  - id: BURL-K006
    title: "Separate sign-out, detach, reconnect, and full-local transition"
    type: Feature
    effort: 8
    depends_on: [BURL-K004]
    category: Correctness
    scope:
      in: ["rust/src/sync/**", rust/src/git/operations.rs, "rust/src/object_store/**", rust/src/api/ffi_api.rs, "test/**"]
    verification:
      command: "cargo test --manifest-path rust/Cargo.toml && ./scripts/check-generated-bindings.sh && dart analyze && git diff --check"
      expected: "exit 0 with offline transition to local-with-store, required reconnect before retained-store removal, online full-local transition, hydration refusal, and exact-history preservation tests passing"
    stop_conditions: ["STOP if detach deletes history or Objects, or can leave an asset-bearing Workspace inconsistently attached.", "STOP if a full-local transition relies on cached Remote refs, stale readiness, or no authenticated online Remote revalidation.", "STOP if removing the Object Store from `LocalWithObjectStore` can proceed without reconnecting the exact prior Remote and obtaining fresh authenticated ref/revision-bound readiness from BURL-I012."]
    description: "Keep sign-out credential-only. Offline Remote detachment moves to LocalWithObjectStore and retains Object Store configuration. From that state, reconnect the exact prior Remote before either resuming publication or returning fully local. For a full-local transition, authenticate online, enumerate all published refs again, hydrate and verify the resulting Protected Object closure, and consume the ref/revision-bound readiness atomically before detaching both external stores. Never delete remote Object bytes or rewrite history"
    acceptance:
      mode: invariant
      evidence: "Sign-out preserves attachment. Offline detachment removes only local Remote bookkeeping, enters `LocalWithObjectStore`, retains the Object Store, and preserves local commits. That state can't remove the retained store directly. Reconnecting the exact prior Remote restores publication without history rewrite or allows a full-local transition through authenticated online Remote-ref revalidation immediately before hydration readiness and compare-and-swap detach. The transition refuses offline, stale, incomplete, or advanced ref evidence. Success retains all protected bytes and deletes no authoritative remote Object."
    flows: [flow-auth-handshake, flow-object-store-lifecycle]
    certainty: assumed
    status: planned
  - id: BURL-K007
    title: "Integrate Remote settings, privacy, and authorization states"
    type: Feature
    effort: 8
    depends_on: [BURL-K004, BURL-K005, BURL-K006]
    category: Feature-Evolution
    scope:
      in: ["lib/src/components/**", lib/src/providers/auth_provider.dart, lib/src/providers/workspace_provider.dart, lib/src/screens/workspace.dart, "lib/l10n/**", "test/**"]
    verification:
      command: "cargo test --manifest-path rust/Cargo.toml && flutter test && dart analyze && ./scripts/smoke-shot.sh remote-k007 && git diff --check"
      expected: "exit 0 with connect, second-device join, reauthorize, public/lost-access pause, sign-out, detach/reconnect, and keyboard/Semantics tests passing"
    stop_conditions: [STOP if authentication gates local writing or UI conflates sign-out with detach.]
    description: "Present device flow, repository selection/provisioning, Object prerequisites, optional prepublication Consolidation, initial attachment, second-device authorize/select/clone join, reauthorization, privacy failure, sign-out, full-local detach, and reconnect through typed authoritative states. BURL-K005 and BURL-K006 own the Core behavior; this ticket owns their Writer-facing workflows"
    acceptance:
      mode: gherkin
      evidence: |
        ```gherkin
        Given a local Workspace in each authorization and attachment state
        When the Writer connects a local Workspace, optionally consolidates another local Workspace before publication, joins from a second device, signs out, reauthorizes, detaches, reconnects, or restores privacy
        Then local editing remains available
        And the UI shows the exact typed state and valid next actions
        And connection can't publish while Consolidation is active or unresolved
        And public or inaccessible Remote state pauses synchronization
        ```
    flows: [flow-auth-handshake]
    certainty: assumed
    status: planned
  - id: BURL-K008
    title: Establish layered private GitHub verification
    type: Chore
    effort: 5
    depends_on: [BURL-K005, BURL-K006]
    category: Security
    scope:
      in: [".github/workflows/**", "integration_test/**", "scripts/**", ".constitution/reports/**"]
    verification:
      command: "cargo test --manifest-path rust/Cargo.toml && flutter test && dart analyze && ./scripts/run-private-github-canary.sh --private-remote \"$BURLMD_TEST_PRIVATE_REMOTE_URL\" --object-endpoint \"$BURLMD_TEST_S3_ENDPOINT\" --cleanup always --output .constitution/reports/canary-k008.json && ./scripts/verify-device-authorization-runbook.sh --require-human-approval --output .constitution/reports/device-auth-k008.json && git diff --check"
      expected: "hermetic PR tests, scheduled live canary apply/probe/cleanup, and manual human-authorized device-flow runbook all pass with isolated secret boundaries"
    stop_conditions: [STOP if canary secrets can reach fork workflows or a browser is automated to approve device codes.]
    description: "Add hermetic protocol tests for every PR, a scheduled live canary against dedicated private repositories, and a manual prerelease device-authorization runbook with cleanup"
    acceptance:
      mode: runbook_probe
      evidence: "The exact commands record apply, probe, and cleanup outcomes. PR verification runs without live secrets; the scheduled canary creates, uses, and cleans dedicated private test state even after injected failure; secret contexts exclude forks; and the manual device-flow gate records human authorization without browser automation. Each report ends in a declared clean state or identifies the bounded residual for manual cleanup."
    flows: [flow-auth-handshake]
    certainty: assumed
    status: planned
