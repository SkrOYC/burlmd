  - id: BURL-M004
    title: Implement deterministic nightly PRD meters
    type: Chore
    effort: 8
    depends_on: [BURL-M016]
    category: Perf
    scope:
      in: ["rust/benches/**", "integration_test/**", "scripts/**", ".github/workflows/**", ".constitution/reports/**"]
