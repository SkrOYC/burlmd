    verification:
      command: "cargo fmt --manifest-path rust/Cargo.toml -- --check && cargo clippy --workspace --all-targets --all-features --manifest-path rust/Cargo.toml -- -D warnings && cargo test --manifest-path rust/Cargo.toml && dart format --output=none --set-exit-if-changed lib test test_driver integration_test && ./scripts/check-generated-bindings.sh && flutter test && dart analyze && ! rg -n '\\[DEBUG-' lib rust test scripts && actionlint && ./scripts/assert-ci-matrix.sh --workflow .github/workflows/ci.yml --require-runner ubuntu-24.04 --require-runner macos-26 --require-runner macos-15 --require-role-schema .constitution/tech-spec/contracts/ci-role-evidence.schema.json --require-aggregate-schema .constitution/tech-spec/contracts/ci-evidence.schema.json && ./scripts/assert-managed-evidence-isolation.sh --contract .constitution/tech-spec/contracts/provisional-spikes.toml --sandbox bubblewrap --expected-version 0.11.2 && git diff --check"
      expected: "local validation exits 0; the reviewed implementation merge establishes TRUST_ANCHOR_SHA; all three roles finish their assigned common-functional, analysis, integration, protocol, and security classes without credential access; Linux also finishes generated-binding and managed-isolation classes; no role claims performance or visual evidence; the dedicated evidence pull request contains only .constitution/evidence/BURL-M003/managed-evidence.json, completion.md, and manifest.yaml and merges after independent review"
    stop_conditions: ["STOP if `BURL-M015` isn't committed, validated, and independently reviewed in `chore/epic-m-ci-foundation` or the branch wasn't created from merged `master`.", "STOP if implementation imports or cherry-picks from the unmerged Epic G branch. Implement the accepted CI and headless contracts from merged `master`; later surgical replay must preserve this merged foundation.", "STOP if any gate invokes `scripts/check-generated-bindings.sh` before this ticket implements it or if the checker changes either generated surface from its precheck state on any exit path.", "STOP if any third-party action isn't pinned to the full Stage 3 commit SHA or a role uses ambient repository toolchains instead of repository locks.", "STOP if private/internal attestation isn't available; emit `attestation-unavailable` and reject the aggregate without a hash-only fallback.", "STOP if candidate code defines expected identity, the managed-evidence launcher, or a signer workflow; if validation uses a pull-request merge revision, a dynamic local-workflow `uses` expression, or a self-hosted runner; or if identity doesn't separate trust anchor, workflow signer, tested source, base, and later evidence state.", "STOP if the implementation hasn't completed local, milestone, and pull-request review before its rebase merge; the launcher isn't running from the clean merged anchor; or `master` differs on any trusted control path.", "STOP if the evidence pull request changes anything except `.constitution/evidence/BURL-M003/managed-evidence.json`, `.constitution/evidence/BURL-M003/completion.md`, and `.constitution/evidence/BURL-M003/manifest.yaml`, lacks independent review, or hasn't merged. `BURL-M003` remains incomplete until that merge.", "STOP if a role bundle omits any manifest-named result, log, raw measurement, or handoff, or if any bundled byte fails its size or SHA-256 check.", "STOP if a role isn't exactly a successful `candidate` job followed by a fresh `seal` job, candidate has OIDC, attestation, or Actions permission, seal doesn't exclusively own signing authority, or candidate bytes execute in the sealing environment.", "STOP if Linux candidate code does not run through `env -i` in Bubblewrap `0.11.2` with a private PID namespace, its teardown lock cannot reject a surviving double-fork probe, or the implementation treats hosted macOS bounded cleanup as a universal containment or zero-survivor proof.", "STOP if a sealing receipt claims final job state, lacks `job.check_run_id`, or is stored inside the sealed bundle that it hashes. Only the post-completion coordinator may construct `origin.sealingJob` after the job API reports one matching completed successful job.", "STOP if a pinned upload action digest isn't bare lowercase 64-hex or if a REST or aggregate digest isn't exactly `sha256:` plus that action output.", "STOP if `artifactNonce` isn't the exact lowercase 32-hex suffix of `runIdentity`, an artifact name contains a forbidden character, or an expected, candidate, or sealed artifact is missing, duplicate, extra, pre-uploaded, or substituted.", "STOP if `run` accepts a managed Spike without staging verified role contents, running its declared coordinator steps, and publishing a valid authoritative machine result.", "STOP if a candidate command receives `GH_TOKEN`, `GITHUB_TOKEN`, OIDC request capability, an ambient credential or configuration path, or an inherited credential descriptor.", "STOP if coordinator preparation begins after authentication, uses an unlocked input, or doesn't record and revalidate the executable and closure identity.", "STOP if Bubblewrap `0.11.2` isn't provided by the locked Linux environment, its namespace or network probe fails, the coordinator sees any credential canary or forbidden client, an input is writable, or anything except its output is writable. There is no credential-clearing-only fallback.", "STOP if the bootstrap profile claims performance, Linux platform-regression, or authoritative macOS visual evidence. Those obligations belong to later benchmark, shell, and release gates.", "STOP if the Flutter Rust Bridge generator, Rust crate, or Dart package differs from the provisionally authorized `2.12.0` triple. Use that triple only for bootstrap and require revalidation after final Stage 3."]
    description: |
      Add one trusted workflow_dispatch caller and three distinct two-job reusable role workflows referenced through static local paths. Each role's candidate job has only contents read permission, checks out the separate tested SHA as data, and runs candidate commands without artifact or signing credentials. Linux uses env -i and Bubblewrap 0.11.2 private PID containment. Hosted macOS performs bounded cleanup only. Every candidate bundle is untrusted. After candidate commands finish, the trusted workflow wrapper uses only its job-scoped artifact runtime authority to upload the handoff. Its dependent seal job starts on a fresh environment, never executes candidate bytes, validates identity, candidate job and label, artifact IDs and REST digests, safe archive structure, schemas, and member hashes, and alone receives OIDC and attestation authority. It uploads the sealed bundle before it writes a separate attested receipt. The receipt records job.check_run_id, immutable identities, and normalized expected, candidate, and sealed digest pairs, but no final job result. After the attempt completes, managed-evidence.sh resolves that locator through the job API and constructs aggregate origin.sealingJob only for a completed successful match. Implement the collect and run forms, the non-mutating generated-binding checker, and the managed-evidence isolation fixture. Add Linux-only Bubblewrap 0.11.2 through the locked Nix environment. Reproduce the specified behavior without importing the Epic G branch. Pin actions/checkout to fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09, cachix/install-nix-action to 13d8dd58da0234aa297dedd986986ccb8e7f3e24, actions/upload-artifact to 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a, actions/download-artifact to 3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c, and actions/attest to 1e69f48acb82d1966a394da916b4c1698aa569d6. Generate authoritative trust-anchor, workflow-signer, tested-source, base, release, build, corpus, run, artifact-nonce, required-role, and signer identity before fan-out. The coordinator verifies the post-completion jobs, unique artifacts, receipt and sealed-bundle attestations, canonical digest conversion, provenance, and bundled files before writing an accepted or rejected aggregate

      Complete these steps in order:
        1. Implement `scripts/check-generated-bindings.sh` from the exact Stage 3 checker contract. Test clean, stale, generator-failure, added-file, removed-file, premodified-file, and interruption cases. Every case must leave `rust/src/frb_generated.rs` and `lib/src/rust/**` byte-identical to their precheck state.
        2. Implement `scripts/assert-managed-evidence-isolation.sh` from the exact Stage 3 fixture contract. The trusted launcher must enumerate and close nonallowlisted descriptors; include a non-`CLOEXEC` descriptor canary. Pin Linux-only `pkgs.bubblewrap` from the locked Nixpkgs revision in `devenv.nix`, and require Bubblewrap `0.11.2` for namespace, network, and filesystem isolation only. Add contract fixtures for the two-job role topology, least-privilege permissions, run-to-artifact nonce derivation, forbidden artifact-name characters, and duplicate or pre-uploaded reserved names. Linux fixtures must run `env -i` candidate code in a private Bubblewrap PID namespace and reject a surviving double-fork probe before upload. Hosted-macOS fixtures must distinguish candidate-command no-privilege execution from the trusted upload wrapper's job-scoped artifact runtime authority. They must prove fresh-job separation, seal-only authority, and no candidate-byte execution in seal. They model a surviving candidate process as untrusted-output corruption or fail-closed upload denial, and reject a universal macOS containment or zero-survivor assertion. Receipt fixtures must reject any final status, conclusion, or completion field. Post-completion fixtures must accept one successful locator match and reject in-progress, failed, missing, duplicate, wrong-job, wrong-label, and self-hosted matches. Digest fixtures must prove bare action output to canonical REST conversion and reject prefix, case, or byte mismatch. In a disposable checkout, run `cargo fmt --manifest-path rust/Cargo.toml -- --check && cargo clippy --workspace --all-targets --all-features --manifest-path rust/Cargo.toml -- -D warnings && cargo test --manifest-path rust/Cargo.toml && dart format --output=none --set-exit-if-changed lib test test_driver integration_test && ./scripts/check-generated-bindings.sh && flutter test && dart analyze && ! rg -n '\[DEBUG-' lib rust test scripts && actionlint && ./scripts/assert-ci-matrix.sh --workflow .github/workflows/ci.yml --require-runner ubuntu-24.04 --require-runner macos-26 --require-runner macos-15 --require-role-schema .constitution/tech-spec/contracts/ci-role-evidence.schema.json --require-aggregate-schema .constitution/tech-spec/contracts/ci-evidence.schema.json && ./scripts/assert-managed-evidence-isolation.sh --contract .constitution/tech-spec/contracts/provisional-spikes.toml --sandbox bubblewrap --expected-version 0.11.2 && git diff --check`.
        3. Commit and independently review the `BURL-M003` milestone on `chore/epic-m-ci-foundation`. Open a ready implementation pull request, obtain independent pull-request review, and rebase-merge it into `master`. Record the resulting full `master` tip as `TRUST_ANCHOR_SHA`; don't treat the ticket as complete.
        4. Create a clean detached `TRUST_ANCHOR_WORKTREE` at `TRUST_ANCHOR_SHA` and create `EVIDENCE_WORKTREE` on `docs/epic-m-ci-evidence` from that merged `master`. Set `BASE_SHA` to the rebased, reviewed `BURL-M015` milestone at the trust anchor's first parent. Run `TRUST_ANCHOR_WORKTREE/scripts/managed-evidence.sh run --ticket BURL-M003 --trust-anchor-sha TRUST_ANCHOR_SHA --source-ref refs/heads/master --tested-source-sha TRUST_ANCHOR_SHA --base-sha BASE_SHA --output EVIDENCE_WORKTREE/.constitution/evidence/BURL-M003/managed-evidence.json && git -C EVIDENCE_WORKTREE diff --check`.
        5. In the minimally privileged Linux `candidate` job, the trusted workflow runs `./scripts/check-generated-bindings.sh && flutter test && dart analyze && flutter test integration_test -d linux -r github && ./scripts/assert-managed-evidence-isolation.sh --contract .constitution/tech-spec/contracts/provisional-spikes.toml --sandbox bubblewrap --expected-version 0.11.2` through `env -i` in its private Bubblewrap PID namespace. It rejects a surviving double-fork probe before upload. On both Apple Silicon macOS roles, it runs `flutter test && dart analyze && flutter test integration_test -d macos -r github`, then performs bounded cleanup of known test processes without claiming universal containment. The dependent `seal` job validates and authenticates the untrusted bundle on a fresh environment with the same fixed role label and never executes candidate bytes.
        6. In `EVIDENCE_WORKTREE`, add `.constitution/evidence/BURL-M003/completion.md` with the anchor SHA, workflow signer SHA, tested-source SHA, run identity, accepted report digest, implementation pull request, and review evidence. Add `.constitution/evidence/BURL-M003/manifest.yaml` with the exact byte counts and SHA-256 digests of `managed-evidence.json` and `completion.md`. Commit exactly those three evidence files. Open, independently review, and merge the ready evidence pull request. Only this merge completes `BURL-M003`.
    acceptance:
      mode: contract_test
      evidence: |
        The `ubuntu-24.04` role provides `common-functional`, `managed-evidence-protocol`, `managed-evidence-security`, `managed-evidence-isolation`, `generated-binding-check`, `static-analysis`, and `desktop-integration`. The Apple Silicon `macos-26` and `macos-15` roles provide `common-functional`, `managed-evidence-protocol`, `managed-evidence-security`, `static-analysis`, and `desktop-integration`. Each role runs the complete Flutter unit suite, analyzer, and desktop integration gate. The evidence records every integration-test file and result and rejects an empty, skipped, or partially discovered suite. The bootstrap profile doesn't include `performance`, `linux-platform-regression`, or `macos-authoritative-visual`. The Linux environment still owns display, compositor, input, process, state directory, and application PID for functional integration without reading the Writer's desktop. Later benchmark, shell, and release tickets own the performance and visual gates.

        The trusted `master` caller invokes `.github/workflows/ci-role-linux-x86-64.yml`, `.github/workflows/ci-role-macos-26-arm64.yml`, and `.github/workflows/ci-role-macos-15-arm64.yml` through static local paths. Each role workflow resolves from `WORKFLOW_SIGNER_SHA` and contains exactly `candidate` and `seal` jobs on separate fresh environments. The clean trust-anchor launcher creates expected identity and verifies that the signer retains every trusted control byte. Identity keeps the trust anchor, signer, tested source, base, `managed:<32hex>` run identity, and its exact 32-hex artifact nonce distinct. Expected, candidate, sealed, and sealing-receipt artifact names use fixed safe templates. The local dispatch token has Actions write permission. Candidate narrows its job permissions to contents read; the fresh non-executing seal alone retains Actions read, contents read, OIDC, and attestations write. Candidate commands can't inherit artifact runtime or signing capabilities. After they finish, the trusted workflow wrapper receives job-scoped artifact runtime authority to upload the untrusted candidate bundle.

        The sealing receipt validates against the Stage 3 raw definition and contains `job.check_run_id` but no status, conclusion, or completion timestamp. After the attempt completes, collection resolves exactly one job API object from that locator and requires `status=completed`, `conclusion=success`, the expected run, attempt, label, hosted environment, and signed sealing provenance. An in-progress, failed, missing, duplicate, or wrong-job match produces a typed rejected report. For every expected, candidate, and sealed artifact, fixtures require the REST `sha256:<hex>` digest to equal `sha256:` plus the pinned action's bare lowercase 64-hex output. Prefix, case, and byte mismatches produce `artifact-digest-mismatch`. Evidence-profile fixtures accept CI bootstrap without performance or visual classes. They reject an unassigned class, a missing assigned class, or a class assigned to the wrong role. Existing role, bundle, nonce, collision, trust-anchor, source-allowlist, coordinator, and aggregation fixtures remain required. Aggregate `accepted` requires all three post-completion role origins and no rejection reason.

        Linux static and integration fixtures prove `env -i` Bubblewrap `0.11.2` PID containment by rejecting a surviving double-fork probe before upload. Hosted-macOS fixtures distinguish candidate-command no-privilege execution from the trusted wrapper's later artifact runtime authority. They prove fresh-job separation, sole seal OIDC and attestation authority, safe validation, and no candidate-byte execution in seal. A surviving candidate process can corrupt untrusted output or cause a fail-closed upload denial. It can't gain seal authority or enter the fresh seal environment. Fixtures reject any universal macOS containment or zero-survivor claim. Accepted evidence authenticates reviewed workflow execution and sealed provenance. It does not prove that arbitrary malicious macOS candidate code is contained or that its untrusted output is truthful. Reviewed source and test contracts remain required.

        Before the ordered gate invokes it, `BURL-M003` creates the missing generated-binding checker. Checker fixtures prove that it snapshots a path-sorted SHA-256 manifest and byte backup for `rust/src/frb_generated.rs` and `lib/src/rust/**`, runs the provisional `2.12.0` generator, and detects every added, removed, or changed generated byte. Clean, stale, generator-failure, premodified-file, and interruption cases restore and verify the exact precheck state before exit. Contract fixtures prove that `collect` and `run` reject extra or missing flags, replace outputs atomically, emit the specified JSON summary, and use exit statuses `0`, `1`, and `2` exactly as Stage 3 defines. Dispatch fixtures require `master`, the exact returned run ID, canonical expected-identity bytes, and separate signer and tested-source SHAs. Managed-Spike fixtures prove that verified manifest members stage only under fixed role directories, coordinator steps use no manual source, and acceptance requires a schema-valid `results.json`. They execute the collector-reconciliation fixture and reject a runner-label mismatch before comparing ordered evidence classes. A non-`CLOEXEC` descriptor canary proves that the trusted launcher closes descriptors before Bubblewrap; namespace and network fixtures remain separate. Packaging fixtures prove that macOS 15 receives the exact macOS 26 archive only through a verified staged role bundle. The workflow never pushes repository content, publishes a release, or receives live product credentials. The implementation review and merge establish the anchor. The dedicated evidence pull request then commits only `.constitution/evidence/BURL-M003/managed-evidence.json`, `.constitution/evidence/BURL-M003/completion.md`, and their digest-bearing `.constitution/evidence/BURL-M003/manifest.yaml`. `BURL-M003` satisfies dependencies only after that reviewed pull request merges. Any trusted-control change repeats the sequence. Final Stage 3 must revalidate the generator triple and generated output before downstream production tickets run.
