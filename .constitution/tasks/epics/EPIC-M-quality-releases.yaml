    stop_conditions: ["STOP if the harness uses ambient Git, omits installed-runtime probes, or infers one Platform result from another.", "STOP if the `BURL-M003` evidence pull request isn't merged or any required role bundle is missing, incomplete, stale, mismatched, corrupt, self-hosted, unauthenticated, or rejected.", "STOP if post-completion API observation doesn't resolve the receipt locator to one completed successful sealing job on the fixed hosted label, or if an expected, candidate, or sealed artifact name or normalized digest is invalid, missing, duplicate, extra, or inconsistent with the run nonce.", "STOP if the launcher isn't the clean trust-anchor copy, a trusted control file differs at the signer SHA, or the base-to-source diff leaves the packaging write allowlist.", "STOP if any cross-role archive comes from a manual or environment-selected source, the machine result is missing or invalid, or the evidence commit omits the machine result, accepted managed report, or executor-authored Spike report.", "STOP if a candidate command can observe a credential canary or OIDC or attestation capability; if the trusted upload wrapper lacks its job-scoped artifact runtime authority; if valid immutable untrusted candidate output doesn't cross into fresh seal; if that output is treated as trusted before seal; if candidate execution or processes gain seal OIDC or attestation authority or cross the fresh environment boundary; or if the coordinator can observe an authentication or credential canary, its identity changes after preparation, isolation or its network denial fails, an input is writable, or a path other than its output is writable.", "STOP and reconcile the contract if Apple's published stable-version list no longer identifies macOS 26 and macOS 15 as the two most recent stable major versions.", STOP at the 3-day time box and leave unsupported hosts outside the recommendation.]
    description: "Build and install the representative harness as AppImage, tagged Nix Flake package, and unsigned Apple Silicon archive across the required Linux and macOS matrix. Authenticate managed role evidence through BURL-M003. Prove the checksum and provenance-metadata layout inside the prototype; release-candidate attestations remain production workflow work owned by BURL-M009 and BURL-M014"
    acceptance:
      mode: hitl_sil
      evidence: "Unique hashed and logged runs verify installed Git and runtime, secure storage, file selection, native loading, secret injection, update selection, host chrome, repeatability, and every named Linux candidate. The Linux role provides `packaging-runtime`; macOS 26 provides `packaging-runtime` and `repeatable-construction`; macOS 15 provides `packaging-runtime-compatibility`. This Spike doesn't claim performance, Linux platform-regression, or authoritative macOS visual evidence. Candidate commands produce an untrusted bundle containing the manifest plus every named result, log, raw measurement, and handoff without token, artifact-runtime, OIDC, or attestation access. After candidate commands finish, the trusted workflow wrapper uses job-scoped artifact runtime authority to upload that untrusted bundle. A fresh dependent sealing job validates the immutable bundle and alone authenticates the sealed artifact. Aggregation verifies the exact packaging evidence profile, trust anchor, workflow signer, separate tested source, ticket base, packaging allowlist, sealing provenance, bundle integrity, and internal artifact hashes. Each named runtime check obtains guest operating system, distribution, version, and architecture from inside the installed probe environment; aggregation requires exact Ubuntu 22.04, 24.04, and 26.04 plus Debian 12 and 13 x86-64 evidence rather than trusting run IDs or the outer Nix host. The versioned build script runs `flutter clean`, enforces the committed dependency lock, normalizes archive metadata from the source revision's epoch, and emits the actual deterministic `.tar.gz` release artifact for each construction. macOS 26 constructs that archive twice from identical inputs; aggregation requires byte-identical archive hashes. Extraction rejects path escape and proves the archive preserves required modes, symlink targets, extended attributes, and one application bundle. The first archive travels in the authenticated macOS 26 sealed bundle. Only after verifying and staging that bundle does the macOS 15 role extract and probe the same bytes. Final aggregation stages all three sealed role bundles under fixed role directories and requires both macOS probes to name the same archive SHA-256. Nix out-links are only build sources: the result tool copies their resolved bytes or closures into `artifacts/` inside the Spike allowlist before size and SHA-256 recording. The aggregate records the prebuilt result-tool identity and proves no network, credential, writable input, or host user state entered coordinator execution. The CLI produces authoritative schema-valid `results.json`; the executor authors its human interpretation and commits both with the accepted managed report."
