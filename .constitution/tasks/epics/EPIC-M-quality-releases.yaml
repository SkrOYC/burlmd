  - id: BURL-M003
    title: Establish the Linux and Apple Silicon macOS managed validation matrix
    type: Chore
    effort: 8
    depends_on: [BURL-M015]
    category: DX
    scope:
      in: [".github/workflows/ci.yml", ".github/workflows/ci-role-linux-x86-64.yml", ".github/workflows/ci-role-macos-26-arm64.yml", ".github/workflows/ci-role-macos-15-arm64.yml", devenv.nix, devenv.lock, "scripts/**", lib/visual_capture_main.dart, test_driver/visual_capture_driver.dart, test/visual_capture_driver_protocol_test.dart, "test/goldens/**", "integration_test/**", ".constitution/evidence/BURL-M003/**"]
