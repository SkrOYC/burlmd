        chain of per-byte format! calls (each an un-zeroized, dropped-not-wiped
        intermediate String) before the final result was wrapped in Zeroizing.
        Now writes hex digits directly into one pre-sized Zeroizing<String> via
        std::fmt::Write, so there is exactly one key-hex allocation and it was
        zeroizing-wrapped from the start. - Fixed a Single-Responsibility P2
        (Standards axis): split _EditableBlock into a top-level
        _buildBlock/_isSingleTextRun eligibility dispatcher and a narrower
        _EditableParagraph that operates on an already-validated single-run
        content list rather than a whole AstNode. - Fixed a spec-honesty P2
        (Standards axis): schema.sql's header comment claimed migration tracking
        via PRAGMA user_version, but no statement ever set it. Added PRAGMA
        user_version = 1; to both schema copies, with a comment that the first
        real migration should branch on this baseline. Added a test asserting
        the pragma reads back as 1. - Backfilled a documentation gap in
        BURL-B001's Justification (P2, Standards axis): the zeroize crate
