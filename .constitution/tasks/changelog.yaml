  - version: v3.0.0
    date: 2026-09-03
    added:
      - "Added the concurrency mechanics to constitution.yaml from the practice
        the v2.2.0 entry describes: one worktree and branch per epic, created
        from merged master, rebase-merged back."
    changed:
      - "Converted tasks/ to the structured layout: one YAML file per epic under
        epics/ and completed/, and a rendered critical-path.md."
      - "Renamed every ticket to the framework's <ACRONYM>-<EPIC><NNN> form
        under the project acronym BURL, because the plan used a different prefix
        per subject and no single acronym could satisfy the ticket-id rule. The
        numeric suffix is unchanged except where two tickets in one epic shared
        it: AUTH-K001 and REG-K001 became BURL-K001 and BURL-K009, and LOG-M002,
        FLAKE-M002, BENCH-M004, and HEALTH-M004 became BURL-M002, BURL-M015,
        BURL-M004, and BURL-M016. The seven spike files were renamed to match.
        The old identifiers stay recoverable from git history."
      - "Broke the epic dependency cycle. Epic M now depends on nothing, because
        its BURL-M003 managed-validation matrix is the prerequisite every other
        epic's tickets name, and a graph in which M also depends on G, H, I, J,
        K, and L cannot start. Epic I no longer depends on Epic L for the same
        reason in the other direction: Epic K and Epic L both need Epic I's
        Object identity and retention, so making Epic I downstream of Epic L
        would only move the cycle. Both losses are recorded as OD-09 and OD-10
        rather than left implicit."
      - Set each epic's capability coverage from its markdown header, its
        estimated diff lines from its open points at 150 lines per point, and
        the flows each of the 80 active tickets serves.
      - "Reworded the three product durations the time-unit check reads as
        estimates: the CAP-058 30-day cache-eviction window and the two 24-hour
        attestation freshness windows. The rule they express is unchanged."
      - Replaced the day-based time boxes in the five unexecuted spike reports
        with a points budget matching the owning Spike ticket.
      - "Migration date retained for v3.0.0: no master commit introducing this
        version string was found."
    fixed:
      - "Recovered thirteen tickets the conversion silently dropped because
        their prefix was longer than six characters: PREFLIGHT-H007,
        TRANSFER-I005, RECOVER-I006, MIGRATE-I011, ARCHIVE-J003, COLLIDE-J005,
        CONNECT-K004, ANALYZE-L002, SUGGEST-L004, MIGRATE-M005, APPIMAGE-M006,
        RELEASE-M009, and PUBLISH-M014. The backlog is 80 active tickets and 564
        open points again, matching v2.2.0."
      - Added a digest manifest to .constitution/evidence/SPK-BURL-F001/, so the
        four production-font captures the editor spike produced are checkable.
