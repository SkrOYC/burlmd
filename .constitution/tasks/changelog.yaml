  - version: v2.2.0
    date: 2026-08-31
    changed:
      - Evolution pass for PRD v1.3.7, Architecture v1.4.15, and TechSpec
        v1.8.0-provisional. The backlog remains 80 tickets and 564 active story
        points. The dependency graph now has 226 edges, and the recomputed
        critical path is 180 points
      - Replaced the global all-five-Spike production stop with contract-scoped
        authorization. The six Epic G M0 tickets remain executable; BURL-M015
        and BURL-M003 are executable bootstrap work. Every other production
        ticket waits for its own evidence, required upstream finalization, and
        Stage 4 adaptation
      - Made BURL-M003 the merged prerequisite for managed-evidence Spikes.
        BURL-H001 and BURL-H002 run sequentially in the H Spike tranche; the H
        foundation then runs BURL-H003, BURL-H005, BURL-H004, BURL-H006, and
        BURL-H007 in order
      - Replaced physical workstation profiles with managed ubuntu-24.04, Apple
        Silicon macos-26, and Apple Silicon macos-15 roles. Linux and macOS 26
        own performance evidence, Linux uses private headless exact
        platform-regression capture, macOS 26 owns the sole authoritative
        product visual baseline, and macOS 15 remains functional
        compatibility-only
      - Updated CI, AST, path, Asset, observer, packaging, benchmark, shell, and
        installed-candidate evidence to use authoritative expected identity,
        immutable pre-upload role bundles, authenticated artifact handoff, and
        accepted or rejected aggregation
      - Authorized the provisional Flutter Rust Bridge 2.12.0 generator and
        runtime triple only for CI bootstrap in a disposable checkout.
        Downstream production remains blocked until final Stage 3 revalidates
        the triple and generated bytes
    added:
      - "Added the user-authorized isolated tranche sequence: M bootstrap, H
        Spikes, constitution evidence finalization, H authority foundation, and
        surgical Epic G replay. Every tranche starts from merged master, uses
        its own worktree, branch, and pull request, and runs one full review per
        ticket milestone"
      - Added exact ownership for chore/epic-m-ci-foundation,
        spike/epic-h-canonical-foundations, and
        feat/epic-h-authority-foundation. Partial H and M tranches don't archive
        their epics. Cross-tranche and cross-branch prerequisites must be merged
        into the base; within a declared tranche, an earlier committed,
        validated, and independently reviewed milestone satisfies the next
        ticket
    fixed:
      - Replaced candidate-owned source-branch validation with trust-anchor
        dispatch. CI and managed Spike commands run the launcher from a clean
        immutable anchor checkout, name the separate tested source and ticket
        base, and dispatch trusted master workflows that check out candidate
        bytes as data
      - Split each managed role into a minimally privileged candidate job and a
        fresh dependent sealing job. The separate sealing receipt contains
        immutable in-job facts and job.check_run_id, but no final state. After
        the attempt completes, aggregation resolves that locator and requires
        one successful API job. Artifact checks normalize the pinned action's
        bare 64-hex digest to the REST and aggregate sha256:<hex> form and
        reject mismatches
      - Assigned exact evidence classes per ticket and role. CI bootstrap proves
        functional, generated-binding, analysis, integration, protocol,
        security, and isolation outcomes without claiming performance or visual
        evidence. The five Spikes require only their measured AST, filesystem,
        Git, Asset, or packaging classes. Later benchmark, shell, and release
        tickets retain their own performance and visual gates
      - Clarified the close-warning invariant. A standalone Note-to-Note
        replacement continues after removing the warned retired tab. Batch close
        stops with unprocessed tabs preserved, and an enclosing Workspace switch
        or orderly shutdown is canceled
      - "Restored the real desktop integration gates in BURL-M003: Linux runs
        the complete integration_test/ directory on the Linux device inside its
        owned headless environment, and both macOS roles run it on the macOS
        device. Each role retains the Flutter unit and analyzer gates and proves
        that every discovered integration test ran"
      - Bound CI self-bootstrap and all five managed Spikes to the exact Stage 3
        managed-evidence.sh run command. The command creates expected identity,
        uses the dispatch response's run ID, enforces trusted-control and
        source-allowlist guards, and produces durable accepted or rejected
        reports
      - Clarified that merge-before-dependency applies across tranches and
        branches. Earlier milestones in the same declared tranche satisfy the
        next ticket only after commit, validation, and independent review. After
        adding the managed BURL-M003 prerequisite to BURL-L001, ticket count,
        effort, dependency edges, and critical path are 80 tickets, 564 points,
        226 edges, and 180 points
      - Added the managed BURL-M003 dependency and evidence command to
        BURL-L001, synchronized the README authorization banner, and made the
        build graph match the fifth managed Spike
      - Distinguished required Linux exact platform-regression evidence from the
        sole authoritative macOS 26 product visual reference across every
        affected ticket
      - "Aligned device-preference and Workspace-snapshot later-version handling
        with BURL-M005: preserve unsupported bytes unchanged, use in-memory
        defaults, and isolate any later current-format write"
      - Made the provisional Spike contract the sole authority for BURL-M001
        inner command order and added test_driver to the BURL-M003 format gate
      - Made BURL-M003 implement the missing non-mutating generated-binding
        checker before its ordered gate invokes that file. The checker preserves
        both generated surfaces on clean, stale, failed-generator, premodified,
        and interrupted runs
      - Tightened BURL-G003 with nonempty and unique identity schema rules plus
        Core validation for active Workspace and active Note membership.
        Malformed bytes remain preserved in quarantine, and runtime receives an
        empty writable default
      - Advanced the modified Epic L marker to v2.2.0; the modified Epic G and
        Epic M files already use v2.2.0
      - Replaced every managed Spike's manual cross-role handoff with
        authenticated role-bundle staging and exact coordinator steps. AST,
        path, Git, Asset, and packaging milestones now require their declared
        results.json, accepted managed report, and executor-authored human
        report in one evidence commit. Packaging passes the macOS archive to the
        compatibility role only through a verified staged bundle
      - Split managed evidence at the credential boundary. BURL-M003 must
        prepare and identify each locked coordinator before authentication,
        restrict authenticated work to evidence acquisition, destroy credentials
        and descriptors, and then run the prebuilt executable in pinned
        Bubblewrap with no network, read-only inputs, and only its output
        writable. Exact canary fixtures cover both role commands and all five
        managed-Spike coordinators
      - Added the two-pull-request trust-on-first-merge exception.
        chore/epic-m-ci-foundation lands the reviewed implementation and
        establishes its immutable anchor. docs/epic-m-ci-evidence contains only
        the accepted CI report and completion record. BURL-M003 satisfies no
        dependency until the second reviewed pull request merges
      - Assigned descriptor closure to the trusted launcher. A non-CLOEXEC
        canary proves that it enumerates and closes every nonallowlisted
        descriptor before Bubblewrap supplies namespace, network, and filesystem
        isolation
    by: migrate
