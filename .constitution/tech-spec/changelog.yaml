entries:
  - version: v2.1.27
    date: 2026-09-08
    fixed:
      - "Replaced BURL-M003's derived OpenSSL linker entry `NIX_LDFLAGS` with `NIX_LDFLAGS_x86_64_unknown_linux_gnu`. The local locked GCC wrapper reads the target-specific entry. A generic-only isolated link exits 1 with `cannot find -lcrypto`; the target-specific replacement exits 0."
      - "Recomputed the 33-entry base and 37-entry integration environment goldens, the reduced serializer golden, seven full production-manifest vectors, and seven reduced-manifest synthetic-log argv fields. Closure manifests, authority rows, preflight bodies, grammar, field order, and all unrelated values remain unchanged."
      - "Retained raw contract version 38, closure-log format version 2, role schema version 15, aggregate schema version 19, the 42-record bill of materials, seven sessions, 35 trusted control paths, and the BURL-O001 stop. Tasks remains v3.2.12 with its historical v2.1.26 upstream pointer; no Task or graph change occurs."
    security:
      - "Candidate-entry fixtures require the target-specific linker key and reject generic `NIX_LDFLAGS`. The correction adds no package, wrapper, mount, capability, host-policy change, or Darwin behavior."
    by: patch-lane
    upstream:
      prd: v2.0.5
      architecture: v2.1.2
  - version: v2.1.26
    date: 2026-09-08
    fixed:
      - "Expanded the BURL-M015 verification command to run both named persistence regression fixtures. Each fixture gets one normal run and 100 isolated repetitions through `scripts/repeat-test.sh`."
      - "Required deterministic timer quiescence before `state_before_shorter` in the longer-and-shorter retry fixture. The fixture retains full `NoteState` equality and doesn't depend on sleeps, wall-clock coincidence, or weaker production behavior."
      - "Updated the four live TechSpec metadata markers to v2.1.26. BURL-M015 remains the owner with `exists: false`. Raw contract version 38, API and evidence schemas, package pins, allowlists, production exceptions, and historical changelog entries remain unchanged."
    by: patch-lane
    upstream:
      prd: v2.0.5
      architecture: v2.1.2
  - version: v2.1.25
    date: 2026-09-08
    fixed:
      - "Corrected the BURL-M003 trusted supervisor launch. Pinned Bash 5.3p9 now uses the exact `-c 'source \"$1\"; shift; main \"$@\"' _ TRUSTED_SUPERVISOR_PATH` shape, so the trusted script reaches end of file before `main` and its defensive descriptor-255 close."
      - "Regenerated the reduced serializer golden to 256 arguments, 5,589 bytes, and SHA-256 `ba3ea8bbdebcbcb92f03abe8a47f0dd74d22f86d573c094ee77decc2485ae04a`; all seven full-vector records use the exact 488-member base and 547-member integration locked manifests; the seven synthetic closure-log argv fields use their reduced one-member base/two-member integration manifests."
      - "Required source-launch fixture coverage for direct-file and changed-argv rejection, source parse and read failure, and a main-defined-then-source-runtime failure. The measured probes exit without invoking `main`."
      - "Retained raw contract version 38, closure-log format version 2, package pins, namespace and capability policy, descriptor roles, cleanup and lock protocol, evidence schemas, profiles, artifact inventories, session IDs, and Tasks v3.2.11 without a Task or graph change."
    security:
      - "The first supervisor inventory now follows source-to-EOF and still requires exactly descriptors 0 through 4 without relying on close-on-exec."
    by: patch-lane
    upstream:
      prd: v2.0.5
      architecture: v2.1.2
  - version: v2.1.24
    date: 2026-09-08
    changed:
      - "Acknowledged Tasks v3.2.11's completed Stage 4 adaptation of BURL-M003 to raw contract version 38 and ADR-020 by marking ci_bootstrap.stage4_tasks_adaptation satisfied. The acknowledgement changes no runtime policy or API."
      - "Retained raw contract version 38, role schema version 15, aggregate schema version 19, spike-result schema version 20, sealing receipt version 2, receipt transport version 1, the 42-record bill of materials, evidence schemas, artifact inventories, session IDs, and the separate BURL-O001 Stage 3 stop."
      - "Tasks v3.2.11 truthfully records TechSpec v2.1.23 as its authoring baseline. VER-003 requires that historical version to exist, not that Tasks point to the latest TechSpec version, so this acknowledgement leaves Tasks unchanged."
    by: patch-lane
    upstream:
      prd: v2.0.5
      architecture: v2.1.2
  - version: v2.1.23
    date: 2026-09-08
    fixed:
      - "Returned ADR-0019 to OD-11's authority ruling. ADR-0020 remains the assumed contract for Linux teardown mechanics, including the retained-descriptor and OFD-lock requirements."
      - "Required the literal `enable_kvm: false` at every trusted cachix/install-nix-action call site. The pinned action manifest defaults this input to true. Static fixtures reject a missing, true, derived, or nonliteral value."
      - "Retained raw contract version 38, the 42-record bill of materials, closure and runtime measurements, evidence schemas, artifact inventories, session IDs, and the BURL-O001 stop. TechSpec advanced to v2.1.23."
    security:
      - "Trusted workflows cannot rely on cachix/install-nix-action's default KVM setup."
    by: patch-lane
    upstream:
      prd: v2.0.5
      architecture: v2.1.2
  - version: v2.1.22
    date: 2026-09-08
    fixed:
      - "Clarified that the trusted supervisor raises and verifies loopback before candidate or Sway startup, while outer unshared network isolation excludes host interfaces, routes, external network, and host network descriptors. Untrusted code can alter its own private network configuration."
      - "Corrected staging-root-sha256 to hash literal canonical UTF-8 leaf-path bytes followed by one LF, without changing any retained bytes or digests."
      - "Corrected the closure-view log policy so it appends its one host-policy row after all sessions end, matching the retained golden and guidelines."
      - "Retained raw contract version 38, the 42-record bill of materials, closure and Sway measurements, evidence schemas, artifact inventories, session IDs, and the BURL-O001 stop. TechSpec advanced to v2.1.22."
    security:
      - "The outer unshared network namespace prevents host-network exposure while allowing untrusted code to alter only its private network configuration."
    by: patch-lane
    upstream:
      prd: v2.0.5
      architecture: v2.1.2
  - version: v2.1.21
    date: 2026-09-08
    fixed:
      - "Removed authority to change hosted AppArmor, sysctl, or other host security policy. The exact pinned Bubblewrap and loopback probe must succeed before dependency or candidate execution; any failure blocks the hosted role and yields no accepted evidence."
      - "Specified the pinned Bash 5.3p9 supervisor structure and fixture that close script descriptor 255 before the first exact preflight inventory, preserve standard streams, and terminate through direct exit or final exec without another script read."
      - "Derived the trusted-control and tested-source roots from PR #15's immutable launcher path and explicit credential-free checkout argument. Local commit checks validate both before launch; fresh sealing validates retained path structure and consistency without claiming independent host-path authentication."
      - "Added the four source-identity fields to the explicit ordered closure-log header and both planned Linux supervisor files to the guidelines layout. Clarified that the supervisor waits for direct children, namespace PID 1 reaps adopted descendants, and the retained outer lock proves teardown."
      - "Retained raw contract version 38, the 42-record bill of materials, closure and Sway measurements, evidence schemas, artifact inventories, session IDs, and the BURL-O001 stop. TechSpec advanced to v2.1.21."
    security:
      - "Hosted execution can remain blocked if the runner policy denies the exact pinned probe. This contract grants no privileged fallback or host-policy mutation."
    by: patch-lane
    upstream:
      prd: v2.0.5
      architecture: v2.1.2
  - version: v2.1.20
    date: 2026-09-08
    fixed:
      - "Clarified that Bubblewrap is the sole candidate namespace and session-payload launch. The trusted parent retains the exact preparation, identity checks, and post-session util-linux `flock` execution already required by raw contract version 38; this correction adds no general parent-process allowlist."
      - "Required the integration supervisor to close log descriptors 3 through 6 after reaping the candidate and Sway, then open the verified session-root directory as temporary descriptor 3 with directory and no-follow flags. Cleanup uses that descriptor only after its device, inode, UID, and GID match the identity recorded before candidate execution, and closes it after the frame-and-acknowledgement handshake."
      - "Documented the already pinned util-linux 2.42 verifier as a bill-of-materials record. The bill of materials contains 42 records; no package, executable, closure, or implementation dependency changed."
      - "Retained raw contract version 38, the preflight and candidate descriptor-role goldens, closure measurements, Sway behavior, evidence schemas, artifact inventories, session IDs, and the BURL-O001 stop. TechSpec advanced to v2.1.20."
    security:
      - "The phase-specific cleanup descriptor cannot reach candidate execution, and cleanup refuses a replaced session-root directory before creating `cleanup.frame`."
    by: patch-lane
    upstream:
      prd: v2.0.5
      architecture: v2.1.2
  - version: v2.1.19
    date: 2026-09-08
    fixed:
      - "Replaced the incompatible default BSD `flock` teardown check with pinned util-linux 2.42 `flock --fcntl --exclusive --timeout 5 --conflict-exit-code 73` on the parent's retained original `O_RDWR` descriptor. The OFD write lock conflicts with Bubblewrap 0.11.2's POSIX read lock and fails closed on timeout or any nonzero result."
      - "Made teardown verification independent of the writable `/candidate/session/namespace-teardown.lock` pathname. The trusted parent creates and opens the original inode before launch, closes that descriptor in the Bubblewrap branch, compares its device and inode after the outer process exits, and never reopens the candidate-replaceable path for proof."
      - "Expanded the version 2 closure-log golden from 21-field to 25-field session rows with lock device, inode, stable-identity, and acquisition values. Added compact live-reaper, double-fork, replacement-path, premature-verification, final-release, descriptor-leak, and cleanup fixtures. The complete Bubblewrap argv, closure, preflight, environment, descriptor-role, and authority goldens remain unchanged."
      - "Retained raw contract version 38 because this is another correction to the same unmerged BURL-M003 implementation contract. TechSpec advanced to v2.1.19. The 41-record bill of materials, evidence schemas, artifact inventories, session IDs, and BURL-O001 stop remain unchanged."
    security:
      - "A candidate can replace the writable lock pathname only to deny the session. It can't redirect verification away from Bubblewrap's original lock inode or cause upload while a namespace reaper remains alive."
    by: patch-lane
    upstream:
      prd: v2.0.5
      architecture: v2.1.2
  - version: v2.1.18
    date: 2026-09-08
    fixed:
      - "Removed the stale `userns-disabled=true` preflight assertion that contradicted raw contract version 38. The synthetic base and integration preflight bodies are 626 and 886 bytes with SHA-256 values `3e94e0e21b39baffe00f7c0898217cd82efdf18bef7df28f7e8aa1e8ec50191a` and `d062b02dd1e6549645ea41ff6b8ff8a8117ae23db4fec3a8f6fa60f97d3a9b0a`. Mutation coverage rejects the removed field."
      - "Moved the parent-generated Bubblewrap, compositor, base, and integration manifests from namespace-only `/contract` paths to four exact host-relative names below canonical `RUNNER_TEMP/burlmd-m003`. The `/contract` mount contains only the per-session `locked-nix-closure.sources` snapshot."
      - "Expanded the existing closure-log golden to every authority needed by argument construction: 22 dynamic sources and one staging source for each of seven sessions, plus two integration runtime sources. Its 163 authority rows and 163 current-path rows hash to `a84bfa98dbb926d0c4e03228d4291ae0586a770fe8ba9a64984d4f6e390152c6`. All seven full vectors reconstruct with zero unresolved authority identifiers."
      - "Defined retained tab-separated paths as literal UTF-8 and fail closed on NUL, tab, LF, CR, or backslash at ingestion and parsing. Added mutations for malformed path encoding, a wrong host-versus-namespace manifest source, and an omitted authority."
      - "Separated Stage 4 implementation adaptation (`affected_tickets = [BURL-M003]`) from stop-condition maintenance (`maintained_stop_tickets = [BURL-O001]`). This preserves the BURL-O001 Stage 3 stop without authorizing its implementation."
      - "Added GNU Bash 5.3p9 and GNU Coreutils 9.11 as directly pinned runtime records. The bill of materials contains 41 records. No tool version or closure measurement changed."
      - "Limited AppArmor restoration claims to success, catchable exits, and handled signals with verification before bundle creation or upload. `SIGKILL`, abrupt runner loss, and host failure produce no accepted upload; ephemeral-runner disposal remains the residual limit."
    security:
      - "Fresh sealing rejects stale namespace assertions, unresolved mount authorities, unsupported retained-path bytes, and any parent manifest written through `/contract`. Candidate, compositor, and output remain untrusted."
    by: patch-lane
    upstream:
      prd: v2.0.5
      architecture: v2.1.2
  - version: v2.1.17
    date: 2026-09-07
    fixed:
      - "Removed the user-namespace-disabling argv pair and every claim that nested user namespaces are impossible. The revised 12-argument namespace vector is 126 bytes with SHA-256 `4f2e4c3c029ddbbc81e36ec2cbc199f3340e9c3ed2aaac5fdb37f36b8c94cd34`. The trusted supervisor now raises and verifies loopback inside each outer Bubblewrap network namespace before candidate or Sway startup. The outer mount, network, PID, user, and process-session namespaces remain the containment authority, and Bubblewrap remains absent from the candidate view."
      - "Split descriptor handling by session class. The handshake, integration-supervisor, and final-candidate descriptor goldens are respectively 102, 106, and 56 bytes with SHA-256 values `c12063917280d73a8a3378c6c2d71a28169ac4dfc2755d0a5c31c34c35403db9`, `4dcfdf087194d55004a9cdbe49c965bb007ffcf562268defd33fb8b263a1b261`, and `02c883d4cbe421973f0a0026fe06ab2f7b59ffbf751a3d15ad43addd14cecd3b`. Base sessions close the handshake descriptors, reverify unchanged standard streams, and immediately exec the candidate. Integration supervisors may open only descriptors 3 through 6 for exact Sway and readiness logs; the forked candidate closes every descriptor above 2 and reverifies standard streams immediately before the final Coreutils `env` exec. Added leak, swap, substitution, inode, target, and access-mode fixtures."
      - "Replaced the incomplete integration-argv label with a 253-argument, 5,554-byte reduced serializer golden whose SHA-256 is `dbed8cb348fa19fdd9304931dd9a2b8c6e68870516cff2cf94dc202a129f96e1`. The base and integration environment-template goldens are 1,100 and 1,209 bytes with SHA-256 values `00f226bc381053da0f2fd639ca02a6967c5a6257bc7774003fe635c42b498816` and `898d772e2c1d82b59f6a6affb6cf6b81489a60b4ff72226d32eda5288bb6cb7e`. Separate full-vector fixtures construct all seven commands from the actual 488-member or 547-member manifests. Production launch and fresh sealing reconstruct actual runtime bytes from full manifests and canonical paths."
      - "Defined `scripts/managed-sway.conf` as a Git-tracked mode-0644 regular file with the existing exact 72 bytes and SHA-256 `dfb19c5d5cd33e3e2ba7570511cee6c96222a94f1a717886bbbaa7d91dd1ab8a`. Its bind is read-only, but its visible permission bits remain 0644. The no-include, no-command-execution, `swaybg`, and Xwayland restrictions remain unchanged."
      - "Added the trusted pre-candidate Ubuntu 24.04 AppArmor probe. A failed pinned Nix-store Bubblewrap loopback probe may temporarily set only `kernel.apparmor_restrict_unprivileged_userns` from 1 to 0 after exact hosted-runner, executable, and noninteractive-sudo checks. An unconditional handler must restore 1 and verify it before bundle creation or upload; candidate code receives no sudo or host sysctl authority."
      - "Replaced production `/work` parents with resolved absolute paths below canonical `RUNNER_TEMP` and role-output roots. `/work` remains only in explicitly synthetic serializer and closure-log fixtures. Authority rows, current paths, launch argv, and fresh-seal reconstruction bind the resolved paths."
      - "Pinned iproute2 7.0.0 as the thirty-ninth bill-of-materials record. Advanced only the TechSpec to v2.1.17 and the raw contract to version 38. Closure-log format v2, role schema 15, aggregate schema 19, Spike-result schema 20, sealing receipt 2, receipt transport 1, evidence profiles, artifact inventories, session IDs, and the BURL-O001 Stage 3 stop remain unchanged."
    security:
      - "A temporary hosted AppArmor relaxation, if required, enlarges the kernel surface only until verified restoration. The role fails before upload on any probe, precondition, sysctl, or restoration error. Only accepted hosted BURL-M003 evidence can settle whether the current runner image needs the precondition."
    by: patch-lane
    upstream:
      prd: v2.0.5
      architecture: v2.1.2
  - version: v2.1.16
    date: 2026-09-07
    fixed:
      - "Replaced Bubblewrap's mode-0755 `--dir /candidate/xdg/runtime` creation with an exact writable bind from the matching frozen and retained `xdg-runtime` authority. Only the two integration sessions receive distinct mode-0700 runtime leaves because only their four appended environment assignments include `XDG_RUNTIME_DIR`; the five base sessions receive no runtime destination, socket, or Wayland variable."
      - "Required each integration runtime leaf to have canonical ownership, mode 0700, empty initial contents, unchanged mount and device identity, and no symbolic-link component. Teardown removes its sockets, lock, and leaf and proves the path absent before the next session."
      - "Added static and fresh-seal mutations for an omitted or read-only runtime bind, wrong source or destination, mode-0755 directory fallback, substituted or reused leaf, and precreated socket or other content. Complete-argv reconstruction resolves the source only from the matching authority declaration and current-path row."
      - "Recorded an earlier incomplete argv sample. TechSpec v2.1.17 replaces its production terminology and construction with separate reduced serializer and full-manifest fixtures. The capacity-authority log golden has 16 rows with SHA-256 `84c452be4629b446fbba93e15c771dab5f79c499d1d620968e1736ce583def52`."
      - "Retained raw contract version 37, closure-log format v2, the 38-record bill of materials, role schema 15, aggregate schema 19, Spike-result schema 20, sealing receipt 2, receipt transport 1, evidence profiles, artifact inventories, session IDs, and the BURL-O001 Stage 3 stop."
    security:
      - "Integration compositor sockets remain inside a distinct authority-backed runtime leaf in the existing untrusted Bubblewrap namespace. Candidate, Sway, `swaymsg`, sockets, and output remain untrusted until fresh sealing validates the retained evidence."
    by: patch-lane
    upstream:
      prd: v2.0.5
      architecture: v2.1.2
  - version: v2.1.15
    date: 2026-09-07
    fixed:
      - "Added the missing authority-backed read-only `/contract` mount to every BURL-M003 Bubblewrap session. The per-session leaf contains only the exact mode-0444 `locked-nix-closure.sources` file and resolves from retained frozen authority and current-path rows. Complete-argv and fresh-seal mutations reject missing, writable, substituted, linked, duplicated, reordered, or extra contract mounts and content."
      - "Added the exact `swaybg_command -` directive from Sway 1.12. The reviewed configuration is 72 bytes with SHA-256 `dfb19c5d5cd33e3e2ba7570511cee6c96222a94f1a717886bbbaa7d91dd1ab8a`. Integration supervision and cleanup now reject any `swaybg` process or output."
      - "Made the pinned Coreutils 9.11 `env -i --` executable the final candidate environment boundary. Base entry receives 33 resolved contract assignments; integration entry receives 37. Fixtures reject inherited or variant `PWD`, `SHLVL`, `_`, and canary values while recording variables that pinned script interpreters create after entry."
      - "Recomputed the representative NUL-delimited complete-argv golden after the `/contract` mount. It is 533 bytes with SHA-256 `31df65a44206be9976b25562dab9fcf675dc4500a268c54171e79c60253fa1e4`. Updated the closure-log golden configuration hash and the related mount, environment, compositor, cleanup, and fresh-seal assertions."
      - "Corrected the PR-facing bill-of-materials count to 38 records after Sway, Diffutils, and Procps."
      - "Retained raw contract version 37, closure-log format v2, evidence schemas, artifact inventories, session IDs, and the BURL-O001 Stage 3 stop. Stage 4 still adapts only BURL-M003 within its existing paths."
    security:
      - "The candidate sees one exact read-only contract file and no inherited supervisor environment at direct entry. Sway starts no background helper. Candidate, compositor, and output bytes remain untrusted until fresh sealing validates the retained proof."
    by: patch-lane
    upstream:
      prd: v2.0.5
      architecture: v2.1.2
  - version: v2.1.14
    date: 2026-09-07
    fixed:
      - "Bound every BURL-M003 Linux session to a canonical NUL-delimited complete Bubblewrap argv. Each session frame retains its byte count and SHA-256, and fresh sealing reconstructs the exact vector from trusted contract data plus retained authority and current paths. Duplicate-aware fixtures reject every added, omitted, reordered, duplicated, or substituted argument, including extra capabilities and host-root alias binds."
      - "Moved Sway and swaymsg out of the trusted parent. The parent launches only Bubblewrap. Only the two integration sessions mount the exact unwrapped compositor closure and start Sway as an untrusted candidate sibling under the trusted in-namespace supervisor."
      - "Defined the exact Sway 1.12 environment, launch arguments, 55-byte reviewed configuration, headless wlroots backend, pixman renderer, Xwayland disablement, and /candidate/xdg/runtime/wayland-1 socket. Base sessions expose no compositor member, process, socket, or Wayland variable."
      - "Required the integration supervisor to terminate candidates and Sway on every outcome, wait for Sway, verify that its PID is absent, and complete a cleanup frame-and-acknowledgement exchange before namespace exit. Fixtures cover early Sway failure, hostile candidate exit and descendants, timeout, socket disruption, interruption, graceful reap, and forced reap."
      - "Reproduced the base, unwrapped compositor, integration, and Bubblewrap closures twice with pinned Nix 2.35.2. The base remains 488 paths, 30,717 manifest bytes, SHA-256 `127043afe260d7756ee6cbda03e39a5bfceb4f7f79ae3a5be1595e447ce15e64`, 6,184,635,112 NAR bytes, and 66,314 bind bytes. The integration closure has 547 paths, 34,315 manifest bytes, SHA-256 `353e927fb857fe8f8fc213da4ac53e0a12147ead779e2e29289c6a3034415896`, 6,338,147,240 NAR bytes, and 74,100 bind bytes."
      - "Advanced the raw contract to version 37 and its closure log to format v2. Role schema 15, aggregate schema 19, Spike-result schema 20, sealing receipt 2, receipt transport 1, evidence profiles, and the exact 11-artifact and 13-artifact inventories remain unchanged."
      - "Routed only BURL-M003 adaptation to Stage 4 within its existing paths. BURL-O001 retains its explicit stop and later Stage 3 packaging-isolation and capacity decision."
    security:
      - "Candidate code, Sway, swaymsg, display traffic, sockets, and candidate artifacts remain untrusted. Only fresh sealing authenticates the retained evidence."
    by: patch-lane
    upstream:
      prd: v2.0.5
      architecture: v2.1.2
  - version: v2.1.13
    date: 2026-09-07
    fixed:
      - "Made the frozen capacity authority independently validatable at fresh sealing. The version 36 closure-view log now retains canonical declaration rows for every identifier and session, including kind, parent, required UID and GID, mode, directory type, device, decoded mount identity, and permitted leaf. The header and every session bind the exact declaration-row digest."
      - "Expanded golden and mutation coverage for a changed or same-device nested mount, wrong kind, parent, ownership, or mode, undeclared leaf, authority substitution, duplicate or omitted declaration, and ambiguous current-path resolution."
      - "Moved Sway and swaymsg out of the candidate closure into a separate trusted-parent compositor manifest. The parent proves both executable identities and exposes only its exact live Wayland socket to each candidate session. Candidate PATH, exact-path, manifest, mount, and trace checks prove that both compositor commands remain absent."
      - "Reproduced all three closures twice with pinned Nix 2.35.2. The candidate has 488 paths, a 30,717-byte manifest, SHA-256 `127043afe260d7756ee6cbda03e39a5bfceb4f7f79ae3a5be1595e447ce15e64`, 6,184,635,112 summed Nix archive (NAR) bytes, and 66,314 bind-only bytes. The compositor has 198 paths, a 12,024-byte manifest, SHA-256 `2989c9144aedb0861d16e440a309e4564679009f4785525033b2a8e1ecf97f3d`, 649,910,672 NAR bytes, and 26,028 bind-only bytes. The Bubblewrap closure remains eight paths, 480 manifest bytes, SHA-256 `398d11c9cd9249369cbb18d36661014eafef5ac18ff7adeb076c2c51ef0141fd`, 40,679,016 NAR bytes, and 1,040 bind-only bytes."
      - "Expanded the Bubblewrap bill-of-materials justification to cover the exact seven BURL-M003 candidate sessions and coordinator isolation. With the separately documented Sway record, the live bill of materials contains 38 records."
      - "Documented the pinned install action's transitive Nix 2.35.2 version without adding a duplicate bill-of-materials record. The workflow must omit `install_url`, reject preinstalled Nix, and require matching observed `nix` and `nix-store` version output before closure queries."
      - "Advanced the live TechSpec to v2.1.13 while retaining raw contract version 36. Role schema 15, aggregate schema 19, Spike-result schema 20, sealing receipt 2, receipt transport 1, evidence profiles, and the 11-artifact and 13-artifact inventories remain unchanged."
    security:
      - "This correction remains limited to BURL-M003. It preserves the seven-session inventory, descriptor handshake, stable and ephemeral root model, credential-free candidate, and fresh-seal authority. It doesn't authorize or solve BURL-O001 Linux packaging isolation or capacity."
    by: patch-lane
    upstream:
      prd: v2.0.5
      architecture: v2.1.2
  - version: v2.1.12
    date: 2026-09-07
    fixed:
      - "Pinned Diffutils 3.12 and Procps 4.0.6 as the thirty-sixth and thirty-seventh bill-of-materials records for BURL-M003. The exact candidate roots use `/nix/store/3c05s0vxy8wafaa7lkj4bfh69wa0ch10-diffutils-3.12/bin/cmp` and `/nix/store/ly5j6qg2q3vn899jd9dz0hx11gvjh9f1-procps-4.0.6/bin/ps`; ambient `/usr` and `/run/current-system` commands are rejected."
      - "Recomputed both closures twice with pinned Nix 2.35.2. The candidate has 549 paths, a 34,418-byte manifest, SHA-256 `c82bb681b260902382f9a747d0f8588ab29bb1d8d56cec0f7b7c30fc368399d9`, 6,338,161,576 summed Nix archive (NAR) bytes, and 74,326 bind-only argument bytes. The parent remains eight paths, a 480-byte manifest, SHA-256 `398d11c9cd9249369cbb18d36661014eafef5ac18ff7adeb076c2c51ef0141fd`, 40,679,016 summed NAR bytes, and 1,040 bind-only argument bytes."
      - "Defined the preflight handshake lifecycle. The preflight receives candidate standard streams on descriptors 0 through 2, the record write end on 3, and the acknowledgement read end on 4. The wrapper closes both handshake descriptors in order and proves only the unchanged standard streams remain before candidate exec."
      - "Changed the golden preflight body from the false descriptor-set claim to the exact five-descriptor map. The canonical body is 689 bytes with SHA-256 `7c50024df422271e58772aa6215ed7714f5387555b39bacd72c4f308d3c8491c`; leak, direction, ordering, acknowledgement, end-of-file, and standard-stream fixtures fail before candidate execution."
      - "Defined each integration session hash as SHA-256 over only the repository-relative path's exact UTF-8 bytes, with no byte-order mark, normalization, delimiter, NUL, carriage return, line feed, platform newline conversion, or other terminator."
      - "Corrected the capacity lifecycle without changing raw contract version 36. The frozen inventory now contains stable writable parents and their mount and device authorities, while each session creates, validates, records, and removes only its declared ephemeral staging, session, and writable-bind leaves. Later sessions don't stat deleted leaves."
