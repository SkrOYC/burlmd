    date: 2026-08-26
    changed: ["PR #12 full review round 17 advances Spike results to schema v10. PATH aggregation now binds its roles to Linux/ext4 and macOS/APFS. Packaging binds Linux roles to Linux/x86-64 hosts and every named distribution candidate to system-captured guest runtime evidence. GitHub contract v5 requires the versioned REST headers on App, installation, repository, and release calls while excluding OAuth endpoints"]
  - version: v1.7.16
