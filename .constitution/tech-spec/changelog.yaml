  - version: v1.0.6
    date: 2026-07-24
    changed: ["PR #5 review round 2 (correctness fixes to the Epic C implementation; no design surface changed). - Corrected v1.0.4's workspace-id derivation note: authenticate_workspace now derives the workspace id from the authenticated GitHub account's *numeric, immutable* id (fetched alongside login from GET api.github.com/user), not the mutable login username v1.0.4 described. GitHub usernames can be renamed at any time; schema.sql keys several tables to workspaces.id via ON DELETE CASCADE, so a login-derived id would silently orphan a renamed user's local data on their next login. rust/src/api/auth.rs's fetch_github_login is renamed fetch_github_account_id to match, and its mock-server test fixtures/assertions updated accordingly. Nothing downstream consumes the returned workspace id yet (that integration is still deferred, per v1.0.4), so this is a migration-free correction. - Verified .constitution/tech-spec/guidelines.md's repo-layout tree once more against the real tree: added rust/src/test_support.rs (landed in the v1.0.5-adjacent review-round-1 commit as #[cfg(test)]-only fixtures shared by git::operations's and sync::scheduler's unit tests), which the tree had not been updated to include. - Checked this round's other fixes (git CLI stderr classification now locale-pinned via a single LC_ALL=C command builder; apply_credentials no longer clobbers an inherited GIT_CONFIG_COUNT; the scheduler's re-index/conflict hooks now fire only when a merge actually ran) against .constitution/architecture/ and this file's contract mirrors: none of them change any tech-spec-governed fact (API contract, schema, or stack choice) — they are implementation-internal correctness fixes to code already covered by the v1.0.3/v1.0.4 entries above, so no further changelog itemization is needed for them. - Confirmed live: cargo test (workspace, run twice) stays green with the new/updated coverage — git_command's LC_ALL=C pin, apply_credentials' config-index-append behavior, the scheduler's fetch-failure-before-merge case (reindex/on_conflict must not fire), and authenticate_workspace_impl's numeric-id assertion"]
  - version: v1.0.5
    date: 2026-07-24
    changed: ["Constitution Freshness & Reconciliation Pass following Epic C execution (BURL-C001–C003). No production code changed; corrects doc drift left behind by v1.0.4, which recorded reqwest as a new direct dependency in prose but never actually updated stack.md's BOM to list it or bumped stack.md's own frontmatter version. - Corrected this file's own v1.0.4 entry: its last bullet named a KeyringTokenStore type that was never implemented. The real mechanism is the free function store_tokens_in_keyring(service, tokens); only a test function happens to be named keyring_token_store_round_trips_tokens_through_the_real_os_keychain, which is presumably where the wrong type name leaked from. - Added the missing reqwest 0.13.4 BOM entry to stack.md's Core Engine & Local Index section (HTTP Client), re-confirming the single-resolved-version claim from v1.0.4 against Cargo.lock (still exactly one reqwest entry, v0.13.4). - Added a stack.md note under the Secure Storage bullet documenting keyring 4.1.5's lazy default-store initialization race (see rust/src/api/auth.rs's new_keyring_entry doc comment for the full account) and its test-only ctor-based warmup workaround, so this known issue is discoverable from the BOM rather than only from a source comment. - Verified .constitution/tech-spec/guidelines.md's repo-layout tree against the real tree (eza -T --git-ignore rust/src lib/src): added rust/src/sync/ (BURL-C003's background sync scheduler) and lib/src/screens/ (BURL-C002's full-screen routes, e.g. login.dart), both real directories the tree had never been updated to include. - Checked .constitution/architecture/ for genuine boundary/target-design drift against the Epic C implementation: found none. The login flow's tail (clone-with-token, encrypted-index init) and the scheduler's app-lifecycle wiring in flow-auth-handshake.md/flow-sync-push.md remain target design the implementation hasn't reached yet, which is an execution gap tracked in tasks/, not an architecture inaccuracy — no architecture file was edited"]
  - version: v1.0.4
    date: 2026-07-24
    changed: ["BURL-C002 implementation (Epic C execution). - Added OAuthFlowStart and begin_oauth_flow(provider, redirect_uri) to tech-spec/contracts/ffi_api.rs, beyond the contract's original surface. flow-auth-handshake.md only says \"Core->UI: Return OAuth URL\"; this ticket's actual split needed a concrete function for that step (PKCE verifier/challenge/state generation and authorize-URL construction happen Core-side; the UI cannot be trusted to mint the verifier authenticate_workspace later checks the exchange against) plus a way to carry the verifier/state back to the UI for the browser leg and the later authenticate_workspace call. authenticate_workspace's own signature is unchanged. - Corrected an assumption baked into the ticket's design before implementation: PKCE on a public client does not eliminate GitHub's client_secret requirement on the token exchange, contrary to the general RFC 8252 native-app-PKCE pattern. Verified 2026-07-24 against docs.github.com/en/apps/oauth-apps/building-oauth-apps/authorizing-oauth-apps's access-token parameter table (client_secret listed \"Required\", no PKCE exception, for both OAuth Apps and GitHub Apps) and cross-checked against docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/generating-a-user-access-token-for-a-github-app. rust/src/api/auth.rs reads an optional secret from BURLMD_GITHUB_CLIENT_SECRET at runtime (never hardcoded) rather than omitting it outright, so the real exchange can still succeed once a GitHub OAuth App is registered. - workspaces.id in schema.sql has no existing minting scheme (db::connection/api::simple only ever reference pre-seeded workspace ids); authenticate_workspace uses the authenticated GitHub login (fetched via GET api.github.com/user with the freshly-exchanged token) directly as the workspace id — stable, non-secret, and unique per account, without inventing a second disconnected id space this ticket has no mandate to wire into schema.sql. - Added reqwest (blocking, rustls, json, form features) as a direct dependency for the GitHub OAuth token exchange and user-lookup calls — already present transitively via gix's blocking-http-transport-reqwest-rust-tls feature (see the v1.0.3 entry), so this adds features to the already-resolved version rather than a second HTTP stack. Also added sha2 (S256 PKCE challenge), base64 and url (already transitively resolved via reqwest), and serde/serde_json (token-response parsing) as direct dependencies. - Confirmed live: cargo test api::auth:: exercises RFC 7636 PKCE verifier/challenge generation (including the S256 challenge against RFC 7636 Appendix B's worked example — cross-checked independently via openssl dgst -sha256), authorize-URL construction, and token exchange (success with/without expiry fields, bad_verification_code mapped to AppError::OAuthError, non-2xx/non-error-body responses mapped to AppError::NetworkError, client_secret sent only when configured) against a hand-rolled local mock HTTP server, plus the store_tokens_in_keyring free function round-tripping through the real OS keychain under a test-scoped service name"]
  - version: v1.0.3
    date: 2026-07-24
    changed: ["BURL-C001 implementation (Epic C execution). - Corrected stack.md's \"Git Implementation\" bullet from a bare \"gix (gitoxide)\" to the verified hybrid actually built: gix 0.86.0 for clone and commit (including rebuilding .git/index from the committed tree, since Repository::commit_as alone only writes the commit object and moves the branch ref), and the git CLI shelled out to for push and pull. This follows directly from upstream's own crate-status.md at gix 0.86.0: push has no client plumbing implemented at all, and merge support stops at blobs and trees — commit-level three-way merge, and the raw conflict markers flow-conflict-resolution.md parses, do not exist in gix today. Confirmed live: cargo test git:: exercises clone, commit, a push+pull round trip against a local bare-repository fixture, and a genuine diverging-history pull that surfaces (and does not clobber) <<<<<<</=======/>>>>>>> markers in the working tree"]
  - version: v1.0.2
    date: 2026-07-22
    changed: ["BURL-B002 implementation (Epic B execution). - Corrected stack.md's Database Encryption bullet: the root key is applied to SQLCipher via the raw-key PRAGMA form (PRAGMA key = \"x'<64 hex chars>'\"), not a passphrase string. The v1.0.1 wording (\"key derived via PBKDF2-HMAC-SHA512... 256,000 iterations\") described SQLCipher's passphrase mode, which this project does not use — PBKDF2 exists to strengthen low-entropy human passphrases and adds cost with no benefit when the input key is already full-entropy CSPRNG output from the OS Keychain (BURL-B001). Confirmed live: cargo test db:: verifies the resulting file is unreadable without the key and its raw bytes don't match SQLite's plaintext header"]
  - version: v1.0.1
    date: 2026-07-22
    changed: ["Phase 0 (tooling readiness). Amendments driven by empirically verifying the stack inside the new devenv shell rather than by design changes. - Replaced fvm with a nixpkgs pin (flutterPackages.v3_44) as the Flutter SDK pinning mechanism. fvm fetches unpatched SDK binaries that cannot execute on NixOS and sidesteps the Nix store. - Recorded devenv + devenv.lock as the reproducibility boundary for the whole toolchain. - Pinned the Rust toolchain to 1.97.1 and documented 1.95 as a hard floor: libsqlite3-sys >= 0.38, reached through rusqlite's bundled-sqlcipher build, uses cfg_select!, stabilised in Rust 1.95.0 (rust-lang/rust#149783). - Corrected the rusqlite feature set: bundled-sqlcipher alone (it implies bundled). The fts5 feature no longer exists in rusqlite 0.40 — FTS5 ships enabled in the bundled amalgamation. Confirmed by an FTS5 MATCH query against a keyed SQLCipher 4.14.0 connection. - Updated the guidelines.md monorepo layout to include the phase 0 root files (devenv.nix, devenv.yaml, devenv.lock, rust-toolchain.toml, .envrc), and recorded that the documented commands assume the devenv shell. - Noted that keyring 4.x reaches the Secret Service through zbus in pure Rust, so no libsecret/libdbus native dependency is required on Linux. - Corrected the SQLCipher encryption claim. It was documented as AES-256-GCM; SQLCipher 4.x is in fact AES-256-CBC with per-page HMAC-SHA512 authentication (Encrypt-then-MAC) and PBKDF2-HMAC-SHA512 key derivation, confirmed against PRAGMA cipher_settings. This is not an AEAD, and the distinction matters for EPIC-C's tamper-resistance reasoning. The same wording was corrected in the BURL-B002 acceptance criterion. - Pinned Android SDK *discovery* shut by pointing ANDROID_HOME/ANDROID_SDK_ROOT at an empty in-repo path. Flutter was otherwise discovering an SDK by scanning the contributor's home directory — no ANDROID_HOME was set and no adb was on PATH, so the mobile toolchain was ambient host state outside the Nix store. Provisioning a real SDK was tried and reverted: it costs a measured 14.9 GiB closure on a desktop-only tree and appends NDK, build-tools, libglvnd and vulkan-loader paths to LD_LIBRARY_PATH, which the environment deliberately leaves untouched. - Adopted the devenv v1.4+ .envrc form (eval \"$(devenv direnvrc)\"). The older source_url recipe pinned a direnvrc revision and content hash by hand, which drifts from both the installed CLI and devenv.lock; the CLI now emits the direnvrc matching its own version. - Recorded the FRB version triple as a risk to manage rather than a documented rule: the Nix-pinned flutter_rust_bridge_codegen is versioned independently of the flutter_rust_bridge Rust crate and Dart package. Upstream publishes no explicit version-matching requirement (manual and troubleshooting pages checked), so the guidance to keep the three aligned is flagged for empirical confirmation at BURL-A001"]
  - version: v1.0.0
    date: 2026-07-24
    changed: ["- Selected flutter_rust_bridge (v2) for FFI, rusqlite for local index, and gix for Git operations. - Defined standard FRB monorepo layout. - Established riverpod for Flutter state management. - Defined physical SQLite schema.sql utilizing FTS5 for sub-100ms full-text search. - Formalized the raw FFI API contract (ffi_api.rs) detailing the AST node structure and synchronous boundary interactions. - Expanded AST definition in ffi_api.rs to cover real-world Markdown semantics (TextRuns, Images, Links). - Added ADR-003-local-encryption.md establishing at-rest encryption via sqlcipher and aes-gcm. - Updated schema.sql to include multi-workspace support. - Updated stack.md to specify flutter_secure_storage and keyring for handling cryptographic material safely at the OS level"]
