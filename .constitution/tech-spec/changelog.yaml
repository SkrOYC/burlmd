  - version: v1.7.11
    date: 2026-08-26
    changed: ["PR #12 full review round 9 keeps authenticated GitHub Actions attestation work in the production release workflow instead of assigning it to the prototype-only packaging Spike. Result schema v8 requires complete profile facts for profile-bound runs, adds the integrated-graphics fact, and uses an inline timestamp shape while the result tool performs strict RFC 3339 calendar validation without an optional schema-format plugin"]
  - version: v1.7.10
    date: 2026-08-26
    changed: ["PR #12 full review round 8 binds multi-host Spike results to immutable input-context hashes and advances the result schema to v7. The AST Spike now evaluates both pinned and current pulldown-cmark models independently. Packaging constructs, extracts, transfers, probes, and byte-compares the actual deterministic macOS release archive. Release provenance is authenticated through repository-, workflow-, revision-, and subject-bound GitHub Actions attestations while Platform signing remains deferred. The forward contracts also add same-corpus nightly aggregation, fresh macOS support-pair checks, bounded advertised-ref quarantine, and stale-device replacement-store backfill"]
  - version: v1.7.9
    date: 2026-08-26
    changed: ["PR #12 full review round 7 binds this provisional layer to PRD v1.3.5 and Architecture v1.4.8. Authoritative Object Store deletion is disabled during 0.x. Store replacement uses durable intent, dual-write, delta reconciliation, and revision-bound cutover. Core commit paths exclude binary payloads independently of ignore files. Result schema v6 permits honest empty stdout or stderr capture. Production implementation remains unauthorized"]
  - version: v1.7.8
    date: 2026-08-26
    changed: ["PR #12 full review round 6 binds this provisional layer to Architecture v1.4.7. Git analysis now runs every candidate on verified default Linux and macOS filesystems. GitHub token refresh explicitly requests and validates JSON rotation fields. The forward CI commands execute the forbidden-debug-marker gate, and the brownfield FFI banner identifies the current upstream lineage. Production implementation remains unauthorized"]
  - version: v1.7.7
    date: 2026-08-26
    changed: ["PR #12 full review round 5 binds this provisional layer to PRD v1.3.4 and Architecture v1.4.6. Spike results now capture complete reference-profile facts. The macOS packaging protocol tests one immutable artifact on both supported major versions and separates repeated construction from compatibility probes. Protected State includes every advertised fetchable Remote ref. The GitHub App keeps least privilege by rejecting reachable workflow history, and device flow classifies bad verification codes and unverified email addresses. Production implementation remains unauthorized"]
  - version: v1.7.6
    date: 2026-08-26
    changed: ["PR #12 full review round 4 binds this provisional layer to PRD v1.3.3 and Architecture v1.4.5. It also binds AST and macOS packaging evidence to verified host facts and makes installed probes execute copied artifacts. GitHub App verification now separates public drift checks from a fresh administrator-approved expiring-token attestation. The forward contracts require fresh online Remote authority for full-local transition, integrate Consolidation into initial connection, and reconcile ADR-011 with the content-derived telemetry prohibition. Production implementation remains unauthorized"]
  - version: v1.7.5
    date: 2026-08-26
    changed: ["PR #12 full review round 3 reconciled the provisional layer against Architecture v1.4.4, completed the access-token 401 recovery contract, and added integrity-checked cross-host Spike result handoff. GitHub App registration and settings drift now have explicit downstream ownership. Production implementation remains unauthorized"]
  - version: v1.7.4
