entries:
  - version: v2.0.1
    date: 2026-09-04
    changed:
      - "Translated the reviewed post-migration TechSpec lineage into the structured Stage 3 layout against PRD v2.0.0 and Architecture v2.0.1. Reviewed v1.8.1 corrected conditional viewport verification; v1.8.2 through v1.8.4 carried that policy into Spike results and required complete host profiles; v1.8.5 and v1.8.6 made runner-label reconciliation executable and structurally valid; v1.8.7 established the platform-specific candidate and fresh-seal authority model."
      - "Advanced the provisional raw contract to version 24 and the Spike-result schema to version 20 while retaining role schema version 9 and aggregate schema version 11, including explicit result_schema_version = 20 and conditional viewport, role-profile, and runner-label reconciliation."
      - "Translated every live managed-validation identity to BURL-M003, BURL-H001, BURL-H002, BURL-I001, BURL-L001, and BURL-M001, with BURL-M015 retaining the reproducibility exception."
      - "Added canonical BURL verification-command entries beside four explicitly labeled temporary aliases whose exact legacy strings are still quoted by Stage 4. The aliases grant no runtime compatibility and must be removed by Stage 3 immediately after Stage 4 migrates BURL-M006, BURL-M011, BURL-M012, and BURL-M013."
      - "Moved BURL-M003 acceptance evidence to .constitution/evidence/BURL-M003/managed-evidence.json, completion.md, and manifest.yaml; reports are not acceptance-evidence storage."
      - "Reconciled trusted_control_paths to the explicit transitive workflow, helper, CI-contract, and toolchain-lock set implemented by PR #15 at 6d65e94, including rust/Cargo.lock and excluding unrelated scripts and contracts."
    fixed:
      - "Preserved the reviewed exact ticket-by-role evidence profiles, role and aggregate acceptance rules, immutable artifact and receipt identities, canonical digest normalization, post-completion job observation, credential-separated coordination, two-pull-request bootstrap, API version 2026-03-10, generated-binding check, and exact CLI output and exit behavior."
      - "Replaced the deleted static viewport-fixture directory with raw policy that points to the executable PR #15 reconciliation, role-production, and seal-validator fixtures."
    security:
      - "Accepted ADR-0019 by ruling: Linux proves private-PID teardown before upload; hosted macOS records bounded cleanup without an arbitrary-process containment claim; candidate commands remain credential-free; a trusted wrapper may upload only an untrusted handoff; and the fresh non-executing seal alone receives provenance authority."
    by: patch-lane
    upstream:
      prd: v2.0.0
      architecture: v2.0.1
  - version: v2.0.0
    date: 2026-09-03
    added: ["Added 96 verification commands to the guidelines front matter, one per distinct command the 117 tickets quote, each labeled with the tickets that quote it. Six are marked exists: false: the five managed-evidence runs owned by BURL-M003 and the GitHub App attestation script owned by BURL-K009.", "Replaced the TODO upgrade_boundaries with the real rule: which bumps re-run which verification, and which need an ADR."]
    changed: ["Converted tech-spec/ to the structured layout. stack.md became stack.yaml, guidelines.md kept its prose and gained front matter, the ADRs gained front matter, and every raw contract and data-model artifact gained a sidecar.", "Gave each ADR its four-digit schema id in front matter. The file names and the prose references keep the three-digit form, so nothing else had to move; ADR-009 now names ADR-0017 as the decision that superseded it.", "Set the surface, the flows, and the boundaries each contract and data-model artifact serves on all twelve sidecars.", "Marked the thirteen layout paths that do not exist yet as exists: false, so the layout describes intent without claiming the tree already matches it.", "Migration date retained for v2.0.0: no master commit introducing this version string was found.", "Migration date retained for v2.0.0: no master commit introducing this version string was found."]
    fixed: ["Rebuilt stack.yaml. The conversion had turned the forward-decision table and the GitHub Actions pin table into the whole bill of materials, every entry labeled ecosystem pub, and dropped the delivered stack entirely. The bill of materials now carries 33 entries with real roles, ecosystems, and pins read from pubspec.lock, rust/Cargo.lock, and rust-toolchain.toml, and marks the unsettled candidates open against their decision or assumed with the assumption stated.", "Corrected eleven ticket verification commands the conversion had reduced to a role label, a ticket id, or a spike id, restoring the command each ticket actually quotes from its epic file.", "Rewrote nine archived verification commands so their first token resolves: the eight Epic D commands now pass --manifest-path rust/Cargo.toml instead of cd rust, and the Epic F spike gate inlines the commit it compared instead of assigning shell variables. The three Epic C tickets predate the field and record git diff --check with that fact in their expected output."]
    by: migrate
    upstream:
      prd: v2.0.0
      architecture: v2.0.0
  - version: v1.8.0
    date: 2026-08-31
    changed: ["Evolution pass for PRD v1.3.7 and Architecture v1.4.15. This version replaces physical workstation evidence with managed, identity-bound validation and leaves unresolved technology choices provisional", "Advanced provisional Spike contracts and result profiles to schema version 17. Role evidence is schema version 8, and aggregate evidence is schema version 10. AST and Asset measurements use the Linux and macOS 26 performance roles without claiming visual evidence. Packaging evidence binds macOS 26 and macOS 15 to their managed profiles", "Replaced physical CPU, disk, graphics, power, and throttling assumptions with hosted image identity, observed system resources, and a verified 1920x1080 at 60 Hz logical viewport. OS-major labels remain mutable weekly image channels and can't guarantee a physical host or identical reruns", "Bound Linux exact platform-regression proof to the committed private headless Sway and Wayland implementation. Its current 1878x989 capture must reach the PRD viewport before acceptance. This required zero-pixel implementation gate isn't a product visual reference. macOS 26 must use the actual hosted GUI and owns the sole authoritative product visual baseline set; macOS 15 has no visual role", "Made the Release Pipeline's expected identity authoritative. Aggregation verifies role-specific GitHub Sigstore signer provenance, independently checks artifact transport and hosted job labels, then compares captured identity instead of trusting artifact self-description", Replaced the global all-Spike production stop with contract-scoped authorization. Epic G M0 remains unchanged. BURL-M015 and BURL-M003 may implement their bootstrap. Every other production ticket waits only for its own decision evidence and Stage 3 and Stage 4 adaptation, Permitted the installed Flutter Rust Bridge 2.12.0 triple for CI bootstrap. BURL-M003 owns implementing the missing generated-binding checker before invoking it. Final Stage 3 must revalidate the triple after evidence-driven dependency choices]
    added: ["Added concrete standard public runner roles. x86-64 ubuntu-24.04 and Apple Silicon macos-26 can produce common functional and performance evidence. Linux can produce platform-regression evidence, and macos-26 alone can produce authoritative product visual evidence. Apple Silicon macos-15 provides functional compatibility only. Ticket profiles select the required subset", "Added ci-role-evidence.schema.json for manifests inside complete candidate role bundles and ci-evidence.schema.json for coordinator-enriched aggregate reports. The Spike result root requires a real Spike identity and can't represent a CI run without falsely labeling it as research", "Added an authenticated two-phase evidence protocol. A trusted default-branch dispatch captures role evidence from a separate tested-source checkout. Local trust-anchor aggregation verifies origin, bundle integrity, identity, freshness, and the ticket write boundary before milestone review", "Added full commit-SHA pins for checkout, Nix installation, artifact upload and download, and release attestation actions"]
    fixed: ["Replaced candidate-owned source-branch validation with a trust-anchor dispatch. The launcher runs from the immutable reviewed CI anchor, verifies trusted controls on master, creates expected identity, and dispatches workflows that check out the separate tested source as data. Expected identity separates trust anchor, workflow signer, tested source, ticket base, and run nonce", "Replaced manifest-only uploads with a deterministic candidate bundle followed by a fresh-job validated and attested sealed bundle. Both contain ci-role-evidence.json and every result, log, raw measurement, and handoff named by internalArtifacts; aggregation verifies the sealed bundle before consuming any result", "Required the signed OIDC runner_environment claim to equal github-hosted, retained that verified fact in aggregate origin, and added an explicit rejection for self-hosted evidence regardless of custom labels", "Clarified close_note warning handling without changing the FFI shape. Only a standalone Note-to-Note replacement continues; batch close stops with unprocessed tabs preserved, and a Workspace switch or orderly shutdown is canceled", "Defined scripts/managed-evidence.sh as the sole managed-evidence client. Its run form verifies a clean anchor checkout and exact source allowlist, creates expected identity, dispatches master, and uses the returned run ID. Its collect form resumes that exact run and repeats both guards. The contract fixes bundle names, flags, permissions, output, and exit statuses without introducing a general workflow framework", "Removed the circular requirement for a role manifest to contain the service-assigned ID and digest of the artifact that contains it. Roles attest immutable pre-upload bundle bytes; the coordinator adds bundle, upload, and attestation facts only to the final report", "Replaced unsupported artifact-to-job REST correlation with three distinct static local reusable-workflow signers resolved from the trusted master signer commit. Signed builder identity binds each bundle to its role workflow, and the job API corroborates that workflow's fixed hosted label without trusting a manifest-supplied job name or ID", "Made final aggregation a discriminated accepted or rejected result. Rejected reports allow missing or partial role evidence and require typed reasons. Each role's evidence-class sequence is exact, so Linux and macOS can't claim the other platform's visual proof", "Renamed the Linux evidence class to linux-platform-regression and its gate to linuxPlatformRegression, separating required exact Linux implementation evidence from macOS 26 product visual authority", "Aligned device-preference and Workspace-session forward-version handling with migration policy. Unsupported later-version and corrupt bytes are quarantined and preserved byte-for-byte; runtime defaults stay in memory, and any later current-format write uses an explicitly safe isolated path", "Made BURL-M003 create a non-mutating generated-binding checker before its ordered gate invokes the file. The checker hashes and backs up both generated surfaces, detects any file-set or byte drift with the provisional generator, and restores the exact precheck state on every exit path", "Tightened the Workspace-session schema to reject empty and duplicate identities. Core semantic validation also rejects a Workspace mismatch, invalid identity, or active Note outside the open-Note list. Rejected bytes remain quarantined and preserved, and runtime uses an empty writable default instead of malformed state", "Removed the alternative persisted-format escape hatch for Workspace sessions. Persisted snapshots must be schema-valid JSON; Core may use an equivalent in-memory representation only after validation and deserialization", "Replaced every manual cross-role Spike handoff with verified role-bundle staging under a fixed coordinator root. Expected and captured identity now bind the exact ticket. All five managed Spikes declare exact machine-result, evidence-report, human-report, and coordinator-step contracts. Acceptance requires a schema-valid results.json; packaging transfers the macOS archive to the compatibility role only through an authenticated staged bundle", "Split managed-Spike coordination into credential-separated phases. The trusted client builds and identifies each locked coordinator before authentication, limits the authenticated phase to evidence acquisition and verification, destroys credentials, and then runs the prepared executable with no network, read-only inputs, and only its output writable. Role commands receive the same ambient-credential exclusion, and canary fixtures make both boundaries executable", Defined the CI trust-on-first-merge exception. The reviewed implementation merge establishes the first immutable trust anchor. A dedicated reviewed evidence pull request containing only the accepted report and completion record must merge before BURL-M003 satisfies any dependency. Later validation-control changes repeat this rotation, "Replaced each role's single signing job with a two-job trust boundary. A minimally privileged candidate job produces a uniquely named untrusted bundle; a fresh dependent sealing job validates that bundle and alone receives OIDC and attestation authority. Its separate receipt records immutable in-job facts and a check-run locator without claiming final state. Post-completion aggregation constructs the successful sealing-job observation", "Kept runIdentity as managed:<32hex> and derived an artifact-safe lowercase 32-hex nonce from its suffix. Expected, candidate, and sealed artifact names use fixed safe templates, and semantic validation rejects a run/nonce mismatch, forbidden character, duplicate reserved name, or substitution", "Normalized artifact digests explicitly. The pinned upload action produces bare lowercase 64-hex, whereas REST and aggregate evidence use sha256:<hex>; aggregation rejects a value unless the canonical REST form equals sha256: plus the action output", "Replaced universal role gates with exact ticket-by-role requiredEvidenceClasses. CI bootstrap proves its functional and managed-evidence controls without claiming performance or visual evidence; each Spike requires only the measurements its commands produce. Later benchmark, shell, and release gates keep their own performance and visual obligations"]
    security: ["Evidence acceptance now requires bundle integrity and authenticated GitHub-hosted origin. Private-repository attestation eligibility isn't guaranteed; without it, aggregation is rejected. Typed reasons cover incomplete bundles, self-hosted origin, missing, duplicate, unexpected-role, untrusted, corrupt, mismatched, stale, or mixed-image evidence", "Managed coordinator acceptance additionally requires a recorded executable and closure identity, successful Bubblewrap isolation, absent credential canaries and clients, explicit launcher-owned descriptor closure, and a representative result. A non-CLOEXEC descriptor canary proves the boundary; Bubblewrap isn't treated as the descriptor owner"]
    by: migrate
    upstream:
      prd: v1.3.7
      architecture: v1.4.15
