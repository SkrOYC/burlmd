descriptor_golden_policy = "Each golden is entry-count|NUL-encoded-bytes|SHA-256 over its corresponding ordered role array. Base and integration candidate children both use final_candidate_descriptor_roles. These serializer goldens bind role declarations; runtime checks additionally bind file type, st_dev, st_ino, decoded target, and access mode."
descriptor_policy = "Before it creates the handshake pipes, the trusted launcher establishes and records the final candidate standard streams on descriptors 0, 1, and 2. The Bubblewrap child receives exactly handshake_descriptor_roles. After the trusted parent validates the preflight record and sends G, the in-namespace process closes descriptors 3 and 4 and immediately reverifies the unchanged standard-stream type, st_dev, st_ino, decoded /proc/self/fd target, and access mode. It then completes loopback_policy. A base session requires that no descriptor above 2 is open and immediately execs the final Coreutils env command. An integration supervisor may then open only integration_supervisor_descriptor_roles, with those exact descriptor numbers, no-follow regular files, access modes, identities, and purposes. The Sway child maps 3 and 4 to its standard output and standard error and closes 3 through 6 before exec. The readiness child maps 5 and 6 to its standard output and standard error and closes 3 through 6 before exec. Immediately before the final Coreutils env exec, the forked candidate child closes every descriptor above 2, requires that only 0, 1, and 2 remain, and reverifies that all three still match the launcher's recorded identities. After candidate and Sway reap, the supervisor closes descriptors 3 through 6 before it opens temporary descriptor 3 for the verified session-root directory under supervisor_cleanup_policy. It closes that descriptor after the cleanup handshake and again requires only descriptors 0 through 2. No branch relies on close-on-exec or Bubblewrap to close a descriptor."
descriptor_fixture_policy = "Exercise the base and integration descriptor branches separately. Base fixtures reject a surviving handshake end, any descriptor above 2, or a substituted standard stream. Integration fixtures accept only descriptors 3 through 6 with the declared role, inode, target, and access mode. They reject an extra supervisor descriptor; a leaked descriptor in the candidate child; a swapped Sway or readiness log; a substituted file, pipe, socket, inode, target, or access mode; a descriptor opened before the post-handshake standard-stream check; and any standard-stream change immediately before the final env exec. In the post-reap cleanup phase only, require descriptors 3 through 6 to close before descriptor 3 is reused for the no-follow session-root directory. Reject cleanup before both reaps, a mismatched directory device, inode, UID, or GID, an unrelated descriptor, or descriptor 3 remaining after the handshake. The handshake, supervisor-log, and final-candidate descriptor goldens remain unchanged."
teardown_lock_fixture_policy = "Use the exact pinned Bubblewrap and flock executables. The trusted parent opens the original lock O_RDWR, records its descriptor identity, and closes that descriptor only in the Bubblewrap launch branch. A detached-descendant fixture keeps the PID-namespace reaper alive after the outer process exits. It must prove that default BSD flock would acquire prematurely, while teardown_lock_verifier_argv conflicts or times out with status 73 until the reaper exits. Then it must acquire only after genuine release. While the reaper is live, the candidate unlinks and recreates teardown_lock_namespace_path. Require the replacement pathname to have a different inode and both parent fstats to retain the original device and inode; never accept a pathname reopen as proof. Reject a leaked lock descriptor in preflight, supervisor, or candidate descriptor inventories; acquisition before the outer process ends; an identity change; nonzero, timeout, signal, exec, unlock, close, or cleanup failure; a session frame written before acquisition; another session start; or bundle creation or upload before acquisition and cleanup. Success removes the replacement and all ephemeral leaves through retained directory authorities while the parent holds the acquired OFD write lock, then unlocks and closes the retained descriptor."
