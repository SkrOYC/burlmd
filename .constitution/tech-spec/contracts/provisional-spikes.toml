handshake_descriptor_policy = "Before it creates the handshake pipes, the trusted launcher establishes the session's final candidate standard input, standard output, and standard error as open descriptors 0, 1, and 2. For each standard descriptor, record its fstat file type, st_dev, st_ino, decoded /proc/self/fd target, and access mode. It creates both pipes with close-on-exec enabled. In the Bubblewrap launch branch only, it closes the parent-retained teardown-lock descriptor, maps the preflight-record write end to descriptor 3 and the acknowledgement read end to descriptor 4, clears close-on-exec only on 3 and 4, and closes the original pipe descriptors plus the record read and acknowledgement write ends before it executes Bubblewrap. The parent branch retains only its teardown-lock descriptor and the two parent handshake ends. The in-namespace trusted wrapper must enumerate exactly this preflight mapping: 0 candidate-stdin, 1 candidate-stdout, 2 candidate-stderr, 3 preflight-record-write, and 4 preflight-ack-read. No other descriptor is allowed. The wrapper writes the complete preflight record to descriptor 3 and closes 3. The parent reads the frame and EOF, validates the bytes, closes its record read end, writes exactly one ASCII G byte to its acknowledgement write end, and closes that end. The wrapper requires exactly G followed by EOF on descriptor 4, then closes 4. Immediately before an `exec` that replaces the wrapper with the candidate command, the wrapper enumerates exactly descriptors 0, 1, and 2. For each descriptor, it requires the recorded file type, st_dev, st_ino, decoded target, and access mode. It doesn't reopen, duplicate, or redirect standard streams during the handshake. The parent closes every handshake descriptor before candidate exec. Any wrong pipe direction, leaked teardown descriptor, extra descriptor, early acknowledgement, missing EOF, byte other than G, standard-stream substitution, or close failure stops the session and runs teardown w