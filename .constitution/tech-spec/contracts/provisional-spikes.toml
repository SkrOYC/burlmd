schema_version = 3
stage = "tech-spec-v1.7.3-provisional"
production_implementation_authorized = false
result_schema = ".constitution/tech-spec/contracts/spike-result.schema.json"

[rules]
write_policy = "allowlist"
required_result = "results.json"
commit_lockfiles = true
record_exact_versions = true
validate_declared_candidates_and_gates = true
all_unlisted_repository_paths_are_read_only = true
validate_unique_run_ids_and_required_roles = true
validate_candidate_attribution = true
validate_artifact_containment_existence_size_and_sha256 = true
copy_external_or_symlinked_build_outputs_into_the_write_allowlist_before_hashing = true
capture_command_exit_status_stdout_and_stderr = true
validate_rfc3339_timestamps_without_relying_on_optional_format_plugins = true

[[spikes]]
id = "SPK-AST-H001"
decision = "OD-04"
path = ".constitution/prototypes/ast"
write_allowlist = [".constitution/prototypes/ast", ".constitution/spikes/SPK-AST-H001.md"]
create_commands = [{ workdir = ".", command = "cargo init --bin .constitution/prototypes/ast" }]
verification_steps = [
  { workdir = ".", command = "cargo test --locked --manifest-path .constitution/prototypes/ast/Cargo.toml --all-targets" },
  { run_id = "linux-reference", run_role = "linux-reference-profile", workdir = ".", command = "cargo run --locked --release --manifest-path .constitution/prototypes/ast/Cargo.toml -- probe --run-id linux-reference --role linux-reference-profile --profile linux-i5-8250u-16gib --output .constitution/prototypes/ast/runs/linux-reference.json" },
  { run_id = "macos-reference", run_role = "macos-reference-profile", workdir = ".", command = "cargo run --locked --release --manifest-path .constitution/prototypes/ast/Cargo.toml -- probe --run-id macos-reference --role macos-reference-profile --profile macos-m1-8gib --output .constitution/prototypes/ast/runs/macos-reference.json" },
  { workdir = ".", command = "cargo run --locked --release --manifest-path .constitution/prototypes/ast/Cargo.toml -- aggregate --contract .constitution/tech-spec/contracts/provisional-spikes.toml --schema .constitution/tech-spec/contracts/spike-result.schema.json --require-role linux-reference-profile --require-role macos-reference-profile --require-distinct-hosts 2 --output .constitution/prototypes/ast/results.json" },
]
candidates = ["markdown 1.0.0 mdast", "comrak 0.54.0", "pulldown-cmark complete model"]
required_gates = ["exhaustive CommonMark representation", "exhaustive selected GFM representation", "frontmatter", "raw HTML", "reference definitions", "tables", "footnotes", "images", "nested formatting", "malformed input", "exact byte positions", "byte-identical untouched source", "OKF link and ghost classification", "block paths", "rendered selections", "structural and range edits", "conflict representation", "existing note-size latency meters", "FFI projection size and latency"]

[[spikes]]
id = "SPK-PATH-H002"
decision = "OD-05"
path = ".constitution/prototypes/path"
write_allowlist = [".constitution/prototypes/path", ".constitution/spikes/SPK-PATH-H002.md"]
create_commands = [{ workdir = ".", command = "cargo init --bin .constitution/prototypes/path" }]
verification_steps = [
  { workdir = ".", command = "cargo test --locked --manifest-path .constitution/prototypes/path/Cargo.toml --all-targets" },
  { run_id = "linux-default-filesystem", run_role = "linux-default-filesystem", workdir = ".", command = "cargo run --locked --release --manifest-path .constitution/prototypes/path/Cargo.toml -- probe --run-id linux-default-filesystem --role linux-default-filesystem --expected-os linux --expected-filesystem default --output .constitution/prototypes/path/runs/linux-default-filesystem.json" },
  { run_id = "macos-default-filesystem", run_role = "macos-default-filesystem", workdir = ".", command = "cargo run --locked --release --manifest-path .constitution/prototypes/path/Cargo.toml -- probe --run-id macos-default-filesystem --role macos-default-filesystem --expected-os macos --expected-filesystem default --output .constitution/prototypes/path/runs/macos-default-filesystem.json" },
  { workdir = ".", command = "cargo run --locked --release --manifest-path .constitution/prototypes/path/Cargo.toml -- aggregate --contract .constitution/tech-spec/contracts/provisional-spikes.toml --schema .constitution/tech-spec/contracts/spike-result.schema.json --require-role linux-default-filesystem --require-role macos-default-filesystem --require-distinct-operating-systems 2 --output .constitution/prototypes/path/results.json" },
]
candidates = ["canonical encoded title-derived component", "canonical opaque path component with title in frontmatter"]
required_gates = ["Unicode normalization", "case equivalence", "Windows reserved names and characters", "trailing dot and space handling", "component and path limits", "deterministic collision disambiguation", "case-only rename", "ghost-link inversion", "default Linux and macOS filesystem probes", "symlink and submodule rejection"]

[[spikes]]
id = "SPK-GIT-L001"
decision = "ADR-015"
path = ".constitution/prototypes/git-analysis"
write_allowlist = [".constitution/prototypes/git-analysis", ".constitution/spikes/SPK-GIT-L001.md"]
create_commands = [{ workdir = ".", command = "cargo init --bin .constitution/prototypes/git-analysis" }]
verification_steps = [
  { workdir = ".", command = "cargo test --locked --manifest-path .constitution/prototypes/git-analysis/Cargo.toml --all-targets" },
  { workdir = ".", command = "cargo run --locked --release --manifest-path .constitution/prototypes/git-analysis/Cargo.toml -- --git-command git --required-version 2.54.0 --contract .constitution/tech-spec/contracts/provisional-spikes.toml --schema .constitution/tech-spec/contracts/spike-result.schema.json --output .constitution/prototypes/git-analysis/results.json" },
]
candidates = ["git merge-tree structured analysis", "temporary-index Git plumbing", "isolated temporary-worktree porcelain"]
required_gates = ["clean and overlapping text edits", "add-add and modify-delete", "rename-edit rename-delete rename-rename rename-add and many-to-one rename", "file-directory conflicts and directory rename effects", "file mode symlink submodule and type changes", "binary assets", "case and Unicode path collisions", "dirty tracked files and untracked checkout blockers", "invalid merge bases and unrelated histories", "interruption and fault injection at every durable transition", "literal Markdown marker examples", "structured conflict records index stages tentative tree ids and exit status", "no mutation of the authoritative worktree", "deterministic NUL-delimited parsing without human error text", "hostile hooks filters merge drivers credential helpers and Git configuration disabled", "reconciliation crash resume and compare-and-swap inputs", "Git redistribution license obligations"]

