closure_view_preflight_policy = "For each session, a fresh trusted in-namespace supervisor applies handshake_descriptor_policy before candidate execution. Its wire record is ASCII preflight-bytes=DECIMAL followed by LF and exactly DECIMAL bytes of UTF-8, LF-only body, then EOF. The body contains, in order: format=burlmd-linux-closure-preflight-v2; session-class=base or integration; selected-manifest-sha256=SHA256; source-identity-count=DECIMAL; the exact selected path-sorted source rows; pid-namespace-private=true; network-namespace-private=true; the unchanged five-descriptor map; store-view-exact=true; forbidden-paths-absent=true; and compositor-state=absent for base or pending-supervisor-start for integration. Each semicolon denotes LF. The parent records the validated body length and SHA-256 in the session frame. The parser rejects the removed userns-disabled field and every other unknown, omitted, duplicated, or reordered assertion."
