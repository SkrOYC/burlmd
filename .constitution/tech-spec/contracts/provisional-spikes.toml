schema_version = 38
stage = "tech-spec-v2.1.20-provisional"
production_implementation_authorized = false
# The Epic G entries preserve the M0 exception. BURL-M015 and BURL-M003 may
# implement only the reproducibility and managed-validation bootstrap. Every
# other production ticket remains blocked by its own evidence and Stage 3/4
# adaptation. Spike write allowlists below remain exhaustive for Spike work.
production_exceptions = [
  "BURL-G001",
  "BURL-G002",
  "BURL-G003",
  "BURL-G004",
  "BURL-G005",
  "BURL-G007",
  "BURL-M015",
  "BURL-M003",
]
result_schema = ".constitution/tech-spec/contracts/spike-result.schema.json"
