static_workflow_shape_fixture_policy = "Inspect trusted reusable-workflow source with duplicate-aware parsing, not the values received by a runner shell. Pin the exact ordered 26 declared producer outputs, 26 declared consumer string inputs, and every observable trusted caller mapping between them. Also pin each canonical consumer input through the declared uppercase environment variable into the matching position of consumer_trusted_validator_inventory. Reject swapped, missing, extra, duplicated, or reordered mappings, declarations, and inventory fields where source structure is observable. Prove that the macOS 26 output boundary ticket-gates and conditionally normalizes producer-sealing-check-run-id, producer-sealing-receipt-artifact-id, and producer-sealing-receipt-upload-action-digest to empty strings for every other ticket before caller mapping. Do not turn runtime-value tests into claims about unobservable YAML key presence, order, duplication, or undeclared names."
consumer_interface_policy = "Before any compatibility artifact acquisition or invocation of scripts/prepare-compatibility-stage-consumer.sh, the macOS 15 trusted workflow wrapper must map each canonical consumer_trusted_inputs name through its consumer_trusted_interface_mappings environment variable into the matching ordered consumer_trusted_validator_inventory field, then invoke scripts/validate-compatibility-stage-interface.sh. For BURL-O001, the validator accepts only 26 nonempty values and the wrapper proceeds to all compatibility downloads, offline verification, and consumer processing. For every other ticket, it accepts only 26 empty values and the wrapper skips only those compatibility steps, then continues the ordinary candidate path. Before caller mapping, the macOS 26 output boundary explicitly ticket-gates and conditionally normalizes producer-sealing-check-run-id, producer-sealing-receipt-artifact-id, and producer-sealing-receipt-upload-action-digest to empty strings for every other ticket; it does not rely on omitted reusable-workflow input defaults. The validator cannot establish source declaration shape or authenticate arbitrary values; downstream attestation, identity, digest, lineage, and freshness checks validate the values that enter consumer processing."
download_action_inputs = ["artifact-ids", "path", "digest-mismatch:error"]
offline_verification_inputs = ["stage artifact", "stage attestation bundle", "producer sealing receipt", "producer receipt attestation bundle", "producer lineage artifact", "producer lineage attestation bundle", "fresh trusted_root.jsonl"]
consumer_binding = "Before any compatibility artifact acquisition or consumer processing, the macOS 15 trusted workflow wrapper invokes scripts/validate-compatibility-stage-interface.sh as required by consumer_interface_policy. Only after that validator accepts 26 nonempty BURL-O001 runtime values does the wrapper perform exact ID-addressed downloads, compare each action digest with its canonical REST digest, and require non-expired stage and producer-receipt state. It fetches a fresh trusted_root.jsonl during the trusted acquisition phase. The wrapper runs three offline gh attestation verify commands for the stage manifest, producer sealing receipt, and compatibility-stage-producer-lineage.json with --bundle --custom-trusted-root -R SkrOYC/burlmd --signer-workflow SkrOYC/burlmd/.github/workflows/ci-role-macos-26-arm64.yml --signer-digest WORKFLOW_SIGNER_SHA --source-digest WORKFLOW_SIGNER_SHA --deny-self-hosted-runners --format json, and writes stage-verification.json, receipt-verification.json, and lineage-verification.json. scripts/prepare-compatibility-stage-consumer.sh consumes and validates those three result files and the 26 runtime values. It verifies the lineage artifact's exact SHA-256, canonical serialization, subject digest, and signed producer-receipt artifact observation. It requires that observation's ID, name, action digest, REST digest, createdAt, expiresAt, and expired:false values to equal the trusted inputs and that expiresAt is later than verifiedAt. It compares all signed output with the exact expected-identity hash, trust anchor, workflow signer, tested source, base, repository, roles, run, attempt, and producing check-run locator. It hashes the parsed verification output and trusted root into consumerBinding. It removes every credential, authentication descriptor, temporary credential file, and ambient configuration before candidate execution."

consumer_exposure = "Validate exact member inventory, byte counts, and SHA-256 digests against compatibility-stage-manifest.json. Copy only required_members into a fresh wrapper-owned input root. Make every directory and file read-only before candidate execution. Do not expose the manifest, attestation bundles, receipt, lineage artifact, trusted root, acquisition output, credentials, or writable producer bytes to candidate commands. After candidate commands finish, the trusted wrapper writes the parsed producerLineage, its exact producerLineageSha256, its producerLineageArtifact receipt, and consumerBinding into the untrusted role manifest."
seal_and_aggregate_policy = "The macOS 15 seal independently reacquires or reconstructs the trusted wrapper facts, compares the candidate-carried producerLineage, producerLineageSha256, producerLineageArtifact, and consumerBinding exactly, and writes them into its version 2 receipt. Final aggregation compares the macOS 26 pre-receipt stage observation, the signed immutable lineage artifact, macOS 15 manifest, macOS 15 receipt, service artifacts, and verified seal origins. Missing, duplicate, substituted, expired, digest-mismatched, unattested, wrong-signer, wrong-run, wrong-role, wrong-seal, unexpected, stale-producer-receipt, or consumer-unbound stages reject the run."

[ci_bootstrap.stage4_tasks_adaptation]
status = "required"
affected_tickets = ["BURL-M003"]
maintained_stop_tickets = ["BURL-O001"]
policy = "Stage 4 must adapt only affected_tickets, which contains BURL-M003, to raw contract version 38 and ADR-0020. Within BURL-M003's existing devenv.nix, devenv.lock, and scripts/** scope, it may add locked Diffutils and Linux-only Procps and iproute2 packages; implement scripts/supervise-linux-session.sh and the Git-tracked mode-0644 scripts/managed-sway.conf; and update the managed-role launcher, isolation helper, fresh-seal parser, and existing fixtures. The adaptation implements the seven ordered sessions whose sole candidate namespace and session-payload launch is Bubblewrap, canonical RUNNER_TEMP and role-output roots, parent manifests below the RUNNER_TEMP-owned root, the authority-backed read-only /contract mount and sole locked-nix-closure.sources file, exact full-vector binding, five base sessions without runtime or compositor state, and two integration sessions with distinct authority-backed writable mode-0700 xdg-runtime leaves. It also implements trusted loopback setup before candidate or Sway startup, the exact final candidate env -i boundary, separate base and integration descriptor branches, in-namespace Sway supervision with swaybg_command - and no swaybg process or output, exact wayland-1 semantics, frozen capacity authority, preflight, the parent-retained original teardown-lock descriptor and util-linux `flock --fcntl` verification, the post-reap descriptor-3 session-root identity check and cleanup handshake, runtime-leaf removal, the fail-closed hosted AppArmor probe and catchable-exit restoration guard, version 2 closure log, and exhaustive mutation coverage. The trusted parent retains the exact preparation, version and identity checks, and post-session flock verifier already required by the contract; this policy adds no general parent-process allowlist. maintained_stop_tickets contains BURL-O001 only to preserve its explicit stop and later Stage 3 route for Linux Nix packaging isolation and capacity; it doesn't authorize BURL-O001 implementation. Ticket IDs, dependencies, estimates, evidence schemas, evidence-class profiles, artifact inventories, and the epic graph do not change."

