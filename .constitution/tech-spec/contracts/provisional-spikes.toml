apparmor_probe_policy = "Before dependency execution or any candidate process, the trusted ubuntu-24.04 wrapper runs a minimal parent-only Bubblewrap probe. Its view is the exact sorted union of the requisite closures for apparmor_probe_shell and iproute2_store_member, and it requires all five recorded closure measurements. It applies namespace_argv; --proc /proc; --dev /dev; --dir /nix; --dir /nix/store; one same-path read-only bind per probe member; --; and apparmor_probe_argv_tail with APPARMOR_PROBE_SCRIPT replaced by the exact apparmor_probe_script bytes. The underscore fixes Bash positional argument 0, so ip_executable is positional argument 1. The probe exposes no host store root. The script performs loopback_raise_argv and the semantic check from loopback_verify_argv. If it succeeds, the wrapper doesn't change a sysctl. If it fails, the wrapper may continue only when /proc/sys/kernel/apparmor_restrict_unprivileged_userns exists, contains exactly 1 plus LF, the trusted runner-placement guards identify the fixed GitHub-hosted ubuntu-24.04 job, /usr/bin/sudo and /usr/sbin/sysctl are root-owned non-writable regular executables, and noninteractive sudo is available. Before any change, it stores the original value and installs EXIT, HUP, INT, QUIT, and TERM restoration handlers. It then runs exactly /usr/bin/sudo --non-interactive -- /usr/sbin/sysctl -w kernel.apparmor_restrict_unprivileged_userns=0, requires the proc file to contain exactly 0 plus LF, and reruns the same pinned probe. Any failed precondition, write, value check, or second probe rejects the role. After all sessions, and on every catchable earlier exit or handled signal, the handler writes the saved value with the same executables and requires the proc file to contain exactly that value plus LF. The trusted wrapper must prove restoration before it creates or uploads the candidate bundle. A restoration failure blocks upload. SIGKILL, abrupt runner loss, and host failure can't run the handler; those paths produce no upload, and the ephemeral hosted runner boundary is the residual limit on the temporary host-wide change. Candidate code receives no sudo executable, host /proc/sys mount, host sysctl descriptor, passwordless-sudo interface, or workflow step capable of changing host policy."
apparmor_fixture_policy = "Reproduce the 33-member probe closure and all five recorded measurements. Reject a missing, extra, reordered, substituted, broad-store, or writable mount and any probe-argv change. Fixtures cover a successful first probe with no sudo call; a failed probe with a missing knob, a value other than 1, an invalid sudo or sysctl executable, unavailable noninteractive sudo, a failed write, a nonzero post-write value, and a failed second probe; and successful restoration after success, candidate failure, timeout, each handled signal, and wrapper error. Every catchable failure rejects before upload. A hosted ubuntu-24.04 run must retain the observed image version, kernel version, initial and final sysctl values, both probe results when the override runs, and the restoration result. The fixture documents that SIGKILL and abrupt runner loss can't execute or record restoration and therefore can't produce an accepted upload. Local systems without the Ubuntu knob validate only the no-override probe and state-machine fixtures; they don't establish hosted behavior."
