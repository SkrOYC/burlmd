closure_view_log_golden_fixture_policy = "The explicitly synthetic golden fixes the version 2 header with the exact util-linux verifier identity, nine-field host-policy row, 25-field session-row grammar, exact seven-session order, five base and two integration class assignments, descriptor and loopback results, two payload delimiters, serializer-golden complete-argv fields, and integration cleanup result. Its 163 authority rows and 163 current-path rows derive from 22 dynamic mount sources for each of seven sessions, one staging source per session, and one runtime source for each of two integration sessions. The authority rows hash to a84bfa98dbb926d0c4e03228d4291ae0586a770fe8ba9a64984d4f6e390152c6. The base and integration preflight bodies are 626 and 886 bytes with SHA-256 values 3e94e0e21b39baffe00f7c0898217cd82efdf18bef7df28f7e8aa1e8ec50191a and d062b02dd1e6549645ea41ff6b8ff8a8117ae23db4fec3a8f6fa60f97d3a9b0a. Its /work paths are fixture data only. The separate serializer golden covers every argument category with reduced manifests. The full-vector fixtures use the actual 488-member and 547-member manifests. Production counts derive from the retained production inventory; they don't copy the synthetic values. Each synthetic session row carries a distinct positive inode, stable identity, and successful acquisition. Production frames retain complete runtime manifests, resolved absolute authority and current paths, measurements, AppArmor observations, and reconstructed argv values."
capacity_authority_fixture_policy = "Preserve the exact 16-field capacity-authority grammar and unique current-path resolution. Derive the row count from the fixture's actual rows. For each session, require the authority and current-path identifiers to equal closure-staging plus the 22 parsed dynamic_mount_plan sources. Require each integration session to add xdg-runtime and every base session to omit it. Reconstruct all seven vectors with zero unresolved identifiers. Reject any missing, extra, substituted, duplicated, reordered, linked, escaping, unsupported-path, wrong-device, wrong-mount, wrong-ownership, wrong-mode, wrong-kind, alias, or reused source before argv acceptance. Runtime-specific mutations also reject a base-session declaration, an omitted or read-only bind, a wrong destination, a mode-0755 directory fallback, and precreated socket or other content."
compositor_fixture_policy = "Reproduce the unwrapped Sway and swaymsg closure and the base-plus-compositor integration closure twice with pinned Nix 2.35.2. Require every recorded count, byte count, SHA-256, NAR-size sum, bind metric, executable path, version, and executable SHA-256. Base-session fixtures prove no compositor-only member, socket, Wayland variable, or compositor process exists. Integration fixtures prove exact env -i, exact argv, the Git-tracked mode-0644 72-byte no-include config with swaybg_command - first, its read-only mount without a claimed 0444 visible mode, WLR_BACKENDS=headless selection, pixman renderer, Xwayland disablement, exact wayland-1 path, readiness through exact swaymsg, and parent-only Bubblewrap launch. Require no swaybg process or output on success and cleanup paths. Inject a fake swaybg process and output canary across candidate failure, early Sway failure, timeout, socket disruption, interruption, graceful reap, and SIGKILL fallback; each survivor or output byte rejects the session."
evidence_binding_policy = "The BURL-M003 Linux role manifest retains exactly one closure-view log through roleEvidence.internalArtifacts. Fresh sealing parses closure_view_log_policy, reconstructs both complete manifests and every complete Bubblewrap argv from trusted version 38 contract data plus retained canonical authority/current-path rows, and requires exact byte counts and SHA-256 values. It validates the authority-backed /contract mount and its sole exact source-identity file, the class-specific descriptor branch and preflight, the original teardown-lock identity and post-Bubblewrap OFD-lock acquisition, loopback setup before candidate or Sway startup, five base sessions with no compositor state or runtime mount, and two integration sessions with distinct empty mode-0700 runtime leaves. It also validates the mode-0644 Sway source file's exact bytes and read-only mount, the exact final candidate environment boundary, no swaybg process or output, supervisor result, Sway reap, runtime cleanup, AppArmor restoration when used, and leaf removal before the next session. It rejects any argv, environment, descriptor, teardown-lock, contract-content, runtime-leaf, host-root, manifest, loopback, or restoration mutation; any parent compositor claim; candidate-defined result; malformed cleanup; session overlap; or absent authority. The unchanged role and aggregate schemas bind the log through the role and sealed bundle digests. Candidate, Sway, swaymsg, their output, and candidate-visible sockets remain untrusted; only fresh sealing is authoritative."
prototype_measurement = "Two independent pinned-Nix 2.35.2 reproductions produced identical manifests. The base closure has 488 paths, 30,717 manifest bytes, SHA-256 127043afe260d7756ee6cbda03e39a5bfceb4f7f79ae3a5be1595e447ce15e64, 6,184,635,112 summed NAR bytes, and 66,314 bind bytes. The exact unwrapped compositor closure has 195 paths, 11,865 bytes, SHA-256 d97a41799b1aecc670e31bfd58b339d748498be2bce09d877a0f1a9ed1c6e673, 649,324,904 summed NAR bytes, and 25,680 bind bytes. Its union with the base produces the integration closure: 547 paths, 34,315 bytes, SHA-256 353e927fb857fe8f8fc213da4ac53e0a12147ead779e2e29289c6a3034415896, 6,338,147,240 summed NAR bytes, and 74,100 bind bytes. The Bubblewrap parent closure remains eight paths, 480 bytes, SHA-256 398d11c9cd9249369cbb18d36661014eafef5ac18ff7adeb076c2c51ef0141fd, 40,679,016 summed NAR bytes, and 1,040 bind bytes. The Bash-plus-iproute2 probe closure has 33 paths, 1,985 manifest bytes, SHA-256 8417a87e4610c15b6237f416532defaaee9c93a06f2b605c6abaeaa8278df8b2, 97,009,672 summed NAR bytes, and 4,300 bind bytes. The complete reduced serializer golden is 253 arguments and 5,554 bytes with SHA-256 dbed8cb348fa19fdd9304931dd9a2b8c6e68870516cff2cf94dc202a129f96e1. Full synthetic-path construction produced the seven full_vector_fixture_records values from the actual manifests with zero unresolved authority identifiers. The complete synthetic authority inventory has 163 rows and SHA-256 a84bfa98dbb926d0c4e03228d4291ae0586a770fe8ba9a64984d4f6e390152c6. Removing the stale userns-disabled assertion produced 626-byte base and 886-byte integration preflight bodies with SHA-256 values 3e94e0e21b39baffe00f7c0898217cd82efdf18bef7df28f7e8aa1e8ec50191a and d062b02dd1e6549645ea41ff6b8ff8a8117ae23db4fec3a8f6fa60f97d3a9b0a. A pinned Bubblewrap 0.11.2 probe raised and verified loopback with the revised namespace_argv; the removed user-namespace-disabling pair made the same ip command fail with RTNETLINK Operation not permitted. A pinned mode probe observed 0700 through the writable bind and 0755 through the rejected directory fallback. The exact unwrapped Sway 1.12 configuration validated and started headless with no swaybg process. The Bubblewrap-plus-Bash environment probe rejected inherited PWD, SHLVL, _, and canary values at the final GNU env -i exec boundary. Earlier compositor prototypes covered success, early failure, socket disruption, timeout, and hostile candidate status 42 with descendant cleanup; every case waited for Sway and verified that its PID was absent. An exact Bubblewrap 0.11.2 and util-linux 2.42 probe retained an O_RDWR descriptor across candidate pathname replacement. Default BSD flock acquired while the reaper lived, but `--fcntl --exclusive` conflicted, the exact five-second timeout returned 73 after 5,007 ms, and final acquisition waited 968 ms for genuine release. The retained descriptor stayed on device and inode 66305:39336124 while the replacement path resolved to 66305:39336135. The local system has no kernel.apparmor_restrict_unprivileged_userns proc entry, so only a managed ubuntu-24.04 run can verify whether the temporary precondition is needed and restored there. These local observations do not settle hosted BURL-M003 evidence."
fixture_policy = "Preserve every applicable closure-view, capacity, descriptor, hidden-state, read-only, runtime, teardown, and cleanup fixture. Apply complete_argv_fixture_policy, descriptor_fixture_policy, teardown_lock_fixture_policy, apparmor_fixture_policy, compositor_fixture_policy, supervisor_cleanup_policy, candidate_environment_fixture_policy, session-contract content checks, class-specific manifest/source checks, and exact version 2 log parsing. Static fixtures must reject every extra, omitted, reordered, duplicated, or substituted argument, including added capabilities, contract-mount mutations, runtime-mount mutations, and host-root alias binds. Runtime mutations include omission, read-only replacement, wrong source or destination, a mode-0755 directory fallback, a substituted or reused leaf, precreated socket or other content, loopback setup after candidate or Sway startup, and any unapproved supervisor descriptor, a leaked teardown descriptor, a pathname replacement used as verification authority, premature lock acquisition, or a session record before genuine lock release. Fresh-seal mutation fixtures exercise the same rejection matrix."

