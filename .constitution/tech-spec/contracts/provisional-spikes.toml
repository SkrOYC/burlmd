schema_version = 14
stage = "tech-spec-v1.8.0-provisional"
production_implementation_authorized = false
# The Epic G entries preserve the M0 exception. FLAKE-M002 and CI-M003 may
# implement only the reproducibility and managed-validation bootstrap. Every
# other production ticket remains blocked by its own evidence and Stage 3/4
# adaptation. Spike write allowlists below remain exhaustive for Spike work.
production_exceptions = [
  "SHELL-G001",
  "PREF-G002",
  "STATE-G003",
  "TABS-G004",
  "CLOSE-G005",
  "NAV-G007",
  "FLAKE-M002",
  "CI-M003",
]
result_schema = ".constitution/tech-spec/contracts/spike-result.schema.json"
ci_role_evidence_schema = ".constitution/tech-spec/contracts/ci-role-evidence.schema.json"
ci_evidence_schema = ".constitution/tech-spec/contracts/ci-evidence.schema.json"

[rules]
write_policy = "allowlist"
required_result = "results.json"
commit_lockfiles = true
declare_dependencies_with_cli_and_regenerate_lockfile_after_the_last_dependency_change = true
record_exact_versions = true
validate_declared_candidates_and_gates = true
all_unlisted_repository_paths_are_read_only = true
validate_unique_run_ids_and_required_roles = true
validate_candidate_attribution = true
validate_artifact_containment_existence_size_and_sha256 = true
copy_external_or_symlinked_build_outputs_into_the_write_allowlist_before_hashing = true
capture_command_exit_status_stdout_and_stderr = true
semantically_parse_rfc3339_timestamps_and_reject_invalid_calendar_dates_without_optional_format_plugins = true
capture_host_fingerprint_os_version_architecture_filesystem_and_profile_from_system_apis = true
never_accept_caller_supplied_host_facts_as_evidence = true
capture_repository_revision_tree_lockfile_contract_schema_probe_source_probe_binary_and_corpus_hashes = true
resolve_recorded_repository_revision_to_the_captured_checkout = true
reject_cross_host_repository_tree_lockfile_contract_schema_probe_source_or_corpus_mismatch = true

[ci_bootstrap]
status = "bootstrap-authorized-provisional"
generated_binding_checker = "scripts/check-generated-bindings.sh"
generated_binding_checker_owner = "CI-M003"
generated_binding_checker_base_state = "absent"
generated_binding_checker_behavior = "Before any gate invokes the checker, implement it without importing or cherry-picking the coordinating Epic G branch. Snapshot a path-sorted SHA-256 manifest and byte-for-byte backup of rust/src/frb_generated.rs and every regular file under lib/src/rust. Run flutter_rust_bridge_codegen generate using provisional version 2.12.0. Compare file sets and bytes, fail on generator error or stale output, and restore and verify the exact precheck state on success, failure, or interruption."
candidate_phase = "pushed-source-branch"
draft_pull_request = "optional-visibility-only"
aggregation = "coordinator-job-or-authenticated-local"
report_phase = "evidence-commit-parented-directly-by-tested-source-before-milestone-review"
caller_workflow = ".github/workflows/ci.yml"
api_version = "2026-03-10"
expected_identity_fields = ["ticket", "release", "tested-source-head-sha", "workflow-execution-sha", "workflow-execution-ref", "base-sha", "workflow-event", "evidence-report-commit-policy", "build", "corpus", "run", "required-roles", "required-role-signers"]
capture_fields = ["ImageOS", "ImageVersion", "os-release", "architecture", "cpu-model", "logical-cpu-count", "memory-bytes", "storage-bytes", "logical-viewport", "ticket", "tested-source-head-sha", "workflow-execution-sha", "workflow-execution-ref", "base-sha", "build", "corpus", "run", "role"]
ci_role_evidence_schema_version = 4
ci_evidence_schema_version = 5
role_phase = "Write every result, log, raw measurement, and handoff first. Record each relative path, size, and SHA-256 digest in internalArtifacts. Validate ci-role-evidence.json, then create deterministic ci-role-evidence.tar.zst containing the manifest and every named file. Attest the exact bundle bytes and upload an artifact containing only that unchanged bundle. The manifest never contains bundle, artifact, upload, or attestation fields."
aggregate_phase = "Verify the upload digest, attested role-bundle digest, safe bundle extraction, manifest schema, and every internalArtifacts path, size, and hash. For a managed Spike, atomically stage manifest-named bytes under the fixed coordinator root, run that ticket's exact coordinator_steps, and validate its declared results.json before validating accepted or rejected coordinator output against ci-evidence.schema.json. Accepted Spike output requires all roles, a valid authoritative machine result, and successful checks. Rejected output permits partial or missing roles and records typed reasons."
origin_authentication = "Trigger the caller from a pushed source branch and call each same-repository role workflow through a static ./.github/workflows path, which resolves from the caller's workflow execution commit. Verify the attestation's signed builder identity against the expected role-specific path, execution ref, and execution SHA and verify its invocation run and attempt. Require signed OIDC runner_environment to equal github-hosted and retain that fact in aggregate origin; reject self-hosted regardless of labels. Query the versioned job API only to corroborate the fixed hosted label. Artifact and job REST objects are not directly correlated, and an artifact-supplied job name or ID is never trusted. Private/internal repository attestation requires GitHub Enterprise Cloud; without it evidence remains rejected and there is no hash-only fallback."
caller_permissions = ["contents:read", "id-token:write", "attestations:write"]
signer_permissions = ["contents:read", "id-token:write", "attestations:write"]
aggregate_permissions = ["contents:read", "actions:read", "attestations:read"]
reject = ["expected-identity-invalid", "role-manifest-invalid", "role-bundle-invalid", "missing-role", "duplicate-role", "unexpected-role", "role-gate-failed", "identity-mismatch", "stale-evidence", "workflow-signer-mismatch", "runner-label-mismatch", "runner-environment-mismatch", "untrusted-origin", "attestation-unavailable", "artifact-api-mismatch", "artifact-corrupt", "mixed-image-version", "aggregation-error"]

[ci_bootstrap.source_push]
required_event = "push"
local_reusable_workflow_syntax = "./.github/workflows/{WORKFLOW_FILE}"
expressions_or_ref_suffixes_in_job_uses_forbidden = true
tested_source_head_equals_workflow_execution_sha = true
ignored_evidence_only_paths = [".constitution/reports/**", ".constitution/prototypes/**/managed-evidence.json", ".constitution/prototypes/**/results.json", ".constitution/spikes/SPK-*.md"]
report_commit_parent = "tested-source-head-sha"
report_commit_diff = "For a managed Spike, exactly managed_report, managed_results, and the executor-authored human_report. For CI-M003 bootstrap, exactly REPORT_JSON."

[ci_bootstrap.cli]
entrypoint = "./scripts/managed-evidence.sh"
authentication_environment = "GH_TOKEN"
token_must_not_appear_in_arguments_logs_reports_or_artifacts = true
expected_identity_artifact = "managed-evidence-expected-{run_id}-{run_attempt}"
expected_identity_member = "expected-identity.json"
role_artifact = "managed-evidence-{role}-{run_id}-{run_attempt}"
role_artifact_member = "ci-role-evidence.tar.zst"
role_bundle_manifest = "ci-role-evidence.json"
role_bundle_internal_artifacts = "exactly-every-manifest-internalArtifacts-entry-and-no-other-files"
output_schema = ".constitution/tech-spec/contracts/ci-evidence.schema.json"
stderr = "diagnostics-only"
output_directory = "dirname(REPORT_JSON)"
coordinator_root = "OUTPUT_DIR/managed-evidence-coordinator"
role_stage_directories = ["roles/linux-x86_64", "roles/macos-26-arm64", "roles/macos-15-arm64"]
stage_policy = "Atomically replace the coordinator root. Stage only verified manifest-named regular files beneath the exact role directory, preserving ticket-root-relative names. Reject absolute paths, traversal, links, collisions, allowlist escape, extra files, and byte mismatch."
coordinator_cleanup_policy = "Before coordinator_steps, snapshot every ticket-declared coordinator_mutable_paths entry. After atomically publishing validated managed_results, or after failure, restore those paths byte-for-byte to their precheck state and remove the owned coordinator root."
output_write = "atomic-replace-results-then-report"
stdout_fields = ["status", "runId", "runAttempt", "result", "report"]
exit_0 = "The output report is schema-valid and accepted. For a managed Spike, the declared results.json is also present, schema-valid, and contract-valid."
exit_1 = "The output report is schema-valid and rejected."
exit_2 = "Invalid arguments, insufficient API permission, interruption, no unique push run, timeout before authoritative identity is available, or output failure prevented a schema-valid report."

[ci_bootstrap.cli.collect]
usage = "./scripts/managed-evidence.sh collect --ticket TICKET_ID --source-ref SOURCE_REF --run-id RUN_ID --attempt RUN_ATTEMPT --source-head-sha SOURCE_HEAD_SHA --base-sha BASE_SHA --output REPORT_JSON"
permissions = ["actions:read", "attestations:read", "contents:read"]
allowed_tickets = ["CI-M003", "AST-H001", "PATH-H002", "ASSET-I001", "GIT-L001", "PKG-M001"]
required_event = "push"
behavior = "Require the remote source ref to resolve to the supplied source head. Verify caller workflow path, event, ticket, run, attempt, source ref, source head, workflow execution SHA and ref, and base SHA. Download the separately produced expected-identity artifact and every exact role-bundle artifact for that run. Verify identity, hashes, bundle contents, artifact metadata, attestations, static signer workflows, signed github-hosted origin, and hosted labels. For a managed Spike ticket, atomically stage verified role contents, execute coordinator_steps, validate and publish managed_results, and then publish accepted or rejected aggregate evidence. CI-M003 has no Spike coordinator steps or machine result and writes only its aggregate report. Never select a run by recency or trust a self-reported job name or ID."

[ci_bootstrap.cli.run]
usage = "./scripts/managed-evidence.sh run --ticket TICKET_ID --source-ref SOURCE_REF --source-head-sha SOURCE_HEAD_SHA --base-sha BASE_SHA --output REPORT_JSON"
permissions = ["actions:read", "attestations:read", "contents:read"]
allowed_tickets = ["AST-H001", "PATH-H002", "ASSET-I001", "GIT-L001", "PKG-M001"]
timeout_seconds = 7200
initial_attempt = 1
behavior = "Require the source commit to be pushed and the remote source ref to resolve to the supplied full SHA. Find exactly one push-triggered fixed-caller run matching the ticket's declared prototype allowlist, source ref, and source head, wait for attempt 1 to finish, then perform the collect protocol. After verifying every required bundle, stage its manifest-named contents under the fixed coordinator root, execute the ticket's exact coordinator_steps, validate and atomically publish managed_results, and atomically publish managed_report. Reject zero or multiple runs and any missing or invalid result. Never identify the run by list order, time, branch alone, pull-request state, or a self-reported job name or ID."

