complete_argv_policy = "Construct one argv per sessions entry in this order: the exact Bubblewrap executable as argv[0]; namespace_argv; one --setenv KEY VALUE triple for every fixed_candidate_environment entry followed by every derived_candidate_environment entry in their listed orders; --lock-file followed by teardown_lock_namespace_path; fixed_filesystem_argv, including --dir /contract and no /candidate/xdg/runtime creation; every dynamic_mount_plan entry in order using the exact absolute current source path resolved from that session's retained authority row. For an integration session only, insert integration_runtime_mount immediately after the session-contract-root read-only bind. Resolve its source from that session's frozen integration_runtime_authority declaration and matching current-path row. Then add one --ro-bind PATH PATH triple per selected manifest member in byte-sorted order; --symlink /nix/store/sr26flm2nkfa12dkrwj2630kqsfakky4-coreutils-9.11/bin/env /usr/bin/env; for integration only, --symlink /nix/store/zh1ijdhb6gng1509b1zrilb6xlzx60j6-bash-5.3p9/bin/bash /bin/sh; --chdir /source; --; supervisor_argv_prefix with SESSION_ID and SESSION_CLASS replaced; and the exact matching sessions.command elements. Base sessions select the complete 488-member base manifest and omit integration_runtime_mount. Integration sessions select the complete 547-member integration manifest. Production vectors use trusted_host_root_policy's canonical RUNNER_TEMP and role-output paths; /work appears only in the explicit synthetic fixtures. No source, destination, option, environment assignment, separator, supervisor argument, or candidate argument may be inferred from tested source. The trusted launcher calls execve directly with bubblewrap_process_environment, records complete_argv_encoding's byte count and SHA-256, and executes that same in-memory vector without shell reparsing or a parent env helper process."
complete_argv_fixture_policy = "First reproduce serializer_golden_policy and its exact argument count, bytes, and SHA-256. Then reproduce every full_vector_fixture_records entry from the complete 488-member or 547-member manifest. A duplicate-aware fixture reconstructs every runtime vector only from trusted contract data and retained canonical authority/current-path rows. It requires all 22 dynamic_mount_plan source identifiers for each session, the integration-only xdg-runtime source, zero unresolved identifiers, and byte-for-byte equality. For every position and option arity, mutations add, omit, reorder, duplicate, or substitute one argument and must reject. Required mutations cover another namespace option, any --cap-add or --cap-drop change, an extra capability, a host-root or alias bind, broad /, /usr, /nix, or /nix/store exposure, a missing, writable, substituted, duplicated, reordered, or extra /contract mount or contract entry, a host `/contract` manifest source in place of the RUNNER_TEMP-relative manifest, a changed bind source or destination, an omitted authority identifier, a retained path containing tab, carriage return, or backslash, another symlink, closure-class substitution, another manifest member, a changed environment key or value, another supervisor, missing --, another session command, and trailing arguments. The integration matrix also rejects an omitted runtime bind, --ro-bind in place of --bind, a wrong runtime source or destination, --dir /candidate/xdg/runtime as a mode-0755 fallback, a substituted or reused runtime leaf, and a leaf with a precreated socket or other content. Base vectors reject any runtime bind, runtime directory, socket, or integration variable. Byte-count equality, set equality, a reduced golden, or successful Bubblewrap parsing never satisfies a production fixture. Fresh sealing reconstructs the actual runtime bytes from the full retained manifest and canonical paths before it accepts a frame."
mount_policy = "Start every session from Bubblewrap's empty root. Apply the exact complete_argv_policy. Mount only the authority-backed session contract leaf read-only at /contract. Bind the selected staging store base read-only at /nix/store, then add one same-path read-only bind per selected class manifest member. Never bind host /, /usr, /nix, /nix/store, Nix state, the Nix database, the daemon socket, a host compositor runtime, or an unlisted store path. Base sessions must not mount a compositor-only member, create or mount /candidate/xdg/runtime, create a Wayland or Sway IPC socket, or receive a Wayland variable. Each integration session mounts the complete integration manifest. It also mounts only its writable, initially empty, authority-backed xdg-runtime leaf at /candidate/xdg/runtime and creates both sockets inside that leaf. The authority-backed /candidate/session bind stays writable for the existing frame-and-acknowledgement exchange. The parent retains the original teardown-lock descriptor, so no separate lock-file bind or read-only mount is allowed. Before the candidate command, require the single exact /contract file, visible store entries, and source identities to equal the selected class manifest. Require /nix/var, its database and daemon paths, an unlisted host-store canary, and the Bubblewrap executable to return ENOENT. Reject writes to /contract, its file, every mounted member, and any extra contract or store entry."
argument_budget_policy = "Before each Bubblewrap exec, measure the complete_argv_encoding byte count and require it below half of getconf ARG_MAX. The session frame retains that count and the complete-vector SHA-256. The base and integration bind-only metrics are reproducible manifest comparisons, not substitutes for the complete-vector digest. Do not fall back to a broad bind, inherited descriptor, shell-expanded argument text, or Bubblewrap --args."
loopback_policy = "Immediately after the descriptor handshake succeeds and before any candidate, Sway, or swaymsg process starts, the trusted in-namespace supervisor runs loopback_raise_argv with an empty environment. It then runs loopback_verify_argv and requires status zero plus exactly one nonempty line for interface lo whose flags include UP. Failure rejects the session before candidate-controlled code runs. The candidate's loopback fixture must still bind, listen, connect, and exchange bytes over 127.0.0.1. No non-loopback interface, route, or external network access is permitted."
