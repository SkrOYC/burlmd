[ci_bootstrap.actions]
checkout = "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09"
install_nix = "cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24"
install_nix_transitive_version = "2.35.2"
install_nix_interface = "The pinned install-nix.sh source sets nix_version=2.35.2 and downloads the corresponding releases.nixos.org installer only when install_url is empty. The trusted workflow must omit install_url and must not set INPUT_INSTALL_URL through another step or environment source. Before the action, require command -v nix to fail so the action cannot accept a preinstalled version through its early exit. Immediately after the action and before any closure query, run nix --version and nix-store --version from the action-installed PATH. Require exact output nix (Nix) 2.35.2 from nix and nix-store (Nix) 2.35.2 from nix-store and require their resolved executables to share the installed Nix profile. Static fixtures reject an install_url key, expression, environment mapping, or action wrapper that can supply it. Runtime fixtures reject preinstalled Nix, missing or changed version output, different nix and nix-store versions, and any closure reproduction that doesn't use the observed 2.35.2 commands. This transitive pin belongs to the exact action interface and doesn't add a separate bill-of-materials record."
upload_artifact = "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
upload_artifact_interface = "Use name, path, overwrite:false, and if-no-files-found:error. Read artifact-id as the service artifact ID and artifact-digest as the bare SHA-256 digest."
download_artifact = "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"
download_artifact_interface = "For the BURL-O001 stage, producer receipt, and producer-lineage artifact, set artifact-ids to the exact comma-free service ID, set path explicitly, set digest-mismatch:error explicitly, and omit name."
attest = "actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6"
attest_interface = "Set subject-path to the exact file, push-to-registry:false, and create-storage-record:false. Copy the returned bundle-path bytes into the declared artifact member before upload; retain attestation-id and attestation-url only as diagnostics, not authority. The seal needs id-token:write and attestations:write but no artifact-metadata authority for this binary-file mode."

[multi_host_handoff]
transport = "Each role exports the Spike's opaque tar.zst handoff plus SHA-256 sidecar and names both in the attested role bundle manifest. After artifact, attestation, manifest, and byte verification, managed-evidence stages those files under OUTPUT_DIR/managed-evidence-coordinator/roles/ROLE_ID using ticket-root-relative names. Exact coordinator_steps copy or import only authenticated staged paths; no manual source or environment-selected handoff is permitted. BURL-O001 is the sole exception to ordinary post-run staging: the macOS 26 seal creates the authenticated compatibility stage, and the macOS 15 trusted wrapper verifies and exposes it before candidate execution as specified by role_prerequisites. The result tool captures host facts from system APIs. Expected flags are assertions, not evidence sources. Aggregation verifies sidecars, run identity, role, distinct host fingerprints, host facts, containment, artifact digests, and BURL-O001 lineage."

[reference_profiles]
interpretation = "Profile roles describe evidence the environment can produce. They do not require every ticket to produce every capability. requiredEvidenceClasses and ticket_evidence_profiles are the acceptance authority for one managed run."

