[multi_host_handoff]
transport = "Each role exports the Spike's opaque tar.zst handoff plus SHA-256 sidecar and names both in the attested role bundle manifest. After artifact, attestation, manifest, and byte verification, managed-evidence stages those files under OUTPUT_DIR/managed-evidence-coordinator/roles/ROLE_ID using ticket-root-relative names. Exact coordinator_steps copy or import only those authenticated staged paths; no network transfer, manual source, or handoff environment variable is permitted. The result tool captures host facts from system APIs and derives a per-Spike SHA-256 host fingerprint from the operating-system machine identity; expected flags are assertions, not evidence sources. Every run records repository revision and tree, every lockfile, contract, schema, probe source tree, platform probe binary, and corpus manifest SHA-256. Aggregation verifies sidecars, run identity, role, distinct host fingerprints, host facts, containment, and artifact digests. It rejects any cross-host mismatch in repository revision/tree, lockfile set, contract, schema, probe source, or corpus; platform probe-binary hashes remain required and attributed but can differ. A shared checkout path or caller-supplied run label is not evidence."

[reference_profiles]
interpretation = "Profile roles describe evidence the environment can produce. They do not require every ticket to produce every capability. requiredEvidenceClasses and ticket_evidence_profiles are the acceptance authority for one managed run."

