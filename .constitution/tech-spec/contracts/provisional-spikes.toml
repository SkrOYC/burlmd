closure_root_policy = "BURL-M003 must add `pkgs.diffutils`, Linux-only `pkgs.procps`, and Linux-only `pkgs.iproute2` to `devenv.nix`. Resolve every base command through that authoritative launcher environment. Require `cmp`, `ps`, `ip`, and `flock` to equal their exact contract paths and require the exact teardown-lock verifier version output and executable SHA-256, and reject `/usr`, `/run/current-system`, and other non-store results. Resolve cargo-expand, the OpenSSL directories, and both Mesa roots as specified by closure_root_inventory. Reduce results to top-level store paths. Resolve base_manifest_host_relative_path and integration_manifest_host_relative_path below the canonical RUNNER_TEMP root; reject an absolute, linked, escaping, or `/contract` host path. With pinned Nix 2.35.2, expand, sort, and write the base manifest to its resolved host path. It must match all five base_closure measurements and exclude Bubblewrap plus every member reached only by the Bubblewrap closure or compositor closure. Expand the exact unwrapped Sway and swaymsg roots from linux_integration_session_compositor, write that sorted requisite closure to its resolved closure_manifest_host_relative_path, and union it with the base manifest. The resulting integration manifest goes to its resolved host path and must match all five integration_closure measurements. It contains the complete compositor closure. Compute each bind metric as the NUL-inclusive UTF-8 size of the ordered --ro-bind PATH PATH triples. Reject an empty, duplicate, noncanonical, missing, linked, cross-class, incomplete, namespace-destination, or unsupported host path. Verify the selected class manifest before every session."
teardown_lock_policy = "Before each Bubblewrap launch, the trusted parent uses openat on the already verified session-root directory descriptor with O_NOFOLLOW, O_CREAT, O_EXCL, O_RDWR, and mode 0600 to create teardown_lock_basename. It retains that open file description and records its regular-file st_dev and st_ino. The Bubblewrap launch branch closes this descriptor before mapping the handshake descriptors or calling execve, and its descriptor checks reject any candidate-visible copy. Bubblewrap 0.11.2 then opens the pathname read-only and holds a traditional POSIX F_RDLCK through F_SETLK while its PID-namespace reaper lives. After the outer Bubblewrap process ends, but before accepting the session, removing any ephemeral leaf, creating or uploading the bundle, or starting another session, the parent fstats its retained descriptor and requires the original st_dev and st_ino. It then invokes exactly teardown_lock_verifier_argv on that descriptor. util-linux 2.42 uses an exclusive F_OFD_SETLK or F_OFD_SETLKW lock for --fcntl, which conflicts with Bubblewrap's POSIX read lock. Status zero proves release and leaves the parent holding the OFD write lock on the original open file description. A nonzero status, timeout, signal, exec failure, identity mismatch, or descriptor error rejects the session. The candidate may unlink or replace the writable pathname, but the parent never reopens it for teardown proof. After successful acquisition, the parent removes session content through the retained session-root authority, removes the other ephemeral leaves, invokes the same executable with --fcntl --unlock on the retained descriptor, and closes it. It fails closed on any cleanup, unlock, or close error. No separate read-only lock mount is required."
staging_policy = "For each candidate session, create a fresh launcher-owned staging leaf only under the stable parent declared for the closure-staging capacity slot. The leaf must not exist before creation. Walk from the open parent directory without following symbolic links, canonicalize the current leaf, and require strict containment under the frozen parent. Require every descendant component to remain on the parent's frozen mount and require the leaf's st_dev to equal the parent's frozen st_dev. Hash the canonical escaped leaf path plus LF as staging-root-sha256, and require all session digests to be distinct. Before Bubblewrap starts, require that the leaf contains exactly the store base and that the base contains exactly one placeholder per manifest basename. Each placeholder must have the manifest member's file type but a different (st_dev, st_ino) pair. A directory placeholder must have no entry, and a regular-file placeholder must have length and allocated block count zero. Reject links, special files, nested mounts, nested payloads, /nix/var state, another top-level entry, another store entry, or any copied member byte. Record the current leaf only in that session's capacity frame. Record staging-root-sha256, placeholder-count equal to member-count, staging-payload-entry-count equal to zero, and staging-payload-bytes equal to the sum of regular-file lengths, which must be zero. Hold the teardown lock until this leaf is removed. A later session must not stat or record the removed leaf."
source_identity_policy = "Immediately before each Bubblewrap invocation, the trusted launcher records every selected class member's no-follow file type, st_dev, st_ino, containing host mountinfo major:minor device, and expected decoded mount root. Every retained path must satisfy retained_path_policy. Write one path-sorted row per selected member to the source_identity_snapshot_basename file under that session's authority-backed contract leaf. Require all base snapshots to be identical to each other and both integration snapshots to be identical to each other. Require the base rows to equal the exact base-member subset of the integration rows. Record the selected digest in the session frame and expose the snapshot read-only at source_identity_snapshot_namespace_path. The preflight parses /proc/self/mountinfo with Linux octal unescaping and requires exactly one matching read-only mount per selected member, with exact root, device, type, st_dev, and st_ino. Reject a missing, duplicate, stacked, extra, class-mismatched, unsupported-path, or writable member mount."
session_contract_mount_policy = "Before each Bubblewrap invocation, create the declared ephemeral current leaf for session_contract_authority under its frozen stable parent. Resolve that leaf only from the retained authority and current-path row for the matching session ordinal and ID. The leaf contains exactly one no-follow regular file named source_identity_snapshot_basename. Its bytes equal the selected class source-identity rows, including their final line feeds; its mode is 0444; and its byte count and SHA-256 equal the selected source-identity values retained for the session. After fixed_filesystem_argv creates /contract, dynamic_mount_plan mounts this leaf read-only at /contract in the exact position after session-root and before prepared-root. The preflight opens only source_identity_snapshot_namespace_path. Reject a missing, writable, linked, substituted, duplicated, incorrectly named, incorrectly moded, or extra contract entry; another /contract mount; a changed source or destination; or a source that doesn't resolve uniquely through the retained authority/current-path row. Remove the current leaf during session teardown."
retained_path_policy = "At every trusted path ingestion and every closure-log parse, decode the field as UTF-8 and reject NUL, horizontal tab, line feed, carriage return, and backslash bytes. Retained tab-separated path fields therefore contain their literal canonical path bytes and require no escape syntax. Spaces and other valid UTF-8 bytes remain literal. Apply this rule before canonicalization, comparison, hashing, authority lookup, or argv construction. Reject a malformed field instead of normalizing or partially decoding it."
trusted_host_root_policy = "Before creating any BURL-M003 leaf, the trusted wrapper requires trusted_runner_temp_input and its trusted role-output argument to be nonempty absolute paths that satisfy retained_path_policy. It resolves each existing directory with realpath -e, rejects a symbolic-link final component, and records its canonical path, UID, GID, mode, st_dev, and decoded containing-mount identity. It creates the three runtime parents only at the declared relative paths below the canonical RUNNER_TEMP root. It resolves every parent-generated manifest from its exact path relative to the canonical RUNNER_TEMP root and requires runner_temp_capacity_relative_root to be the first path component; no parent writes a manifest through /contract. Role artifacts and logs remain below the separately canonical role-output root. Every retained capacity-authority and current-path row contains the resolved absolute parent and leaf, never an unresolved environment value or a production /work alias. Revalidation and fresh sealing apply retained_path_policy and derive the same parents from these trusted roots. They reject a missing, escaping, substituted, aliased, linked, differently mounted, or unsupported path."
integration_runtime_mount_policy = "Create a runtime leaf only for the matching integration session, immediately before its Bubblewrap invocation. Resolve its stable parent from the canonical RUNNER_TEMP root plus integration_runtime_relative_parent. Use the frozen integration_runtime_authority row to open that parent without following symbolic links, then create only that row's declared relative leaf. Require its canonical path to match the retained current-path row. Before the bind, require the frozen required UID and GID, mode 0700, no-follow directory type, unchanged containing mount identity, and st_dev equal to the frozen parent device. Require the leaf to be empty. Reject a symbolic link, nested or changed mount, device mismatch, wrong UID or GID, wrong mode, substituted current path, reused earlier leaf, undeclared leaf, or precreated socket, lock, regular file, directory, or other content. integration_runtime_mount binds that exact current path writable at integration_runtime_destination; Bubblewrap's user mapping exposes it to the in-namespace supervisor as the owned mode-0700 runtime directory. After the supervisor reaps Sway and the candidate, remove every socket, lock, and other runtime entry, remove the leaf, and prove that the path is absent before creating any later session leaf. Base sessions have no xdg-runtime declaration, current-path row, source leaf, destination, bind, socket, or XDG_RUNTIME_DIR assignment."
bubblewrap_identity_policy = "Apply linux_trusted_parent_bubblewrap.policy before the first session and revalidate its executable and tool-closure manifest digests before every session. Record the canonical executable path, version, executable digest, and tool-closure manifest digest in closure_view_log_policy. Use the exact parent executable for each of the session_count Bubblewrap invocations. Candidate PATH must not resolve bwrap. The candidate must receive ENOENT when it probes the exact parent executable path and status 127 when it invokes bwrap by name. The candidate and in-namespace preflight must not execute another Bubblewrap process, including for --version; they assert only the resulting namespace, mount, process, descriptor, and network properties."
supervisor_cleanup_policy = "For an integration session, the trusted supervisor starts Sway first, records its direct-child PID, validates readiness with the exact swaymsg command, and then starts the candidate in a separate process group. It monitors the candidate, Sway PID, wayland-1 socket and lock, timeout, and any swaybg process or output canary. On candidate success or failure, early Sway exit, socket disruption, unexpected swaybg activity, SIGINT, SIGHUP, SIGQUIT, SIGTERM, or timeout, it stops the candidate group, verifies that no candidate descendant remains, sends SIGTERM to Sway, waits a bounded interval, sends SIGKILL only if needed, and calls waitpid for Sway. Before it reports cleanup, kill(pid, 0) must return ESRCH, /proc/PID must be absent, and no swaybg process may remain. After the candidate and Sway are reaped, it closes supervisor log descriptors 3 through 6 and requires that no descriptor above 2 remains. It then opens /candidate/session as temporary descriptor 3 with O_RDONLY, O_DIRECTORY, O_NOFOLLOW, and O_CLOEXEC. It fstats descriptor 3 and requires the session-root directory's previously recorded st_dev, st_ino, UID, and GID. Only then may it use openat on descriptor 3 with O_WRONLY, O_NOFOLLOW, O_CREAT, O_EXCL, and O_CLOEXEC plus mode 0600 to write and fsync one canonical cleanup.frame. It closes the frame descriptor before the parent reads the file. The frame carries the session ID, supervisor result, Sway PID, termination path, wait status, sway-reaped=true, and cleanup-complete=true. The trusted parent validates those bytes from the retained session-root authority, then creates and fsyncs cleanup.ack containing exactly ASCII K plus LF. The supervisor accepts that acknowledgement, removes both handshake files through descriptor 3, closes descriptor 3, requires that only descriptors 0 through 2 remain, and exits. The cleanup descriptor is opened only after candidate and Sway reap and is never retained into candidate exec. The parent waits for the outer Bubblewrap process, completes teardown_lock_policy, and only then appends and fsyncs the matching closure-log session frame. Any earlier candidate-created name is removed only after every candidate process is gone; a link, special file, wrong session-root device, inode, UID, or GID, preexisting acknowledgement, malformed frame, missing fsync, timeout, unexpected signal, swaybg process or output byte, cleanup-failure result, or session record before teardown-lock acquisition rejects the session. A base session records compositor-not-applicable and starts no compositor. Fixtures cover early Sway failure, hostile candidate exit and descendant, timeout, socket disruption, graceful success, handled interruption, SIGKILL fallback, verified reap, candidate precreation, injected swaybg process and output, and the cleanup frame, acknowledgement, teardown-lock, and session-record order."
