apparmor_evidence_policy = "The pinned runner-image inventory documents Ubuntu 24.04.4, its Azure kernel, sudo, and host iproute2, but it doesn't document Bubblewrap, an AppArmor package/profile state, or the live sysctl value. Ubuntu's primary release notes state that 24.04 restricts unprivileged user namespaces through AppArmor and permits a one-boot value of 0. Bubblewrap's pinned source confirms the exact namespace and capability options. These sources justify the fail-closed runtime probe and conditional temporary precondition; they don't establish that the current hosted runner needs it."
namespace_policy = "Use exactly one parent-launched Bubblewrap invocation as the sole candidate namespace and session-payload launch for each session_id. Apply namespace_argv exactly and raise loopback through loopback_policy. The outer Bubblewrap invocation remains the containment authority for mount, network, PID, user, and process-session isolation. The candidate closure and PATH omit Bubblewrap, and the trusted preflight and candidate don't execute it. Candidate-created nested user namespaces aren't claimed to be impossible and aren't a containment control. For base sessions, the in-namespace process applies the base descriptor branch and then replaces itself with the exact candidate command. For integration sessions, it remains the minimal supervisor and starts Sway and the candidate as untrusted sibling processes inside the same outer namespace. The trusted parent never directly launches Sway, swaymsg, the candidate, or another session payload. It still performs the exact trusted preparation, version and identity checks, and post-session teardown_lock_verifier_argv execution required elsewhere in this contract. This distinction doesn't create a general parent-process allowlist. After every result, interruption, or timeout, finish process cleanup and remove all ephemeral leaves before the next invocation."
runtime_policy = "Every session omits Nix command authority, Nix state, the host store root, daemon access, and Bubblewrap. Base sessions also omit Sway, swaymsg, every compositor-only store member, WAYLAND_DISPLAY, SWAYSOCK, DISPLAY, all WLR_* variables, and compositor processes. Only the two integration sessions mount the integration closure. Their supervisor starts the exact Sway and swaymsg members under linux_integration_session_compositor. Through candidate_environment_policy, it gives the candidate only the resolved fixed and derived environments plus WAYLAND_DISPLAY=wayland-1, XDG_RUNTIME_DIR=/candidate/xdg/runtime, GDK_BACKEND=wayland, and LIBGL_ALWAYS_SOFTWARE=1 for integration sessions. It omits SWAYSOCK, DISPLAY, every WLR_* variable, and every inherited supervisor variable at the candidate exec boundary. A pinned candidate interpreter may add its own runtime variables after entry. A missing loader, library, interpreter, member, or exact socket rejects the session."
capacity_root_policy = "Apply trusted_host_root_policy before the first candidate session. Create and canonicalize every stable source parent that BURL-M003 can use, then freeze one capacity authority entry for each stable identifier. Each entry contains the kind; resolved absolute parent; required UID and GID; exact mode; no-follow file type; st_dev; decoded containing-mount identity; and one permitted leaf declaration for every session that uses it. For each session, the inventory contains exactly one authority and current-path resolution for closure-staging and each of the 22 source identifiers parsed from dynamic_mount_plan. Each integration session adds exactly one xdg-runtime resolution. The total retained authority-row count is therefore the parsed dynamic source count multiplied by session_count, plus one staging row per session, plus the integration_session_ids count. Derive and validate that count from the parsed inventories instead of a fixture constant. The exhaustive set also covers writable environment paths, staging, session, output, cache, build, generated, and home storage. Freeze these fields before any ephemeral leaf exists. Reject a missing, linked, duplicate, incorrectly owned or moded, unclassified, extra, omitted, unresolved, or synthetic production parent or declaration. No later step may add a parent, mount, device, capacity entry, leaf declaration, writable path, or argv source outside this set."
start_space_policy = "Immediately before each session's namespace entry, revalidate every frozen stable parent's canonical path, required UID and GID, exact mode, no-follow directory type, st_dev, and decoded containing-mount identity. For a stable entry, require the permitted declaration self and use the parent as that session's current path. For an ephemeral entry, require the leaf declared for this session to exist. Walk and canonicalize it from the open parent directory without following symbolic links, and require strict containment. Require every descendant component to use the parent's frozen mount ID, major:minor device, root, and mount point. Require the leaf st_dev to equal the parent's frozen st_dev. For an integration runtime leaf, also require the frozen required UID and GID, mode 0700, directory type, and empty initial contents. Reject a precreated socket, lock, regular file, directory, or other entry. Do not stat or record a removed earlier leaf or an uncreated later leaf. Reject an undeclared leaf, linked component, escape, nested or changed mount even when st_dev is unchanged, device mismatch, changed kind, parent, ownership, mode, or other authority field, authority substitution, reused leaf, or writable path outside the frozen set. Group the frozen parent authorities by distinct st_dev. For each distinct device, obtain available bytes from its stable parent filesystem as statvfs.f_bavail multiplied by statvfs.f_frsize. Require every product to be a canonical unsigned 64-bit value at least minimum_start_available_bytes. Reject an unavailable, overflowed, inconsistent, or smaller observation before that session's candidate command. In that session's log frame, record every stable identifier, current path, and device plus one observation per distinct frozen device. Resolve each current-path row uniquely against the same session ordinal, session ID, stable identifier, and exact authority declaration retained by closure_view_log_policy. Remove every ep