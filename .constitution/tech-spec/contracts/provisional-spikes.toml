ci_evidence_schema = ".constitution/tech-spec/contracts/ci-evidence.schema.json"

[rules]
write_policy = "allowlist"
required_result = "results.json"
commit_lockfiles = true
declare_dependencies_with_cli_and_regenerate_lockfile_after_the_last_dependency_change = true
record_exact_versions = true
validate_declared_candidates_and_gates = true
all_unlisted_repository_paths_are_read_only = true
validate_unique_run_ids_and_required_roles = true
validate_candidate_guards_and_seal_origin_separately = true
validate_artifact_containment_existence_size_and_sha256 = true
copy_external_or_symlinked_build_outputs_into_the_write_allowlist_before_hashing = true
capture_command_exit_status_stdout_and_stderr = true
semantically_parse_rfc3339_timestamps_and_reject_invalid_calendar_dates_without_optional_format_plugins = true
capture_host_fingerprint_os_version_architecture_filesystem_and_profile_from_system_apis = true
viewport_evidence_policy = "A Spike result run records logicalViewportVerified true only when its role-owned probe observes the exact 1920x1080 at 60 Hz viewport. Functional and packaging-only claims can record false. A reconciled claimedEvidenceClasses entry that includes performance, linux-platform-regression, or macos-authoritative-visual must record true. Host profile capabilities are descriptive and don't trigger this rule. macOS 15 profiles remain functional compatibility-only and cannot claim any viewport-bound class."
reconcile_every_run_claimed_evidence_classes_against_authenticated_expected_identity = true
spike_result_viewport_fixture_policy = "The executable PR #15 fixtures scripts/test-managed-role-production-contract.sh, scripts/test-managed-evidence-reconciliation.sh, and scripts/test-seal-validators.sh own the former static-fixture requirements. They validate Draft 2020-12 schema behavior, conditional viewport verification, hosted-role restrictions, and collector reconciliation. The runner-label mismatch case must use a schema-valid full result and reject with runner-label-mismatch before profile comparison. Missing, extra, reordered, and wrong-role claims reject with evidence-profile-mismatch. JSON Schema cannot compare a result to authenticated expected identity. Do not recreate contracts/fixtures/spike-result-viewport."
never_accept_caller_supplied_host_facts_as_evidence = true
capture_repository_revision_tree_lockfile_contract_schema_probe_source_probe_binary_and_corpus_hashes = true
resolve_recorded_repository_revision_to_the_captured_checkout = true
reject_cross_host_repository_tree_lockfile_contract_schema_probe_source_or_corpus_mismatch = true
compare_every_captured_identity_field_and_role_signer_with_trusted_expected_identity = true

[ci_bootstrap]
status = "bootstrap-authorized-provisional"
generated_binding_checker = "scripts/check-generated-bindings.sh"
generated_binding_checker_owner = "BURL-M003"
generated_binding_checker_base_state = "absent"
generated_binding_checker_behavior = "Before any gate invokes the checker, implement it without importing or cherry-picking the coordinating Epic G branch. Snapshot a path-sorted SHA-256 manifest and byte-for-byte backup of rust/src/frb_generated.rs and every regular file under lib/src/rust. Run flutter_rust_bridge_codegen generate using provisional version 2.12.0. On Linux, use linux_candidate_closure_view.cmp_executable for both byte comparisons. Compare file sets and bytes, fail on generator error or stale output, and restore and verify the exact precheck state on success, failure, or interruption."
candidate_phase = "trusted-workflow-dispatch-with-tested-source-checked-out-as-data"
draft_pull_request = "candidate-visibility-and-review-only"
aggregation = "clean-trust-anchor-checkout-only"
report_phase = "reviewed-evidence-only-pull-request"
caller_workflow = ".github/workflows/ci.yml"
api_version = "2026-03-10"
default_branch = "master"
expected_identity_fields = ["ticket", "release", "trust-anchor-sha", "tested-source-sha", "workflow-signer-sha", "workflow-signer-ref", "base-sha", "workflow-event", "evidence-report-commit-policy", "source-write-allowlist", "build", "corpus", "run", "artifact-nonce", "required-roles", "required-role-signers", "required-role-guards", "required-evidence-classes"]
capture_fields = ["ImageOS", "ImageVersion", "os-release", "architecture", "cpu-model", "logical-cpu-count", "memory-bytes", "storage-bytes", "filesystem", "logical-viewport", "ticket", "trust-anchor-sha", "tested-source-sha", "workflow-signer-sha", "workflow-signer-ref", "base-sha", "source-write-allowlist", "build", "corpus", "run", "artifact-nonce", "role", "evidence-classes", "claimed-evidence-classes"]
ci_role_evidence_schema_version = 15
sealing_receipt_schema_version = 2
ci_evidence_schema_version = 19
schema_version_policy = "Raw contract version 38 corrects the unmerged BURL-M003 Linux closure-view contract. It removes the user-namespace-disabling flags and assertions that prevent or misstate loopback setup, splits descriptor handling between base and integration branches, and distinguishes the reduced serializer golden from production vectors built from all 488 or 547 manifest members. It also binds trusted host paths to canonical RUNNER_TEMP and role-output roots, keeps parent-generated manifests outside the namespace-only /contract mount, fixes the Git-tracked Sway configuration at mode 0644, defines a fail-closed Ubuntu 24.04 AppArmor probe, and verifies Bubblewrap teardown through a retained original lock descriptor and util-linux 2.42 `flock --fcntl`. The ci-role-evidence, ci-evidence, and spike-result schemas remain byte-identical at versions 15, 19, and 20. Sealing receipt version 2, receipt transport version 1, the exact evidence-class profiles, and the exact 11-artifact ordinary and 13-artifact BURL-O001 inventories remain unchanged."
compatibility_stage_consumer_binding_policy = "For BURL-O001, compatibilityStageConsumerBinding.downloadedStageArtifactId names only the stage artifact, even though the macOS 15 trusted wrapper downloads the stage, producer receipt, and producer-lineage artifacts. Semantic validation requires downloadedStageArtifactId to equal producerLineage.stageArtifact.artifactId in the macOS 15 manifest, its sealing receipt, and the aggregate. This corrects the same unmerged version-33 draft field and does not advance raw, role, or aggregate schema versions."
filesystem_capture_policy = "Every managed role captures environment.filesystem as a non-empty observed string from its system API. The value is descriptive evidence only: do not hard-code or infer a filesystem from a hosted label, and do not add medium, mount, topology, or I/O fields. Candidate validation, sealing, and aggregation preserve and semantically compare the exact value through the sealed role bundle. Reject omission, an empty string, tampering after capture or sealing, or any candidate-to-sealed-to-aggregate mismatch with filesystem-evidence-mismatch."
non_spike_ticket_policy = "BURL-G011, BURL-P002, and BURL-O011 through BURL-O013 authenticate complete role bundles but have no coordinator or Spike result. BURL-O004 prepares and identifies its locked trust-anchor coordinator before reading or using GH_TOKEN, authenticates complete role bundles, destroys credentials, and then runs that prepared executable once against fixed read-only /inputs to produce only /output/nightly-prd-meters.json. Each non-Spike ticket remains candidate-command credential-free and uses the same fresh-seal provenance authority as a managed Spike."
viewport_policy = "viewport.verified is true only when a role-owned probe observes the exact 1920x1080 at 60 Hz viewport. Every role records the fixed viewport fields, but false does not claim an observed viewport. Only performance, linux-platform-regression, and macos-authoritative-visual classes require true. BURL-M003 assigns none of those classes, so its macOS 26 and macOS 15 manifests can record false. BURL-M003 must not add a host-display probe; its functional integration environment remains role-owned and nonauthoritative."
role_phase = "Each role uses static candidate and seal jobs on separate fresh environments. Candidate jobs keep only contents:read. The immutable workflow fixes placement and topology; the collector compares expected placement with REST labels and terminal state as noncryptographic fail-closed guards. Neither labels nor completion authenticate candidate hosted origin. Candidate commands receive no artifact-runtime, OIDC, attestation, Actions, or repository-content write authority. Their output remains untrusted. Linux keeps its Bubblewrap 0.11.2 containment and teardown proof. Hosted macOS keeps bounded cleanup without a universal containment claim. A fresh seal validates the untrusted bundle without executing candidate bytes, then attests the sealed bundle and receipt. Verified seal provenance alone authenticates runner_environment=github-hosted. For BURL-O001, the macOS 26 seal uses the trusted scripts/prepare-compatibility-stage.sh helper to validate the two declared producer members and create the stage, scripts/record-compatibility-stage-rest.sh to bind the attested stage to its REST observation, and scripts/write-compatibility-stage-lineage.sh to create the attested immutable compatibility-stage-producer-lineage.json artifact after the receipt REST object exists. Before caller mapping, the macOS 26 output boundary ticket-gates and normalizes producer-sealing-check-run-id, producer-sealing-receipt-artifact-id, and producer-sealing-receipt-upload-action-digest to empty strings for every other ticket. Before any compatibility artifact acquisition or consumer processing, the macOS 15 trusted workflow wrapper must invoke scripts/validate-compatibility-stage-interface.sh. It requires all 26 runtime values to be nonempty for BURL-O001 and all 26 to be empty for every other ticket. Only after that validator accepts BURL-O001 may the wrapper download compatibility artifacts, run the three offline gh attestation verify commands, and call scripts/prepare-compatibility-stage-consumer.sh with their result files and runtime values. For every other ticket, the wrapper skips only compatibility acquisition, verification, and consumer processing, then continues the ordinary candidate path. The consumer helper validates those results and the lineage, removes credentials, and exposes only verified read-only producer members. That canonical lineage binds the stage and the producer receipt's service ID, exact name, bare action digest, canonical REST digest, createdAt, expiresAt, expired:false state, producing seal locator, subject, signer, source, run, attempt, and bundle digest. The same seal job performs all producer-stage work; no separate staging job exists."
aggregate_phase = "After the workflow attempt reaches a terminal state, verify every expected, candidate, sealed, sealing-receipt, receipt-digest-transport, and BURL-O001 lineage artifact. Verify every receipt and sealed-bundle attestation, exact member, receipt identity, unchanged inner role-bundle digest, safe extraction, manifest schema, and internal artifact hash. Enumerate the exact run and resolve the unique reserved transport name to its immutable artifact ID. Fetch that ID's REST object, require the expected run, repository, name, and non-expired state, then download the raw archive through the ID-addressed REST endpoint. Compute SHA-256 over those bytes and compare it with the canonical REST digest before extraction or JSON parsing. Retain the ID, name, REST digest, and computed hash in aggregate receiptDigestTransportArtifact. Validate the extracted caller transport against ci-evidence.schema.json#/$defs/receiptDigestTransport. For each role, require its transported receipt artifact ID and name to match the unique REST artifact object. Require the REST digest to equal sha256: plus the transported bare upload-action digest, and retain both forms in aggregate origin.sealingReceiptArtifact. Candidate placement, topology, labels, and completion are runtime guards only. For every seal receipt locator, resolve exactly one completed successful seal job in the same run and attempt. Verify its exact signer, source, check-run ID, and runner_environment=github-hosted claim from attestation provenance before setting hostedOriginVerified. For BURL-O001, verify current non-expired REST state for the macOS 26 stage and producer receipt. Require each bare action digest and canonical REST digest to match. Verify the stage, producer-receipt, and producer-lineage attestations offline. Require lineageSha256 to hash the exact RFC 8785 UTF-8 lineage bytes. The signed lineage must preserve the producer receipt's createdAt and expiresAt values and expire after each consumer and aggregate verification. Require the macOS 15 candidate manifest and sealing receipt to preserve the parsed lineage, its SHA-256, its transport receipt, and the trusted consumerBinding. Reject every other ticket that carries a stage. Missing, duplicate, substituted, expired, digest-mismatched, unattested, wrong-signer, wrong-run, wrong-role, wrong-seal, unexpected, stale-producer-receipt, noncanonical-lineage, lineage-SHA-mismatch, or consumer-unbound stages fail closed. Existing evidence-profile, filesystem, coordinator, and aggregate checks remain required."
spike_result_evidence_reconciliation = "The trusted collector maps each results.json run to the authenticated role bundle that supplied it through the fixed role staging directory. Before comparing evidence classes, it requires observed host.profile.runnerLabel to equal that role's exact expected runner label. Reject a mismatch with runner-label-mismatch. It then requires claimedEvidenceClasses to equal the exact ordered expectedIdentity.requiredEvidenceClasses entry for that role. The result can't authorize itself. Reject a missing, extra, reordered, wrong-role, or mismatched class with evidence-profile-mismatch, even when JSON Schema validation succeeds. Apply the viewport condition only to this reconciled claim."
origin_authentication = "Dispatch the caller workflow from the trusted default branch. Before dispatch, require every validation control file at workflow-signer-sha to match trust-anchor-sha byte for byte. The trusted workflow checks out tested-source-sha separately with persisted credentials disabled and never loads control code from that checkout. For each candidate, compare static placement and candidate-to-seal topology with requiredRoleGuards, then compare the versioned job API's labels, status, conclusion, run, and attempt. Record those facts as candidatePlacement only. Do not construct or infer candidate runnerEnvironment, and do not use candidate labels as hosted-origin proof. Each seal receipt records job.check_run_id without making a completion claim. After completion, resolve exactly one matching seal job, then require completed success, the fixed label, same run and attempt, and attestation-bound signer, source, check-run ID, and runner_environment=github-hosted. Retain only that object as sealingJob origin. Private or internal repository attestation requires GitHub Enterprise Cloud; without it evidence remains rejected and there is no hash-only fallback."
dispatch_client_permissions = ["actions:write", "contents:read"]
caller_permissions = ["actions:read", "contents:read", "id-token:write", "attestations:write"]
candidate_job_permissions = ["contents:read"]
sealing_job_permissions = ["actions:read", "contents:read", "id-token:write", "attestations:write"]
aggregate_permissions = ["contents:read", "actions:read", "attestations:read"]
reject = ["expected-identity-invalid", "evidence-profile-mismatch", "artifact-name-invalid", "artifact-name-collision", "artifact-digest-mismatch", "trust-anchor-mismatch", "candidate-control-surface-changed", "source-allowlist-violation", "candidate-placement-mismatch", "candidate-topology-mismatch", "candidate-label-mismatch", "candidate-completion-mismatch", "sealing-job-in-progress", "sealing-job-failed", "sealing-job-missing", "sealing-job-mismatch", "sealing-runner-environment-mismatch", "role-manifest-invalid", "role-bundle-invalid", "missing-role", "duplicate-role", "unexpected-role", "role-gate-failed", "identity-mismatch", "stale-evidence", "workflow-signer-mismatch", "untrusted-origin", "attestation-unavailable", "artifact-api-mismatch", "artifact-corrupt", "filesystem-evidence-mismatch", "mixed-image-version", "compatibility-stage-missing", "compatibility-stage-duplicate", "compatibility-stage-substituted", "compatibility-stage-expired", "compatibility-stage-digest-mismatch", "compatibility-stage-unattested", "compatibility-stage-wrong-signer", "compatibility-stage-wrong-run", "compatibility-stage-wrong-role", "compatibility-stage-wrong-seal", "compatibility-stage-stale-producer-receipt", "compatibility-stage-noncanonical-lineage", "compatibility-stage-lineage-sha-mismatch", "compatibility-stage-consumer-unbound", "compatibility-stage-unexpected", "coordinator-identity-mismatch", "coordinator-isolation-failed", "coordinator-credential-exposure", "aggregation-error"]

[ci_bootstrap.trust_anchor]
required_event = "workflow_dispatch"
launcher_checkout = "clean-detached-checkout-at-trust-anchor-sha"
launcher_path = "scripts/managed-evidence.sh"
trusted_control_paths = [".github/workflows/ci.yml", ".github/workflows/ci-role-linux-x86-64.yml", ".github/workflows/ci-role-macos-26-arm64.yml", ".github/workflows/ci-role-macos-15-arm64.yml", "scripts/managed-evidence.sh", "scripts/assert-managed-evidence-isolation.sh", "scripts/check-generated-bindings.sh", "scripts/ci-devenv.sh", "scripts/run-managed-role.sh", "scripts/supervise-linux-session.sh", "scripts/managed-sway.conf", "scripts/prepare-compatibility-stage.sh", "scripts/record-compatibility-stage-rest.sh", "scripts/write-compatibility-stage-lineage.sh", "scripts/prepare-compatibility-stage-consumer.sh", "scripts/validate-compatibility-stage-interface.sh", "scripts/stage-authenticated-role-bundle.sh", "scripts/validate-authenticated-stage-producer.sh", "scripts/validate-managed-role-bundle.sh", "scripts/validate-managed-workflow-inputs.sh", "scripts/validate-seal-rest.sh", "scripts/validate-sealing-receipt.sh", "scripts/write-sealing-receipt.sh", "scripts/write-receipt-digest-observation.sh", ".constitution/tech-spec/contracts/ci-role-evidence.schema.json", ".constitution/tech-spec/contracts/ci-evidence.schema.json", ".constitution/tech-spec/contracts/spike-result.schema.json", ".constitution/tech-spec/contracts/provisional-spikes.toml", "devenv.nix", "devenv.yaml", "devenv.lock", "rust-toolchain.toml", "pubspec.lock", "rust/Cargo.lock", "rust_builder/cargokit/build_tool/pubspec.lock"]
future_trusted_control_paths = ["rust/benches/prd-meters-coordinator/Cargo.toml", "rust/benches/prd-meters-coordinator/Cargo.lock", "rust/benches/prd-meters-coordinator/src/main.rs"]
future_trusted_control_policy = "The three BURL-O004 coordinator files are absent at TechSpec v2.1.9 and are owned by active ticket BURL-O004 under rust/benches/**. They become trusted controls only after their implementation milestone is independently reviewed and merged, the resulting master tip becomes the replacement trust anchor, and that anchor completes the normal self-validation and reviewed evidence-only rotation. Until then BURL-O004 managed evidence is blocked. After rotation, workflow_guard requires every file byte and mode at the signer and tested source to equal the trust anchor. Their appearance in the ticket diff is allowed only under that three-way equality; another ticket or later candidate change is rejected even if a broad allowlist would otherwise match."
workflow_dispatch_ref = "master"
workflow_dispatch_ref_kind = "branch"
workflow_dispatch_response = "HTTP 200 with workflow_run_id, run_url, and html_url"
workflow_dispatch_input_limit = 25
workflow_dispatch_payload_limit_bytes = 65535
nonce_generation_policy = "For run, the launcher must use the PR #15 trust-anchor mechanism exactly: od -An -N16 -tx1 /dev/urandom | tr -d ' \\n'. /dev/urandom is the pinned OS cryptographically secure random-number generator source, and the pinned coreutils od serializes exactly 16 bytes as lowercase hexadecimal. The launcher accepts only exactly 32 lowercase hexadecimal characters, derives managed: plus those characters as runIdentity, and fails closed without a fallback, retry-derived nonce, or new dependency when the source, command, or output check fails."
attempt_one_only_policy = "A managed-evidence collection is one fresh workflow_dispatch run. The launcher generates a cryptographically random 128-bit artifact nonce for that dispatch and derives runIdentity from it. Before candidate execution, trusted acquisition, artifact upload, sealing, or attestation, the trusted caller and every reusable role workflow must invoke their existing trusted workflow-input validator and require the literal environment value GITHUB_RUN_ATTEMPT=1. Those in-workflow validators reject a missing, malformed, zero, negative, noncanonical, or greater-than-one value. Local collection does not inspect GITHUB_RUN_ATTEMPT. Before any acquisition, the local collect command must require the literal CLI spelling --attempt 1 and the exact workflow-run REST object's numeric .run_attempt to equal 1. After all evidence and coordinator verification completes, immediately before atomically publishing an accepted report, it must re-fetch that exact workflow-run REST object by run ID and require its numeric .run_attempt to equal 1 again. Attempt drift or an unavailable final REST object fails closed and leaves no accepted report published. A failure, cancellation, timeout, or rejected report requires a new run command, a new nonce, and a different workflow run ID. GitHub UI and API reruns, including job and failed-job reruns, are prohibited."
reserved_artifact_inventory_policy = "Artifact names remain nonce-only. Every managed-evidence upload must set overwrite: false, and no managed-evidence control may perform an artifact-deletion operation. A non-BURL-O001 run has the exact 11 reserved artifacts: one expected artifact; candidate, sealed, and sealing-receipt artifacts for each of three roles; and one caller-owned receipt-digest transport. BURL-O001 has the exact 13 reserved artifacts by adding exactly one authenticated stage and one producer-lineage artifact. Missing, duplicate, extra, or substituted names reject the run. The fixture uses a recording fake API to prove that every path in the complete trusted_control_paths inventory makes no artifact-deletion request."
receipt_digest_transport = "Each role seal maps the receipt upload step's artifact-id and bare artifact-digest to job outputs, then to exact reusable-workflow outputs named sealing-receipt-artifact-id and sealing-receipt-upload-action-digest. The trusted caller's receipt_digests job needs expected and all three role-calling jobs. It receives no candidate bytes and performs no artifact download. The job invokes scripts/write-receipt-digest-observation.sh to bind exactly one role, receipt ID, receipt name, and bare digest for each role to the expected-identity hash, repository, run, attempt 1, workflow signer, and artifact nonce. It validates the result against ci-evidence.schema.json#/$defs/receiptDigestTransport and uploads the single receipt-upload-digests.json member as managed-evidence-receipt-digests-{artifact_nonce} with overwrite:false and if-no-files-found:error. This post-role transport is the only path from reusable-workflow upload outputs to local collection. The transport does not authenticate itself or add provenance. Local collection trusts only the exact run inventory and GitHub REST metadata long enough to resolve the immutable transport ID and canonical digest. It verifies the ID-addressed raw download against that digest before reading the transport. This process detects transfer corruption or substitution within the supplied bytes, but it does not protect against a compromised GitHub artifact service. The transport does not alter sealing receipt version 2 or let a receipt claim a fact that exists only after its upload."
expected_identity_transport = "The trusted launcher creates canonical expected-identity.json before dispatch, retains those bytes locally, and passes their base64 encoding plus SHA-256 digest as workflow_dispatch inputs. The identity includes exact requiredRoleGuards for each workflow path, candidate and seal job topology, runner label, and terminal candidate state. The trusted caller's static expected job decodes and validates those exact bytes, uploads expected_identity_artifact, and exports its artifact ID and bare action digest. Every role-calling job needs expected and passes those outputs as trusted reusable-workflow inputs for the sealing receipt. The launcher derives artifactNonce as the exact lowercase 32-hex suffix of runIdentity; validators require runIdentity to equal managed: plus artifactNonce."
expected_identity_job_id = "expected"
source_checkout = "actions/checkout tested-source-sha into an isolated data directory with persist-credentials false; remove checkout authentication before candidate execution; never load workflows, actions, launchers, or configuration from this checkout"
normal_source_guard = "Before dispatch and again during collection, resolve base-sha and tested-source-sha from origin. Require base-sha to be an ancestor of tested-source-sha. Select a managed Spike's write_allowlist from its trusted [[spikes]] record or a managed non-Spike's exact ordered array from ci_bootstrap.non_spike_source_write_allowlists.tickets, always from provisional-spikes.toml in the clean trust-anchor checkout; never select an allowlist from candidate input, the tested-source checkout, runtime Task data, or expected identity. Compute the exact path and object-mode diff for base-sha..tested-source-sha and reject every changed, renamed, copied, deleted, type-changed, submodule, or symlink path outside that selected allowlist. An allowlist root matches only that exact path or a slash-delimited descendant, never a string-prefix sibling. Both source and destination of a rename or copy must match. Reject symlinks and submodules even inside a root. Reject any trusted_control_paths change regardless of another allowlist. Treat future_trusted_control_paths identically except for BURL-O004 after required anchor rotation, where every such path must exist as a regular file and be byte-for-byte and mode-for-mode identical at tested-source-sha, workflow-signer-sha, and trust-anchor-sha."
bootstrap_write_allowlist = [".github/workflows/ci.yml", ".github/workflows/ci-role-linux-x86-64.yml", ".github/workflows/ci-role-macos-26-arm64.yml", ".github/workflows/ci-role-macos-15-arm64.yml", "devenv.nix", "devenv.lock", "scripts/**", "lib/visual_capture_main.dart", "test_driver/visual_capture_driver.dart", "test/visual_capture_driver_protocol_test.dart", "test/goldens/**", "integration_test/**"]
bootstrap_source_guard = "For BURL-M003 self-validation only, require trust-anchor-sha, tested-source-sha, workflow-signer-sha, and refs/heads/master to resolve to one commit. Require base-sha to be the rebased and reviewed BURL-M015 milestone that is the anchor's first parent. Verify base-sha..trust-anchor-sha against bootstrap_write_allowlist. Trusted-control changes are allowed only because the reviewed merge has already established those exact bytes as the new anchor."
workflow_guard = "Resolve refs/heads/master as workflow-signer-sha. Require trust-anchor-sha to be an ancestor and require every trusted_control_paths byte and object mode at workflow-signer-sha to equal trust-anchor-sha. For BURL-O004, additionally require every future_trusted_control_paths member to exist as a regular non-symlink file and match byte-for-byte and mode-for-mode at workflow-signer-sha, tested-source-sha, and trust-anchor-sha. Reject before dispatch and again during collection if any condition fails."
local_reusable_workflow_syntax = "./.github/workflows/{WORKFLOW_FILE}"
expressions_or_ref_suffixes_in_job_uses_forbidden = true
ignored_evidence_only_paths = [".constitution/evidence/BURL-M003/managed-evidence.json", ".constitution/evidence/BURL-M003/completion.md", ".constitution/evidence/BURL-M003/manifest.yaml", ".constitution/evidence/BURL-G011/managed-evidence.json", ".constitution/evidence/BURL-G011/manifest.yaml", ".constitution/evidence/BURL-P002/managed-evidence.json", ".constitution/evidence/BURL-P002/manifest.yaml", ".constitution/evidence/BURL-O004/managed-evidence.json", ".constitution/evidence/BURL-O004/nightly-prd-meters.json", ".constitution/evidence/BURL-O004/manifest.yaml", ".constitution/evidence/BURL-O011/managed-evidence.json", ".constitution/evidence/BURL-O011/manifest.yaml", ".constitution/evidence/BURL-O012/managed-evidence.json", ".constitution/evidence/BURL-O012/manifest.yaml", ".constitution/evidence/BURL-O013/managed-evidence.json", ".constitution/evidence/BURL-O013/manifest.yaml", ".constitution/prototypes/**/managed-evidence.json", ".constitution/prototypes/**/results.json", ".constitution/spikes/SPK-*.md"]
report_commit_parent = "tested-source-sha"
report_commit_diff = "For a managed Spike, exactly managed_report, managed_results, and the executor-authored human_report. For BURL-M003 bootstrap, the dedicated evidence pull request contains exactly .constitution/evidence/BURL-M003/managed-evidence.json, .constitution/evidence/BURL-M003/completion.md, and .constitution/evidence/BURL-M003/manifest.yaml; the manifest records the exact byte counts and SHA-256 digests of the report and completion record. For BURL-G011 and BURL-P002, it contains exactly the declared managed report and manifest. For BURL-O004, it contains exactly the declared managed report, nightly-prd-meters result, and manifest; for each installed-release gate BURL-O011 through BURL-O013, it contains exactly that gate's managed report and manifest. Each manifest records the exact byte counts and SHA-256 digests of its declared artifacts."
bootstrap_implementation_branch = "chore/epic-m-ci-foundation"
bootstrap_evidence_branch = "docs/epic-m-ci-evidence"
bootstrap_completion = "Locally validate and independently review the BURL-M003 milestone and its implementation pull request, then rebase-merge it into master. The resulting master tip is trust-anchor-sha. From a clean detached checkout at that SHA, dispatch the trusted workflow against tested-source-sha equal to trust-anchor-sha. Create .constitution/evidence/BURL-M003/manifest.yaml over the accepted report and completion record, then open, review, and merge the dedicated evidence pull request. BURL-M003 remains incomplete until that second merge."
trust_anchor_rotation = "Any later trusted_control_paths change repeats the implementation review and merge, records the resulting master tip as a replacement trust anchor, validates that anchor against itself, and completes through a reviewed evidence-only pull request before normal tickets use it."

[ci_bootstrap.cli]
entrypoint = "./scripts/managed-evidence.sh"
authentication_environment = "GH_TOKEN"
token_must_not_appear_in_arguments_logs_reports_or_artifacts = true
artifact_nonce = "exact-lowercase-32-hex-suffix-of-run-identity"
artifact_name_character_set = "lowercase-ascii-letters-digits-hyphen-and-underscore"
artifact_name_forbidden_characters = ["double-quote", "colon", "less-than", "greater-than", "vertical-bar", "asterisk", "question-mark", "carriage-return", "line-feed", "backslash", "forward-slash"]
expected_identity_artifact = "managed-evidence-expected-{artifact_nonce}"
expected_identity_member = "expected-identity.json"
candidate_role_artifact = "managed-evidence-candidate-{role}-{artifact_nonce}"
sealed_role_artifact = "managed-evidence-sealed-{role}-{artifact_nonce}"
sealing_receipt_artifact = "managed-evidence-seal-receipt-{role}-{artifact_nonce}"
receipt_digest_artifact = "managed-evidence-receipt-digests-{artifact_nonce}"
compatibility_stage_artifact = "managed-evidence-authenticated-stage-macos-26-arm64-for-macos-15-arm64-{artifact_nonce}"
producer_lineage_artifact = "managed-evidence-producer-lineage-macos-26-arm64-for-macos-15-arm64-{artifact_nonce}"
candidate_role_artifact_member = "ci-role-evidence.tar.zst"
sealed_role_artifact_member = "ci-sealed-role-evidence.tar.zst"
sealed_role_bundle_members = ["ci-role-evidence.tar.zst"]
sealing_receipt_artifact_member = "ci-seal-receipt.json"
sealing_receipt_attestation_member = "ci-seal-receipt-attestation.sigstore.json"
receipt_digest_artifact_member = "receipt-upload-digests.json"
receipt_digest_artifact_schema = ".constitution/tech-spec/contracts/ci-evidence.schema.json#/$defs/receiptDigestTransport"
compatibility_stage_manifest_member = "compatibility-stage-manifest.json"
compatibility_stage_attestation_member = "compatibility-stage-attestation.sigstore.json"
compatibility_stage_members = ["compatibility-stage-manifest.json", "compatibility-stage-attestation.sigstore.json", "handoff/outbox/macos-current-construction.tar.zst", "handoff/outbox/macos-current-construction.sha256"]
producer_lineage_members = ["compatibility-stage-producer-lineage.json", "compatibility-stage-producer-lineage-attestation.sigstore.json"]
upload_action_digest_format = "bare-lowercase-64-hex"
rest_and_aggregate_digest_format = "sha256-colon-lowercase-64-hex"
digest_normalization = "For every expected, candidate, sealed, receipt, BURL-O001 stage, and BURL-O001 producer-lineage artifact, require REST artifact.digest to equal sha256: concatenated with the pinned upload-artifact artifact-digest output. For each receipt, take the bare action output only from the validated caller transport and take the canonical digest only from its exact REST artifact object. Record both forms in origin.sealingReceiptArtifact. The receipt-digest transport has no independently carried upload-action digest. For that artifact, require the canonical REST digest to equal sha256: concatenated with the SHA-256 computed over the raw ID-addressed archive download. Record its ID, exact name, REST digest, and computed hash in receiptDigestTransportArtifact. Reject before extraction, transport consumption, or aggregation on any mismatch."
role_bundle_manifest = "ci-role-evidence.json"
role_bundle_internal_artifacts = "exactly-every-manifest-internalArtifacts-entry-and-no-other-files"
output_schema = ".constitution/tech-spec/contracts/ci-evidence.schema.json"
stderr = "diagnostics-only"
anchor_worktree = "clean detached checkout whose HEAD is trust-anchor-sha; launcher and trusted contracts resolve only from this checkout"
evidence_worktree = "separate declared checkout that receives evidence outputs; never an execution or trust source"
output_directory = "absolute dirname(REPORT_JSON) beneath the declared evidence worktree and outside the anchor checkout"
coordinator_root = "OUTPUT_DIR/managed-evidence-coordinator"
role_stage_directories = ["roles/linux-x86_64", "roles/macos-26-arm64", "roles/macos-15-arm64"]
stage_policy = "Atomically replace the coordinator root. Stage only verified manifest-named regular files beneath the exact role directory, preserving ticket-root-relative names. Reject absolute paths, traversal, links, collisions, allowlist escape, extra files, and byte mismatch."
coordinator_cleanup_policy = "After atomically publishing validated managed_results, or after failure, remove the owned coordinator and preparation roots. No coordinator step may write outside the mounted coordinator output root."
output_write = "atomic-replace-results-then-report"
stdout_fields = ["status", "runIdentity", "workflowRunId", "runAttempt", "trustAnchorSha", "workflowSignerSha", "testedSourceSha", "result", "report"]
exit_0 = "The output report is schema-valid and accepted. For a managed Spike, the declared results.json is also present, schema-valid, and contract-valid."
exit_1 = "The output report is schema-valid and rejected."
exit_2 = "Invalid arguments, dirty or wrong trust-anchor checkout, insufficient API permission, dispatch failure before a run ID exists, interruption, or output failure prevented a schema-valid report."

[ci_bootstrap.cli.collect]
usage = "./scripts/managed-evidence.sh collect --ticket TICKET_ID --trust-anchor-sha TRUST_ANCHOR_SHA --source-ref SOURCE_REF --tested-source-sha TESTED_SOURCE_SHA --base-sha BASE_SHA --run-identity RUN_IDENTITY --run-id RUN_ID --attempt 1 --output REPORT_JSON"
permissions = ["actions:read", "attestations:read", "contents:read"]
allowed_tickets = ["BURL-M003", "BURL-H001", "BURL-H002", "BURL-I001", "BURL-L001", "BURL-O001", "BURL-G011", "BURL-P002", "BURL-O004", "BURL-O011", "BURL-O012", "BURL-O013"]
required_event = "workflow_dispatch"
behavior = "Accept only the literal CLI spelling --attempt 1. Run only from the clean detached trust-anchor checkout and reconstruct the canonical expected identity, artifact nonce, exact evidence profile, requiredRoleGuards, and ordered sourceWriteAllowlist from provisional-spikes.toml. Before any acquisition or collection work, fetch the exact workflow-run REST object and require its numeric .run_attempt to equal 1; local collection does not inspect GITHUB_RUN_ATTEMPT. Verify the run, event, signer, source, base, nonce, caller, expected bytes, static two-job role topology, and the exact 11-artifact inventory, or the exact 13-artifact inventory for BURL-O001. Wait for that attempt to complete. Resolve the unique reserved receipt-digest transport name from the exact run inventory to its immutable artifact ID. Fetch that ID's canonical REST object and require its run, repository, name, digest, and non-expired state. Download the raw archive by ID, hash it, and require its SHA-256 to match the REST digest before extraction or JSON parsing. Retain that observation in receiptDigestTransportArtifact, then safely extract and schema-validate the transport. For each role, match its transported receipt ID and name to the REST object, compare REST digest with sha256: plus the transported bare upload-action digest, and retain both in origin.sealingReceiptArtifact. Record candidate placement, topology, labels, and completion only as noncryptographic runtime guards; never create candidate runnerEnvironment. For each seal, verify the receipt, completed REST job, signer, source, run, attempt, check-run locator, and runner_environment from attestation provenance. For BURL-O001, require exactly one non-expired compatibility stage and one signed producer-lineage artifact from the macOS 26 seal. Verify the exact stage and receipt service IDs, names, action and REST digests, producer-receipt createdAt and expiresAt values, manifest, producer members, all three attestation bundles, canonical lineage bytes, and unchanged macOS 15 lineage SHA-256, transport receipt, and consumer binding. No other ticket can carry a stage. After all evidence and coordinator verification, immediately before atomically publishing an accepted report, re-fetch the exact workflow-run REST object by run ID and require numeric .run_attempt to equal 1. A changed or unavailable final attempt fails closed without an accepted report. Existing identity, evidence-profile, filesystem, coordinator-isolation, and output rules remain required."

[ci_bootstrap.cli.run]
usage = "./scripts/managed-evidence.sh run --ticket TICKET_ID --trust-anchor-sha TRUST_ANCHOR_SHA --source-ref SOURCE_REF --tested-source-sha TESTED_SOURCE_SHA --base-sha BASE_SHA --output REPORT_JSON"
permissions = ["actions:write", "attestations:read", "contents:read"]
allowed_tickets = ["BURL-M003", "BURL-H001", "BURL-H002", "BURL-I001", "BURL-L001", "BURL-O001", "BURL-G011", "BURL-P002", "BURL-O004", "BURL-O011", "BURL-O012", "BURL-O013"]
timeout_seconds = 7200
initial_attempt = 1
behavior = "Run only from the clean detached trust-anchor checkout. Resolve source-ref to tested-source-sha and refs/heads/master to workflow-signer-sha. Select the ticket's exact ordered source-write allowlist from the trusted raw contract and verify the source diff before authentication. For a managed Spike or BURL-O004, prepare and identify the locked coordinator before reading or using GH_TOKEN. Generate a cryptographically random 128-bit nonce only with PR #15's od -An -N16 -tx1 /dev/urandom | tr -d ' \\n' mechanism. Accept only exactly 32 lowercase hexadecimal characters and fail closed without a fallback, retry-derived nonce, or new dependency. Create canonical expected identity with a fresh runIdentity derived from that nonce, and copy the exact evidence profile, sourceWriteAllowlist, and requiredRoleGuards into that identity. Validate it before dispatch. Create one fresh workflow_dispatch run of the fixed caller on master, require the HTTP 200 response's workflow_run_id, wait up to 7,200 seconds for that run's only permitted attempt, and collect that exact run with literal --attempt 1. On failure, cancellation, timeout, or rejection, discard the nonce and invoke run again; never use the GitHub UI or API rerun operations. BURL-M003 remains limited to post-merge self-validation. Other tickets require the merged BURL-M003 completion record. Do not discover a run by list order, recency, branch, candidate state, or candidate input."

[ci_bootstrap.coordinator]
trusted_client_source = "merged-reviewed-BURL-M003"
prepare_before_github_authentication = true
prepare_before_github_authentication_policy = "For a managed Spike and BURL-O004, run and collect must prepare and identify the locked coordinator before any read or use of GH_TOKEN. Fixtures must reject either path when it reads or uses GH_TOKEN before preparation."
sandbox_package = "bubblewrap-0.11.2"
sandbox_nixpkgs_revision = "6004ea8c229fe9d41b21c6f4c76bf6c2e10771dd"
sandbox_platform = "github-ubuntu-24_04-x86_64"
sandbox_required_flags = ["--unshare-all", "--unshare-net", "--new-session", "--die-with-parent"]
sandbox_descriptor_policy = "The trusted launcher enumerates its open descriptors, closes every descriptor above stderr that isn't in its empty execution allowlist, verifies closure, and only then execs Bubblewrap. Bubblewrap supplies namespace, network, and filesystem isolation; descriptor closure never depends on undocumented Bubblewrap behavior."
prepare_environment = "env -i with owned empty HOME, XDG_CONFIG_HOME, XDG_CACHE_HOME, XDG_DATA_HOME, GH_CONFIG_DIR, CARGO_HOME, and Git configuration; explicitly enumerate, close, and verify all descriptors above stderr; omit GitHub, Git, SSH-agent, package-registry, and cloud credentials"
dependency_fetch = "Before GitHub authentication, fetch only dependencies locked by each declared Cargo lockfile without running build scripts and without GitHub, Git, SSH-agent, package-registry, or cloud credentials."
build_environment = "Run coordinator_build with network unshared, source and dependency inputs read-only, only coordinator_target_dir writable, and the same empty credential-free environment."
identity_fields = ["ticket", "executable-sha256", "source-tree-sha256", "lockfile-sha256", "toolchain-closure-sha256", "execution-closure-sha256", "contract-sha256", "build-command-sha256"]
authenticated_phase = "Only the trusted client may use GH_TOKEN and Actions OIDC descriptors. It downloads and verifies API objects, attestations, bundles, manifests, and member hashes. It never runs tested-source executables, build scripts, Cargo, or candidate shell commands."
credential_teardown = "Close authentication clients and inherited descriptors; unset GH_TOKEN, GITHUB_TOKEN, Actions OIDC, SSH_AUTH_SOCK, GIT_ASKPASS, package-registry, and cloud credential variables; remove temporary authentication files before coordinator execution."
execution_mounts = ["coordinator:read-only", "runtime-closure:read-only", "inputs:read-only", "contract:read-only", "output:read-write", "tmp:private", "home:private-empty"]
execution_environment = ["HOME=/home/coordinator", "XDG_CONFIG_HOME=/tmp/xdg-config", "XDG_CACHE_HOME=/tmp/xdg-cache", "XDG_DATA_HOME=/tmp/xdg-data", "GH_CONFIG_DIR=/tmp/gh-config", "LC_ALL=C.UTF-8", "LANG=C.UTF-8", "GIT_CONFIG_NOSYSTEM=1", "GIT_CONFIG_GLOBAL=/dev/null", "GIT_CONFIG_COUNT=0", "GIT_TERMINAL_PROMPT=0", "GCM_INTERACTIVE=Never", "COORDINATOR_BIN=/coordinator/bin", "INPUT_ROOT=/inputs", "OUTPUT_ROOT=/output", "CONTRACT_ROOT=/contract"]
execution_path = "pinned-bash-and-coreutils-only"
forbidden_execution_closure_tools = ["cargo", "git", "gh", "ssh", "curl", "wget", "cloud-clients"]
isolation_failure = "Reject with coordinator-isolation-failed; no credential-clearing-only fallback."
fixture_policy = "Inject unique environment and configuration canaries for GitHub, Git, SSH-agent, package registries, and cloud credentials. Open a non-CLOEXEC descriptor on canary bytes in the launcher parent. The probe child dumps its environment, probes standard credential paths, attempts gh and git discovery, enumerates descriptors, and attempts a network connection. Reject any visible canary, credential path, client, descriptor above stderr, or network route. A representative coordinator must still read staged inputs and write a schema-valid result."

[ci_bootstrap.non_spike_source_write_allowlists]
selection_policy = "These arrays are immutable, ordered trusted-control data derived from the active Stage 4 ticket scope and reviewed evidence contract. They contain source-change paths only. The later .constitution/evidence/TICKET/** integration paths are governed by ci_bootstrap.evidence_only_integration and never enter sourceWriteAllowlist. run and collect fail closed when the selected non-Spike mapping is absent and never infer one from the candidate, tested-source checkout, Task file, evidence output, or expected identity."
fixture_policy = "For each of BURL-G011, BURL-P002, BURL-O004, BURL-O011, BURL-O012, and BURL-O013, fixtures require run to construct expectedIdentity.sourceWriteAllowlist byte-for-byte and in-order from the tickets table and collect to reconstruct and compare the same array. Reject an absent ticket mapping; an absent expectedIdentity.sourceWriteAllowlist; and any omitted, added, substituted, duplicated, or reordered entry. Also prove that each ticket's evidence-only directory is absent from the source array and accepted only by the later evidence-only policy. No fixture may create a synthetic [[spikes]] record for a non-Spike ticket."

[ci_bootstrap.non_spike_source_write_allowlists.tickets]
"BURL-G011" = ["lib/src/design/**", "lib/src/screens/workspace.dart", "lib/src/components/**", "lib/l10n/**", "test/goldens/**", "test/**", "integration_test/**", "scripts/visual-regression.sh"]
"BURL-P002" = ["rust/src/workspace/**", "rust/src/api/**", "rust/Cargo.toml", "rust/Cargo.lock", "test/**"]
"BURL-O004" = ["rust/benches/**", "integration_test/**", "scripts/**", ".github/workflows/**"]
"BURL-O011" = ["integration_test/**", "scripts/**", ".github/workflows/**"]
"BURL-O012" = ["integration_test/**", "scripts/**", ".github/workflows/**"]
"BURL-O013" = ["integration_test/**", "scripts/**", ".github/workflows/**"]

[ci_bootstrap.role_execution]
filesystem_fixture_policy = "Contract fixtures must produce a schema-valid rejected aggregate with filesystem-evidence-mismatch and filesystemEvidenceVerified false when a role manifest omits environment.filesystem, records an empty string, or tampers with the value at candidate capture, sealing, or aggregate extraction. They must accept a non-empty observed string through candidate bundle creation, sealing, and aggregate round-trip without normalizing it, and must reject any candidate-to-sealed-to-aggregate mismatch with the same typed code. Fixtures must not assert a particular filesystem value or introduce medium, mount, topology, or I/O data."
candidate_process_environment = "The candidate job runs every tested-source build, test, probe, and packaging command through env -i and a trusted launcher with owned empty HOME and XDG/GH/Git configuration, closed inherited descriptors, and no GH_TOKEN, GITHUB_TOKEN, Actions runtime artifact token or URL, Actions OIDC request variables, SSH agent, Git askpass, package-registry token, or cloud credential variable. Candidate commands receive only the declared toolchain, locale, input, and output variables. The trusted workflow wrapper receives job-scoped artifact runtime authority only after candidate commands finish, to upload the untrusted bundle."
candidate_job = "Use the static candidate job ID on the role's fixed label with only contents:read. Check out tested-source-sha as data, enforce its allowlist, run candidate commands, and create the complete untrusted bundle. Compare trusted workflow placement, candidate-to-seal topology, REST labels, and terminal state with requiredRoleGuards. These observations fail closed but do not authenticate candidate hosted origin. Do not write runnerEnvironment into candidate evidence or aggregate origin. Linux retains Bubblewrap 0.11.2 containment and its teardown lock. Hosted macOS records bounded cleanup without claiming arbitrary-process containment. After candidate commands finish, the trusted wrapper uploads exactly candidate_role_artifact with overwrite:false and if-no-files-found:error. Candidate commands never receive that artifact runtime authority."
sealing_job = "Use the static seal job ID with needs:candidate and no always override on a fresh environment with the same fixed label. Download and validate only the exact candidate artifact. Never execute candidate bytes. Attest and upload the deterministic sealed bundle. Query its REST object and compare the canonical digest with the pinned upload action's bare output. Write sealing receipt version 2 with immutable in-job facts and job.check_run_id, but no status, conclusion, completed time, or self-referential receipt artifact observation. Attest the receipt, copy the pinned attest action's bundle-path to ci-seal-receipt-attestation.sigstore.json, and upload both receipt members. Map that upload's artifact-id and artifact-digest through the seal job to the reusable workflow's exact sealing-receipt-artifact-id and sealing-receipt-upload-action-digest outputs. Only this job receives actions:read, contents:read, id-token:write, and attestations:write. For BURL-O001 on macOS 26, this same job validates the declared producer members; creates, attests, uploads, and REST-validates the compatibility stage; uploads and REST-validates its receipt; then creates canonical compatibility-stage-producer-lineage.json with the producer receipt's createdAt and expiresAt values, attests it, and uploads the immutable lineage transport artifact. No staging job or fourth authority is permitted."
fresh_environment_boundary = "The candidate and sealing jobs use separate fresh hosted environments and don't share a workspace, process namespace, or writable filesystem. Only the immutable untrusted candidate artifact crosses the boundary. The sealing job never executes a candidate byte. This boundary protects seal authority on every role; it does not claim that arbitrary hosted-macOS candidate code is lifecycle-contained."
candidate_guard_fixture_policy = "Require a trusted static runs-on value, local reusable-workflow path, candidate-to-seal needs edge, expected label, completed status, and successful conclusion for each role. Accept those facts only as candidatePlacement and four true aggregate guard checks. Reject each mismatch with candidate-placement-mismatch, candidate-topology-mismatch, candidate-label-mismatch, or candidate-completion-mismatch. A hosted-looking label without self-hosted remains insufficient to create runnerEnvironment or hosted-origin proof. Fixtures must fail if candidate evidence contains runnerEnvironment or if hostedOriginVerified depends on candidate REST data."
compatibility_stage_fixture_policy = "For BURL-O001, require the macOS 26 seal to validate exactly the two producer members, create the canonical stage manifest, attest it, copy the exact bundle-path bytes, upload one stage artifact, compare its bare upload digest with the canonical REST digest, and bind the pre-receipt stage fields into sealing receipt version 2. After the receipt upload and REST query, require the same seal to create RFC 8785 canonical compatibility-stage-producer-lineage.json, including the producer receipt's ID, name, action digest, REST digest, createdAt, expiresAt, and expired:false state; attest it; and upload one immutable lineage artifact. Separate static workflow-shape fixtures inspect the trusted workflow source with duplicate-aware parsing. They pin the ordered 26-key producer-output declaration, consumer-input declaration, every observable trusted caller mapping, and each canonical hyphenated input through its declared uppercase environment variable into the matching ordered validator field. They reject swapped, missing, extra, duplicated, or reordered declared, mapped, or inventory keys where source structure is observable. Static fixtures also prove that the macOS 26 output boundary ticket-gates and conditionally normalizes producer-sealing-check-run-id, producer-sealing-receipt-artifact-id, and producer-sealing-receipt-upload-action-digest to empty strings for every other ticket before caller mapping. Behavioral fixtures invoke scripts/validate-compatibility-stage-interface.sh before any compatibility artifact acquisition or consumer processing. For BURL-O001, they require all 26 values to be nonempty. For every other ticket, they require all 26 values to be empty. They must prove that every other ticket skips only compatibility acquisition, offline verification, and consumer processing, then continues the ordinary candidate path. Only after the validator accepts BURL-O001 may the wrapper use download-artifact artifact-ids with digest-mismatch:error, obtain a fresh trusted root, run all three offline gh attestation verify commands with --bundle and --custom-trusted-root, or invoke scripts/prepare-compatibility-stage-consumer.sh. Behavioral fixtures must not claim that the shell observes YAML declaration presence, order, duplication, undeclared names, or arbitrary value substitution. The downstream attestation, identity, digest, lineage, and freshness checks validate the values they consume. Require scripts/prepare-compatibility-stage-consumer.sh to consume and validate the three result files, reject a producer receipt whose signed expiresAt is not later than verifiedAt, remove credentials, and expose only the two producer members read-only. Require the macOS 15 manifest and receipt to preserve the parsed lineage, its exact SHA-256, its transport receipt, and the trusted consumerBinding. Final aggregation must verify current non-expired REST state for the stage and producer receipt, both seals, both receipts, the lineage artifact, and the complete lineage. Fixtures cover reserved inventory, artifact-name collision, substituted stage, substituted lineage, wrong producer, wrong signer, wrong run or attempt, wrong role, wrong check-run locator, missing or invalid attestation bundle, action-to-REST digest mismatch, expired stage, expired producer receipt, missing producer receipt lifetime, noncanonical lineage bytes, lineage SHA mismatch, missing consumer binding, and a stage on any no-stage ticket. Each case must produce its typed compatibility-stage rejection."
compatibility_stage_consumer_binding_fixture_policy = "For BURL-O001, fixtures must reject a consumerBinding whose downloadedStageArtifactId differs from producerLineage.stageArtifact.artifactId in either the macOS 15 manifest, its sealing receipt, or the aggregate. They must accept equality while the wrapper downloads all three artifacts."
fixture_policy = "Retain the token, configuration, descriptor, artifact-runtime, Linux containment, hosted-macOS bounded-cleanup, fresh-seal, no-candidate-byte-execution, receipt, evidence-profile, viewport, nonce, artifact, bundle, trust-anchor, source-allowlist, filesystem, coordinator, and aggregation fixtures. Apply candidate_guard_fixture_policy and compatibility_stage_fixture_policy. Static workflow fixtures require each role to expose exactly sealing-receipt-artifact-id and sealing-receipt-upload-action-digest from its receipt upload step. They require the caller receipt_digests job to map all six outputs into one schema-valid transport. Collector fixtures reject missing, extra, duplicate, malformed, reordered, wrong-role, wrong-run, wrong-attempt, wrong-signer, wrong-nonce, wrong-name, wrong-ID, or wrong-digest transport data. Before transport extraction, fixtures require exact-name run enumeration, immutable-ID REST lookup, ID-addressed raw download, and equality between the canonical REST digest and the downloaded archive's SHA-256. Corruption fixtures flip one downloaded archive byte. Substitution fixtures return another artifact's valid archive bytes for the selected transport ID. Both cases must reject with artifact-corrupt before extraction or JSON parsing. A REST object whose ID, run, repository, name, or non-expired state differs must reject with artifact-api-mismatch. Accepted fixtures retain the ID, name, REST digest, and computed hash in receiptDigestTransportArtifact. They require each aggregate origin.sealingReceiptArtifact to retain the transported bare digest and matching canonical REST digest, and reject every action-to-REST mismatch with artifact-digest-mismatch. At every existing trusted workflow-input validator boundary, fixtures reject missing, malformed, zero, negative, noncanonical numeric forms including 01 and +1, and every value greater than 1 for GITHUB_RUN_ATTEMPT before any candidate, acquisition, upload, seal, or attestation action. Local collect fixtures reject missing, malformed, zero, negative, noncanonical numeric forms including 01 and +1, and every value other than the literal CLI spelling --attempt 1 before acquisition. They separately reject a missing, malformed, nonnumeric, or non-1 workflow-run REST .run_attempt before acquisition, without claiming that the local process reads GITHUB_RUN_ATTEMPT. After successful evidence verification, the fixtures inject attempt drift before publication, require a final exact workflow-run REST fetch, and reject publication of an accepted report unless numeric .run_attempt remains 1. Static workflow fixtures require the exact 11-artifact ordinary inventory and exact 13-artifact BURL-O001 inventory, require every upload to set overwrite: false, and use a recording fake API to prove that every path in the complete trusted_control_paths inventory makes no artifact-deletion request. Lifecycle fixtures prove that only a fresh workflow_dispatch run with a new 128-bit nonce and workflow run ID can recover after a failed, cancelled, timed-out, or rejected report; they reject GitHub UI and API rerun paths. Receipt fixtures reject status, conclusion, completion, or receipt-artifact observation fields and require a positive job.check_run_id locator. Seal-origin fixtures accept exactly one completed successful seal with valid provenance and reject in-progress, failed, missing, duplicate, wrong-job, wrong-label, self-hosted, wrong-signer, wrong-source, wrong-run, wrong-attempt, or wrong-locator matches."

