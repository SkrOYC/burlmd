schema_version = 24
stage = "tech-spec-v1.8.7-provisional"
production_implementation_authorized = false
# The Epic G entries preserve the M0 exception. FLAKE-M002 and CI-M003 may
# implement only the reproducibility and managed-validation bootstrap. Every
# other production ticket remains blocked by its own evidence and Stage 3/4
# adaptation. Spike write allowlists below remain exhaustive for Spike work.
production_exceptions = [
  "SHELL-G001",
  "PREF-G002",
  "STATE-G003",
  "TABS-G004",
  "CLOSE-G005",
  "NAV-G007",
  "FLAKE-M002",
  "CI-M003",
]
result_schema = ".constitution/tech-spec/contracts/spike-result.schema.json"
result_schema_version = 20
ci_role_evidence_schema = ".constitution/tech-spec/contracts/ci-role-evidence.schema.json"
ci_evidence_schema = ".constitution/tech-spec/contracts/ci-evidence.schema.json"

[rules]
write_policy = "allowlist"
required_result = "results.json"
commit_lockfiles = true
declare_dependencies_with_cli_and_regenerate_lockfile_after_the_last_dependency_change = true
record_exact_versions = true
validate_declared_candidates_and_gates = true
all_unlisted_repository_paths_are_read_only = true
validate_unique_run_ids_and_required_roles = true
validate_candidate_attribution = true
validate_artifact_containment_existence_size_and_sha256 = true
copy_external_or_symlinked_build_outputs_into_the_write_allowlist_before_hashing = true
capture_command_exit_status_stdout_and_stderr = true
semantically_parse_rfc3339_timestamps_and_reject_invalid_calendar_dates_without_optional_format_plugins = true
capture_host_fingerprint_os_version_architecture_filesystem_and_profile_from_system_apis = true
viewport_evidence_policy = "A Spike result run records logicalViewportVerified true only when its role-owned probe observes the exact 1920x1080 at 60 Hz viewport. Functional and packaging-only claims can record false. A reconciled claimedEvidenceClasses entry that includes performance, linux-platform-regression, or macos-authoritative-visual must record true. Host profile capabilities are descriptive and don't trigger this rule. macOS 15 profiles remain functional compatibility-only and cannot claim any viewport-bound class."
reconcile_every_run_claimed_evidence_classes_against_authenticated_expected_identity = true
spike_result_viewport_fixture_policy = "Validate contracts/fixtures/spike-result-viewport/valid and invalid against the Draft 2020-12 result schema. Execute the collector-reconciliation fixture. Its runner-label mismatch case uses a schema-valid full result, then rejects with runner-label-mismatch. Missing, extra, reordered, and wrong-role claims reject with evidence-profile-mismatch. JSON Schema cannot compare a result to authenticated expected identity."
never_accept_caller_supplied_host_facts_as_evidence = true
capture_repository_revision_tree_lockfile_contract_schema_probe_source_probe_binary_and_corpus_hashes = true
resolve_recorded_repository_revision_to_the_captured_checkout = true
reject_cross_host_repository_tree_lockfile_contract_schema_probe_source_or_corpus_mismatch = true
compare_every_captured_identity_field_and_role_signer_with_trusted_expected_identity = true

[ci_bootstrap]
status = "bootstrap-authorized-provisional"
generated_binding_checker = "scripts/check-generated-bindings.sh"
generated_binding_checker_owner = "CI-M003"
generated_binding_checker_base_state = "absent"
generated_binding_checker_behavior = "Before any gate invokes the checker, implement it without importing or cherry-picking the coordinating Epic G branch. Snapshot a path-sorted SHA-256 manifest and byte-for-byte backup of rust/src/frb_generated.rs and every regular file under lib/src/rust. Run flutter_rust_bridge_codegen generate using provisional version 2.12.0. Compare file sets and bytes, fail on generator error or stale output, and restore and verify the exact precheck state on success, failure, or interruption."
candidate_phase = "trusted-workflow-dispatch-with-tested-source-checked-out-as-data"
draft_pull_request = "candidate-visibility-and-review-only"
aggregation = "clean-trust-anchor-checkout-only"
report_phase = "reviewed-evidence-only-pull-request"
caller_workflow = ".github/workflows/ci.yml"
api_version = "2026-03-10"
default_branch = "master"
expected_identity_fields = ["ticket", "release", "trust-anchor-sha", "tested-source-sha", "workflow-signer-sha", "workflow-signer-ref", "base-sha", "workflow-event", "evidence-report-commit-policy", "source-write-allowlist", "build", "corpus", "run", "artifact-nonce", "required-roles", "required-role-signers", "required-evidence-classes"]
capture_fields = ["ImageOS", "ImageVersion", "os-release", "architecture", "cpu-model", "logical-cpu-count", "memory-bytes", "storage-bytes", "logical-viewport", "ticket", "trust-anchor-sha", "tested-source-sha", "workflow-signer-sha", "workflow-signer-ref", "base-sha", "source-write-allowlist", "build", "corpus", "run", "artifact-nonce", "role", "evidence-classes", "claimed-evidence-classes"]
ci_role_evidence_schema_version = 9
ci_evidence_schema_version = 11
schema_version_policy = "The role and aggregate schemas remain at 9 and 11. They do not encode a platform-independent candidate-process termination assertion. This raw contract owns the Linux containment and hosted-macOS authority policy."
viewport_policy = "viewport.verified is true only when a role-owned probe observes the exact 1920x1080 at 60 Hz viewport. Every role records the fixed viewport fields, but false does not claim an observed viewport. Only performance, linux-platform-regression, and macos-authoritative-visual classes require true. CI-M003 assigns none of those classes, so its macOS 26 and macOS 15 manifests can record false. CI-M003 must not add a host-display probe; its functional integration environment remains role-owned and nonauthoritative."
role_phase = "Each role uses two jobs on separate fresh hosted environments. The candidate job has contents read permission only. Its credential-sanitized launcher checks out and runs the tested source, records exactly its assigned ticket_evidence_profiles classes with true gates, and creates ci-role-evidence.json plus deterministic ci-role-evidence.tar.zst as an untrusted bundle. On Linux, the launcher uses env -i and Bubblewrap 0.11.2 with a private PID namespace and rejects an adversarial double-fork process that survives teardown before upload. On hosted macOS, the launcher performs bounded cleanup of known test processes and records failure, but makes no universal containment or zero-survivor claim. A pinned upload action publishes the untrusted bundle under its unique candidate artifact name with overwrite false. The sealing job needs the successful candidate job, downloads only that exact artifact, and uses validation code from the immutable trust anchor to verify expected identity, exact requiredEvidenceClasses, candidate job and hosted label, manifest, internal hashes, artifact name and ID, normalized REST digest, and safe archive shape. It never executes a candidate byte. It creates deterministic ci-sealed-role-evidence.tar.zst containing only the unchanged candidate bundle, attests it, and uploads it under its unique sealed name. After that upload, the job writes ci-seal-receipt.json with only immutable in-job facts: expected identity digest, run and attempt, job.check_run_id, workflow and source identities, role and nonce, hosted-environment claim, expected/candidate/sealed artifact IDs and normalized digests, and inner and sealed bundle hashes. The receipt has no final job status or conclusion. Attest and upload the receipt separately. The jobs never share a filesystem or process lifetime."
aggregate_phase = "After the workflow attempt reaches a terminal state, verify the expected, candidate, sealed, and sealing-receipt artifacts; both receipt and sealed-bundle attestations; exact outer members; receipt identities; unchanged inner role-bundle digest; safe inner extraction; manifest schema; and every internalArtifacts path, size, and hash. Resolve the receipt's sealingCheckRunId through the completed attempt's job API. Require one matching completed sealing job with conclusion success, the expected labels and hosted environment, the same run and attempt, and signed sealing provenance. For every expected, candidate, and sealed artifact, require the REST digest to equal sha256: plus the pinned upload action's bare lowercase digest before recording the canonical REST form. Require each role's evidenceClasses and gates to equal the selected ticket_evidence_profiles entry exactly. Reject a missing assigned class, an unassigned extra class, a false gate, or a class invalid for that role. For a managed Spike, atomically stage manifest-named bytes under the fixed coordinator root, run that ticket's exact coordinator_steps, and validate its declared results.json before validating accepted or rejected coordinator output against ci-evidence.schema.json. Accepted Spike output requires all roles, a valid authoritative machine result, and successful checks. Rejected output permits partial or missing roles and records typed reasons."
spike_result_evidence_reconciliation = "The trusted collector maps each results.json run to the authenticated role bundle that supplied it through the fixed role staging directory. Before comparing evidence classes, it requires observed host.profile.runnerLabel to equal that role's exact expected runner label. Reject a mismatch with runner-label-mismatch. It then requires claimedEvidenceClasses to equal the exact ordered expectedIdentity.requiredEvidenceClasses entry for that role. The result can't authorize itself. Reject a missing, extra, reordered, wrong-role, or mismatched class with evidence-profile-mismatch, even when JSON Schema validation succeeds. Apply the viewport condition only to this reconciled claim."
origin_authentication = "Dispatch the caller workflow from the trusted default branch. Before dispatch, require every validation control file at workflow-signer-sha to match trust-anchor-sha byte for byte. The trusted workflow checks out tested-source-sha separately with persisted credentials disabled and never loads workflow, action, or launcher code from that checkout. Each immutable role workflow has a static candidate job and a sealing job that needs it. The in-job sealing receipt records job.check_run_id as a stable locator but makes no completion claim. After the workflow attempt completes, query the versioned job API and resolve exactly one job whose check_run_url matches that locator. Only then require status completed, conclusion success, the fixed hosted label, the same run and attempt, and the signed OIDC runner_environment claim equal to github-hosted. Retain the resulting full sealing-job observation in aggregate origin. Reject an in-progress, failed, missing, duplicate, or mismatched sealing job. Private/internal repository attestation requires GitHub Enterprise Cloud; without it evidence remains rejected and there is no hash-only fallback."
dispatch_client_permissions = ["actions:write", "contents:read"]
caller_permissions = ["actions:read", "contents:read", "id-token:write", "attestations:write"]
candidate_job_permissions = ["contents:read"]
sealing_job_permissions = ["actions:read", "contents:read", "id-token:write", "attestations:write"]
aggregate_permissions = ["contents:read", "actions:read", "attestations:read"]
reject = ["expected-identity-invalid", "evidence-profile-mismatch", "artifact-name-invalid", "artifact-name-collision", "artifact-digest-mismatch", "trust-anchor-mismatch", "candidate-control-surface-changed", "source-allowlist-violation", "candidate-job-failed", "sealing-job-in-progress", "sealing-job-failed", "sealing-job-missing", "sealing-job-mismatch", "job-topology-mismatch", "role-manifest-invalid", "role-bundle-invalid", "missing-role", "duplicate-role", "unexpected-role", "role-gate-failed", "identity-mismatch", "stale-evidence", "workflow-signer-mismatch", "runner-label-mismatch", "runner-environment-mismatch", "untrusted-origin", "attestation-unavailable", "artifact-api-mismatch", "artifact-corrupt", "mixed-image-version", "coordinator-identity-mismatch", "coordinator-isolation-failed", "coordinator-credential-exposure", "aggregation-error"]

[ci_bootstrap.trust_anchor]
required_event = "workflow_dispatch"
launcher_checkout = "clean-detached-checkout-at-trust-anchor-sha"
launcher_path = "scripts/managed-evidence.sh"
trusted_control_paths = ["scripts/managed-evidence.sh", "scripts/assert-managed-evidence-isolation.sh", ".github/workflows/ci.yml", ".github/workflows/ci-role-linux-x86-64.yml", ".github/workflows/ci-role-macos-26-arm64.yml", ".github/workflows/ci-role-macos-15-arm64.yml", ".constitution/tech-spec/contracts/ci-role-evidence.schema.json", ".constitution/tech-spec/contracts/ci-evidence.schema.json", ".constitution/tech-spec/contracts/provisional-spikes.toml"]
workflow_dispatch_ref = "master"
workflow_dispatch_ref_kind = "branch"
workflow_dispatch_response = "HTTP 200 with workflow_run_id, run_url, and html_url"
workflow_dispatch_input_limit = 25
workflow_dispatch_payload_limit_bytes = 65535
expected_identity_transport = "The trusted launcher creates canonical expected-identity.json before dispatch, retains those bytes locally, and passes their base64 encoding plus SHA-256 digest as workflow_dispatch inputs. The trusted caller's static expected job decodes and validates those exact bytes, uploads expected_identity_artifact, and exports its artifact ID and bare action digest. Every role-calling job needs expected and passes those outputs as trusted reusable-workflow inputs for the sealing receipt. The launcher derives artifactNonce as the exact lowercase 32-hex suffix of runIdentity; validators require runIdentity to equal managed: plus artifactNonce."
expected_identity_job_id = "expected"
source_checkout = "actions/checkout tested-source-sha into an isolated data directory with persist-credentials false; remove checkout authentication before candidate execution; never load workflows, actions, launchers, or configuration from this checkout"
normal_source_guard = "Before dispatch and again during collection, resolve base-sha and tested-source-sha from origin. Require base-sha to be an ancestor of tested-source-sha. Compute the exact path and object-mode diff for base-sha..tested-source-sha and reject every changed, renamed, copied, deleted, type-changed, submodule, or symlink path outside the selected Spike write_allowlist. A write_allowlist root matches only that exact path or a slash-delimited descendant, never a string-prefix sibling. Both source and destination of a rename or copy must match. Reject symlinks and submodules even inside a root. Reject any trusted_control_paths change regardless of another allowlist."
bootstrap_write_allowlist = [".github/workflows/ci.yml", ".github/workflows/ci-role-linux-x86-64.yml", ".github/workflows/ci-role-macos-26-arm64.yml", ".github/workflows/ci-role-macos-15-arm64.yml", "devenv.nix", "devenv.lock", "scripts/**", "lib/visual_capture_main.dart", "test_driver/visual_capture_driver.dart", "test/visual_capture_driver_protocol_test.dart", "test/goldens/**", "integration_test/**"]
bootstrap_source_guard = "For CI-M003 self-validation only, require trust-anchor-sha, tested-source-sha, workflow-signer-sha, and refs/heads/master to resolve to one commit. Require base-sha to be the rebased and reviewed FLAKE-M002 milestone that is the anchor's first parent. Verify base-sha..trust-anchor-sha against bootstrap_write_allowlist. Trusted-control changes are allowed only because the reviewed merge has already established those exact bytes as the new anchor."
workflow_guard = "Resolve refs/heads/master as workflow-signer-sha. Require trust-anchor-sha to be an ancestor and require every trusted_control_paths byte and object mode at workflow-signer-sha to equal trust-anchor-sha. Reject before dispatch and again during collection if either condition fails."
local_reusable_workflow_syntax = "./.github/workflows/{WORKFLOW_FILE}"
expressions_or_ref_suffixes_in_job_uses_forbidden = true
ignored_evidence_only_paths = [".constitution/reports/**", ".constitution/prototypes/**/managed-evidence.json", ".constitution/prototypes/**/results.json", ".constitution/spikes/SPK-*.md"]
report_commit_parent = "tested-source-sha"
report_commit_diff = "For a managed Spike, exactly managed_report, managed_results, and the executor-authored human_report. For CI-M003 bootstrap, the dedicated evidence pull request contains exactly .constitution/reports/ci-m003-managed-evidence.json and .constitution/reports/ci-m003-completion.md."
bootstrap_implementation_branch = "chore/epic-m-ci-foundation"
bootstrap_evidence_branch = "docs/epic-m-ci-evidence"
bootstrap_completion = "Locally validate and independently review the CI-M003 milestone and its implementation pull request, then rebase-merge it into master. The resulting master tip is trust-anchor-sha. From a clean detached checkout at that SHA, dispatch the trusted workflow against tested-source-sha equal to trust-anchor-sha. Open, review, and merge the dedicated evidence pull request. CI-M003 remains incomplete until that second merge."
trust_anchor_rotation = "Any later trusted_control_paths change repeats the implementation review and merge, records the resulting master tip as a replacement trust anchor, validates that anchor against itself, and completes through a reviewed evidence-only pull request before normal tickets use it."

[ci_bootstrap.cli]
entrypoint = "./scripts/managed-evidence.sh"
authentication_environment = "GH_TOKEN"
token_must_not_appear_in_arguments_logs_reports_or_artifacts = true
artifact_nonce = "exact-lowercase-32-hex-suffix-of-run-identity"
artifact_name_character_set = "lowercase-ascii-letters-digits-hyphen-and-underscore"
artifact_name_forbidden_characters = ["double-quote", "colon", "less-than", "greater-than", "vertical-bar", "asterisk", "question-mark", "carriage-return", "line-feed", "backslash", "forward-slash"]
expected_identity_artifact = "managed-evidence-expected-{artifact_nonce}"
expected_identity_member = "expected-identity.json"
candidate_role_artifact = "managed-evidence-candidate-{role}-{artifact_nonce}"
sealed_role_artifact = "managed-evidence-sealed-{role}-{artifact_nonce}"
sealing_receipt_artifact = "managed-evidence-seal-receipt-{role}-{artifact_nonce}"
candidate_role_artifact_member = "ci-role-evidence.tar.zst"
sealed_role_artifact_member = "ci-sealed-role-evidence.tar.zst"
sealed_role_bundle_members = ["ci-role-evidence.tar.zst"]
sealing_receipt_artifact_member = "ci-seal-receipt.json"
upload_action_digest_format = "bare-lowercase-64-hex"
rest_and_aggregate_digest_format = "sha256-colon-lowercase-64-hex"
digest_normalization = "For every expected, candidate, and sealed artifact, require REST artifact.digest to equal sha256: concatenated with the pinned upload-artifact artifact-digest output. Record only that canonical REST value as aggregate artifactDigest, while retaining the bare action output as uploadActionDigest. Reject before download or aggregation on any mismatch."
role_bundle_manifest = "ci-role-evidence.json"
role_bundle_internal_artifacts = "exactly-every-manifest-internalArtifacts-entry-and-no-other-files"
output_schema = ".constitution/tech-spec/contracts/ci-evidence.schema.json"
stderr = "diagnostics-only"
anchor_worktree = "clean detached checkout whose HEAD is trust-anchor-sha; launcher and trusted contracts resolve only from this checkout"
evidence_worktree = "separate declared checkout that receives evidence outputs; never an execution or trust source"
output_directory = "absolute dirname(REPORT_JSON) beneath the declared evidence worktree and outside the anchor checkout"
coordinator_root = "OUTPUT_DIR/managed-evidence-coordinator"
role_stage_directories = ["roles/linux-x86_64", "roles/macos-26-arm64", "roles/macos-15-arm64"]
stage_policy = "Atomically replace the coordinator root. Stage only verified manifest-named regular files beneath the exact role directory, preserving ticket-root-relative names. Reject absolute paths, traversal, links, collisions, allowlist escape, extra files, and byte mismatch."
coordinator_cleanup_policy = "After atomically publishing validated managed_results, or after failure, remove the owned coordinator and preparation roots. No coordinator step may write outside the mounted coordinator output root."
output_write = "atomic-replace-results-then-report"
stdout_fields = ["status", "runIdentity", "workflowRunId", "runAttempt", "trustAnchorSha", "workflowSignerSha", "testedSourceSha", "result", "report"]
exit_0 = "The output report is schema-valid and accepted. For a managed Spike, the declared results.json is also present, schema-valid, and contract-valid."
exit_1 = "The output report is schema-valid and rejected."
exit_2 = "Invalid arguments, dirty or wrong trust-anchor checkout, insufficient API permission, dispatch failure before a run ID exists, interruption, or output failure prevented a schema-valid report."

[ci_bootstrap.cli.collect]
usage = "./scripts/managed-evidence.sh collect --ticket TICKET_ID --trust-anchor-sha TRUST_ANCHOR_SHA --source-ref SOURCE_REF --tested-source-sha TESTED_SOURCE_SHA --base-sha BASE_SHA --run-identity RUN_IDENTITY --run-id RUN_ID --attempt RUN_ATTEMPT --output REPORT_JSON"
permissions = ["actions:read", "attestations:read", "contents:read"]
allowed_tickets = ["CI-M003", "AST-H001", "PATH-H002", "ASSET-I001", "GIT-L001", "PKG-M001"]
required_event = "workflow_dispatch"
behavior = "Run only from the clean detached trust-anchor checkout and reconstruct the canonical expected identity, artifact nonce, and exact ticket_evidence_profiles entry from the supplied identities and run nonce. For a managed Spike, prepare and identify the locked coordinator before reading or using GH_TOKEN. Recheck the workflow guard and exact source allowlist before using authentication. Verify the returned workflow run ID, attempt, workflow_dispatch event, master signer ref and SHA, tested-source input, base, run nonce, caller path, expected-identity bytes, static two-job role topology, and exact unique artifact names. Wait for the workflow attempt to complete before accepting any role. Download the expected-identity, sealed role, and sealing-receipt artifacts. For each receipt locator, resolve the exact post-completion job API object and require status completed, conclusion success, fixed hosted labels, matching run and attempt, and authenticated signer provenance. Verify canonical action-to-REST digest conversion and require each role manifest to match requiredEvidenceClasses exactly before recording aggregate evidence. Recheck the workflow guard and source allowlist after download. Tear down authentication, revalidate coordinator identity, stage role contents as read-only inputs, and execute coordinator_steps with the prepared binary in the declared sandbox. Validate and publish managed_results, then publish accepted or rejected aggregate evidence. A timeout or terminal non-success produces a typed rejected report. CI-M003 has no Spike coordinator steps or machine result and writes only its aggregate report. Never trust candidate workflow files, a candidate launcher, a receipt completion claim, candidate-supplied job identity, or an unverified diff."

[ci_bootstrap.cli.run]
usage = "./scripts/managed-evidence.sh run --ticket TICKET_ID --trust-anchor-sha TRUST_ANCHOR_SHA --source-ref SOURCE_REF --tested-source-sha TESTED_SOURCE_SHA --base-sha BASE_SHA --output REPORT_JSON"
permissions = ["actions:write", "attestations:read", "contents:read"]
allowed_tickets = ["CI-M003", "AST-H001", "PATH-H002", "ASSET-I001", "GIT-L001", "PKG-M001"]
timeout_seconds = 7200
initial_attempt = 1
behavior = "Run only from the clean detached trust-anchor checkout. Resolve source-ref to tested-source-sha and refs/heads/master to workflow-signer-sha. Verify the workflow guard and exact base-sha..tested-source-sha allowlist before authentication. For a managed Spike, prepare and identify the locked coordinator before reading or using GH_TOKEN. Create canonical expected identity with a fresh runIdentity of managed: plus 32 lowercase hex digits, derive artifactNonce as those exact 32 digits, and copy the ticket's exact ticket_evidence_profiles mapping into requiredEvidenceClasses. Dispatch the fixed caller on master with the base64 identity bytes and digest, require the HTTP 200 response's workflow_run_id, wait up to 7200 seconds for attempt 1, and perform collect with that exact run ID and nonce. CI-M003 is allowed only when trust-anchor-sha, tested-source-sha, workflow-signer-sha, and the current master tip are equal after its reviewed implementation merge. Normal managed Spikes require a previously merged CI-M003 completion record naming the trust anchor. Do not discover a run by list order, recency, branch alone, or candidate state."

[ci_bootstrap.coordinator]
trusted_client_source = "merged-reviewed-CI-M003"
prepare_before_github_authentication = true
sandbox_package = "bubblewrap-0.11.2"
sandbox_nixpkgs_revision = "6004ea8c229fe9d41b21c6f4c76bf6c2e10771dd"
sandbox_platform = "github-ubuntu-24_04-x86_64"
sandbox_required_flags = ["--unshare-all", "--unshare-net", "--new-session", "--die-with-parent"]
sandbox_descriptor_policy = "The trusted launcher enumerates its open descriptors, closes every descriptor above stderr that isn't in its empty execution allowlist, verifies closure, and only then execs Bubblewrap. Bubblewrap supplies namespace, network, and filesystem isolation; descriptor closure never depends on undocumented Bubblewrap behavior."
prepare_environment = "env -i with owned empty HOME, XDG_CONFIG_HOME, XDG_CACHE_HOME, XDG_DATA_HOME, GH_CONFIG_DIR, CARGO_HOME, and Git configuration; explicitly enumerate, close, and verify all descriptors above stderr; omit GitHub, Git, SSH-agent, package-registry, and cloud credentials"
dependency_fetch = "Before GitHub authentication, fetch only Cargo.lock dependencies without running build scripts and without GitHub, Git, SSH-agent, package-registry, or cloud credentials."
build_environment = "Run coordinator_build with network unshared, source and dependency inputs read-only, only coordinator_target_dir writable, and the same empty credential-free environment."
identity_fields = ["ticket", "executable-sha256", "source-tree-sha256", "lockfile-sha256", "toolchain-closure-sha256", "execution-closure-sha256", "contract-sha256", "build-command-sha256"]
authenticated_phase = "Only the trusted client may use GH_TOKEN and Actions OIDC descriptors. It downloads and verifies API objects, attestations, bundles, manifests, and member hashes. It never runs tested-source executables, build scripts, Cargo, or candidate shell commands."
credential_teardown = "Close authentication clients and inherited descriptors; unset GH_TOKEN, GITHUB_TOKEN, Actions OIDC, SSH_AUTH_SOCK, GIT_ASKPASS, package-registry, and cloud credential variables; remove temporary authentication files before coordinator execution."
execution_mounts = ["coordinator:read-only", "runtime-closure:read-only", "inputs:read-only", "contract:read-only", "output:read-write", "tmp:private", "home:private-empty"]
execution_environment = ["HOME=/home/coordinator", "XDG_CONFIG_HOME=/tmp/xdg-config", "XDG_CACHE_HOME=/tmp/xdg-cache", "XDG_DATA_HOME=/tmp/xdg-data", "GH_CONFIG_DIR=/tmp/gh-config", "LC_ALL=C.UTF-8", "LANG=C.UTF-8", "GIT_CONFIG_NOSYSTEM=1", "GIT_CONFIG_GLOBAL=/dev/null", "GIT_CONFIG_COUNT=0", "GIT_TERMINAL_PROMPT=0", "GCM_INTERACTIVE=Never", "COORDINATOR_BIN=/coordinator/bin", "INPUT_ROOT=/inputs", "OUTPUT_ROOT=/output", "CONTRACT_ROOT=/contract"]
execution_path = "pinned-bash-and-coreutils-only"
forbidden_execution_closure_tools = ["cargo", "git", "gh", "ssh", "curl", "wget", "cloud-clients"]
isolation_failure = "Reject with coordinator-isolation-failed; no credential-clearing-only fallback."
fixture_policy = "Inject unique environment and configuration canaries for GitHub, Git, SSH-agent, package registries, and cloud credentials. Open a non-CLOEXEC descriptor on canary bytes in the launcher parent. The probe child dumps its environment, probes standard credential paths, attempts gh and git discovery, enumerates descriptors, and attempts a network connection. Reject any visible canary, credential path, client, descriptor above stderr, or network route. A representative coordinator must still read staged inputs and write a schema-valid result."

[ci_bootstrap.role_execution]
candidate_process_environment = "The candidate job runs every tested-source build, test, probe, and packaging command through env -i and a trusted launcher with owned empty HOME and XDG/GH/Git configuration, closed inherited descriptors, and no GH_TOKEN, GITHUB_TOKEN, Actions runtime artifact token or URL, Actions OIDC request variables, SSH agent, Git askpass, package-registry token, or cloud credential variable. Pass only the declared toolchain, locale, input, and output variables."
candidate_job = "Use the static candidate job ID on the role's fixed hosted label with only contents:read. Check out tested-source-sha as data, enforce its allowlist, run candidate commands, create the manifest and complete untrusted bundle, and use the pinned upload action with overwrite:false and if-no-files-found:error to upload exactly candidate_role_artifact. On Linux, start candidate code through env -i in Bubblewrap 0.11.2 with a private PID namespace, enforce a teardown lock, and reject a surviving double-fork canary before upload. On hosted macOS, terminate and reap known test processes, record cleanup failure, and make no claim that arbitrary candidate code has no survivor. Export the trusted upload action's artifact ID and digest as job outputs. A failed command, required Linux teardown, bundle, or upload fails the job."
sealing_job = "Use the static seal job ID with needs:candidate and no always override on a fresh environment with the same fixed hosted label. Download only the exact candidate_role_artifact. Validation code from the immutable trust anchor verifies artifact name, ID, canonical digest conversion, expected identity, manifest, every internal hash, and the completed candidate job API record. Reject another reserved artifact, a duplicate name, an unexpected member, or a candidate mismatch. Create deterministic ci-sealed-role-evidence.tar.zst containing only the unchanged candidate bundle. Attest and upload that sealed bundle exactly once as sealed_role_artifact with overwrite:false and if-no-files-found:error. Then query the sealed artifact REST object and compare its digest with sha256: plus the pinned action's bare output. Write ci-seal-receipt.json from immutable facts available during the job, including job.check_run_id, but no status, conclusion, or completed time. Attest the receipt and upload it separately as sealing_receipt_artifact. Only this job receives actions:read, contents:read, id-token:write, and attestations:write."
fresh_environment_boundary = "The candidate and sealing jobs use separate fresh hosted environments and don't share a workspace, process namespace, or writable filesystem. Only the immutable untrusted candidate artifact crosses the boundary. The sealing job never executes a candidate byte. This boundary protects seal authority on every role; it does not claim that arbitrary hosted-macOS candidate code is lifecycle-contained."
fixture_policy = "Inject token, configuration, descriptor, and artifact-runtime canaries into the candidate launcher parent. A candidate child must report them absent and still complete its representative build or probe. Linux fixtures run the candidate through env -i and Bubblewrap 0.11.2, double-fork a process, enforce the teardown lock, and reject any survivor before upload. Hosted-macOS fixtures prove fresh-job separation, candidate no-privilege permissions, seal-only OIDC and attestation authority, no candidate-byte execution in seal, and bounded cleanup reporting. They must reject a universal macOS containment or zero-survivor assertion. Receipt fixtures reject a status, conclusion, or completion field and require a positive job.check_run_id locator. Post-completion fixtures accept exactly one completed successful seal and reject in-progress, failed, missing, duplicate, wrong-job, wrong-label, or self-hosted matches. Digest fixtures require REST sha256:hex to equal sha256: plus the pinned action's bare hex. Evidence-profile fixtures accept CI-M003 without performance or visual classes, reject an unassigned class, reject a missing assigned class, and reject a class assigned to the wrong role. Viewport fixtures accept CI-M003 macOS 26 and macOS 15 manifests with verified false and require verified true when a role includes performance, linux-platform-regression, or macos-authoritative-visual. They reject every forbidden macOS 15 class, preserve exact profile and true-gate matching, and prove CI-M003 adds no host-display probe. Existing nonce, artifact collision, bundle, trust-anchor, source-allowlist, coordinator, and aggregation fixtures remain required."

