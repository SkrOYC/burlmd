schema_version = 6
stage = "tech-spec-v1.7.9-provisional"
production_implementation_authorized = false
result_schema = ".constitution/tech-spec/contracts/spike-result.schema.json"

[rules]
write_policy = "allowlist"
required_result = "results.json"
commit_lockfiles = true
record_exact_versions = true
validate_declared_candidates_and_gates = true
all_unlisted_repository_paths_are_read_only = true
validate_unique_run_ids_and_required_roles = true
validate_candidate_attribution = true
validate_artifact_containment_existence_size_and_sha256 = true
copy_external_or_symlinked_build_outputs_into_the_write_allowlist_before_hashing = true
capture_command_exit_status_stdout_and_stderr = true
validate_rfc3339_timestamps_without_relying_on_optional_format_plugins = true
capture_host_fingerprint_os_version_architecture_filesystem_and_profile_from_system_apis = true
never_accept_caller_supplied_host_facts_as_evidence = true

[multi_host_handoff]
transport = "Each source host exports an opaque tar.zst bundle plus SHA-256 sidecar into its Spike outbox. The result tool captures host facts from system APIs and derives a per-Spike SHA-256 host fingerprint from the operating-system machine identity; expected flags are assertions, not evidence sources. The coordinator copies both files through an explicit SSH/SCP artifact channel into the Spike inbox, then aggregation verifies the sidecar, run identity, role, distinct host fingerprints, host facts, containment, and artifact digests before importing any result. A shared checkout path or caller-supplied run label is not evidence."
source_environment = ["BURLMD_LINUX_HANDOFF_SOURCE", "BURLMD_MACOS_HANDOFF_SOURCE", "BURLMD_MACOS_CURRENT_HANDOFF_SOURCE", "BURLMD_MACOS_PREVIOUS_HANDOFF_SOURCE"]

[reference_profiles.linux-i5-8250u-16gib]
os = "linux"
architecture = "x86_64"
cpu_model_contains = "i5-8250U"
physical_core_count = 4
memory_bytes = 17179869184
storage_kind = "nvme-ssd"
integrated_graphics = true
display_width_pixels = 1920
display_height_pixels = 1080
display_refresh_hz = 60
power_source = "ac"
thermal_throttling = false

[reference_profiles.macos-m1-8gib]
os = "macos"
architecture = "aarch64"
cpu_model = "Apple M1"
physical_core_count = 8
memory_bytes = 8589934592
storage_kind = "internal-ssd"
integrated_graphics = true
display_width_pixels = 1920
display_height_pixels = 1080
display_refresh_hz = 60
power_source = "ac"
thermal_throttling = false

[[spikes]]
