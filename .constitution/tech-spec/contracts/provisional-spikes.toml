  { workdir = ".", command = "cargo run --locked --release --manifest-path .constitution/prototypes/ast/Cargo.toml -- aggregate --contract .constitution/tech-spec/contracts/provisional-spikes.toml --schema .constitution/tech-spec/contracts/spike-result.schema.json --import-bundle .constitution/prototypes/ast/handoff/inbox/linux-reference.tar.zst --import-sha256 .constitution/prototypes/ast/handoff/inbox/linux-reference.sha256 --import-bundle .constitution/prototypes/ast/handoff/inbox/macos-reference.tar.zst --import-sha256 .constitution/prototypes/ast/handoff/inbox/macos-reference.sha256 --require-role linux-reference-profile --require-role macos-reference-profile --require-distinct-hosts 2 --require-distinct-operating-systems 2 --require-role-os linux-reference-profile=linux --require-role-arch linux-reference-profile=x86_64 --require-role-profile linux-reference-profile=linux-i5-8250u-16gib --require-role-os macos-reference-profile=macos --require-role-arch macos-reference-profile=aarch64 --require-role-profile macos-reference-profile=macos-m1-8gib --output .constitution/prototypes/ast/results.json" },
]
candidates = ["markdown 1.0.0 mdast", "comrak 0.54.0", "pulldown-cmark complete model"]
required_gates = ["exhaustive CommonMark representation", "exhaustive selected GFM representation", "frontmatter", "raw HTML", "reference definitions", "tables", "footnotes", "images", "nested formatting", "malformed input", "exact byte positions", "byte-identical untouched source", "OKF link and ghost classification", "block paths", "rendered selections", "structural and range edits", "conflict representation", "existing note-size latency meters", "FFI projection size and latency"]

