assumption: "Raw contract version 37 preserves version 35's authority, lineage, lifecycle, receipt transport, and service-artifact counts. ADR-0020 assumes that the exact read-only closure view, private Nix context, protected capacity transcript, and complete Linux finalization window can run safely on the standard Linux runner. Local initial measurements don't prove the complete packaging peak fits."
settles_when: "BURL-M003 and BURL-O001 contract fixtures exercise version 37. Both fixtures must prove exact manifest-to-view equality, hidden ambient store paths, read-only host closure members, complete locked inputs and requisites, working loaders and runtime search path dependencies, disabled nested user namespaces, complete-vector ARG_MAX headroom, and cleanup. BURL-O001 must export the subset from the host database, load it into the selected private database, preserve the root no-userns Nix configuration, and prove persistent private outputs, absent host state and daemon access, and host closure immutability. Capacity fixtures must compile schema version 1 and prove the protected-path lifecycle, independent wrapper-state comparison, exact 29-record ordering, every phase precheck and postcheck, three threshold semantics, later-phase low-space rejection before output change, finalization coverage, and sealed-only aggregation. Managed BURL-O001 evidence must record the complete Linux packaging peak before the standard-runner choice or Linux packaging feasibility can settle. Existing version 35 receipt transport, 26-field compatibility interface, fresh-dispatch, 11-artifact and 13-artifact service inventories, and no-deletion fixtures remain required. Aggregate schema version 19, role schema version 15, and spike-result schema version 20 remain byte-identical."
