assumption: "Raw contract version 38 preserves version 35's authority, lineage, receipt transport, evidence schemas, evidence-class profiles, and artifact inventories. It corrects only the unmerged BURL-M003 Linux view: the trusted supervisor raises loopback inside each outer Bubblewrap network namespace, base and integration branches enforce different descriptor allowlists, and fresh sealing reconstructs full-manifest vectors from complete retained authority rows with zero unresolved source identifiers. Parent-generated manifests use exact host-relative paths below canonical RUNNER_TEMP and never use the namespace-only /contract destination. Exact unwrapped Sway and swaymsg members appear only inside the two integration namespaces. The Git-tracked mode-0644 Sway configuration is mounted read-only without changing its visible permission bits. A trusted hosted probe determines whether Ubuntu 24.04 needs a temporary AppArmor sysctl precondition and blocks upload unless it verifies restoration after success or a catchable exit. Untrappable process or runner loss can't produce accepted evidence and leaves ephemeral-runner disposal as the residual limit. Local fixtures can prove the mechanics but cannot establish hosted capacity or policy behavior."
settles_when: "Local BURL-M003 fixtures exercise raw contract version 38 across the exact seven-session inventory. They must prove the five-session 488-member base closure, two-session 547-member integration closure, the reduced serializer golden, all seven full-vector constructions, exact runtime argv reconstruction and mutation rejection, separate base and integration descriptor branches, source and capacity identity, canonical RUNNER_TEMP and role-output paths, exact parent-manifest host paths, complete authority and current-path inventories with zero unresolved source identifiers, the authority-backed read-only /contract mount and sole exact locked-nix-closure.sources file, hidden Nix state, outer network isolation, trusted loopback setup before candidate or Sway startup, exact final candidate entry environment, start-space guard, teardown, and ephemeral cleanup. Base fixtures must prove that no compositor member, runtime mount, process, socket, Wayland variable, or descriptor above 2 exists at candidate exec. Integration fixtures must prove the exact supervisor descriptor allowlist and that the forked candidate closes every descriptor above 2. They must also prove the writable xdg-runtime bind, exact Sway and swaymsg identities and arguments, the Git-tracked mode-0644 72-byte no-include configuration and read-only mount, no swaybg process or output, headless and pixman selection, Xwayland disablement, exact /candidate/xdg/runtime/wayland-1 creation, supervisor cleanup on every outcome, leaf removal before the next session, and a reaped Sway PID before the namespace exits. Static and fresh-seal mutations must reject the stale userns-disabled assertion, a parent manifest under /contract, an omitted authority identifier, a tab, CR, or backslash in a retained path, descriptor leaks and substitutions, an omitted or read-only bind, a wrong source or destination, a mode-0755 directory fallback, a substituted or reused leaf, and precreated socket or other content. The hosted run must retain its AppArmor probe, any temporary value change, and verified restoration after success or a catchable exit before upload, while untrappable process or runner loss produces no accepted upload. Fresh sealing must reconstruct every actual argv from the complete manifest and retained canonical authority/current-path fields and require exact byte and SHA-256 equality. Settlement also requires accepted managed BURL-M003 role evidence and merged completion evidence under .constitution/evidence/BURL-M003/. Candidate-created nested user namespaces aren't claimed to be impossible. Candidate, compositor, and their output remain untrusted; only fresh sealing is authoritative. Version 35 receipt transport, the 26-field BURL-O001 interface, exact 11-artifact ordinary and 13-artifact BURL-O001 inventories, aggregate schema 19, role schema 15, Spike-result schema 20, sealing receipt 2, and receipt transport 1 remain unchanged."
