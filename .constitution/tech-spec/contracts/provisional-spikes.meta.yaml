certainty: assumed
assumption: "Raw contract version 36 preserves version 35's authority, lineage, lifecycle, receipt transport, schemas, evidence-class profiles, and artifact inventories. ADR-0020 adds only the assumed exact read-only BURL-M003 candidate closure and separate trusted-parent Bubblewrap and compositor closures needed for the standard Linux runner. TechSpec v2.1.13 corrects that unmerged version 36 record with retained frozen capacity declarations, Sway and swaymsg parent ownership, and verified transitive Nix 2.35.2 installation. Local fixtures can prove the per-session view mechanics, but they cannot establish hosted capacity or feature availability."
settles_when: "Local BURL-M003 contract fixtures exercise version 36 and prove the closure-view mechanics for the exact seven-session inventory. For every session, they must prove exact manifest-to-view equality; exact locked Diffutils and Procps paths; byte-defined integration IDs; source-distinct staging; per-member source identity; hidden Nix state; complete runtime dependencies; candidate absence of Bubblewrap, Sway, and swaymsg; parent proof of the exact Bubblewrap and compositor closures; socket-only Wayland exposure; user-namespace prevention; complete-vector ARG_MAX headroom; and the 4,000,000,000-byte start guard on every frozen device. Capacity fixtures must retain canonical authority rows with every frozen identifier, kind, parent, ownership, mode, device, decoded mount identity, and permitted leaf. They must bind the authority digest into every session and resolve each current-path row uniquely. Mutations must reject a changed or same-device nested mount, wrong kind, parent, ownership, or mode, undeclared leaf, authority substitution, linked escape, device mismatch, omitted authority, and low-space secondary device. Fixtures must also prove the exact descriptor handshake, teardown, survivor rejection, ephemeral-leaf cleanup, the pinned install action's transitive Nix 2.35.2 version, install_url absence, and observed nix and nix-store version equality. These local fixtures cannot settle hosted capacity or feature availability. Settlement also requires an accepted managed BURL-M003 report with standard ubuntu-24.04 role evidence and merged completion evidence under .constitution/evidence/BURL-M003/. The Linux role bundle must retain logs/burl-m003-linux-closure-view.log through roleEvidence.internalArtifacts. The log must match the canonical golden grammar and contain both parent closure identities, the candidate manifest, frozen authority declarations, exact session order and count, per-session digests, complete-vector byte count, ARG_MAX, current-path mappings, per-device start-space observations, and cleanup result. Fresh sealing must validate the log, and accepted aggregation must bind the unchanged role and sealed bundle digests. Version 35 receipt transport, the 26-field BURL-O001 compatibility interface, fresh-dispatch controls, exact 11-artifact ordinary and 13-artifact BURL-O001 inventories, and no-deletion fixtures remain required. Aggregate schema version 19, role schema version 15, spike-result schema version 20, sealing receipt version 2, and receipt transport version 1 remain unchanged."
