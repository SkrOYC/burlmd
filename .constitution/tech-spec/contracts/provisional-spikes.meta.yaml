assumption: "Raw contract version 40 preserves version 39's containment, closure, authority, evidence-class, permission, and artifact-inventory rules. The macOS 26 first integration gate observes only Flutter 3.44.3's exact nested Swift Package Manager resolver. A private xcrun observer relays the resolver's existing stdout and stderr and retains only their final 32,768 bytes through the declared two-tail and status-file handoff. Its pipes can change delivery timing and do not establish cross-stream ordering. It doesn't change the resolver's argv, cwd, environment, exit status, or authority. Descriptor-based handoff validation protects only bounded reads from those transient files. It doesn't make final pathname removal atomic with an identity check, so the parent leaves the small private diagnostic area for the hosted job lifecycle rather than remove an uncertain entry. This doesn't establish hosted-macOS candidate lifecycle containment. The existing one failure-only block retains its bounded source-log snapshot and may include the two resolver snapshots after cleanup. No diagnostic value affects acceptance, artifacts, or schemas. The underlying macOS 26 failure from run 34313264792 remains unknown. Pinned Flutter source at e1fd963c6f6922bd32afde2e9698a363cd0406d2 shows that Flutter buffers resolver stderr and consumes stdout except Fetching lines. Its Darwin dependency manager permits mixed Swift Package Manager and CocoaPods, so a Podfile change is unsupported by this observation. The co-merged Tasks v3.2.14 BURL-M003 adaptation satisfies the Stage 4 routing requirement when the complete reviewed documentation pull request merges; the other historical adaptations remain historical. The recovery keeps the strict first-parent source guard and the original reviewed PR #15 and BURL-M015 ancestry."
settles_when: "Local BURL-M003 fixtures exercise raw contract version 40 across the exact seven-session inventory and all version 39 closure, descriptor, loopback, teardown, and cleanup requirements. They must also prove the ubuntu-22.04 role and profile mappings, schemas 16, 20, and 21, and the strict recovery first-parent rule. A pinned Bash fixture must reproduce the nested candidate_exec, run_ci_gate, and top-level candidate_phase errexit path. It must preserve the original failure status and cleanup, reject continued execution, and select only a regular-file log from the exhaustive ordered candidate_failure_diagnostic_gate_log_map with no-follow nonblocking handling. Fixtures reject every missing, extra, duplicated, substituted, or reordered map entry, every prefix mutation including its trailing space, and either Linux role-step integration-log substitution. They snapshot at most 65,536 source-log tail bytes and allow a source at or below that limit to fit wholly in the snapshot. Against controlled source logs and contract constants, they verify actual retained bytes and the fixed gate ID, original exit status, observed fstat size, retained count, and snapshot SHA-256 before exact-prefix standard padded RFC 4648 section 4 Base64 output without line wrapping, not emitter self-description. For the exact macOS 26 first integration resolver, fixtures prove the real xcrun receives unchanged argv, cwd, environment, and status, and that the relays forward its controlled stdout and stderr byte sequences; every nonmatch execs unchanged. They read the declared handoff filenames and status grammar from the raw contract, verify atomic complete-status publication, descriptor-relative no-follow nonblocking opens, immediate and final fstat identity checks, bounded reads from the same descriptors, file and directory replacement suppression, and identity revalidation before emission. They bind the canonical decimal grammar and reject leading zeros, signs, whitespace, and out-o