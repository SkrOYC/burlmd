assumption: "Raw contract version 37 preserves version 35's authority, lineage, receipt transport, evidence schemas, evidence-class profiles, and artifact inventories. It corrects only the unmerged BURL-M003 Linux view: Bubblewrap stays parent-only, while exact unwrapped Sway and swaymsg members appear only inside the two integration namespaces under the trusted supervisor. Every session commits to its complete argv, authority-backed contract mount, and exact final candidate environment boundary. Each integration session also commits to a distinct writable mode-0700 xdg-runtime bind from frozen authority. Local fixtures can prove the mechanics but cannot establish hosted capacity or feature availability."
settles_when: "Local BURL-M003 fixtures exercise raw contract version 37 across the exact seven-session inventory. They must prove the five-session base closure, two-session integration closure, exact complete-argv reconstruction and mutation rejection, descriptor handshake, source and capacity identity, the authority-backed read-only /contract mount and sole exact locked-nix-closure.sources file, hidden Nix state, no network, user-namespace prevention, exact final candidate entry environment, start-space guard, teardown, and ephemeral cleanup. Base fixtures must prove that no compositor member, runtime mount, process, socket, or Wayland variable exists. Integration fixtures must prove the writable xdg-runtime bind from the matching frozen authority and current path, canonical ownership, mode 0700, empty initial contents, unchanged mount and device identity, and no symbolic link. They must also prove exact env -i, exact Sway and swaymsg identities and arguments, the 72-byte reviewed no-include configuration with swaybg_command -, no swaybg process or output, headless and pixman selection, Xwayland disablement, exact /candidate/xdg/runtime/wayland-1 creation, supervisor cleanup on every outcome, leaf removal before the next session, and a reaped Sway PID before the namespace exits. Static and fresh-seal mutations must reject an omitted or read-only bind, a wrong source or destination, a mode-0755 directory fallback, a substituted or reused leaf, and precreated socket or other content. Fresh sealing must reconstruct every argv from trusted contract and retained authority/current-path fields and require exact byte and SHA-256 equality. It must validate the version 2 closure log and both manifest payloads. Settlement also requires accepted managed BURL-M003 role evidence and merged completion evidence under .constitution/evidence/BURL-M003/. Candidate, compositor, and their output remain untrusted; only fresh sealing is authoritative. Version 35 receipt transport, the 26-field BURL-O001 interface, exact 11-artifact ordinary and 13-artifact BURL-O001 inventories, aggregate schema 19, role schema 15, Spike-result schema 20, sealing receipt 2, and receipt transport 1 remain unchanged."
