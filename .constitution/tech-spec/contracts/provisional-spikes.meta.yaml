assumption: "Raw contract version 39 preserves version 38's containment, closure, authority, evidence-class, permission, and artifact-inventory rules. It advances the role, aggregate, and Spike-result schemas only for the ubuntu-22.04 managed Linux role and profile. Diagnostic GitHub Actions run 34365475868 attempt 1 passed the exact native-isolation prerequisite on image 20260831.284.1, but it did not run the complete role or settle its resource profile. GitHub starts ubuntu-22.04 deprecation on 2026-09-17 and retires the image on 2027-04-17, so this profile is a temporary measured bridge. The recovery keeps the strict first-parent source guard and the original reviewed PR #15 and BURL-M015 ancestry. The bounded macOS failure channel uses the exhaustive five-entry gate-log map and exact `burlmd-m003-diagnostic: ` prefix, carries only base64 candidate bytes, and cannot affect acceptance. A source log of at most 65,536 bytes can fit wholly in the one bounded snapshot; no additional or unbounded full-file pass is allowed, and the snapshot makes no complete-log integrity claim. The underlying macOS 26 failure from run 34313264792 remains unknown. The precise map and prefix require a Stage 4 correction in PR #37 before a final Stage 3 acknowledgement restores the adaptation to satisfied. The acknowledged Tasks SHA will identify that reviewed source-branch commit, not its rebase-merged SHA. The 21,600-second observer bound is an extrapolation from one measured Linux bootstrap, not a complete or Darwin timing, and changes no job or session timeout, retry, topology, permission, or cache trust."
settles_when: "Local BURL-M003 fixtures exercise raw contract version 39 across the exact seven-session inventory and all version 38 closure, descriptor, loopback, teardown, and cleanup requirements. They must also prove the ubuntu-22.04 role and profile mappings, schemas 16, 20, and 21, and the strict recovery first-parent rule. A pinned Bash fixture must reproduce the nested candidate_exec, run_ci_gate, and top-level candidate_phase errexit path. It must preserve the original failure status and cleanup, reject continued execution, and select only a regular-file log from the exhaustive ordered candidate_failure_diagnostic_gate_log_map with no-follow nonblocking handling. Fixtures reject every missing, extra, duplicated, substituted, or reordered map entry, every prefix mutation including its trailing space, and either Linux role-step integration-log substitution. They snapshot at most 65,536 tail bytes and allow a source at or below that limit to fit wholly in the snapshot. They record only the observed fstat size, retained count, and snapshot SHA-256 before exact-prefix base64 output. Oversized, sparse, changing, linked, FIFO, and special-file fixtures must prove there is no additional or unbounded full-file pass and no interference with cleanup or status. They must make no complete-log integrity claim. Settlement also requires the final Stage 3 acknowledgement of the corrected Tasks source-branch commit, PR #37's post-merge source-to-landed record and final landed documentation tip, accepted managed BURL-M003 role evidence, and merged completion evidence on the replacement anchor. Candidate, compositor, output, and failure diagnostics remain untrusted; only fresh sealing is authoritative."
