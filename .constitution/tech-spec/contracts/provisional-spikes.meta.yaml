assumption: "Raw contract version 40 preserves version 39's containment, closure, authority, evidence-class, permission, and artifact-inventory rules. The BURL-M003 macos-26-arm64 first integration gate for integration_test/production_host_flow_test.dart observes only Flutter 3.44.3's exact nested Swift Package Manager resolver from the canonical candidate-workspace macos cwd with the exact candidate-workspace/build/macos/SourcePackages argv value; any role, gate, cwd, argv, or path substitution is a nonmatch. A private xcrun observer relays the resolver's existing stdout and stderr and retains only their final 32,768 bytes through the declared two-tail and status-file handoff. Its pipes can change delivery timing and do not establish cross-stream ordering. A tail-retention/storage write failure is capture loss only: its relay must keep draining upstream input and forwarding it downstream. An upstream resolver-pipe read failure or downstream forwarding-write failure can truncate input, cause SIGPIPE, or apply backpressure. Either is an observer execution failure, not a transparent diagnostic loss; it makes no no-observer or unobserved-xcrun-status claim. When both relay data paths complete and xcrun terminates, including nonzero, no tail-retention/storage write failure permits the observer to publish the handoff before it exits with that observed status and before the enclosing candidate wrapper cleans up. A tail-retention/storage write failure suppresses capture but the observer still exits with the observed status. It doesn't change the resolver's argv, cwd, environment, authority, or an already observed status. Descriptor-based handoff validation protects only bounded reads from those transient files. It doesn't make final pathname removal atomic with an identity check, so the parent leaves the small private diagnostic area for the hosted job lifecycle rather than remove an uncertain entry. This doesn't establish hosted-macOS candidate lifecycle containment. The existing one failure-only block retains its bounded source-log snapshot and may include the two resolver snapshots after cleanup. No diagnostic value affects acceptance, artifacts, or schemas. Historical run 34313264792 had no retained gate log. Run 34554369301, attempt 1, retained a 2,167-byte snapshot with SHA-256 29941e1f9ab09916775f58e55e5326984c10855a87375ca5935d2b6939a221fe; it identifies a resolver-stage failure but not its inner cause. Pinned Flutter source at e1fd963c6f6922bd32afde2e9698a363cd0406d2 shows that Flutter buffers resolver stderr and consumes stdout except Fetching lines. Its Darwin dependency manager permits mixed Swift Package Manager and CocoaPods, so a Podfile change is unsupported by this observation. The co-merged Tasks v3.2.14 BURL-M003 adaptation satisfies the Stage 4 routing requirement when the complete reviewed documentation pull request merges; the other historical adaptations remain historical. The recovery keeps the strict first-parent source guard and the original reviewed PR #15 and BURL-M015 ancestry."
settles_when: "Local BURL-M003 fixtures exercise raw contract version 40 across the exact seven-session inventory and all version 39 closure, descriptor, loopback, teardown, and cleanup requirements. They must also prove the ubuntu-22.04 role and profile mappings, schemas 16, 20, and 21, and the strict recovery first-parent rule. A pinned Bash fixture must reproduce the nested candidate_exec, run_ci_gate, and top-level candidate_phase errexit path. It must preserve the original failure status and cleanup, reject continued execution, and select only a regular-file log from the exhaustive ordered candidate_failure_diagnostic_gate_log_map with no-follow nonblocking handling. Fixtures reject every missing, extra, duplicated, substituted, or reordered map entry, every prefix mutation including its trailing space, and either Linux role-step integration-log substitution. They snapshot at most 65,536 source-log tail bytes and allow a source at or below that limit to fit wholly in the snapshot. Against controlled source logs and contract constants, they verify actual retained bytes and the fixed gate ID, original exit status, observed fstat size, retained count, and snapshot SHA-256 before exact-prefix standard padded RFC 4648 section 4 Base64 output without line wrapping, not emitter self-description. For the exact BURL-M003 macos-26-arm64 first integration gate for integration_test/production_host_flow_test.dart, fixtures prove the real xcrun receives the exact canonical candidate-workspace macos cwd and exact argv, including candidate_workspace/build/macos/SourcePackages, plus unchanged environment. They reject every role, gate, cwd, argv, and path substitution. Completed relays without an upstream resolver-pipe read failure, downstream forwarding-write failure, or tail-retention/storage write failure forward the controlled stdout and stderr byte sequences and publish bounded tails. They must prove that the observer exits with the observed real-xcrun status, including non