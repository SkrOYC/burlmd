assumption: "Raw contract version 33 defines the OD-11 authority split, the attested canonical BURL-O001 producer-lineage transport, and a fresh-dispatch-only managed-evidence lifecycle. Each collection uses a new 128-bit nonce from the PR #15 pinned /dev/urandom and coreutils od mechanism, which fails closed without a fallback. In-workflow validators require literal GITHUB_RUN_ATTEMPT=1 before candidate, acquisition, upload, seal, or attestation work. Local collect requires literal --attempt 1 and REST .run_attempt == 1 before acquisition and again immediately before accepted-report publication; it does not inspect GITHUB_RUN_ATTEMPT. Tasks v3.2.6 historically adopted the interface, while the current Tasks v3.2.7 artifacts are downstream-stale for this lifecycle."
settles_when: "BURL-M003 and BURL-O001 contract fixtures exercise version 33, assert that scripts/prepare-compatibility-stage.sh, scripts/record-compatibility-stage-rest.sh, scripts/write-compatibility-stage-lineage.sh, scripts/prepare-compatibility-stage-consumer.sh, and scripts/validate-compatibility-stage-interface.sh are immutable trusted controls, reject byte or mode drift in each helper, use duplicate-aware source inspection to pin the exact ordered 26 producer-output declarations, consumer-input declarations, and observable caller mappings while rejecting missing, extra, duplicated, or reordered source keys, require both macOS 26 output boundaries to ticket-gate and normalize the three producer-sealing aliases for non-O001 tickets, require all 26 runtime values to be nonempty for BURL-O001 and all 26 to be empty for every other ticket, require three distinct offline attestation verifications to write stage-verification.json, receipt-verification.json, and lineage-verification.json before the consumer helper consumes and validates them with all runtime values, and exercise every candidate guard, producer-receipt freshness check, canonical-lineage byte check, downloadedStageArtifactId equality with producerLineage.stageArtifact.artifactId at the macOS 15 manifest, its sealing receipt, and final aggregate. In-workflow fixtures reject missing, malformed, zero, negative, noncanonical forms including 01 and +1, and values greater than 1 for GITHUB_RUN_ATTEMPT before work. Local fixtures reject those forms unless the CLI is literal --attempt 1, separately require REST .run_attempt == 1 before acquisition and re-fetch the exact workflow-run REST object after all evidence verification immediately before atomic accepted-report publication. The fixture injects attempt drift between initial acquisition and publication and requires no accepted report. Fixtures require exact 10-artifact ordinary and 12-artifact BURL-O001 inventories, overwrite: false on every upload, and a recording fake API that proves every path in the complete trusted_control_paths inventory makes no artifact-deletion request. They require fresh dispatch with a new nonce and workflow run ID after failed, cancelled, timed-out, or rejected reports rather than a GitHub workflow or job rerun."
