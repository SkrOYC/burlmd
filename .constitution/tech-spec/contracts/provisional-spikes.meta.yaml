assumption: "Raw contract version 36 preserves version 35's authority, lineage, lifecycle, receipt transport, schemas, and artifact inventories. ADR-0020 adds only the assumed exact read-only BURL-M003 closure view needed for the standard Linux runner. Local fixtures can prove the view mechanics, but they cannot establish hosted capacity or feature availability."
settles_when: "Local BURL-M003 contract fixtures exercise version 36 and prove the closure-view mechanics. They must prove exact manifest-to-view equality; an empty source-distinct staging shape; trusted per-member mountinfo, device, inode, type, and read-only source identity; rejection of an omitted bind behind a correctly typed placeholder; rejection of copied private-store state beneath otherwise valid binds; absence of /nix/var, the Nix database, and the daemon socket; source-shape rejection of broad /nix and /nix/store binds; hidden ambient store paths; working loaders and runtime search path dependencies; forbidden-client absence; prevention of candidate-created user namespaces without a second Bubblewrap invocation; complete-vector ARG_MAX headroom; the start-space guard; descriptor closure; and teardown. These local fixtures cannot settle hosted capacity or feature availability. Settlement also requires an accepted managed BURL-M003 report with standard ubuntu-24.04 role evidence and merged completion evidence under .constitution/evidence/BURL-M003/. The Linux role bundle must retain logs/burl-m003-linux-closure-view.log through roleEvidence.internalArtifacts. The log contains the exact manifest and SHA-256, staging-shape and per-member source observations, complete-vector byte count, ARG_MAX, and start-space observation. Fresh sealing must validate the log, and accepted aggregation must embed the same role manifest and bind the unchanged role and sealed bundle digests. Version 35 receipt transport, the 26-field BURL-O001 compatibility interface, fresh-dispatch controls, exact 11-artifact ordinary and 13-artifact BURL-O001 inventories, and no-deletion fixtures remain required. Aggregate schema version 19, role schema version 15, spike-result schema version 20, sealing receipt version 2, and receipt transport version 1 remain unchanged."
