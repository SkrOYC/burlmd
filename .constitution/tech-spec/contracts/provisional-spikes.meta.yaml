certainty: assumed
assumption: "Raw contract version 36 preserves version 35's authority, lineage, lifecycle, receipt transport, schemas, evidence-class profiles, and artifact inventories. ADR-0020 adds only the assumed exact read-only BURL-M003 candidate closure and separate trusted-parent Bubblewrap tool closure needed for the standard Linux runner. TechSpec v2.1.12 corrects that unmerged version 36 record with locked Diffutils and Procps roots, an exact descriptor handshake, byte-defined integration session IDs, and stable capacity authorities whose ephemeral leaves exist for one session only. Local fixtures can prove the per-session view mechanics, but they cannot establish hosted capacity or feature availability."
settles_when: "Local BURL-M003 contract fixtures exercise version 36 and prove the closure-view mechanics for the exact seven-session inventory. For every session, they must prove exact manifest-to-view equality; exact locked Diffutils and Procps command paths with no ambient host fallback; byte-defined integration session IDs without terminators or newline conversion; fresh empty source-distinct staging with a unique root digest; the same trusted per-member mountinfo, device, inode, type, and read-only source identity; rejection of an omitted bind behind a correctly typed placeholder; rejection of copied private-store state beneath otherwise valid binds; absence of /nix/var, the Nix database, and the daemon socket; source-shape rejection of broad /nix and /nix/store binds; hidden ambient store paths; working loaders and runtime search path dependencies; a store-backed /usr/bin/env symlink and #!/usr/bin/env bash fixture; candidate Bubblewrap absence; trusted-parent proof of the exact locked Bubblewrap executable, version, executable digest, and separate tool-closure manifest digest without candidate or preflight Bubblewrap execution; prevention of candidate-created user namespaces; complete-vector ARG_MAX headroom; a frozen stable-parent and device authority set; and a 4,000,000,000-byte start guard on every distinct frozen st_dev. The capacity fixtures must run all seven create, canonicalize, contain, same-mount, same-device, record-current-only, teardown, remove, and verify-absent sequences for the declared staging, session, and writable-bind leaves. A later session must not stat a removed prior leaf. The fixtures must reject a new undeclared leaf, symbolic-link escape, nested mount, device mismatch, new parent, mount, device, or writable path after freeze, an omitted authority, and a low-space secondary stable device. They must also prove the exact five-descriptor preflight handshake and three-descriptor candidate entry with unchanged standard streams, private PID ownership, teardown, survivor rejection, and complete ephemeral-leaf cleanup before the next session. These local fixtures cannot settle hosted capacity or feature availability. Settlement also requires an accepted managed BURL-M003 report with standard ubuntu-24.04 role evidence and merged completion evidence under .constitution/evidence/BURL-M003/. The Linux role bundle must retain logs/burl-m003-linux-closure-view.log through roleEvidence.internalArtifacts. The log must match the canonical golden grammar and contain the parent-only Bubblewrap identity, candidate manifest, exact session order and count, per-session manifest, source, namespace-flag, unique staging-root, and preflight digests, complete-vector byte count, ARG_MAX, stable-parent-to-current-path mappings, per-device start-space observations, and cleanup result. Fresh sealing must validate the log, and accepted aggregation must embed the same role manifest and bind the unchanged role and sealed bundle digests. Version 35 receipt transport, the 26-field BURL-O001 compatibility interface, fresh-dispatch controls, exact 11-artifact ordinary and 13-artifact BURL-O001 inventories, and no-deletion fixtures remain required. Aggregate schema version 19, role schema version 15, spike-result schema version 20, sealing receipt version 2, and receipt transport version 1 remain unchanged."
