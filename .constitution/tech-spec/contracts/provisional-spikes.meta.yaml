assumption: "Raw contract version 38 preserves version 35's authority, lineage, receipt transport, evidence schemas, evidence-class profiles, and artifact inventories. It corrects only the unmerged BURL-M003 Linux view. PR #15 derives the trusted-control root from the immutable launcher path and passes the credential-free tested-source checkout explicitly; local commit checks validate both before launch. The supervisor raises loopback inside each outer Bubblewrap network namespace, closes Bash script descriptor 255 before its first descriptor inventory, and enforces separate base and integration descriptor sets. It waits for direct children, Bubblewrap's namespace PID 1 reaps adopted descendants, and the parent's retained-lock acquisition proves teardown. Fresh sealing reconstructs full-manifest vectors from retained authority rows but doesn't claim independent cryptographic knowledge of departed host paths. The exact hosted Bubblewrap and loopback probe must succeed before dependency or candidate execution. Failure blocks the role without a host-policy mutation or privileged fallback. Local fixtures can prove the mechanics but cannot establish hosted availability or capacity."
settles_when: "Local BURL-M003 fixtures exercise raw contract version 38 across the exact seven-session inventory. They must prove the 488-member base closure, 547-member integration closure, reduced serializer golden, seven full-vector constructions, exact runtime argv reconstruction, distinct trusted-control and tested-source derivations, canonical RUNNER_TEMP and role-output roots, complete authority inventories, read-only /contract mount, hidden Nix state, outer network isolation, final candidate environment, start-space guard, retained teardown-lock identity, genuine OFD-lock acquisition, and cleanup. A pinned Bash fixture must close descriptor 255 before the first inventory, preserve standard streams, and terminate through direct exit and final exec paths without another script read. Integration fixtures must prove direct-child waits, namespace-PID-1 adopted-descendant reaping, the writable runtime bind, exact Sway configuration and identities, no swaybg process or output, and leaf removal. Recording fixtures must reject host-policy writes, privileged fallbacks, host-origin authentication additions, and restoration machinery. The exact hosted probe must succeed before candidate execution. Fresh sealing must reconstruct every actual argv and validate retained host-path structure and internal consistency without claiming independent host-path authentication. Settlement also requires accepted managed BURL-M003 role evidence and merged completion evidence. Candidate, compositor, and output remain untrusted; only fresh sealing is authoritative. Receipt transport, evidence schemas, profiles, artifact inventories, and the BURL-O001 interface remain unchanged."
