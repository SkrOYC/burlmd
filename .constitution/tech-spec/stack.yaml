compatibility_policy:
  pinning: "- Developer Environment: The entire toolchain is provisioned by devenv (Nix). devenv.lock pins nixpkgs, rust-overlay and git-hooks, so the toolchain closure resolves identically across machines and CI. Note the boundary stops there: pub and cargo still resolve package registries outside the store, pinned by pubspec.lock/Cargo.lock once those exist, and the devenv CLI that reads the lock is itself installed outside it. - Android SDK: Not provisioned, and discovery is pinned shut. ANDROID_HOME and ANDROID_SDK_ROOT point at an in-repo path that deliberately holds no SDK, because Flutter otherwise scans well-known home-directory locations and silently adopts whatever SDK a contributor happens to have installed — the one part of the toolchain devenv.lock could not govern. flutter doctor now reports ANDROID_HOME = <repo>/.sentinels/no-android-sdk but Android SDK not found at this location. — the same result on every machine, instead of a per-host one. Note this is deliberately *not* Flutter's \"Unable to locate Android SDK\" message, which is the branch taken when no ANDROID_HOME is set at all: that was the pre-fix state. A real pinned SDK belongs here when mobile is unshelved, at versions current at that time; provisioning one now would cost a 14.9 GiB closure on every desktop-only checkout (measured) and would append NDK, build-tools, libglvnd and vulkan-loader paths to LD_LIBRARY_PATH, which the environment deliberately leaves untouched. - Web Target: Also out of scope, and pinned shut by the same mechanism: CHROME_EXECUTABLE points at an in-repo path holding no browser. Left unset, Flutter resolves one off the host PATH and reports a green [✓] Chrome that devenv.lock does not govern — the same ambient per-machine state the Android sentinel closes. - devenv Modules Input: devenv.lock pins the devenv module set to a master revision with no ref, so devenv update moves it to whatever master is that day, independently of the CLI it was verified against (2.1.2). Pinning inputs.devenv.url to the CLI's release tag would close that drift; deferred, but re-verify the shell after any devenv update. - Rust Toolchain: Pinned via rust-toolchain.toml (currently 1.97.1), consumed by devenv through languages.rust.toolchainFile and by rustup users directly. 1.95 is a hard floor because libsqlite3-sys >= 0.38 requires cfg_select!, which was stabilised in Rust 1.95.0 (rust-lang/rust#149783). - Flutter SDK: Pinned via nixpkgs (flutterPackages.v3_44, currently 3.44.3 / Dart 3.12.2) rather than fvm. fvm downloads unpatched upstream SDK binaries that do not execute on NixOS and would bypass the Nix store, defeating reproducibility. - Flutter localization generation: Flutter 3.44.3's flutter gen-l10n --help marks --synthetic-package deprecated and unavailable; its default output is the ARB directory, not .dart_tool. The repository therefore pins l10n.yaml to arb-dir: lib/l10n, output-dir: lib/l10n/generated, and output-localization-file: app_localizations.dart. The repository includes the SDK flutter_localizations package and direct intl 0.20.2 (the version the pinned Flutter 3.44.3 flutter_localizations package requires) with flutter pub add \"flutter_localizations@{sdk: flutter}\" intl@0.20.2, committing pubspec.lock. Generated Dart under lib/l10n/generated/ is repository-owned and committed so pre-commit and deterministic builds do not depend on a hidden synthetic package. - Flutter text-input API verification: ADR-012's direct TextInputClient proxy is verified against the pinned Flutter 3.44.3 / Dart 3.12.2 SDK source, not an ambient Flutter installation. packages/flutter/lib/src/services/text_input.dart requires currentTextEditingValue, currentAutofillScope, updateEditingValue, performAction, performPrivateCommand, updateFloatingCursor, showAutocorrectionPromptRect, and connectionClosed, and declares TextInput.attach(TextInputClient, TextInputConfiguration) plus TextInputConnection.show, setEditingState, and close. packages/flutter/lib/src/widgets/actions.dart supplies Actions/CallbackAction; its paired DefaultTextEditingShortcuts source binds the desktop delete and clipboard intents ADR-012 overrides explicitly. The SDK path resolves from the pinned Nix package during the development shell. Re-verify this exact surface on any Flutter patch/minor bump before changing the proxy. - FRB Version Triple: The installed flutter_rust_bridge_codegen, Rust crate, and Dart package are all 2.12.0. The merged base doesn't contain scripts/check-generated-bindings.sh. BURL-M003 must implement the non-mutating checker specified in guidelines.md before invoking it as a bootstrap gate. The checker snapshots both generated surfaces, runs the provisional generator, detects byte drift, and restores the exact precheck state before exit. This authorization is provisional: final Stage 3 must revalidate the generator, both runtimes, configuration, and generated outputs after every evidence-driven dependency decision. A later ticket can't cite the bootstrap pin as final approval. - Managed coordinator isolation: BURL-M003 adds Linux-only pkgs.bubblewrap to devenv.nix. The devenv.lock Nixpkgs revision 6004ea8c229fe9d41b21c6f4c76bf6c2e10771dd resolves Bubblewrap 0.11.2. The trusted launcher enumerates, closes, and verifies every nonallowlisted descriptor before it starts Bubblewrap. Bubblewrap supplies user, mount, process, network, and filesystem isolation only. Managed-Spike aggregation runs only in the Linux coordinator role and requires successful descriptor, namespace, mount, and network probes. The coordinator receives a minimal read-only Nix runtime closure, verified read-only inputs, and one writable output mount. It doesn't receive the repository, host home, credential configuration, or network. If the hosted kernel or policy blocks this isolation, aggregation is rejected; credential clearing alone isn't a fallback. - OKF Specification Version: Pinned to v0.2 by ADR-004. The specification's §12 states that a minor bump adds backward-compatible optional fields while a major bump may rename required fields or change reserved filenames — but do not plan against that stated policy, because upstream has already departed from it. The only minor bump the format has had, v0.1 to v0.2, carried two breaking changes in its own §13.1: timestamp superseded by generated.at, and the body # Citations list superseded by the sources frontmatter field. Treat every OKF revision, minor or major, as potentially breaking and as an explicit decision to re-evaluate against data-models/okf-bundle.md; never as an automatic adoption. The format is young (v0.1 shipped June 2026, v0.2 within weeks), so movement is likely and this is not a theoretical concern. Note also that we ship untagged: §12 permits declaring okf_version only in a bundle-root index.md, which ADR-004 decision 6 declines to generate. - saphyr Pre-1.0 Risk: The pin is 0.0.11 (published 2026-07-11). The crate is at 0.0.x, has shipped multiple releases in a single day, and changed publishing maintainer partway through its history — so its API should be assumed unstable across any bump. This is tolerable here specifically because the surface consumed is tiny and read-only (parse a block; extract two scalar strings), which caps the blast radius of a breaking change at a single module. It would not be tolerable if the frontmatter block were being serialized back out. Re-verify on every bump. saphyr-parser is pinned to the identical 0.0.11 for the same reason and carries the same risk profile — it is published from the same repository in lockstep with saphyr, so the two are re-verified together. - Data Schemas: Handled through rusqlite PRAGMA user_version. Fresh creation, recoverable version-zero crash states, and version publication are one immediate SQLite transaction. Version zero is not assumed empty: a full v1 notes shape is migrated before v2 is published, while a v2 shape or the deterministic workspaces-only prefix is completed as v2. Opening a version 1 index adds and backfills notes.title_lookup_key, then creates its lookup index in that same transaction. The derived key uses NFKC, full Unicode case folding, and NFC, so title-prefix lookup does not depend on SQLite's ASCII-only LIKE and NOCASE behavior. An index with a later version remains unchanged. - Key Rotation: The root AES key is randomly generated on first boot and never leaves the device's secure enclave. Key rotation is currently out of scope unless device compromise is suspected"
  lockfiles: [pubspec.lock, rust/Cargo.lock, devenv.lock, rust-toolchain.toml]
  upgrade_boundaries: "An upgrade needs an ADR, or a re-verification recorded in the tech-spec changelog, whenever it moves a surface another decision rests on. pulldown-cmark is pinned exactly because ADR-007 depends on Parser::into_offset_iter and ENABLE_YAML_STYLE_METADATA_BLOCKS; any bump re-runs both source-line verifications. A Flutter patch or minor bump re-verifies the ADR-012 TextInputClient and DefaultTextEditingShortcuts surface before the proxy changes. A gix major or minor bump re-checks the push and commit-merge split that sends pull and push to the Git CLI. A keyring bump re-verifies the lazy default-store race. saphyr and saphyr-parser move together and are re-verified on every bump because both are pre-1.0. Every Open Knowledge Format revision, minor or major, is an explicit decision re-evaluated against data-models/okf-bundle.md, never an automatic adoption. The flutter_rust_bridge version triple is authorized for the CI bootstrap only; final Stage 3 must revalidate the generator, both runtimes, the configuration, and the generated bytes. Every pinned GitHub Action moves only by full commit SHA."
