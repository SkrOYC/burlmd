constraints:
  - id: NFC-01
    legacy_id: Search Latency
    class: performance
    statement: Full-text search and title filtering stay interactive at the Corpus Scale Goal.
    scale: Time from submitting a full-text search or title-filter query to receiving results.
    meter: "The 95th percentile over 1,000 deterministic queries against the Goal corpus on each reference class."
    goal: Under 100 milliseconds.
    stretch: Under 25 milliseconds.
    fail: "Over 250 milliseconds at 10,000 Notes, or over 100 milliseconds at 1,000 Notes."
    certainty: assumed
    assumption: "The target comes from operator intent; no nightly benchmark run exists on either managed reference class yet, so nothing has measured it."
  - id: NFC-02
    legacy_id: UI Responsiveness
    class: performance
    statement: "Writing and editing, including a Block moving into and out of its raw editing state, hold a 60 Hz frame budget."
    scale: "Frame time of writing and editing interactions, including the transition of a Block into and out of its raw editing state."
    meter: Frame timing over a 5-minute scripted session on the editing Note and each reference class.
    goal: "At least 99% of frames complete within 16.7 milliseconds, with no input-to-effect delay above 50 milliseconds."
    stretch: "At least 99.9% of frames complete within 16.7 milliseconds."
    fail: "More than 1% of frames exceed 33.3 milliseconds or any input-to-effect delay exceeds 100 milliseconds."
    certainty: assumed
    assumption: "SPK-BURL-D001 measured the encrypted draft write on the typing path against this budget, but the scripted 5-minute frame-timing session it defines has never run on either reference class."
  - id: NFC-03
    legacy_id: Workspace Open Latency
    class: performance
    statement: "Opening a Workspace reaches an interactable shell quickly, with index construction continuing in the background."
    scale: Time from launch request to an interactable shell with the Workspace open.
    meter: The 95th percentile of 20 opens of the Goal corpus on each reference class.
    goal: No more than 1 second at the Corpus Scale Goal. Remaining index construction proceeds without blocking Workspace use.
    stretch: No more than 1 second at the Corpus Scale Stretch.
    fail: Open blocking longer than 3 seconds at the Corpus Scale Goal.
    certainty: assumed
    assumption: "The target comes from operator intent; no nightly benchmark run exists on either managed reference class yet, so nothing has measured it."
  - id: NFC-04
    legacy_id: Cold Start
    class: performance
    statement: A cold process launch reaches the interactive shell without warm caches.
    scale: "Time from process launch to the interactive shell, cold, with no warm caches assumed."
    meter: "The 95th percentile of 20 cold launches on each reference class, including secure-storage and encrypted-index access."
    goal: 1 second.
    stretch: 500 milliseconds.
    fail: 3 seconds.
    certainty: assumed
    assumption: "The Goal is deliberately aggressive by operator intent, to force optimization rather than neglect; if the first measurement lands above it, rebaseline explicitly here rather than silently accepting the result."
  - id: NFC-05
    legacy_id: Idle Memory
    class: performance
    statement: Resident memory at rest stays modest and does not grow while idle.
    scale: "Resident memory at rest, after opening a Workspace at the Corpus Scale Goal and letting activity settle."
    meter: Resident memory sampled each second for 10 minutes after a 5-minute settling period on each reference class.
    goal: 400 MB.
    stretch: 250 MB.
    fail: "1 GB, or growth above 5% during a 4-hour idle run after the settling period."
    certainty: assumed
    assumption: "The target comes from operator intent; no nightly benchmark run exists on either managed reference class yet, so nothing has measured it."
  - id: NFC-06
    legacy_id: External Change Detection
    class: performance
    statement: A guest filesystem change becomes visible as reconciled state or a required Writer decision while the Workspace is open.
    scale: Time from a guest filesystem change to a visible reconciled state or required Writer decision while the Workspace is open.
    meter: "Timed create, edit, rename, move, and delete operations on supported filesystems, including burst writes."
    goal: Within 2 seconds after the final write in a burst.
    stretch: Within 500 milliseconds after the final write in a burst.
    fail: "More than 10 seconds, a missed event, or duplicate history from one burst."
    certainty: assumed
    assumption: "No live observer exists yet; BURL-H009 builds the observer this meter measures, and its candidate library is still unpinned."
  - id: NFC-07
    legacy_id: Corpus Scale
    class: performance
    statement: Every other meter holds over a Workspace of this size.
    scale: Number of Notes in the Workspace over which every other meter in this file must hold.
    meter: "Synthetic corpora at each level, exercising search, tree building, open, and indexing."
    goal: "10,000 Notes."
    stretch: "50,000 Notes."
    fail: "1,000 Notes. Below the Fail point, any missed meter is a defect rather than a scaling story."
    certainty: assumed
    assumption: "Deterministic corpus generation has not been published yet; Technical Implementation owes the generator and reference-class setup specification this meter depends on."
  - id: NFC-08
    legacy_id: Image Import Size
    class: performance
    statement: One imported image can be accepted and used up to a stated encoded size without breaking another meter.
    scale: Encoded bytes in one imported image.
    meter: "Import, decode, local persistence, and second-device hydration across representative image dimensions and formats."
    goal: Accept and use images up to the provisional 25 MiB limit without violating the UI Responsiveness or Idle Memory goals.
    stretch: The asset Spike can recommend a larger limit when every dependent meter remains within its Goal.
    fail: "Accepting an image above the supported limit without an explicit refusal, or violating another Fail threshold below the limit."
    certainty: open
    decision: OD-06
  - id: NFC-09
    legacy_id: History Storage Health Warning
    class: operability
    statement: The Writer is warned before the local history store becomes unhealthy.
    scale: Stored textual and manifest history in the local Version store.
    meter: "Storage size, second-device bootstrap time, synchronization retrieval time, maintenance cost, and index cost at the Corpus Scale Goal."
    goal: Warn the Writer before the history store reaches the provisional 1 GiB threshold.
    stretch: The asset or performance Spike can recommend an evidence-based threshold that warns before user-visible degradation.
    fail: "No warning at the accepted threshold, or a threshold that another PRD Fail meter disproves."
    certainty: open
    decision: OD-07
  - id: NFC-10
    legacy_id: Sync Latency While Connected
    class: performance
    statement: A local Version reaches the Remote promptly while online and authorized.
    scale: "Time from a local Version landing in history to its publication on the Remote, while online and authorized."
    meter: End-to-end timed pushes on a live connection.
    goal: Within 60 seconds.
    stretch: Within 15 seconds.
    fail: Beyond 15 minutes while the connection is healthy.
    certainty: assumed
    assumption: "No synchronization capability is delivered; the meter describes intended behavior that Epics K and L still have to build."
  - id: NFC-11
    legacy_id: Remote Change Freshness
    class: performance
    statement: "An incoming Remote change is presented or applied promptly, including after a long offline period."
    scale: Time from an incoming Remote change becoming available to burlmd presenting or applying that change while online and authorized.
    meter: End-to-end observation across 100 incoming changes and reconnection after 1 hour offline.
    goal: Within 60 seconds while connected and within 60 seconds after connectivity returns.
    stretch: Within 15 seconds while connected.
    fail: "Beyond 15 minutes while connected, or beyond 1 hour after connectivity returns."
    certainty: assumed
    assumption: "No synchronization capability is delivered; the meter describes intended behavior that Epics K and L still have to build."
  - id: NFC-14
    legacy_id: Durability of In-Progress Work
    class: reliability
    statement: "Edits not yet written to a Note survive abrupt process termination, including termination the application receives no opportunity to handle."
    scale: In-progress editor content recovered after an unhandled process kill.
    meter: "Kill the process without a signal handler at randomized points in a scripted editing session, then reopen the Workspace."
    goal: Every acknowledged keystroke is recoverable.
    fail: Any acknowledged in-progress content is lost.
    certainty: assumed
    assumption: "Recoverable drafts are delivered in rust/src/draft.rs, but no randomized kill harness has run against them."
deferred:
  - class: cost
    risk: "No cost meter exists because nothing in the architecture runs on infrastructure this project operates: content lives on the Writer's device, their Remote, and their Object Store. If a project-operated component ever appears, this gap hides its running cost until someone pays it."
  - class: accessibility
    risk: "Keyboard completeness and Flutter Semantics labels are the accepted baseline, but screen-reader certification against Orca and VoiceOver is out of scope with no reopening condition, so nothing measures whether the baseline still holds. OD-02 carries the missing trigger."
  - class: NFC-12 reliability
    risk: "Rule: The application is fully functional while completely disconnected, and never requires an account, credential, or Provider authorization to create, read, edit, search, or organize Notes. Risk: Treating this prose rule as a quantified meter would invent a scale, meter, goal, and fail that the source did not state."
  - class: NFC-13 reliability
    risk: "Rule: Background synchronization never blocks the main UI thread or interrupts editing, and a pending Decision pauses synchronization without blocking local editing or history. Risk: Treating this prose rule as a quantified meter would invent a scale, meter, goal, and fail that the source did not state."
  - class: NFC-15 reliability
    risk: "Rule: Every orderly tab close, Workspace switch, and application exit runs the Note durability and history lifecycle, and a partial batch close reports which Notes closed and preserves every unprocessed session. Risk: Treating this prose rule as a quantified meter would invent a scale, meter, goal, and fail that the source did not state."
  - class: NFC-16 reliability
    risk: "Rule: After a crash or local branch advance, burlmd recovers recorded reconciliation inputs, rejects stale tentative outcomes, and preserves every local and incoming state. Risk: Treating this prose rule as a quantified meter would invent a scale, meter, goal, and fail that the source did not state."
  - class: NFC-17 reliability
    risk: "Rule: A connected Workspace does not publish Note history that references an Object until that Object is verified in the configured Object Store. Risk: Treating this prose rule as a quantified meter would invent a scale, meter, goal, and fail that the source did not state."
  - class: NFC-18 reliability
    risk: "Rule: Writing a Note to disk does not alter any region of that Note the Writer did not edit, including whitespace, delimiter style, and unmanaged metadata keys. Risk: Treating this prose rule as a quantified meter would invent a scale, meter, goal, and fail that the source did not state."
  - class: NFC-19 reliability
    risk: "Rule: Every Note burlmd creates satisfies the Open Knowledge Format from creation, no burlmd operation makes a conformant Note nonconformant, and an invalid guest Note stays outside authoritative state until the Writer accepts a previewed repair. Risk: Treating this prose rule as a quantified meter would invent a scale, meter, goal, and fail that the source did not state."
  - class: NFC-20 reliability
    risk: "Rule: Reconciling concurrent edits never discards either side's content or duplicates a Note, and both variants stay recoverable until the Writer resolves the Suggestion. Risk: Treating this prose rule as a quantified meter would invent a scale, meter, goal, and fail that the source did not state."
  - class: NFC-21 reliability
    risk: "Rule: burlmd validates guest filesystem writes before they enter authoritative Workspace state; invalid input never replaces the last known-good Note and never triggers silent repair. Risk: Treating this prose rule as a quantified meter would invent a scale, meter, goal, and fail that the source did not state."
  - class: NFC-22 compatibility
    risk: "Rule: A path burlmd creates retains one identity under supported Linux and macOS filesystems and Windows-compatible path rules. Risk: Treating this prose rule as a quantified meter would invent a scale, meter, goal, and fail that the source did not state."
  - class: NFC-23 reliability
    risk: "Rule: burlmd verifies Object bytes against their content identity before exposing, publishing, migrating, restoring, or deleting them. Risk: Treating this prose rule as a quantified meter would invent a scale, meter, goal, and fail that the source did not state."
  - class: NFC-24 reliability
    risk: "Rule: burlmd retains every Object reachable from a Protected State, and during 0.x never deletes authoritative Object Store bytes; only verified local cache copies may be evicted. Risk: Treating this prose rule as a quantified meter would invent a scale, meter, goal, and fail that the source did not state."
  - class: NFC-25 security
    risk: "Rule: Workspace-controlled paths and indirections never grant access outside the Workspace boundary, and unsupported filesystem aliases or nested external repositories are rejected during adoption, monitoring, and synchronization. Risk: Treating this prose rule as a quantified meter would invent a scale, meter, goal, and fail that the source did not state."
  - class: NFC-26 security
    risk: "Rule: Note content is stored only on the Writer's own device and, when connected, in the Writer's designated Remote; no component this project operates acts as a storage broker, relay, or intermediary. Risk: Treating this prose rule as a quantified meter would invent a scale, meter, goal, and fail that the source did not state."
  - class: NFC-27 security
    risk: "Rule: Notes stay plaintext so standard tools work, while the aggregate search index is encrypted independently with persistent key material held only in Platform secure storage. Risk: Treating this prose rule as a quantified meter would invent a scale, meter, goal, and fail that the source did not state."
  - class: NFC-28 security
    risk: "Rule: Remote and Object Store credentials are never persisted outside operating-system secure storage, and never written to logs, diagnostics, or version history. Risk: Treating this prose rule as a quantified meter would invent a scale, meter, goal, and fail that the source did not state."
  - class: NFC-29 compatibility
    risk: "Rule: Every Note remains a plain-text file in a published, openly specified format, fully readable and editable with any text editor and with no tooling this project produces. Risk: Treating this prose rule as a quantified meter would invent a scale, meter, goal, and fail that the source did not state."
  - class: NFC-30 security
    risk: "Rule: A connected Remote stays private; burlmd pauses synchronization if the Remote becomes public or required access is lost. Risk: Treating this prose rule as a quantified meter would invent a scale, meter, goal, and fail that the source did not state."
  - class: NFC-31 security
    risk: "Rule: burlmd never requests GitHub workflow-modification authority and never publishes a commit reachable from a local publication ref that contains .github/workflows/**; local Workspace access stays available and Consolidation into a clean Workspace is offered instead. Risk: Treating this prose rule as a quantified meter would invent a scale, meter, goal, and fail that the source did not state."
  - class: NFC-32 security
    risk: "Rule: burlmd refuses or pauses an Object Store when anonymous list, read, write, or delete access is detected, or when the complete storage-privacy result is missing or stale. Risk: Treating this prose rule as a quantified meter would invent a scale, meter, goal, and fail that the source did not state."
  - class: NFC-33 privacy
    risk: "Rule: burlmd records bounded structured diagnostics locally but never automatically transmits usage metrics, errors, diagnostics, Note or Asset content, signed locations, or content-derived metadata; a Writer-created and Writer-shared Diagnostics Export is the only reporting path. Risk: Treating this prose rule as a quantified meter would invent a scale, meter, goal, and fail that the source did not state."
  - class: NFC-34 compatibility
    risk: "Rule: Every supported release system passes the same release-blocking capability matrix; a launch-only check is not sufficient. Risk: Treating this prose rule as a quantified meter would invent a scale, meter, goal, and fail that the source did not state."
  - class: NFC-35 compatibility
    risk: "Rule: Releases stay in the 0.x series until the user explicitly declares stability, and downgrade compatibility is not guaranteed. Risk: Treating this prose rule as a quantified meter would invent a scale, meter, goal, and fail that the source did not state."
  - class: NFC-36 reliability
    risk: "Rule: Application-state migrations create a backup, apply atomically, and restore the earlier state after failure, and never rewrite Note content unless an explicit product operation requires it. Risk: Treating this prose rule as a quantified meter would invent a scale, meter, goal, and fail that the source did not state."
