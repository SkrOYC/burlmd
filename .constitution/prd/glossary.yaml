terms:
  - term: Writer
    definition: "The primary person who creates, organizes, and synchronizes knowledge through burlmd"
    do_not_use: [User (when the Writer role is intended), Customer]
  - term: Agent
    definition: An automated guest that the Writer authorizes to read or write Workspace files. burlmd remains the authority for Workspace semantics
    do_not_use: [Owner, Automated Consumer]
  - term: Platform
    definition: "The host operating system and filesystem that own window chrome, process lifecycle, secure storage, and installation behavior"
    do_not_use: [OS Emulator, Chrome Theme]
  - term: Note
    definition: A single unit of knowledge that the Writer creates and edits as Markdown
    do_not_use: [Page]
  - term: Directory
    definition: A hierarchical container used to logically group and organize Notes
    do_not_use: [Folder]
  - term: Link
    definition: "A lateral connection from one Note to another, forming the knowledge graph structure"
    do_not_use: [Backlink (as a synonym for Link), Wikilink]
  - term: Workspace
    definition: The root container holding all Notes and Directories. It is local by default and may optionally be connected to a Remote
    do_not_use: [Vault, Brain, Repo]
  - term: Remote
    definition: "The Writer's private hosted repository that a connected Workspace synchronizes with. A Workspace remains fully functional without a Remote"
    do_not_use: [Server, Backend]
  - term: Provider
    definition: "An external service through which the Writer authorizes, selects, provisions, and uses a Remote"
    do_not_use: []
  - term: Suggestion
    definition: A persistent inline decision for resolving a concurrent content change without exposing raw conflict markers
    do_not_use: [Conflict (as a synonym for Suggestion), Fork]
  - term: Lifecycle Decision
    definition: "A required Writer choice that resolves a conflicting add, delete, rename, move, Directory, type, or path-identity outcome. Delete-versus-edit remains a Suggestion instead"
    do_not_use: [Structural conflict (as a synonym), File conflict]
  - term: Asset Decision
    definition: "A required Writer choice that resolves conflicting asset bytes, references, or availability"
    do_not_use: [Binary conflict, Attachment conflict]
  - term: Block
    definition: "A structural element within a Note, such as a paragraph, list item, or heading"
    do_not_use: [Segment, Element]
  - term: Live Preview
    definition: The editing model in which the focused Block displays its raw Markdown source while every other Block renders formatted
    do_not_use: [WYSIWYG, Rich text mode, Hybrid editor, Source mode]
  - term: Open Knowledge Format
    definition: The published open contract that every burlmd-created Note satisfies and against which burlmd validates adopted or guest-written content. Abbreviated OKF
    do_not_use: [Our format, Custom format, OKF-like, OKF-inspired]
  - term: Export
    definition: Producing a copy of the Workspace readable with no application-specific tooling
    do_not_use: [Dump]
  - term: Bundle Archive
    definition: "A single-file .okf zip archive of an entire Workspace bundle, in the packaged distribution form the Open Knowledge Format itself names"
    do_not_use: [Backup (use Export)]
  - term: Consolidation
    definition: "The guided, one-time migration of non-conflicting Notes from a previous local Workspace into a freshly connected one, with explicit resolution of every identity collision"
    do_not_use: [Import (as a synonym)]
  - term: Diagnostics Export
    definition: "A Writer-produced export describing recent application errors, retries, and failures with Note content excluded"
    do_not_use: [Log dump, Crash report]
  - term: Version
    definition: A recoverable past state of one Note in local history
    do_not_use: []
  - term: Asset
    definition: "Non-Note content that a Note references and presents to the Writer, such as an image"
    do_not_use: [Blob, Attachment]
  - term: Object
    definition: Immutable asset bytes identified by their content. An Asset refers to one Object at a time
    do_not_use: []
  - term: Local Asset Store
    definition: The Workspace area that keeps active Object bytes available through portable paths for offline use and guest tools
    do_not_use: [Local Object Store, Asset Cache]
  - term: Object Store
    definition: Writer-controlled remote storage that synchronizes Object bytes for a connected Workspace
    do_not_use: [Backend]
  - term: Protected State
    definition: Current or historical Workspace state whose reachable Objects burlmd must retain
    do_not_use: [Retained History, Live Set, Cache Root]
